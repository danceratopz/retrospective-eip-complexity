    summary: >-
      Initial addition of EIPS/eip-7892.md (119 lines): defines Blob Parameter Only (BPO) hardforks as a
      class of fork modifying only blob_target, blob_limit and baseFeeUpdateFraction; extends the
      EIP-7840 `blobSchedule` object to an arbitrary number of block-timestamp keys; sketches a
      consensus-layer `BPO_FORK` epoch/max_blobs configuration table; states four requirements (EL and
      CL schedules MUST be consistent; BPO forks MUST NOT conflict with other fork schedules; the
      blobSchedule timestamp MUST align with the start of the CL epoch; the blobSchedule max field MUST
      equal the CL max_blobs value). Frontmatter status Draft, type Informational, created 2025-02-28,
      requires 7840. Committer timestamp re-verified with
