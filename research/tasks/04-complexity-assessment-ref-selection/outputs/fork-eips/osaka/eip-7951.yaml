  notes:
  - Approved as-is after human review of the selected ref on the Osaka timeline.
  - 'Anchor kind is a judgement call and is materially contestable: no explicit PFI event exists for
    EIP-7951. The Fusaka Meta EIP EIPS/eip-7607.md did carry a "Proposed for Inclusion" section (and
    used it for up to 28 other EIPs between 2024-12-19 and 2025-04-14), but it was emptied on
    2025-04-19, before EIPS/eip-7951.md existed, and it never listed EIP-7951, RIP-7212 or the
    secp256r1 precompile in any of that file''s 53 commits. This record therefore anchors on the SFI
    event osaka-eip7951-e2 as a normalized_proposal_equivalent: it is the only Fusaka inclusion-state
    event that names the EIP-7951 document, and the ACDE#214 decision behind it is where this document
    entered the fork scope. A human must confirm that label; a reviewer could reasonably prefer
    "other" (SFI is downstream of PFI in the EIP-7723 ordering) or "fallback_cfi" on
    osaka-eip7951-e1.'
  - 'Alternative proposal cycle preserved, and the selection is insensitive to it: osaka-eip7951-e1
    (2024-09-27T18:42:32Z, commit 1d4ce5462677, ACDE#197) placed the secp256r1 precompile in Fusaka
    "Considered for Inclusion" under the precursor identifier RIP-7212 - a Rollup Improvement Proposal
    in ethereum/RIPs, not an ethereum/EIPs document - 277 days before EIPS/eip-7951.md was created.
    Anchoring there would leave no preceding candidate and would force the contract''s "file created
    after the anchor" branch, selecting the same creation commit d386b29b5a31 as a
    post_anchor_exception with information_cutoff_at 2025-07-01T20:21:20Z. The selected commit, blob
    and content hash are identical under either anchor; only selection.mode and the cutoff (by about
    21 hours) differ. This is not a removal-and-re-proposal cycle: the RIP-7212 CFI line stood
    unbroken from 2024-09-27 until it was replaced by the EIP-7951 SFI line in the same commit
    ca4fda0074fe (verified across every version of EIPS/eip-7607.md).'
  - 'Anchor timing convention: effective_at uses the exactly-timed ethereum/EIPs commit
    (2025-07-02T17:49:36Z) rather than the ACDE#214 call date (2025-06-19 14:00 UTC), for which Task 01
    records no minute-level timestamp. This gap is the largest in the fork (13.2 days) and it straddles
    the EIP file''s creation: if a reviewer instead treats the ACDE#214 decision date as effective_at,
    the EIP file did not yet exist at the anchor, no preceding candidate exists, and the same commit
    d386b29b5a31 would be selected as a post_anchor_exception (12.3 days after that anchor, outside the
    seven-day ceiling but inside the contract''s "no preceding candidate" branch) with
    information_cutoff_at 2025-07-01T20:21:20Z. Again the selected content does not change.'
  - 'Selected content caveat for downstream complexity work: the selected creation revision prices
    P256VERIFY at 3450 gas and claims "the exact same interface" and "Same gas cost" as RIP-7212. The
    parameter that shipped in Fusaka is 6900 gas, set 1.65 days after the anchor (eip7951-e01,
    2025-07-04T09:19:01Z) on the basis of implementation benchmarking. A reviewer should confirm that
    assessing the pre-anchor text - not the shipped parameter - is intended, and that the deliberate
    exclusion of that benchmark-driven revision is accepted.'
  - 'The Task 01 fork record''s own unknown is inherited: treating the RIP-7212 CFI event as part of
    this fork-EIP relationship is an identity judgement. This record does not rely on it for the
    selected ref, but a reviewer who rejects the identity judgement should note that EIP-7951''s Fusaka
    inclusion history then begins at osaka-eip7951-e2, which is exactly the anchor used here.'
