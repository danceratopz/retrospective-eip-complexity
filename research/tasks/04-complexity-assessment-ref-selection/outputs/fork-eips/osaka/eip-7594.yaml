  - Approved as-is after human review of the selected ref on the Osaka timeline.
  - >-
    Anchor kind is normalized_proposal_equivalent, not explicit_pfi: no PFI event exists for EIP-7594 in
    the Fusaka Meta EIP. Commit 1d4ce546 created EIP-7607's 'Proposed for Inclusion' section empty and
