    53 commits of the file). A reviewer must confirm that this SFI-at-seed entry is the correct
    PFI-equivalent anchor for this fork.
  - >-
    Confirm the date basis: effective_at is the UTC committer time of the ethereum/EIPs commit editing
    EIPS/eip-7607.md (2024-09-27T18:42:32Z), while the underlying AllCoreDevs decision is ACDE#197 on
    2024-09-26 (14:00-15:30 UTC). The ~1.2-day difference does not change the preceding or following
    candidate.
  - >-
    Confirm the scope boundary Task 01 asserts: PeerDAS entered Fusaka by the Pectra scope split, so any
    earlier PFI/CFI-equivalent event for EIP-7594 lives in the Prague/Pectra fork work unit (EIP-7600),
    not in this record. If the study wants the earliest proposal-equivalent event for this EIP in any
    fork, that event is out of scope here and this anchor is not it.
  - >-
    Confirm acceptance of a non-substantive selected revision: the selected commit 4353b530c3 only flips
    frontmatter status Draft -> Review, and its blob is otherwise identical to the creation blob. It is
    selected because it is the latest at-or-before-anchor event, and its content is the EIP text in force
    at the anchor.
  - >-
    Escalation for the coordinator, recorded as fact and not as a complexity judgement: at the selected
    ref the document is frontmatter category Networking and its Specification delegates the detailed spec
    by link to ethereum/consensus-specs (specs/_features/eip7594/das-core.md at consensus-specs commit
    b4188829), with Rationale 'TBD' and Security Considerations 'Needs discussion'. The
    execution-layer-observable requirements that the Task 01 fork-EIP record cites for the cross-layer
    classification (the cell-proof PooledTransactions wrapper, commit b447dd7866,
    2025-04-01T17:36:08Z, and the 6-blobs-per-transaction limit, commit cf1a3edbdd, 2025-07-14T14:14:09Z)
    do not exist in the EIP file at the selected ref. A human must decide whether this fork-EIP record
    should be assessed at the anchor ref anyway.
