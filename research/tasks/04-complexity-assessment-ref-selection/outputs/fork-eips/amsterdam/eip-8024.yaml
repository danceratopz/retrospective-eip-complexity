    semantic_effect: substantive
    summary: 'Initial addition of EIP-8024 ''Backward compatible SWAPN, DUPN, EXCHANGE'' (183 lines, merged
      directly in status Review, type Standards Track, category Core, three authors: Francisco Giordano,
      Charles Cooper, Alex Beregszaszi). It introduces DUPN (0xe6), SWAPN (0xe7) and EXCHANGE (0xe8),
      each taking a one-byte immediate, each charging 3 gas and advancing pc by 2. Immediate values in
      the ranges 90 < x < 128 (DUPN, SWAPN) and 79 < x < 128 (EXCHANGE) revert consuming all gas, which
      is what keeps JUMPDEST analysis unchanged and preserves existing jump targets. decode_single / decode_pair
      and the matching encode_single / encode_pair are given as branching Python; EXCHANGE n m at this
      version swaps stack items n + 1 and m + 1 with decode_pair returning (q + 2, r + 2) or (r + 2, 30
      - q). Rationale (immediate operand, disallowed immediate range, EXCHANGE immediate and its addressing
      trade-off, immediate size, gas cost, EXCHANGE vs SWAPN), Backwards Compatibility, ten assembly/disassembly
      and five execution test cases, and Security Considerations are included.'
    immutable_url: https://github.com/ethereum/EIPs/blob/28578c7ba0e3c7831a91a9784e85ce9b400c29a8/EIPS/eip-8024.md
