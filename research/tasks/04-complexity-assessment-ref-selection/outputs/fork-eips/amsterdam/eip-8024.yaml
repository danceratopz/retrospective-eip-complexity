    offset_from_anchor_seconds: 525260
    semantic_effect: substantive
    summary: Shifts the EXCHANGE operand encoding down by one so the assembly operands match the intended
      SWAP-like indexing. decode_pair returns (q + 1, r + 1) / (r + 1, 29 - q) instead of (q + 2, r +
      2) / (r + 2, 30 - q), and encode_pair's assertion and arithmetic change from '2 <= n <= 14 and n
      < m <= 30 and n + m <= 32' with the m <= 17 branch to '1 <= n <= 13 and n < m <= 29 and n + m <=
      30' with the m <= 16 branch. A Rationale paragraph is added explaining that the operands look off
      by one because EXCHANGE n m operates on stack depths n + 1 and m + 1, chosen so that EXCHANGE n
      m is equivalent to SWAP{n} SWAP{m} SWAP{n}. Two disassembly test cases are renumbered accordingly
      (e812 becomes EXCHANGE 2 3, e8d0 becomes EXCHANGE 1 19).
    immutable_url: https://github.com/ethereum/EIPs/blob/db5c483ea122c6735cd92ff135de985f0e9253e2/EIPS/eip-8024.md
