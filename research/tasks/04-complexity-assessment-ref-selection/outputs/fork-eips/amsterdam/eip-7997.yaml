    semantic_effect: substantive
    summary: 'Rewrites the Abstract and two Motivation paragraphs, and - the substantive part - adds a
      prose normative specification of the factory''s behaviour ahead of the bytecode: when called, the
      account invokes CREATE2 (linking EIP-1014) with salt = first 32 bytes of input, init code = the
      remaining input and value = the call''s value; the call reverts with empty return data if input
      is shorter than 32 bytes; if CREATE2 outputs 0 the call reverts with the creation frame''s return
      data. The bytecode is retained and is now described as implementing that specification.'
    immutable_url: https://github.com/ethereum/EIPs/blob/85d76ebe7795c478efecc119054744ac492709e9/EIPS/eip-7997.md
