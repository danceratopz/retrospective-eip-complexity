    summary: 'Initial addition (PR #11590) as a Draft: removes the remaining SELFDESTRUCT burn cases.
      Same-transaction selfdestruct-to-self leaves the balance unchanged, and at transaction finalization
      accounts marked for selfdestruction are no longer deleted but have nonce reset to 0, balance unchanged,
      code cleared and storage cleared; a resulting zero balance still makes the account empty and EIP-161-deleted.
      Frontmatter requires: 161, 6780. Test Cases are TBD.'
