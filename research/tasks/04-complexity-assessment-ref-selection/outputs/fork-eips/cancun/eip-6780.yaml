    summary: 'Initial addition of EIP-6780 ''SELFDESTRUCT only in same transaction'' (64 lines, Draft):
      SELFDESTRUCT no longer deletes storage/code and only transfers the account balance to the target,
      except when executed in the same transaction in which the contract was created, where the original
      behaviour is preserved. Frontmatter ''requires: 2681, 2929, 3529''.'
