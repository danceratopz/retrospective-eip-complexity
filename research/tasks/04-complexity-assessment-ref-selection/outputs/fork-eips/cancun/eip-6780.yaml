    committed_at: '2023-09-10T03:35:59Z'
    offset_from_anchor_seconds: 14182559
    semantic_effect: substantive
    summary: 'Rewrites the Specification bullets (''Add clarifications to EIP-6780''): states that the
      current execution frame halts, that SELFDESTRUCT deletes no data at all (storage keys, code, account)
      outside same-transaction creation, that Ether is no longer burnt when target == self for pre-existing
      contracts (but still burnt for same-transaction-created contracts), and adds a definition of when
      a contract is ''considered created'' (start of a create transaction or when a CREATE-series operation
      begins execution, including when a balance already exists at the address). Also adds a counterfactual-account
      rationale paragraph, rewrites Backwards Compatibility, and fixes the mis-numbered Security Considerations
      list while adding the Ether-burn case.'
    immutable_url: https://github.com/ethereum/EIPs/blob/22c0ef2b2a9d5ab52705c21128f99a5e082013aa/EIPS/eip-6780.md
