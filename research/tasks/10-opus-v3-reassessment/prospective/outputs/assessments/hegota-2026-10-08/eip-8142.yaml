  - source: eip.md
    locator: engine_newPayload - zkEVM-Optimized Variant
    summary: New payload_kzg_commitments and payload_kzg_proofs inputs, plus changed versioned-hash validation.
  rationale: Both endpoint behavior and multiple fields change. getPayload and newPayload validation change,
