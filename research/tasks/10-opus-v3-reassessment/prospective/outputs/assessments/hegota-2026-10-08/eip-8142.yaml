assessment:
  snapshot_scope_summary: 'EIP-8142 requires the execution-payload data (the RLP-encoded block access
    list from EIP-7928 and the RLP-encoded transaction list) to be written into blobs. It uses a fixed
    codec: an 8-byte length header, 31 usable bytes per field element and zero padding. The KZG commitments
    for these payload-blobs must form the first `payload_blob_count` blob commitments of the block, ahead
    of the type-3 transaction blobs. A new `payload_blob_count` header/ExecutionPayload field is added.
    engine_getPayload must compute payload blobs, commitments and cell proofs, plus random-point proofs
    in the zk variant. engine_newPayload must re-derive the payload blobs, check the count and check that
    the expected versioned hashes are the payload hashes followed by the type-3 hashes. Payload blobs
    consume blob gas and count toward MAX_BLOBS_PER_BLOCK without paying a per-blob fee.'
