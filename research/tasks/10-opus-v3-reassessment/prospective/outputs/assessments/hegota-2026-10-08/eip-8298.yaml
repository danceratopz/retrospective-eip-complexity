  - source: eip.md
    locator: Backwards Compatibility
    summary: A client implementing only EIP-7928 rejects blocks that use the new form, and vice versa.
  - source: supporting/eip-7928.md
    locator: State Transition Function
    summary: The BAL is validated against execution during block processing, and a mismatch invalidates
      the block.
  rationale: 'Block import must decode and validate the changed CodeChange structure: optional trailing
