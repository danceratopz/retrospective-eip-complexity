  interaction_details:
  - eip: 7702
    interaction: coordinated_cases
    cases: SETCODEFROM executed in delegated code updates the authority, replacing the delegation indicator
      with regular code. Later authorization tuples for that authority fail the empty-or-delegated check.
      A source holding a delegation indicator is invalid. CALL to a delegated account whose code runs
      SETCODEFROM.
  - eip: 3607
    interaction: coordinated_cases
    cases: After an EOA adopts code (via 7702 delegation), a later ECDSA transaction from it is invalid,
      including within the same block (block invalid if included).
  - eip: 6780
    interaction: coordinated_cases
    cases: A source created in the current tx (CREATE/CREATE2/creation tx) returns 0. The same source
      is valid in a later tx. An account that adopts code in initcode and then SELFDESTRUCTs in the same
      tx is deleted, with no BAL code change.
  - eip: 7928
    interaction: coordinated_cases
    cases: BAL records [idx, b"", hash] for adopted code. The two-element form is kept otherwise, including
      create-then-adopt and adopt-then-create orderings. The source address is included in the BAL on
      access. Invalid forms reject the block. The hash must resolve to pre-state or to a lower-index deposit.
  - eip: 8037
    interaction: coordinated_cases
    cases: Creation with adoption charges the new-account state gas but no L×CPSB. Existing-destination
      creation with adoption charges no state gas. A revert or halt of a creation frame with adoption
      refills state gas. SETCODEFROM itself charges no state gas.
  - eip: 8038
    interaction: local_compatibility_check
    cases: Gas tables use COLD_ACCOUNT_ACCESS=3000, WARM_ACCESS=100, ACCOUNT_WRITE=9000. Check values
      against the active parameters.
  - eip: 3541
    interaction: coordinated_cases
    cases: A source whose code starts with 0xEF is rejected. Initcode that adopts code and then returns
      0xEF-prefixed (or oversize) data succeeds, because return data is not validated.
  - eip: 8141
    interaction: local_compatibility_check
    cases: 'Public-mempool handling only: SETCODEFROM banned in the validation prefix, and contracts containing
      it treated as mutable code. Frame transactions are exempt from EIP-3607, so adopted accounts can
      still originate via SENDER frames.'
  - eip: 8151
    interaction: local_compatibility_check
    cases: If the companion is activated together, ecRecover returns zero for addresses whose raw code
      became regular code through SETCODEFROM.
  - eip: 8279
    interaction: local_compatibility_check
    cases: If the byte floor is active, a SETCODEFROM code change has a fixed size (hash entry) to meter.
      The target does not specify the byte count.
