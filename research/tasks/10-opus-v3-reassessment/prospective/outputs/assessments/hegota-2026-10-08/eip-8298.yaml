criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 2
  evidence:
  - source: eip.md
    locator: Gas Costs
    summary: 'Adds a tiered charging scheme: SETCODEFROM_SOURCE_GAS on every attempt, then WARM_ACCESS
      only if the source is valid, then ACCOUNT_WRITE only if the hashes differ. This gives six cost outcomes
      (3100/200/3200/300/12200/9300).'
  - source: eip.md
    locator: Contract Creation
    summary: When code is adopted, contract creation charges no code-deposit execution gas (hash cost).
      Baseline creations, where codeHash is empty, are unchanged.
  - source: supporting/eip-8038.md
    locator: Parameters
    summary: Defines the COLD_ACCOUNT_ACCESS, WARM_ACCESS and ACCOUNT_WRITE values that the new schedule
      reuses.
  rationale: 'The new instruction brings its own conditional, multi-stage charging rule, and adopted creations
    get a new code-deposit exemption. Without SETCODEFROM, baseline operations keep their expected gas
    results. This matches level 2: a new mechanism without changing baseline expectations.'
  confidence: medium
  uncertainty_note: It is arguable whether a new opcode's schedule built from existing parameters counts
    as a 'new accounting mechanism'. The conditional tiers and the creation exemption support level 2.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Gas Costs
    summary: 'Sets an order: source account load, then source code-store inspection, then (if valid) the
      current-account access charged ''before comparing'', then ACCOUNT_WRITE charged ''before updating''.'
  - source: supporting/eip-7928.md
    locator: Gas Validation Before State Access
    summary: Pre-state and post-state validation rules decide BAL inclusion for state-accessing opcodes.
      SETCODEFROM is not in that table.
  rationale: This is a new state-accessing operation (it reads the source account and its code, and writes
    the current account's codeHash). It needs its own ordering rule for gas charges against accesses and
    for BAL inclusion, covering cold/warm source, valid/invalid source, same/different hash, and static/non-static
    context. It does not change ordering for an existing opcode class, so level 2.
  confidence: medium
  uncertainty_note: The EIP does not map SETCODEFROM onto EIP-7928's pre-state/post-state table. It is
    unclear whether a cold source enters the BAL when gas covers the account access but not the extra
    WARM_ACCESS for code validation.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Gas Costs
    summary: Only execution gas and (zero) state gas are discussed. Blobs are not mentioned.
  rationale: No blob-gas rule is touched.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 2
  evidence:
  - source: eip.md
    locator: Contract Creation
    summary: With adopted code, 'no code-deposit state gas or code-deposit execution gas is charged'.
      The account-creation state gas still applies for a new leaf.
  - source: eip.md
    locator: Gas Costs
    summary: SETCODEFROM_STATE_GAS is 0, and nothing depends on source code size.
  - source: supporting/eip-8037.md
    locator: Gas accounting for new accounts
    summary: In the baseline, CREATE/CREATE2 is charged L × CPSB code-deposit state gas, plus the new-account
      charge when the destination is non-existent.
  rationale: The EIP adds a conditional exemption to the EIP-8037 code-deposit state-gas charge at the
    creation site, keyed on whether the created account adopted code. It interacts with the account-creation
    charge and with refill on revert. It is not just a parameter change, and it adds no new state-gas
    mechanism or spill change. Level 2 is the closest fit (a changed charging condition at a site, using
    the existing mechanism).
  confidence: medium
  uncertainty_note: This could be read as level 1, because no new charging site is added; the existing
    one is conditionally zeroed.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Gas Costs
    summary: No refund is defined. Invalid or same-hash cases simply skip later charges.
  rationale: No refund mechanism is introduced.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 1
  evidence:
  - source: eip.md
    locator: Parameters
    summary: SETCODEFROM_OPCODE is TBD. A previously undefined byte becomes a defined instruction.
  - source: eip.md
    locator: Contract Creation
    summary: The creation-completion rule branches on the created account's codeHash. Without SETCODEFROM
      the codeHash stays EMPTYCODEHASH, so baseline creation tests are unaffected.
  - source: eip.md
    locator: Block-Level Access Lists
    summary: Code changes other than adoptions keep the two-element form, so baseline BAL expectations
      stay valid.
  rationale: The only baseline rework is in undefined/invalid-opcode tests that use the newly allocated
    byte, a localized case within one family. Creation and BAL baselines are preserved by design.
  confidence: medium
  uncertainty_note: The opcode byte is TBD, so which invalid-opcode tests are affected is unknown.
