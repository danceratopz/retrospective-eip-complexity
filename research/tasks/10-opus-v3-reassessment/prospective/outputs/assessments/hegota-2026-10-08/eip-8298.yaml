  - execution
assessment:
  snapshot_scope_summary: EIP-8298 adds one EVM instruction, SETCODEFROM(source). It sets the current
    execution-environment account's codeHash to the codeHash of a live source account. The source must
    exist, have non-empty code, not start with 0xEF, and not have been created in the current transaction.
    The instruction is allowed in deployed code (including EIP-7702 delegated execution) and in initcode.
    When initcode adopts code this way, contract-creation completion skips return-data validation, installation
    and all code-deposit gas, both execution and state. The opcode charges tiered execution gas from EIP-8038
    parameters and no state gas. It extends the EIP-7928 BAL CodeChange with an optional trailing new_code_hash
    element for adopted code. It also states non-consensus public-mempool rules for EIP-8141 frame transactions,
    and relies on EIP-3607 and EIP-7702 to permanently disable ECDSA origination for migrated EOAs.
