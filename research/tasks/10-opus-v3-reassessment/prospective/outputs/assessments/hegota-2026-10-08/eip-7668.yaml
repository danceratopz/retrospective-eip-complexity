assessment:
  snapshot_scope_summary: EIP-7668 requires the logs bloom to be empty (0 bytes long) in both the execution
    block header and every transaction receipt. Clients would no longer compute or validate a 2048-bit
    bloom. The header field is not removed; the Rationale leaves that to a future EIP. LOG gas costs stay
    the same. The only normative text is two sentences, so the work is mostly about encoding, header validation
    and receipt-root changes rather than new execution semantics.
