assessment:
  snapshot_scope_summary: 'EIP-8198 makes slot duration a runtime, fork-activated configuration and reduces
    SLOT_DURATION_MS from 12,000 to 8,000 ms. Most of the changes are consensus-layer constants: issuance,
    inactivity leak, data-availability windows and churn limits. On the execution layer, the first block
    at or after the fork timestamp must set gas_limit = parent_gas_limit * 8000 // 12000, which bypasses
    the ±1/1024 rule for that one block. The EIP also appends an EIP-7892 BLOB_SCHEDULE entry with max
    blobs scaled the same way and a target "derived as usual". The EIP describes the EL impact as limited
    to these one-time gas-limit and blob-parameter adjustments at the fork boundary.'
