  label: New test-framework primitives
  score: 2
  evidence:
  - source: eip.md
    locator: Engine API Changes — "If the IL is not satisfied an `INCLUSION_LIST_UNSATISFIED` status must
      be returned."
    summary: A third newPayload outcome, distinct from VALID and INVALID, must be expressible and checked.
  - source: eip.md
    locator: Engine API Changes — "`payloadAttributes` is extended to include the IL"
    summary: Payload-building tests must supply ILs and check that the built payload includes valid IL
      transactions.
  - source: eip.md
    locator: IL Building
    summary: engine_getInclusionListV1 draws on the mempool, which needs a mempool-driven test setup.
  rationale: 'Testing needs new abstractions: an IL attachment modifier for blocks/newPayload, a new ''valid
    but IL-unsatisfied'' expectation, and payload-building or getInclusionList tests that depend on mempool
    state. These are new expectation and construction abstractions within the target''s suite (level 2).
    They do not clearly change how unrelated families are built or checked.'
  confidence: medium
  uncertainty_note: If the engine fixture format must change for all target-fork fixtures, or a shared
    mempool/payload-building facility is required, this could reach level 3.
  exceptional_score_justification: null
