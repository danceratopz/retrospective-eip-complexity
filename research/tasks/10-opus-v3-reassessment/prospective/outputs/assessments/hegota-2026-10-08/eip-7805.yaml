- id: performance_risks
  label: Performance risks
  score: 2
  evidence:
  - source: eip.md
    locator: Execution Layer
    summary: newPayload must decode and recover the sender of each IL transaction and read sender nonce
      and balance from the post-state, adding to validation latency.
  - source: eip.md
    locator: Preset — IL_COMMITTEE_SIZE 16, MAX_BYTES_PER_INCLUSION_LIST 8192
    summary: 'Bounds the workload: up to 16 × 8 KiB of IL transactions per slot.'
  - source: eip.md
    locator: Payload Construction — "`O(n^2)`"
    summary: A naive payload update is quadratic; builders must update payloads under tight timing (t=11s).
  - source: eip.md
    locator: Consensus Liveness
    summary: Liveness depends on enough time to update the payload after the IL freeze.
  rationale: Targeted integrated benchmarks are needed for two bounded interactions. The first is newPayload
    latency with maximum-size adversarial ILs (many distinct senders forcing cold state reads, invalid
    signatures). The second is payload-update time in forkchoiceUpdated with ILs under the slot deadline.
  confidence: medium
  uncertainty_note: Coupling with attestation deadlines and mempool-driven IL building could justify level
    3.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 3
  evidence:
  - source: eip.md
    locator: CL P2P Validation Rules — "ILs are allowed to contain any transactions—valid or invalid"
    summary: The EL receives untrusted, unvalidated transaction bytes through the Engine API.
  - source: eip.md
    locator: Core Properties — Fork-choice enforced
    summary: The EL's satisfaction result decides whether attesters vote, so divergent EL results across
      clients split fork choice.
  - source: eip.md
    locator: Consensus Liveness
    summary: Builders unable to satisfy ILs cannot produce canonical blocks.
  rationale: A shared validation invariant now spans the EL newPayload check, the EL payload builder and
    CL fork choice. Clients must agree exactly on IL satisfaction for adversarially crafted ILs (malformed
    or undecodable transactions, edge nonce/balance cases, dependency chains, equivocation-filtered sets).
    Otherwise blocks are wrongly rejected or censorship is missed. This needs coordinated adversarial
    scenarios across components.
  confidence: medium
  uncertainty_note: Could be argued as level 2 if the check is treated as a bounded EL/CL interaction.
  exceptional_score_justification: null
