- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Execution Layer — "If `T.gas` > `gas_left`, then jump to the next transaction"
    summary: Gas-fit boundary (T.gas equal to vs exceeding gas_left).
  - source: eip.md
    locator: Execution Layer — "Validate `T` against `S` by checking the nonce and balance of `T.origin`"
    summary: Nonce boundary (exact vs off by one) and balance boundary (exactly sufficient vs 1 wei short),
      both evaluated against the post-block state.
  - source: eip.md
    locator: IL Building — "maximum size of `MAX_BYTES_PER_INCLUSION_LIST = 8 KiB`"
    summary: Byte-size bound on ILs produced by the EL.
  - source: eip.md
    locator: Payload Construction
    summary: Dependencies between IL transactions (balance transfers, nonce chains) and in-block changes
      to sender nonce/balance alter the outcome.
  rationale: 'Several boundary-sensitive mechanisms are introduced: gas-fit against `gas_left`, the post-state
    nonce check, the post-state balance check, and the 8 KiB IL size bound. The satisfaction outcome depends
    on interacting dimensions that cannot be tested independently. These are: whether the transaction
    is already in the block, remaining gas, sender nonce and balance as changed by in-block transactions,
    multiple IL transactions from the same sender, duplicates across ILs, and multiple ILs.'
  confidence: medium
  uncertainty_note: If gas-fit, nonce and balance are treated as separable conjunctive checks, level 2
    would apply.
  exceptional_score_justification: null
