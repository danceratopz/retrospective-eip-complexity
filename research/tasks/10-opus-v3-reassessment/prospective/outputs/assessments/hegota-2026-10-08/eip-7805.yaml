  - source: eip.md
    locator: Engine API Changes
    summary: IL transactions are a new input to payload validation and building.
  rationale: 'To fill IL-satisfaction expectations, the transition tool must accept IL transactions and
    run a new post-block check: is each transaction present, does `T.gas` fit in `gas_left`, does it pass
