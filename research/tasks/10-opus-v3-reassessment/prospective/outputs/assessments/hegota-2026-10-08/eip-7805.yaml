  title: Fork-choice enforced Inclusion Lists (FOCIL)
  layers:
  - execution
  - consensus
assessment:
  snapshot_scope_summary: EIP-7805 (FOCIL) adds a per-slot committee of 16 validators. Each member gossips
    a signed inclusion list (IL) of up to 8 KiB of RLP-encoded transactions taken from its mempool view.
    On the execution side, `engine_newPayload` gains a post-execution check. For every IL transaction
    not already in the block, the EL checks whether `T.gas <= gas_left` and whether the transaction passes
    nonce and balance checks against the post-block state. If any such transaction would be valid, the
    EL returns a new `INCLUSION_LIST_UNSATISFIED` status. The block stays valid, but attesters will not
    vote for it. The Engine API also gains `engine_getInclusionListV1`, an IL field in `forkchoiceUpdated`
    `payloadAttributes` for payload building, and an IL-transactions parameter in `newPayload`. There
    are no EVM, gas, header, transaction-type or system-contract changes; the remaining changes (committee,
    gossip, equivocation handling and fork choice) are consensus-layer only.
