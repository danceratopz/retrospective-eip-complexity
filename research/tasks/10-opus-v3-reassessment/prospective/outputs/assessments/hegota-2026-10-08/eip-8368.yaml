  - source: supporting/eip-8037.md
    locator: Deterministic deployment factories
    summary: Pre-signed deployment gas limits are sensitive to CPSB.
  rationale: 'A single common change (the CPSB value) alters the expected gas used, balances, reservoir/spill
    amounts and OOG boundaries for ordinary cases in several distinct baseline families: SSTORE, value-bearing
    CALL to new accounts, CREATE/CREATE2 and code deposit, SELFDESTRUCT beneficiaries, 7702 authorizations,
    contract-creation transactions, block gas_used/base fee, and system calls.'
  confidence: medium
  uncertainty_note: If baseline tests derive expectations from a fork-scoped CPSB parameter, the rework
