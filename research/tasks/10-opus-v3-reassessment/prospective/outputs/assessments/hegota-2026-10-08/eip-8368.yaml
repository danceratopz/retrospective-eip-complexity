assessment:
  snapshot_scope_summary: 'EIP-8368 is a placeholder that would replace the value of EIP-8037''s `CPSB`
    (cost per state byte) with a value re-derived for a new reference block gas limit, using EIP-8037''s
    methodology. The new reference gas limit, the new `CPSB` value and the rationale are all TBD. It states
    that every other EIP-8037 parameter, mechanism and semantic stays the same. In practice, every state-gas
    charge that EIP-8037 defines as a multiple of `CPSB` changes value: new storage slots, new accounts,
    code deposit, the EIP-7702 per-authorization base and new-account costs, and the formula-derived `SYSTEM_CALL_GAS_LIMIT`
    reservoir.'
