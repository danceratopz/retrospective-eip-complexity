    locator: Gas accounting for SSTORE / Gas accounting for new accounts
    summary: State-gas charges and refills for SSTORE, CALL* with value, CREATE/CREATE2, SELFDESTRUCT
      and contract-creation transactions are all multiples of CPSB.
  - source: supporting/eip-8037.md
    locator: System contracts and system transactions — SYSTEM_CALL_GAS_LIMIT
    summary: The system-call gas limit and reservoir depend on CPSB.
  - source: supporting/eip-8037.md
