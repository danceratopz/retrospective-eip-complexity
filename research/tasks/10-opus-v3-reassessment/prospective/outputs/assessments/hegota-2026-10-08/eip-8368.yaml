criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: Abstract — "All other parameters, mechanisms, and semantics defined in EIP-8037 ... remain
      unchanged"
    summary: Only CPSB changes; execution-gas rules are untouched.
  - source: supporting/eip-8037.md
    locator: Parameter changes — "New Execution Gas" column
    summary: Execution-gas components (CREATE_ACCESS, hash cost, ACCOUNT_WRITE, EXECUTION_PER_AUTH_BASE_COST)
      do not depend on CPSB.
  rationale: CPSB only scales state-gas charges. The execution-gas accounting rules and parameters are
    unchanged. When state gas spills into gas_left, a different CPSB moves gas_left, but that effect belongs
    to state-gas accounting.
  confidence: high
  uncertainty_note: State-gas spill into gas_left changes the GAS opcode values seen in tests with no
    reservoir. This is counted under SGAS/PAT, not here.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification — CPSB | TBD
    summary: Only a value changes; no ordering rules are touched.
  - source: supporting/eip-8037.md
    locator: Account-creation charging and EIP-7928
    summary: Charge placement and access timing are defined by EIP-8037 and are not changed by the target.
  rationale: No instruction's state-access or charge ordering changes.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
