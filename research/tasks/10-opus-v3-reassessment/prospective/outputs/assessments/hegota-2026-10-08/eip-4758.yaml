- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Specification — "it no longer destroys code or storage or alters the nonce"
    summary: In the baseline, SELFDESTRUCT still destroys a contract created in the same transaction.
      Those cases now keep their code, storage and nonce.
  - source: eip.md
    locator: Backwards Compatibility — "re-created at the same address using `CREATE2` (after a `SELFDESTRUCT`)"
    summary: CREATE2 redeployment after a SELFDESTRUCT now fails, which changes the expected results of
      create/collision scenarios.
  rationale: Several families need their expected results reworked in specific cases. These include SELFDESTRUCT
    tests where the contract was created in the same transaction (including SELFDESTRUCT inside initcode
    and burning ETH by naming itself as beneficiary), CREATE/CREATE2 redeploy-after-destroy scenarios,
    and state/access-list expectations that involve destroyed accounts. Ordinary SELFDESTRUCT cases on
    pre-existing contracts that only send ETH are mostly unaffected in the baseline. This is localized
    rework in several families, which is level 2.
  confidence: medium
  uncertainty_note: How much rework is needed depends on the unresolved halting semantics and on how target==self
    is handled. If SENDALL did not halt, rework would spread across ordinary SELFDESTRUCT tests (level
    3).
  exceptional_score_justification: null
