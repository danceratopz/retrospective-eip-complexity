criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification — "All refunds related to `SELFDESTRUCT` are removed"
    summary: The only gas-related statement removes SELFDESTRUCT refunds. It defines no new costs and
      no new accounting mechanism.
  rationale: In the Amsterdam baseline, SELFDESTRUCT already gives no gas refund (general protocol knowledge
    about the base fork), so removing the refunds changes nothing there. The EIP changes no opcode cost,
    charging rule or limit, which fits level 0.
  confidence: medium
  uncertainty_note: The spec does not say whether SENDALL still halts execution. If execution continued
    after it, the gas results of baseline sequences would change (level 1). The spec also does not restate
    the gas schedule of the renamed opcode.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification — "now only immediately moves all ETH in the account to the target"
    summary: The opcode still reads and writes the same accounts (self and target). The EIP defines no
      new ordering of accesses or gas charges.
  rationale: The opcode touches the same accounts as before, and the EIP does not change the order of
    its state accesses or gas charges. This is level 0.
  confidence: medium
  uncertainty_note: Account deletion in same-transaction-created contracts no longer happens, which may
    change which state writes a block-level access list records. The EIP says nothing about this.
  exceptional_score_justification: null
