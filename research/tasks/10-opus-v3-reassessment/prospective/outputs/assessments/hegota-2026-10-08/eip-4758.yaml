assessment:
  snapshot_scope_summary: EIP-4758 renames SELFDESTRUCT to SENDALL and changes what it does. The opcode
    now only moves all ETH in the executing account to the target. It no longer deletes code or storage,
    and it no longer changes the nonce. The EIP also removes every refund related to SELFDESTRUCT. As
    a result, redeploying a contract at the same address with CREATE2 after destroying it no longer works.
    Applications that use SELFDESTRUCT only to pull out funds keep working.
