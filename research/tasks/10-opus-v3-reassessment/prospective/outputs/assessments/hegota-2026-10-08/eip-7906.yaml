criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 2
  evidence:
  - source: eip.md
    locator: Transaction Diff Lookup Opcode > Gas Cost
    summary: TXDIFF storage params charge COLD_SLOAD_COST/WARM for an arbitrary (address, slot) pair,
      and balance/codehash params charge COLD_ACCOUNT_ACCESS_COST/WARM. The view params charge a flat
      100.
  - source: supporting/eip-2929.md
    locator: Storage read changes, 'Note 2'
    summary: EIP-2929 says pricing for remote cold storage reads is undefined, and any EIP adding them
      must define it. TXDIFF is such a remote storage read.
  - source: eip.md
    locator: The `POST_TX` Frame Mode, 'payer is fully charged for the gas consumed up to the point of
      the failure'
    summary: A POST_TX failure reverts the execution body but keeps its execution gas charged. Skipped
      POST_TX frame budgets are refunded.
  rationale: 'The EIP adds new accounting: remote storage-read pricing (cold SLOAD on any address, with
    no account-access charge), the gas schedules of the new opcodes, and gas settlement after a POST_TX-triggered
    body revert. Baseline operations keep their expected gas results, so this is level 2.'
  confidence: medium
  uncertainty_note: 'Two points are unspecified and could alter baseline-like settlement expectations:
    whether the EIP-3529 refund counter accumulated by the body is discarded on POST_TX failure, and whether
    a cold storage query also warms the account.'
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Transaction Diff Lookup Opcode > Gas Cost, 'added to the EIP-2929 access list after the call'
    summary: For TXDIFF params 0x00–0x05, the accessed slot or address is added to the access list after
      the call and recorded in the EIP-7928 BAL. Params 0x06–0x0C and TXTRACE/EVENTDATACOPY add no accesses.
  - source: supporting/eip-7928.md
    locator: Gas Validation Before State Access
    summary: BAL inclusion depends on a pre-state gas check passing before the access. TXDIFF is not in
      the table.
  rationale: TXDIFF is a new state-accessing operation that needs its own ordering and BAL-recording rule
    (cold/warm, live-state fallback versus diff-only answers, out-of-gas before access). No existing opcode
    class changes, so this is level 2.
  confidence: medium
  uncertainty_note: The text does not say whether an out-of-gas TXDIFF records the access in the BAL,
    or whether a storage query also records or warms the account.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Transaction Trace Opcode, 'gas_pre_charge = gas_limit × gas_price + blob_count × GAS_PER_BLOB
      × blob_base_fee'
    summary: Blob fees are only reported through a read-only TXTRACE param. Blob charging is unchanged.
  rationale: No blob-gas charging, pricing or limit rule changes. The blob fee is only exposed for reading.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 2
  evidence:
  - source: eip.md
    locator: The `POST_TX` Frame Mode, 'the state gas recorded in them is removed, as for an unrolled
      EIP-8141 atomic batch'
    summary: On POST_TX failure, the state gas of every execution-body frame is rolled back, reusing the
      atomic-batch rollback at a new, wider boundary.
  - source: supporting/eip-8141.md
    locator: State-gas attribution and refills
    summary: The state-gas journal is restored at frame, call and batch boundaries, and cross-frame refills
      adjust earlier receipts.
  rationale: 'The existing EIP-8141 state-gas rollback mechanism is applied at a new site: a whole-body
    rollback spanning several frames and batches, triggered by a later frame. No new charging mechanism
    is added, so this is level 2.'
  confidence: medium
  uncertainty_note: Interplay of the body rollback with refills of charges owned by validation-prefix
    frames (for example a deploy frame) is not detailed.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: The `POST_TX` Frame Mode, 'their gas is refunded at the end of the transaction'
    summary: Unexecuted POST_TX frame budgets are returned as unused gas, in the same way as skipped atomic-batch
      frames.
  rationale: Returning unused gas from skipped frames reuses the existing EIP-8141 settlement. No new
    protocol refund mechanism is introduced.
  confidence: medium
  uncertainty_note: Discarding the body's EIP-3529 refund-counter contributions on POST_TX failure is
    implied, not stated.
  exceptional_score_justification: null
