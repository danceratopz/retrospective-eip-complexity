  - execution
assessment:
  snapshot_scope_summary: 'EIP-7906 adds three opcodes: TXTRACE (0xb6), TXDIFF (0xb7) and EVENTDATACOPY
    (0xb8). Together they expose the transaction''s net state diff (balances, storage, newly deployed
    code, account change flags), the logs it emitted, the gas pre-charge and the gas payer. It also amends
    the EIP-8141 frame transaction with a new frame mode, POST_TX (3). POST_TX frames must form a contiguous
    trailing suffix, execute read-only as STATICCALLs, and cannot carry the atomic-batch flag; the frame
    directly before them cannot carry it either. If a POST_TX frame reverts or halts, the whole execution
    body is unconditionally rolled back, the validation prefix and gas payment stay committed, the remaining
    POST_TX frames are skipped with status 2, and the receipts of the reverted body frames lose their
    logs and state gas. The opcodes halt exceptionally outside POST_TX frames. TXDIFF is priced with EIP-2929
    cold/warm costs and records accesses in the EIP-2929 access lists and the EIP-7928 block-level access
    list (BAL).'
