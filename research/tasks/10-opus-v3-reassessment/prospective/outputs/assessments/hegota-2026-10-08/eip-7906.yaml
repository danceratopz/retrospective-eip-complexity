  - source: eip.md
    locator: State Difference Semantics
    summary: 'Net-change inclusion rules: restored values are excluded, storage wipes are excluded, delegation
      designators are excluded, and EIP-6780 created-and-destroyed contracts are included.'
  rationale: 'There are many independent boundary-sensitive rules: index bounds, topic counts, reserved
    operands, copy bounds, suffix rules, cold/warm, and net-change inclusion. Two are elevated matrices.
    First, POST_TX failure × frame position × atomic-batch state × number of POST_TX frames × validation-prefix
    boundary, which changes receipts and committed state. Second, diff-entry inclusion × create/selfdestruct/delegation
    × write-then-restore. This is level 3.'
