assessment:
  snapshot_scope_summary: 'EIP-7979 adds three EVM instructions: CALLSUB (pop a destination, push PC+1
    to a new return stack, jump), CALLDEST (a no-op subroutine-entry label costing 1 gas), and RETURNSUB
    (pop the return stack into the PC). The return stack is a new part of machine state that EVM code
    cannot read or write directly. It holds at most 1024 entries, and both overflow and underflow cause
    an exceptional halt. Jump-destination analysis is extended so CALLDEST is a valid target for CALLSUB,
    JUMP and JUMPI, which changes the set of valid destinations for the existing jump instructions. Opcode
    byte values are still to be decided. EIP-8173 is an informational background document and defines
    no protocol rules.'
