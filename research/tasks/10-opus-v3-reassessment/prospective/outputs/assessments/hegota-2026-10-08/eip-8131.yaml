assessment:
  snapshot_scope_summary: 'EIP-8131 replaces the separate calldata floor (EIP-7623/EIP-7976) and the EIP-7981
    access-list data surcharge with one transaction floor: tx_floor = 21000 + 64 × (calldata bytes + 20·access-list
    addresses + 32·storage keys + 108·EIP-7702 authorizations + 32·EIP-4844 blob versioned hashes). A
    transaction is valid only if tx.gas >= max(intrinsic, tx_floor), and tx.gasUsed = max(execution_gas_used,
    tx_floor). Intrinsic gas is stated to be unchanged. The stated goal is to cap user-controlled content
    at block_gas_limit/64 bytes per block, and it newly brings authorization tuples and blob versioned
    hashes under the floor. The EIP adds no new transaction type, header field, opcode, precompile or
    encoding.'
