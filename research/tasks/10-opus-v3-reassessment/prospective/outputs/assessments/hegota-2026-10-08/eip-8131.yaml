    locator: Specification / Charging
    summary: Only the floor/max settlement is specified. No refund mechanism is introduced.
  rationale: No new refund mechanism. The existing refund-before-floor interaction is inherited from EIP-7623.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Test Cases / EIP-4844 with six blob versioned hashes
    summary: A blob tx with no calldata now has a floor above 21000 (+2048 per hash), so minimal blob
      txs become floor-bound and txs with gas limit 21000 become invalid.
  - source: eip.md
    locator: Backwards Compatibility — bind-rate table
    summary: Type-3 bind rate is 60%, and type-4 bind rate rises from 0.04% to 20.63%, so ordinary cases
      in those families change gasUsed.
  - source: supporting/eip-7981.md
    locator: Specification
    summary: Baseline access-list txs always pay a 1280/2048 surcharge. Under the unified floor, access-list
      bytes are paid only when the floor binds, which changes ordinary access-list gas expectations.
  rationale: 'One common rule change (the unified content floor) requires reworking ordinary cases in
    several distinct families: blob tx gas, validity and balance tests; access-list (EIP-2930/7981) gas
    expectations; calldata-floor tests that mix fields; and type-4 txs carrying calldata. That fits level
    3.'
  confidence: medium
  uncertainty_note: How much access-list rework is needed depends on whether the EIP-7981 surcharge stays
    in intrinsic gas. If it stays, that family is less affected and the score could be 2.
  exceptional_score_justification: null
