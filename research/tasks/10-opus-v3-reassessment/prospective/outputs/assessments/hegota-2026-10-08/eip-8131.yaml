  label: Cross-EIP interactions
  score: 3
  evidence:
  - source: eip.md
    locator: Specification / Transaction floor
    summary: One formula couples calldata (EIP-7976), access lists (EIP-2930/7981), authorizations (EIP-7702)
      and blob hashes (EIP-4844).
  - source: supporting/eip-7702.md
    locator: Gas Costs / Behavior step 7
    summary: Per-auth intrinsic cost and refunds for existing authorities interact with the floor's max
      settlement.
  - source: supporting/eip-4844.md
    locator: Execution layer validation
    summary: The blob-tx balance check uses tx.gas; floor-raised gas limits interact with max_total_fee
      and the separate blob fee.
  rationale: The target couples behavior defined by several EIPs into one settlement and validity rule.
    Coordinated scenarios are needed across type-1/2 access lists, type-3 blob hashes, type-4 authorizations
    and calldata mixes, including how each interacts with that EIP's own intrinsic cost and refund rules.
    That fits level 3.
  confidence: medium
  uncertainty_note: The access-list interaction depends on the unresolved fate of the EIP-7981 surcharge.
  exceptional_score_justification: null
