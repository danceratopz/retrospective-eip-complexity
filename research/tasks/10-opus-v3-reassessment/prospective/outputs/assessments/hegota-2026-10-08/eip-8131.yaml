  label: Unspecified behavior requiring cross-client consensus
  score: 2
  evidence:
  - source: eip.md
    locator: Specification / Charging — "Intrinsic gas is unchanged."
    summary: Does not say whether the EIP-7981 access-list data surcharge (part of baseline intrinsic/gasUsed)
      is removed or kept, even though the abstract says the rule 'replaces' EIP-7981.
  - source: supporting/eip-7981.md
    locator: Reference Implementation — "intrinsic_gas = ... + access_list_data_cost"
    summary: In the baseline, intrinsic gas includes the surcharge.
  - source: eip.md
    locator: Specification / Charging — "tx.gasUsed = max(execution_gas_used, tx_floor)"
    summary: execution_gas_used is not redefined here. EIP-7623 defines it as EVM gas excluding intrinsic.
      Backwards Compatibility implies 'intrinsic plus execution'.
  rationale: Access-list transactions have two competing outcomes (surcharge kept in intrinsic vs. removed),
    differing by 1280/2048 gas per entry, and this must be agreed before expected values can be fixed.
    The execution_gas_used naming is a secondary localized issue that surrounding text resolves. That
    fits level 2.
  confidence: medium
  uncertainty_note: A later revision or client agreement may resolve this; none is supplied.
  exceptional_score_justification: null
