    locator: Specification / Transaction floor — "BLOB_VERSIONED_HASH_BYTES * num_blob_versioned_hashes"
    summary: Blob versioned hashes are charged in regular gas through the floor, not in blob gas.
  - source: supporting/eip-4844.md
    locator: Gas accounting
    summary: Blob gas is an independent gas type with its own pricing, which the target does not change.
  rationale: Blob gas pricing, limits and settlement are unchanged. The new term is regular-gas floor
    content.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
