  label: Security risks
  score: 1
  evidence:
  - source: eip.md
    locator: Rationale / Per-auth term is a constant — "maximum RLP size ... 9 B chain_id"
    summary: Assumes a 108-byte maximum auth tuple.
  - source: supporting/eip-7702.md
    locator: Set code transaction — "assert auth.chain_id < 2**256"
    summary: chain_id may be up to 256 bits and y_parity up to 2**8, so a tuple can exceed 108 bytes and
      the claimed bound is not strictly tight.
  rationale: The changed invariant is the per-block content bound. It can be checked locally through floor
    arithmetic and worst-case constructions. The auth-size assumption should be checked against oversized-field
    authorizations.
  confidence: medium
  uncertainty_note: Whether exceeding the bound via oversized authorization fields matters is a design
    question, not a testing-breadth one.
  exceptional_score_justification: null
