criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification / Transaction floor
    summary: Redefines the existing floor term to add access-list, authorization and blob-versioned-hash
      byte counts at 64 gas/byte.
  - source: eip.md
    locator: Specification / Charging — "The `max(intrinsic, floor)` shape of EIP-7623 is preserved"
    summary: Settlement keeps the existing max(execution, floor) mechanism. Only its inputs change.
  - source: supporting/eip-7981.md
    locator: Specification — "added as a flat surcharge to the gas used calculation"
    summary: In the baseline, access-list data cost is an always-paid surcharge. EIP-8131 folds it into
      the floor instead.
  rationale: The transaction gas settlement rule (the floor) changes its terms and rates, and the EIP-7981
    always-paid surcharge moves into the floor. No new accounting mechanism is added; the existing max(intrinsic+execution,
    floor) mechanism is modified. That fits level 1.
  confidence: medium
  uncertainty_note: How much of the change is structural depends on whether the EIP-7981 surcharge is
    removed from intrinsic/gasUsed, which the text leaves ambiguous ('Intrinsic gas is unchanged'). Either
    way no new mechanism is added.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: Only transaction-level floor gas is specified. No instruction behavior or access ordering
      is touched.
  rationale: No opcode state-access or gas-charge ordering changes.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
