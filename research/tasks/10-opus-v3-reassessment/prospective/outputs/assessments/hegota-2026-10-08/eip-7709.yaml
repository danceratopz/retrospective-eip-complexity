criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Gas costs
    summary: In-window BLOCKHASH charges the corresponding SLOAD cold/warm cost for slot arg % HISTORY_SERVE_WINDOW
      in addition to the base cost.
  - source: eip.md
    locator: Reading from the System contract
    summary: System-contract execution gas is not charged even if resolved via a call; only the SLOAD
      effect applies.
  - source: eip.md
    locator: Backwards Compatibility
    summary: Significant increase in the cost of in-window BLOCKHASH queries.
  rationale: An existing opcode's gas rule changes from a constant cost to a cost that depends on access
    state. It reuses the existing cold/warm SLOAD accounting and adds no new accounting mechanism, so
    this is level 1.
  confidence: medium
  uncertainty_note: Treating BLOCKHASH's move to access-dependent gas as a new charging site for an existing
    mechanism rather than a new mechanism is a judgement call. The warming of the account address is also
    unspecified.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 1
  evidence:
  - source: eip.md
    locator: Specification — "performs an sload on arg % HISTORY_SERVE_WINDOW including gas charges, warming
      effects as well as state-access recording"
    summary: BLOCKHASH now performs a storage access with gas charging and state-access recording, but
      only after the window check.
  - source: eip.md
    locator: Test Cases — "returns 0 without applying additional storage access effects"
    summary: Out-of-window calls must not record an access or warm the slot.
  rationale: Exactly one existing opcode, BLOCKHASH, gains a storage access whose gas charge and access
    recording must be ordered (window check, then charge and access). No general rule for an opcode class
    changes, so this is level 1.
  confidence: medium
  uncertainty_note: 'Two points are unstated: the order of base-gas and SLOAD-gas checks relative to recording
    on out-of-gas, and whether the history account itself is recorded or warmed. This could support level
    2 if treated as a new state-accessing operation.'
  exceptional_score_justification: null
