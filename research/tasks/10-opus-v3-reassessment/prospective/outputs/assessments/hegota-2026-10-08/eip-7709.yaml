assessment:
  snapshot_scope_summary: EIP-7709 changes how BLOCKHASH (0x40) resolves in-window lookups. From the fork
    block onward, a lookup for one of the last 256 ancestors is treated as an SLOAD of slot `arg % 8191`
    at the EIP-2935 HISTORY_STORAGE_ADDRESS. The opcode then charges the cold or warm SLOAD cost on top
    of the BLOCKHASH base cost, warms the slot, and applies any state-access recording the active fork
    requires. Out-of-window and future arguments still return 0 with no extra effects, and the return-value
    semantics are declared unchanged. Clients may resolve the value by direct SLOAD, by a non-system `get`
    call (whose execution gas is not charged) or from memory. The EIP assumes EIP-2935 was active at least
    256 blocks earlier, or at genesis.
