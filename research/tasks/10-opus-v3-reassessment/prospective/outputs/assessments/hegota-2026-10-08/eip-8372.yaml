assessment:
  snapshot_scope_summary: EIP-8372 changes EIP-8037's two-dimensional gas model. It replaces CPSB with
    a new value (TBD) and adds STATE_GAS_LIMIT_SCALE (TBD, as a percentage over a denominator of 100).
    The raw state-gas limit becomes block_gas_limit * SCALE // 100, and that value replaces the block
    gas limit in EIP-8037's per-transaction state_gas_available check. At block level, raw block_state_gas_used
    is normalized (× 100 // SCALE) before taking the max with execution gas to form header gas_used, and
    two validity assertions are added. The EIP adds no transaction or header fields and leaves the reservoir
    model, transaction-level accounting and receipts unchanged.
