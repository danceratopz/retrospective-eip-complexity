criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Block-level gas accounting
    summary: Header gas_used is now max(block_execution_gas_used, normalized_block_state_gas_used), with
      gas_used <= block_gas_limit asserted.
  - source: supporting/eip-8037.md
    locator: Block-level gas accounting – "gas_used_delta = parent.gas_used - parent.gas_target"
    summary: The base-fee update uses header gas_used, so changing how gas_used is computed changes block-level
      settlement for all gas.
  rationale: Block-level gas_used, which feeds the gas limit check and the base-fee update, is computed
    by a changed rule. This is a change to an existing block accounting rule. No new execution-gas charging
    mechanism is added, and opcode execution-gas costs are unchanged. That fits level 1.
  confidence: medium
  uncertainty_note: The change mainly concerns state gas. Treating the change to the shared gas_used/base-fee
    settlement as an execution-gas rule change is a judgement call; 0 is defensible.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Backwards Compatibility – "Transaction formats, the EIP-8037 reservoir model, transaction-level
      gas accounting, and receipt semantics remain unchanged"
    summary: Opcode-level charging and access timing are unchanged.
  rationale: No instruction's state-access or charge ordering changes.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: Only CPSB, the state-gas limit and block gas_used normalization are specified; blob gas is
      not mentioned.
  rationale: No blob-gas rule changes.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 2
  evidence:
  - source: eip.md
    locator: Parameters
    summary: CPSB is replaced with a new TBD value, which rescales every state-gas charge.
  - source: eip.md
    locator: Transaction validation – "state_gas_limit = block_env.block_gas_limit * STATE_GAS_LIMIT_SCALE
      // STATE_GAS_LIMIT_SCALE_DENOMINATOR"
    summary: The block state-gas budget becomes a scaled raw limit instead of the block gas limit.
  - source: eip.md
    locator: Block-level gas accounting – "normalized_block_state_gas_used"
    summary: Raw state gas is normalized before it enters header gas_used.
  rationale: Beyond the CPSB rate change (level 1), the block-level state-gas budget and how it is allocated
    change through the scaled limit and normalization. That is a budget-allocation change (level 2). Charging
    sites, the reservoir, and spill between the reservoir and gas_left are unchanged, so level 3 is not
    met.
  confidence: medium
  uncertainty_note: If the chosen SCALE were 100, only the CPSB change would remain (level 1).
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
