    locator: Parameters – "CPSB | TBD"
    summary: A new CPSB changes the expected state-gas cost of every state-creating operation.
  - source: supporting/eip-8037.md
    locator: Parameter changes
    summary: CPSB drives costs for CREATE/CREATE2, code deposit, CALL to a new account, SELFDESTRUCT,
      SSTORE set, and 7702 empty-account/auth-base charges.
  - source: supporting/eip-8037.md
    locator: System contracts and system transactions – "SYSTEM_CALL_GAS_LIMIT = 30_000_000 + STATE_BYTES_PER_STORAGE_SET
      × CPSB × SYSTEM_MAX_SSTORES_PER_CALL"
    summary: The system-call gas allotment and reservoir depend on CPSB.
  - source: eip.md
    locator: Block-level gas accounting
    summary: Header gas_used, and therefore base-fee expectations, change for state-dominated blocks.
  rationale: 'One common change (the CPSB value, plus normalized block gas_used) alters expected gas results
    across distinct families: SSTORE, contract creation and code deposit, value calls to new accounts,
    SELFDESTRUCT, 7702 authorizations, reservoir and transaction-gas boundaries, system calls, and block
    gas_used/base-fee tests. This meets level 3.'
  confidence: medium
  uncertainty_note: Values are TBD. If CPSB stayed equal to the baseline and SCALE = 100, the rework would
