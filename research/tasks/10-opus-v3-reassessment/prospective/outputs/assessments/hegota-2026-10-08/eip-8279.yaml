  - execution
assessment:
  snapshot_scope_summary: EIP-8279 adds two per-transaction counters, `bal_data_bytes` and `floor_gas_used`,
    to EIP-7928 Block Access List (BAL) processing. Before an opcode inserts an entry into the BAL, it
    calls `meter_bal_data` with a fixed byte count for cold account or storage accesses, storage-value
    changes, value transfers, CREATE nonce and balance entries, and deployed code. That count, at 64 gas
    per byte, is added to the EIP-8131 static transaction floor. If the floor would exceed `tx.gas`, the
    operation raises OutOfGasError. The static floor seed also gains a fixed 51 BAL bytes per EIP-7702
    authorization, which changes the transaction validity threshold. A storage slot returned to its pre-transaction
    value gets its 32 value bytes back. Final charging stays `tx.gasUsed = max(execution_gas_used, floor_gas_used)`.
    System calls and withdrawals are excluded from the meter.
