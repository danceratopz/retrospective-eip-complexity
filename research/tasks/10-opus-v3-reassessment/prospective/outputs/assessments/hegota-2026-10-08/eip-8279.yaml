- After a failed `meter_bal_data`, are the bytes that were added to `bal_data_bytes` kept? Can a later
  refund recompute push `floor_gas_used` above `tx.gas`?
- An O→X write happens in a reverted frame, then a committed O→Y write follows. Are the 32 value bytes
  charged again, and is the per-slot charged flag reverted?
- Is the floor check before or after EIP-7928 pre-state gas validation? This matters when the frame then
  OOGs and the floor binds.
