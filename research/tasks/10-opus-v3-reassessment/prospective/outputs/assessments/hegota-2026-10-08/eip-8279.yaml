criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: Data meter and floor accumulator
    summary: 'Adds a new runtime per-transaction floor accumulator: `new_floor = static_floor + bal_data_bytes
      * 64`. If the new floor exceeds `tx.gas`, the operation raises OutOfGasError.'
  - source: eip.md
    locator: Final charge
    summary: '`tx.gasUsed = max(execution_gas_used, tx_env.floor_gas_used)` now includes runtime BAL bytes.'
  - source: eip.md
    locator: Static floor seed
    summary: The static floor adds 64 × 51 gas per authorization on top of EIP-8131's `tx_floor`.
  - source: supporting/eip-8131.md
    locator: Charging
    summary: 'Baseline: `tx.gasUsed = max(execution_gas_used, tx_floor)`, a floor computed only from transaction
      content.'
  rationale: 'This adds a new accounting mechanism: a runtime floor accumulator with its own out-of-gas
    trigger. It also changes existing settlement results: any floor-bound transaction that touches state,
    and type-4 transactions whose floor dominates, now get a different gasUsed. That meets level 3.'
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 3
  evidence:
  - source: eip.md
    locator: Data meter and floor accumulator — "MUST be called BEFORE the matching BAL insertion or state
      mutation"
    summary: Adds a new gate before BAL insertion. An OutOfGasError at that gate aborts the operation
      before the BAL entry exists.
  - source: eip.md
    locator: Runtime data metering
    summary: 'Metering applies across a whole class of operations: BALANCE, EXT*, CALL*, SELFDESTRUCT,
      CREATE/CREATE2, SLOAD and SSTORE, plus value transfers and code deployment.'
  - source: supporting/eip-7928.md
    locator: Gas Validation Before State Access
    summary: 'Baseline two-phase rule: pre-state validation must pass before access. Once it passes, the
      target is included in the BAL.'
  rationale: 'A common new ordering step (the floor check before BAL insertion) is added for every account-accessing
    and storage-accessing opcode class. It changes which accesses get recorded: an access that passes
    EIP-7928 pre-state validation can still be left out of the BAL if the floor check fails. Baseline
    BAL expectations for floor-bound transactions must be revised. This meets level 3.'
  confidence: medium
  uncertainty_note: The order of the floor check relative to EIP-7928 pre-state gas validation is not
    specified. Baseline revisions are limited to floor-bound transactions, so level 2 is plausible.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Static floor seed
    summary: Blob versioned hashes enter the floor only through EIP-8131's `tx_floor`. This EIP leaves
      blob-gas pricing unchanged.
  rationale: No blob-gas charging, pricing or limits change.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Runtime data metering
    summary: SSTORE value bytes and deployed code bytes are charged as BAL data bytes at the floor rate,
      not as state-growth gas.
  rationale: The rubric places BAL data-size charges under GAS. No state-gas mechanism changes.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 2
  evidence:
  - source: eip.md
    locator: Runtime data metering — "`SSTORE` returning a slot to its pre-transaction value | −32 (refund)"
    summary: Adds a byte refund to the floor meter. It depends on the slot's pre-transaction value and
      on whether it was charged earlier.
  - source: eip.md
    locator: Runtime data metering — "not the EIP-3529 SSTORE gas refund"
    summary: The refund is explicitly separate from EIP-3529 refunds, which are unchanged.
  rationale: The floor-byte refund depends on history (original vs current value, earlier charge state,
    revert behaviour), so it counts as complex under the rubric. Existing EIP-3529 refund rules and baseline
    refund expectations are unchanged. That is level 2.
  confidence: medium
  uncertainty_note: It is debatable whether a reduction of the floor accumulator counts as an 'EVM gas
    refund'. If it does not, the score would be 0.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Backwards Compatibility
    summary: Minimum `tx.gas` changes only when the floor side already dominated, i.e. for calldata-heavy
      or BAL-heavy transactions.
  - source: eip.md
    locator: Static floor seed
    summary: The per-authorization term changes the floor of type-4 transactions.
  rationale: 'Rework is localized to several families: floor-bound calldata or access-list tests from
    EIP-8131/7623 that touch state, type-4 floor and validity boundary tests, and BAL tests built on floor-bound
    transactions. No common rewrite is needed across ordinary tests, because the floor rarely binds. That
    is level 2.'
