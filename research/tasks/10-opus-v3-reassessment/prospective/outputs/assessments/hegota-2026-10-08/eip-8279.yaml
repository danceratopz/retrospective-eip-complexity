- id: security_risks
  label: Security risks
  score: 2
  evidence:
  - source: eip.md
    locator: Block-size bound
    summary: The security claim is that every BAL byte is covered by the floor. Under-counting breaks
      the bound.
  - source: eip.md
    locator: Per-auth coverage is static — "would propagate uncaught and crash block processing"
    summary: Metering at the wrong site can crash block processing.
  - source: supporting/eip-7928.md
    locator: Recording Semantics by Change Type
    summary: BAL entries include CALL sender balances, precompiles and delegated targets. The meter must
      cover these (only the recipient's 32 balance bytes are listed for CALL).
  rationale: The change couples transaction settlement to how the BAL builder records entries. The meter
    must stay an upper bound on EIP-7928 contents. Possible gaps include warm-but-unrecorded addresses,
    CALL-sender balance changes and delegation resolution. The meter must also never fire outside the
    EVM exception handler. This bounded interaction needs targeted differential fuzzing of the meter against
    actual BAL contents. That is level 2.
  confidence: medium
  uncertainty_note: None identified.
  exceptional_score_justification: null
