    locator: Data meter and floor accumulator — `tx_env.bal_data_bytes += num_bytes` before the check
    summary: Bytes are added even when the check raises OutOfGasError and are not rolled back. Later meter
      calls, or the refund recompute, could then push `floor_gas_used` above `tx.gas`.
  - source: eip.md
    locator: Runtime data metering — "The refund subtracts from bal_data_bytes and recomputes floor_gas_used"
    summary: The refund recompute has no `tx.gas` check, and its interaction with failed-meter bytes is
      undefined.
  - source: eip.md
    locator: Reverts — "value bytes charged inside a frame that later reverts are left in place"
    summary: It is unclear whether the per-slot 'charged' state is reverted. This contradicts 'at most
      once per slot' for an O→X write in a reverted frame followed by a committed O→Y.
  - source: supporting/eip-7928.md
