  title: Replace cumulative receipt fields
  layers:
  - execution
assessment:
  snapshot_scope_summary: EIP-8116 changes the on-chain receipt so that, after activation, each receipt
    records the transaction's own `gasUsed` instead of the running block total `cumulativeGasUsed`. As
    a result, the serialized receipt contents and the `receiptsRoot` commitment change for every block
    with more than one transaction. The EIP also changes the JSON-RPC `logIndex` so it counts within each
    receipt instead of across the block. It says this second part is RPC-only. The EIP does not change
    gas charging, transaction validity, headers, opcodes, precompiles or system contracts.
