    cases: Address collision at 0x12/0x13. If both EIPs were scheduled, the fork configuration must make
      sure only one definition occupies each address.
  - eip: 7951
    interaction: local_compatibility_check
    cases: 'Contrast in output convention only: 32-byte zero on failure versus P256VERIFY''s empty output.
      No shared behavior to test.'
