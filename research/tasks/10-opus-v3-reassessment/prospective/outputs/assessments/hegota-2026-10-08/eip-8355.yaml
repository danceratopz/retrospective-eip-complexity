assessment:
  snapshot_scope_summary: 'EIP-8355 adds three precompiles at 0x12, 0x13 and 0x14 that verify FIPS 204
    ML-DSA signatures for ML-DSA-44, ML-DSA-65 and ML-DSA-87. Each one takes `pubkey ++ signature ++ message`,
    where the public key is compressed and the message has variable length, and always uses the empty
    context. Every call that does not run out of gas returns a 32-byte word: 1 when the signature verifies
    and 0 when it fails, is malformed or the input is too short. Gas is BASE + 6 per 32-byte message word,
    charged before verification. BASE is 6500, 9000 or 13500, and the message-word count is clamped at
    zero.'
