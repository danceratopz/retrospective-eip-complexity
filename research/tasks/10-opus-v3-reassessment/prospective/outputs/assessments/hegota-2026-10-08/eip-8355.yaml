  - eip: 8141
    interaction: local_compatibility_check
    cases: Check that the precompiles work when called from a VERIFY frame's static context, and when
      a frame's resolved_target is 0x12–0x14 directly. Optionally, check that ARBITRARY signature bytes
      copied via SIGDATACOPY, followed by the message, form a valid precompile input.
