  evidence:
  - source: eip.md
    locator: Gas cost
    summary: Defines a per-precompile fee of BASE + 6*ceil(max(0, L-PK_LEN-SIG_LEN)/32), charged up front.
      This is a fee for the new precompiles, not a change to EVM accounting rules.
  - source: eip.md
    locator: Backwards Compatibility
    summary: The precompiles occupy previously unassigned addresses, so no existing behavior changes.
  rationale: The only gas content is the fee schedule of the new precompiles, which the template treats
    as an ordinary contract fee. No EVM charging, metering or settlement rule changes.
  confidence: medium
  uncertainty_note: Adding precompile addresses normally puts them in the pre-warmed access set, which
    changes cold/warm costs for calls to 0x12–0x14. The target does not state this. If it is counted as
    a parameter change, level 1 could apply.
