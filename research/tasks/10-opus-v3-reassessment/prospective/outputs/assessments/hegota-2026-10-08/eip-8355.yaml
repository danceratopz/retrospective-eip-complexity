- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 1
  evidence:
  - source: supporting/eip-8141.md
    locator: Behavior
    summary: '''If resolved_target is an active precompile at the current fork, the frame dispatches it
      as an ordinary call would.'' VERIFY frames run as STATICCALL.'
  - source: eip.md
    locator: Rationale / Message last, with no length field
    summary: An ML-DSA witness may travel as an EIP-8141 ARBITRARY entry and be copied with SIGDATACOPY
      before the precompile call.
  - source: supporting/eip-8051.md
    locator: Specification
    summary: EIP-8051 assigns VERIFY_MLDSA to 0x12 and VERIFY_MLDSA_ETH to 0x13, which collide with this
      EIP's addresses.
  - source: eip.md
    locator: Rationale / Always returning 32 bytes
    summary: Output convention deliberately differs from EIP-7951 P256VERIFY.
  rationale: Only local compatibility checks are needed. Under EIP-8141, the precompiles must be callable
    from VERIFY frames (static context), including as a direct frame target. The EIP-8051 address collision
    is a fork-composition check. EIP-7951 is only a contrast in output format. The verification flow built
    on ARBITRARY signatures is an optional application design.
  confidence: medium
  uncertainty_note: If EIP-8141 VERIFY-frame flows using SIGDATACOPY plus the precompile are judged required
    coordinated cases, the score would be 2.
  exceptional_score_justification: null
