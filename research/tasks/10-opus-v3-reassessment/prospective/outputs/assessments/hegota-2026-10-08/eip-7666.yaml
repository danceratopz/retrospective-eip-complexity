criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Backwards Compatibility — "Gas costs are slightly different"
    summary: Calls to 0x04 are no longer charged by the precompile gas schedule. They are charged as ordinary
      EVM execution of EVM_CODE, including memory expansion in the callee frame.
  - source: eip.md
    locator: Specification — "should no longer be treated as a precompile"
    summary: Removing 0x04 from the precompile set implies it is no longer pre-warmed like other precompiles,
      so first access in a transaction becomes a cold access.
  rationale: 'Existing accounting rules now apply differently to 0x04: interpreter gas replaces precompile
    gas, and the address''s warm/cold status changes. No new accounting mechanism is added, so level 1
    applies.'
  confidence: medium
  uncertainty_note: The EIP does not say explicitly whether 0x04 stays in the pre-warmed address set.
    This assessment assumes it does not, based on 'no longer treated as a precompile'.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: No instruction's state-access or gas-charge sequence is changed. Only the callee at 0x04
      changes.
  - source: rubric.md
    locator: SAO note — "Changed precompile or contract internals do not modify an instruction's ordering"
    summary: Changing what the callee is does not count as an ordering change.
  rationale: CALL-family instructions keep their specified ordering. The only change is what runs at 0x04.
  confidence: medium
  uncertainty_note: The supplied text does not say whether calls to 0x04 or the activation-time code write
    must now appear in the block-level access list. If they must, recordable-access expectations for 0x04
    change.
  exceptional_score_justification: null
