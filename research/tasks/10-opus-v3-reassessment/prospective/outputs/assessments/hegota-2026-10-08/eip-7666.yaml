assessment:
  snapshot_scope_summary: EIP-7666 removes the identity precompile at 0x04. At the start of the fork block,
    the protocol sets that address's code to the 7-byte EVM program 0x365f5f37365ff3 (CALLDATASIZE PUSH0
    PUSH0 CALLDATACOPY CALLDATASIZE PUSH0 RETURN). From that block on, 0x04 is no longer treated as a
    precompile. Return values are meant to stay the same, but the EIP says gas costs differ slightly.
    The program needs PUSH0 (EIP-3855), and the EIP cites MCOPY (EIP-5656) only as the reason the precompile
    is no longer needed.
