assessment:
  snapshot_scope_summary: EIP-8250 changes the EIP-8141 frame transaction payload. The single `nonce`
    becomes `nonce_keys`, a strictly increasing list of 1 to 16 uint256 keys, plus a shared uint64 `nonce_seq`.
    `nonce_keys == [0]` keeps using the legacy account nonce. Non-zero keys are stored in a new revert-only
    system contract, NONCE_MANAGER at 0x…8250, at slot keccak256(sender||key). The protocol checks these
    sequences for stateful validity and consumes them when a payment-scoped APPROVE succeeds. Each first-use
    slot costs EIP-8037 state gas, and these accesses do not count toward EIP-2929 warmth or EIP-2200
    SSTORE pricing. The EIP also prices the nonce bytes as calldata, makes TXPARAM(0x01) return nonce_seq,
    adds TXPARAM selectors 0x0D–0x10, and installs NONCE_MANAGER at fork activation. Mempool identity
    and revalidation rules are updated to match.
