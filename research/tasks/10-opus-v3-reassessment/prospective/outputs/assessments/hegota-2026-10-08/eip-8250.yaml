criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Transaction payload — "add `nonce_calldata_cost` to `standard_gas_limit`"
    summary: The nonce fields are now priced as transaction data under the existing EIP-8141/EIP-7623
      calldata pricing, which changes the gas totals of frame transactions.
  - source: eip.md
    locator: Nonce consumption — "are NOT charged under EIP-2200 `SSTORE` pricing"
    summary: Keyed-nonce reads and writes are exempt from execution-gas access and SSTORE charges.
  - source: supporting/eip-8141.md
    locator: Gas Accounting — standard_gas_limit / calldata_floor_gas
    summary: These are the baseline formulas that the target extends with new inputs.
  rationale: 'Existing frame-transaction gas formulas gain new inputs: the nonce calldata cost and tokens.
    This shifts the expected gas of every frame transaction, but no new execution-gas accounting mechanism
    is introduced. The access exemption is an exclusion, not a new mechanism. That fits level 1.'
  confidence: medium
  uncertainty_note: It is unclear whether the nonce calldata cost also enters frame_tx_intrinsic_gas for
    the EIP-7825 cap and the block execution_reservation. It is also unclear which token count feeds the
    floor. Neither question changes the level.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 1
  evidence:
  - source: eip.md
    locator: Nonce consumption — "Only after those checks and costs succeed, and before any approval effect
      is committed"
    summary: 'Defines a new sequence for APPROVE: approval checks, execution gas and memory first; then
      read the selected slots, compute and check state gas, charge it, consume the nonce and commit.'
  - source: eip.md
    locator: Nonce consumption — "do NOT add `NONCE_MANAGER` or its slots to EIP-2929 `accessed_addresses`"
    summary: Protocol keyed-nonce accesses do not warm the address or slots.
  rationale: 'Only APPROVE, a prerequisite instruction, has its state-access and charge ordering changed:
    up to 16 storage reads are inserted before its state-gas charge. No general class-wide ordering rule
    changes, which fits level 1.'
  confidence: medium
  uncertainty_note: The EIP does not say whether these protocol reads and writes are recorded in EIP-7928
    block-level access lists. If a new recordable-access rule is needed, the score could reach 2.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Transaction payload — "No other payload field is changed"
    summary: The blob fields and blob accounting of EIP-8141 are unchanged.
  rationale: No blob-gas rule changes.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 2
  evidence:
  - source: eip.md
    locator: Constants — KEYED_NONCE_FIRST_USE_STATE_GAS
    summary: Each fresh key costs STATE_BYTES_PER_STORAGE_SET*CPSB (97920) state gas.
  - source: eip.md
    locator: Nonce consumption — steps 1-3
    summary: 'State gas is charged inside APPROVE from state_gas_left: KEYED_NONCE_FIRST_USE_STATE_GAS
      times first_use_count, or the account-creation charge for [0]. It counts toward the transaction
      and block state-gas totals.'
  - source: eip.md
    locator: Mempool — "Structural Rule 6 also allows a `VERIFY` frame to use state gas"
    summary: The mempool budget rule now admits state gas for keyed-slot creation.
  - source: supporting/eip-8037.md
    locator: Gas accounting for SSTORE (opcode-level)
    summary: Baseline per-slot state-gas pricing that the target reuses.
  rationale: A new charging site (APPROVE keyed-slot creation) uses the existing EIP-8037 state-gas mechanism
    and frame state pools. No new mechanism and no change to spill between pools, which fits level 2.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Nonce consumption — "are NOT charged under EIP-2200 `SSTORE` pricing"
    summary: Keyed-nonce writes are outside SSTORE refund logic, and the protocol never writes 0.
  rationale: No new refund mechanism. The only reversal of the keyed-nonce charge is the existing frame
    rollback.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Transaction payload — "replaces the `nonce` field ... with two consecutive fields"
    summary: Every post-fork frame transaction must be re-encoded and re-signed with nonce_keys and nonce_seq.
  - source: eip.md
    locator: Transaction payload — nonce_calldata pricing
    summary: The gas and fee results of all frame transactions change because the nonce bytes are now
      priced.
  - source: eip.md
    locator: Nonce consumption — "EIP-8141's payment-approval transition currently increments ... This
      EIP replaces"
    summary: The APPROVE nonce increment and the sender-creation charge are restructured.
  - source: eip.md
    locator: Transaction introspection — "`TXPARAM(0x01)` returns `tx.nonce_seq`"
    summary: The meaning of the TXPARAM nonce selector changes.
  rationale: One common change, the payload schema plus priced nonce bytes, forces ordinary-case rework
    across distinct EIP-8141 test families after the fork. These include encoding and signature-hash,
    validity, APPROVE, TXPARAM, gas and fee settlement, and receipts. That fits level 3.
  confidence: medium
  uncertainty_note: If EIP-8141 and this EIP activate in the same fork, some of this is authoring the
    prerequisite suite directly in the new format, which would argue for 2.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Activation — "clients MUST initialize `NONCE_MANAGER` with `NONCE_MANAGER_CODE`, nonce `1`"
    summary: A new protocol-mandated account appears in post-fork state.
  - source: eip.md
    locator: Nonce state — slot(sender, nonce_key)
    summary: Keyed transactions produce protocol-mandated storage writes under NONCE_MANAGER.
  rationale: Post-fork state must include the NONCE_MANAGER account, which affects state-root expectations
    for fork-transition and fork tests. Keyed storage writes are new-feature outputs. No pre-fork vectors
    need re-deriving, which fits level 2.
  confidence: medium
  uncertainty_note: How genesis-at-fork test networks install NONCE_MANAGER is not specified. If it is
    pre-allocated, the effect is narrower (level 1).
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 2
  evidence:
  - source: eip.md
    locator: Transaction payload
    summary: The frame transaction input replaces `nonce` with the two fields `nonce_keys` and `nonce_seq`.
  - source: eip.md
    locator: Activation — "whose parent has `parent.timestamp < FORK_TIMESTAMP`"
    summary: A parent-timestamp-dependent installation is needed for fork-transition blocks.
  rationale: Several transaction fields change (nonce removed; nonce_keys and nonce_seq added) without
    a new exchange mechanism. That fits level 2.
  confidence: medium
  uncertainty_note: No t8n interface documentation was supplied. Whether parent-timestamp input already
    exists cannot be verified.
  exceptional_score_justification: null
- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 2
  evidence:
  - source: eip.md
    locator: Nonce state — current_nonce_seq
    summary: Nonce state now lives in per-(sender, key) storage domains under a system contract, not only
      the account nonce.
  - source: eip.md
    locator: Transaction introspection — nonce_keys_hash
    summary: Verifier test contracts need a helper to compute the canonical key-set hash.
  rationale: Tests need a construction abstraction for keyed nonce domains. It must compute NONCE_MANAGER
    slots, pre-populate them, and track sequences per key instead of auto-incrementing the account nonce.
    It must also produce frame transactions with key sets. This is a new abstraction within the target
    suite, but not a shared facility that changes other families, which fits level 2.
  confidence: medium
  uncertainty_note: If existing frame-transaction builders are easily extensible, this could be a local
    extension (level 1).
  exceptional_score_justification: null
