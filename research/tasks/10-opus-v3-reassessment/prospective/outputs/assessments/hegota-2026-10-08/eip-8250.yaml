  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Transaction payload — decoder rejection list
    summary: Boundaries for 1–16 keys, key < 2**256, nonce_seq < 2**64, strictly increasing keys, and
      the zero-key-only-alone rule.
  - source: eip.md
    locator: Stateful validity — "assert tx.nonce_seq < MAX_NONCE_SEQ"
    summary: An exhausted key at 2**64-1 cannot be used.
  - source: eip.md
    locator: Nonce consumption — "would make `state[sender].nonce > MAX_NONCE_SEQ`"
    summary: Legacy nonce overflow on increment causes an exceptional halt.
  - source: eip.md
    locator: Nonce consumption — steps 1-2 "If `state_gas_left < nonce_state_gas`"
    summary: The state-gas sufficiency boundary depends on first_use_count.
  - source: eip.md
    locator: Activation — FORK_TIMESTAMP
    summary: Timestamp boundary for the schema and logic switch.
  rationale: 'Several boundary-sensitive mechanisms are introduced. The APPROVE state-gas check is an
    elevated matrix: frame limits.state × number of keys × how many keys are fresh vs. used × [0]-with-nonexistent-sender
    × approval scope 0x1/0x3 × VERIFY (makes the tx invalid) vs. non-VERIFY frame. That fits level 3.'
