      dequeued.
  - source: eip.md
    locator: update_excess_preregistration_requests
    summary: A protocol-mandated storage write (resetting the inhibitor, updating excess and count) happens
      in each block.
  rationale: New outputs (the request entry and contract storage) only matter to assertions in the request-related
