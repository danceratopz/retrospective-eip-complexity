  - source: supporting/eip-7685.md
    locator: Block Header — "Items with empty request_data are excluded"
    summary: Blocks with no preregistration requests keep the same requests_hash, which limits rework.
  rationale: Empty request data is excluded from the commitment, so ordinary baseline tests keep their
    expected outputs. Rework is limited to request-bus cases, such as tests that enumerate request types
    and their ordering or that test missing system-contract code. That is localized rework.
  confidence: medium
  uncertainty_note: Post-state roots change because the new contract's storage is written (the excess
