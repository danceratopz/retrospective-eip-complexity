assessment:
  snapshot_scope_summary: 'EIP-8205 adds a new EIP-7685 request contract on the execution layer for withdrawal-credential
    preregistrations. A request is pubkey ++ withdrawal_credentials ++ signature, 176 bytes. The contract
    copies the EIP-7002/7251 design: a queue, an exponential fee with TARGET=1 and MAX=4 dequeued per
    block, an EXCESS_INHIBITOR, a fee getter that reverts if value is attached, LOG0 emission, and an
    end-of-block system call that returns SSZ-serialized records. A system call with calldata disables
    the queue, but nothing under this EIP reaches that path. The consensus layer stores the preregistrations,
    checks their BLS signatures, enforces them against validator deposits and expires them. The EL side
    only queues and passes requests on; it performs no cryptographic checks. The bytecode, address, request
    type and deployment are all still TBD.'
