  number: 8253
  title: Bump nonce of zero-nonce storage accounts
  layers:
  - execution
assessment:
  snapshot_scope_summary: EIP-8253 adds a one-time irregular state transition at the start of the Hegotá
    fork block. Before any pre-execution system contract call or transaction, it sets the nonce to 1 for
    a fixed list of 28 Mainnet accounts that have empty code, zero nonce and non-empty storage. Balance,
    code hash and storage root stay the same, and the transition produces no transaction, receipt or log
    and uses no gas. Because the bumped accounts now fail EIP-684's nonce == 0 precondition, later CREATE/CREATE2
    calls to these addresses fail; the EIP offers this as an alternative to EIP-7610's runtime storage
    check. When EIP-7928 is active, each targeted account must appear in the block access list (BAL) with
    a single NonceChange [0, 1] and no other changes.
