assessment:
  snapshot_scope_summary: EIP-3298, as supplied, is a delta on EIP-8037 and EIP-8038. It removes the SSTORE
    storage-clearing refund (STORAGE_CLEAR_REFUND = 11,616) and the two EIP-8038 refund rules that grant
    and reverse it. It also removes the EIP-3529 20% refund cap from transaction settlement. The only
    refund rule left is EIP-8038's net-metered STORAGE_WRITE reversal, applied when a slot returns to
    its original value. The refund counter keeps its journaling, the EIP-7623/7976 calldata floor still
    applies after refunds, and block-level execution-gas accounting stays pre-refund under EIP-7778. When
    EIP-8141 is active, frame-transaction settlement also applies the full refund counter, with no MAX_REFUND_QUOTIENT.
