    locator: Specification / SSTORE refund rules
    summary: STORAGE_CLEAR_REFUND and the two EIP-8038 refund rules that use it are removed. The STORAGE_WRITE
      reversal rule is unchanged.
  - source: eip.md
    locator: Specification / Removal of the refund cap
    summary: In settlement, tx_gas_refund = min(tx_gas_used_before_refund // 5, refund_counter) becomes
      refund_counter. The calldata floor still applies after refunds.
  - source: supporting/eip-8037.md
    locator: Transaction gas used
    summary: The baseline settlement applies the 20% refund cap.
  rationale: Existing refund and settlement rules are removed or simplified. No new accounting mechanism
    is introduced, which matches level 1. Expected gas results of baseline operations change, but level
