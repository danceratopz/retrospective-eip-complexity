  label: Security risks
  score: 2
  evidence:
  - source: eip.md
    locator: Security Considerations
    summary: '"Removing the cap is safe only because the remaining refund is self-bounded and the counter
      is journaled across reverts; both properties are load-bearing."'
  - source: eip.md
    locator: Specification / Removal of the refund cap
    summary: For EIP-8141, the counter is transaction-scoped and discards reverted frames' changes, so
      the bound is claimed to hold.
  - source: supporting/eip-8141.md
    locator: Transaction settlement
    summary: The refund counter accumulates across frames and is discarded for reverted frames and unrolled
      atomic batches.
  rationale: Removing the cap takes away a defensive bound on what the sender pays. Safety now depends
    on the refund counter never exceeding STORAGE_WRITE charges paid in the same transaction. That property
    depends on journaling across call-frame reverts, frame-transaction frames and atomic batches, and
    on its interaction with state-gas refills and the floor. This is a bounded interaction that needs
    targeted adversarial cases (level 2).
  confidence: medium
  uncertainty_note: This could be viewed as a local check (level 1) if the journaling semantics are considered
    already covered by the prerequisites.
  exceptional_score_justification: null
