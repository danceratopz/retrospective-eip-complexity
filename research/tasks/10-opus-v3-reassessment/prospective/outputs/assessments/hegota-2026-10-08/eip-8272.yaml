assessment:
  snapshot_scope_summary: 'EIP-8272 sets up a stateful recent root contract at RECENT_ROOT_ADDRESS (0x…8272),
    installed by the protocol at activation. Root sources write domain-separated keccak entry hashes into
    an 8192-slot ring buffer keyed by (source_id, slot) using 64-byte calldata. The same contract checks
    1–16 packed 72-byte (source_id, slot, root) tuples against storage and the EIP-7843 SLOTNUM within
    an 8191-slot window. A canonical EIP-8141 VERIFY frame, `recent_root_verify`, calls this check before
    account validation, so a failed check invalidates the frame transaction. The EIP-8141 public mempool
    policy is extended with: a fixed frame position, a SLOTNUM/SLOAD exception, MAX_VERIFY_GAS accounting,
    dependency indexing, and eviction on age, slot advance, reorg and code change. There is no new opcode,
    transaction envelope, header field or gas mechanism.'
