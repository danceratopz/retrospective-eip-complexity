notable_ambiguities:
- RECENT_ROOT_CODE is TBD, but the EIP requires direct evaluation to match EVM gas use and warm sets exactly.
- A static-context write "MUST fail" without saying whether it reverts or halts exceptionally.
- The activation trigger is unclear for chains or tests whose genesis is already in the fork.
- Mempool current_slot (header slotNumber + 1) can differ from the payload slot, so builder revalidation
  is required; the expected eviction behavior for skipped slots is only partly specified.
- The admission margin for references close to expiry is left to the node, so expiry-near admission results
  are not deterministic across clients.
