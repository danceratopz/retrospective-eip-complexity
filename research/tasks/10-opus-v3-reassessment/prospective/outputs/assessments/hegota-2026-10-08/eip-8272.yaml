  - source: eip.md
    locator: Test Cases — "Each of EIP-8141's four recognized validation prefix shapes must be tested
      with no protocol verifier, with recent_root_verify, with expiry_verify, and with expiry_verify followed
      by recent_root_verify."
    summary: Elevated matrix of prefix shape × verifier presence × order.
  rationale: 'There are several independent boundary-sensitive mechanisms: the age window and ring index,
    calldata length and tuple count, the MAX_VERIFY_GAS budget, the execution limit, and the activation-state
    conditions. The frame-position rule is an elevated matrix: four prefix shapes × expiry_verify presence
