criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Gas Cost
    summary: Successful recovery adds 100 (warm) or 2600 (cold) gas following EIP-2929 and warms recovered_address;
      failed recovery stays at 3000.
  - source: eip.md
    locator: Rationale / EIP-2929 Gas Accounting
    summary: Reuses the existing warm/cold access pattern to 'avoid introducing a new gas model'.
  - source: supporting/eip-2929.md
    locator: Storage read changes
    summary: Defines the existing accessed_addresses warm/cold charging rule being applied at the new
      site.
  rationale: 'The existing EIP-2929 warm/cold rule is applied at a new site: the ecRecover precompile''s
    gas schedule. This changes the expected gas of a baseline operation (every successful ecRecover) without
    defining a new accounting mechanism. That fits level 1.'
  confidence: medium
  uncertainty_note: Making precompile gas depend on state and recovery outcome could be treated as a new
    accounting mechanism that also changes baseline gas results (level 3).
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Modified ecRecover Behavior, step 3
    summary: 'After recovery succeeds, charge 3000 plus the access cost, then check the raw code: a new
      state access with a defined charge-then-read sequence.'
  - source: eip.md
    locator: Reference Implementation / ecrecover_gas
    summary: The address is added to accessed_addresses inside the gas computation, before the code check.
  rationale: 'The precompile becomes a new state-accessing operation and needs an ordering rule: recover,
    then charge, then mark warm, then read code. Relevant combinations are cold/warm, recovery success/failure,
    out-of-gas in the precompile frame, and caller revert. No opcode class''s common ordering changes,
    so this is level 2.'
  confidence: medium
  uncertainty_note: The text does not say whether the recovered address is recorded in the Amsterdam block-level
    access list. Under the rubric's footnote on precompile internals, this could be argued down to 0–1.
  exceptional_score_justification: null
