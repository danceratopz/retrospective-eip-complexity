  label: Unspecified behavior requiring cross-client consensus
  score: 2
  evidence:
  - source: eip.md
    locator: Modified ecRecover Behavior, steps 2 and 5
    summary: States 'return 32 zero bytes' for failure and rejection, calling this 'the existing zero
      return value'.
  - source: eip.md
    locator: Rationale / Returning 32 Zero Bytes
    summary: Asserts malformed v and failed recovery currently 'return 32 zero bytes with success = 1'.
  - source: eip.md
    locator: Reference Implementation
    summary: Adds to accessed_addresses inside the gas function before any out-of-gas check; out-of-gas
      handling is not specified.
  rationale: 'Under the established baseline, ecRecover failure gives empty output (RETURNDATASIZE 0),
    but the EIP''s normative text says 32 zero bytes. That leaves competing observable outcomes for both
    the existing failure path and the new rejection path: a return-data size of 0 or 32. It also does
    not say whether the recovered address is warmed when the extra charge runs out of gas, or whether
    it enters the block-level access list. These localized competing outcomes need agreement before expected
    values can be fixed, which is level 2.'
  confidence: medium
  uncertainty_note: Treating baseline failure output as empty relies on general protocol knowledge rather
    than a supplied document. The block-level access list rules are not supplied, so that point is partly
    an evidence gap.
  exceptional_score_justification: null
- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 2
  evidence:
  - source: eip.md
    locator: Gas Cost
    summary: Reads and writes the EIP-2929 accessed_addresses set shared with other operations.
  - source: eip.md
    locator: Account Code Check
    summary: Exempts EIP-7702 delegation indicators and does not follow delegation.
  - source: supporting/eip-7702.md
    locator: Behavior, steps 4 and 8
    summary: Authorization warms the authority and writes or clears the delegation indicator, both visible
      to the new check in the same transaction.
  rationale: 'Coordinated cases are needed with EIP-2929 and EIP-7702. For EIP-2929: warmth from the tx
    sender, the access list or earlier opcodes sets ecRecover''s cost, ecRecover''s warming lowers later
    opcode costs, and warmth is rolled back on revert. For EIP-7702: authorization in a type-4 transaction
    followed by ecRecover, delegation clearing, and the boundaries of the 23-byte indicator. EIP-3607
    needs only a consistency check. The scenarios are bounded, so this is level 2 rather than coupled
    restructuring.'
  confidence: medium
  uncertainty_note: A type-4 transaction that both warms and delegates the authority, followed by ecRecover,
    couples two EIPs; this could be read as level 3.
