  number: 8151
  title: Account Code Restricted ecRecover
  layers:
  - execution
assessment:
  snapshot_scope_summary: EIP-8151 changes the ecRecover precompile at address 0x01. After a successful
    ECDSA recovery, the precompile charges the EIP-2929 warm/cold account-access cost for the recovered
    address (+100 or +2600 on top of 3000) and adds that address to accessed_addresses. It then reads
    the address's raw code without following delegation. It returns the address only if that code is empty
    or exactly a 23-byte 0xef0100||address EIP-7702 delegation indicator; otherwise it returns 32 zero
    bytes. A failed recovery keeps the 3000 gas cost and does no state access. The goal is to stop an
    old ECDSA key from authorizing contract actions after the account moves to non-delegation code, in
    line with the EIP-3607/EIP-7702 transaction-origination rule.
