  unresolved_questions:
  - What protocol version number does eth/XX take?
  - Must announcements with unequal list lengths be rejected or treated as a protocol violation?
  - What exact penalty applies to a mismatched announcement (disconnect, deprioritize)? Does it apply
    when an eagerly pushed transaction contradicts an earlier announcement?
  - What is the quantified bandwidth overhead (the Overhead section says 'Details TBD')?
  - Do the fee fields discussed under Alternatives become part of the message? The current Specification
    does not include them.
notable_ambiguities:
- The Specification lists only the source and nonce additions. The fee fields discussed in Rationale/Alternatives
  are not specified.
- It is not stated whether eth/XX carries over all other eth/69 message definitions unchanged.
- '''Treated as a node that violated the protocol'' leaves the enforcement action unspecified.'
- This is a Networking EIP with no hard fork. Its relevance to the Hegotá fork assessment is limited to
  coordinating client releases.
