  present: true
  summary: The protocol version number is a placeholder ('eth/XX'). The overhead analysis is marked TBD.
    The text does not say how to handle list-length inconsistencies across the five parallel lists. The
    consequence of a tuple mismatch is only described as 'protocol violation'. All of these are p2p-local
    and not consensus-visible.
