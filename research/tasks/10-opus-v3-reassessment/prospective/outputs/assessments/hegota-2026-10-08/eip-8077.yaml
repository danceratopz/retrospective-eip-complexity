assessment:
  snapshot_scope_summary: 'EIP-8077 is a Networking-category EIP. It defines a new devp2p ''eth'' protocol
    version, eth/XX, that adds two parallel lists to the NewPooledTransactionHashes (0x08) message: each
    transaction''s source address (B_20) and nonce (P), alongside the hash, type and size lists from eth/69.
    Sender-side changes are limited to the extra data. How receivers use the new fields for scheduling
    is left to implementations. If an announced <txhash,type,size,address,nonce> tuple does not match
    the transaction actually received, the announcing peer is treated as having violated the protocol.
    The EIP explicitly says it does not change EVM consensus rules and does not need a hard fork. It builds
    on the eth/69 message format from EIP-7642.'
