criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 2
  evidence:
  - source: eip.md
    locator: Gas Cost
    summary: 'PAY has its own gas function that adds three conditional parts: warm/cold access, GAS_NEW_ACCOUNT
      when the recipient does not exist and val is non-zero, and GAS_CALL_VALUE when val is non-zero.
      No stipend or 63/64 forwarding applies.'
  - source: supporting/eip-2929.md
    locator: Storage read changes
    summary: Defines the WARM_STORAGE_READ_COST and COLD_ACCOUNT_ACCESS_COST that PAY reuses. Charges
      for existing opcodes are not changed by the target.
  rationale: 'PAY adds a new dynamic charging rule at a new instruction. It is built from existing components
    and does not change any existing opcode''s gas or baseline gas results. That fits level 2: a new mechanism
    with no change to existing rules.'
  confidence: medium
  uncertainty_note: One could argue that reusing existing gas components is not a new accounting mechanism,
    which would give 0. Level 2 is the best-supported reading because the opcode's charging rule is new
    and conditional.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Behavior
    summary: 'Fixes the order: static check, pop, address-width halt, charge gas, mark addr warm, then
      a conditional transfer. The gas charge depends on reading whether the recipient exists before the
      transfer.'
  - source: supporting/eip-2929.md
    locator: Specification
    summary: Changes to access sets are reverted when a scope reverts. This applies to PAY's warming.
  rationale: PAY is a new state-accessing operation that needs its own ordering rule. The existence read
    and the warm/cold check come before the charge, and the warming and transfer come after it. No existing
    opcode's ordering changes. Relevant combinations are cold/warm, existing/non-existing recipient, static/non-static,
    enough/too little balance, revert/success, and out-of-gas at each gas part.
  confidence: medium
  uncertainty_note: The Amsterdam baseline's block-level access list rules are not supplied. Whether `addr`
    is recorded on out-of-gas or insufficient-balance paths cannot be checked.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: Covers only an EVM opcode. Blobs are not mentioned.
  rationale: No blob-gas rule is affected.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 2
  evidence:
  - source: eip.md
    locator: Gas Cost
    summary: Charges GAS_NEW_ACCOUNT when the recipient does not exist and val is non-zero. This is a
      charge for creating a new account in state, at a new site.
  - source: eip.md
    locator: Constants
    summary: GAS_NEW_ACCOUNT is taken from the frontier EELS constant. No state-gas reservoir or state-byte
      rule is specified.
  rationale: 'PAY adds a new place where an existing account-creation charge applies, without a new state-gas
    mechanism. That matches level 2: charging added at a new site using an existing mechanism.'
  confidence: low
  uncertainty_note: Any state-gas mechanism in the Amsterdam baseline is not supplied. If GAS_NEW_ACCOUNT
    is treated purely as execution gas, this could be 0. If the baseline has a separate state-gas dimension,
    PAY must also be wired into it, which the EIP does not specify.
  exceptional_score_justification: null
