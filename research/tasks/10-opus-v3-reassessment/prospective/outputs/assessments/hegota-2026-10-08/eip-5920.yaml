  - source: eip.md
    locator: Security Considerations
    summary: Refers to EIP-6780 SELFDESTRUCT as another way to move value.
  rationale: Coordinated cases are needed with EIP-214 (PAY in static frames, including val=0), EIP-2929
    (warming shared with CALL/BALANCE, and warming undone on revert) and EIP-7702 (PAY to a delegated
    EOA runs no code and charges no delegation-resolution cost). Each of these is a pairwise interaction,
    not a coupled multi-EIP restructuring, so level 2 applies.
  confidence: medium
  uncertainty_note: Whether the EIP-6780 cases (PAY to or from a contract created and self-destructed
