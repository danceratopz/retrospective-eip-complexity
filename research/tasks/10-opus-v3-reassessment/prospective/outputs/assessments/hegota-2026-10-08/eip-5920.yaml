assessment:
  snapshot_scope_summary: EIP-5920 adds one EVM instruction, PAY (0xfc). It pops `addr` then `val` and
    sends `val` wei from the current account to `addr` without running any code at `addr`. If the frame
    is static (EIP-214) or the upper 12 bytes of `addr` are non-zero, it halts exceptionally. It charges
    warm/cold access gas (EIP-2929), plus GAS_NEW_ACCOUNT when the recipient does not exist and `val`
    is non-zero, plus GAS_CALL_VALUE when `val` is non-zero. It then adds `addr` to `accessed_addresses`
    and pushes 1 on success or 0 if the balance is too low. It relies on EIP-7523 (no empty accounts)
    and adds no transaction, header, encoding or system-contract changes.
