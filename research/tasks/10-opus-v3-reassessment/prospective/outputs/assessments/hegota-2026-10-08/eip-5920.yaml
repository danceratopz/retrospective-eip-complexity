  - eip: 214
    interaction: coordinated_cases
    cases: PAY inside a STATICCALL frame halts exceptionally for zero and non-zero val (unlike CALL with
      zero value). Also PAY in a frame nested under a static call.
  - eip: 2929
    interaction: coordinated_cases
    cases: Cold vs. warm PAY. PAY warms addr so a later CALL/BALANCE/EXT* is warm, and vice versa. Warming
