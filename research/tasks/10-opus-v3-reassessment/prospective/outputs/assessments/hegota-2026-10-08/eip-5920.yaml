  label: Cross-EIP interactions
  score: 2
  evidence:
  - source: eip.md
    locator: Behavior
    summary: Uses EIP-214's static flag and EIP-2929's accessed_addresses.
  - source: eip.md
    locator: Motivation
    summary: Sending to an EIP-7702 delegated EOA must not run its code.
  - source: supporting/eip-7702.md
    locator: Delegation indicator
    summary: Only CALL-family opcodes and transactions follow delegation. Resolving delegated code adds
