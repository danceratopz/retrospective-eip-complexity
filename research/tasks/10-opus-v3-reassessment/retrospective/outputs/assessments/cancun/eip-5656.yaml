assessment:
  historical_scope_summary: 'EIP-5656 (revision e9b6a228, status Review) adds one EVM instruction, MCOPY,
    at 0xb7. It pops dst, src and length from the stack and copies length bytes of memory from src to
    dst, behaving as if through an intermediate buffer, so the two regions may overlap. It returns no
    stack items. Its gas follows the existing W_copy formula: Gverylow + 3 per copied word, plus memory
    expansion. Memory is expanded only when length > 0 and src+length or dst+length goes past the current
    memory size. The EIP cites EIP-2929 only to explain why the identity precompile is a costly way to
    copy memory, and it changes no other opcode, precompile, transaction, header or API.'
