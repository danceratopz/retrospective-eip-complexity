assessment:
  historical_scope_summary: EIP-7516 (revision of 2023-09-14) adds one EVM instruction, BLOBBASEFEE, at
    byte 0x49. It takes no stack inputs, pushes one value and costs a constant 2 gas. The pushed value
    is get_blob_gasprice(header) from EIP-4844, computed from the current block header's excess_blob_gas.
    The EIP describes itself as identical to EIP-3198's BASEFEE except for the value it returns. It adds
    no header fields, transaction rules, encodings or accounting mechanisms. However, in the supplied
    EIP-4844 text, byte 0x49 is already assigned to BLOBHASH (HASH_OPCODE_BYTE = Bytes1(0x49)), so the
    two opcode assignments clash.
