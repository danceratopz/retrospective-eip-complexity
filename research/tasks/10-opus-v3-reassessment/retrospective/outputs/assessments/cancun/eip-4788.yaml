  label: Patterns affecting pre-existing tests
  score: 1
  evidence:
  - source: eip.md
    locator: Specification (constants) "OPCODE_VALUE | 0x48"
    summary: Opcode 0x48, previously undefined, becomes valid at the fork.
  - source: eip.md
    locator: Specification (constants) "HISTORY_STORAGE_ADDRESS"
    summary: Address 0xff..fd now receives protocol writes, which affects any baseline test that uses
      that address as an ordinary account.
  rationale: 'Rework is confined to boundary cases in one family: invalid/undefined-opcode tests that
    cover 0x48, plus incidental use of the newly reserved address. The universal header and storage-write
