  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: EVM changes / Block processing "for slot in range(start_slot, end_slot)"
    summary: The number of writes depends on the timestamp gap between parent and child. Skipped slots
      are filled, and the keys wrap modulo 8192.
  - source: eip.md
    locator: EVM changes / New opcode "slot % SLOTS_PER_HISTORICAL_ROOT"
    summary: The read key wraps modulo 8192 for any 256-bit argument, so future or stale slots alias other
      entries.
  - source: eip.md
    locator: Block processing "block.timestamp >= FORK_TIMESTAMP"
    summary: There is a fork-activation timestamp boundary, and the first post-fork block has a pre-fork
      parent.
  rationale: 'There are several boundary-sensitive mechanisms: the fork-timestamp gate, the write loop
    over skipped slots with modulo wrap, the opcode''s modular read with arbitrary arguments, and the
    header field''s presence by timestamp. The write mechanism forms an elevated matrix: gap length (0,
    1, many, at least 8192) × ring-wrap position × fork-boundary parent. These combine to determine which
    keys hold which roots, so they cannot be tested independently.'
  confidence: medium
  uncertainty_note: If the gap and wrap dimensions are treated as separable, this would be 2. Undefined
    slot conversion (rounding of non-aligned timestamps) adds further boundaries.
  exceptional_score_justification: null
- id: block_syncing_changes
  label: Block syncing changes
  score: 2
  evidence:
