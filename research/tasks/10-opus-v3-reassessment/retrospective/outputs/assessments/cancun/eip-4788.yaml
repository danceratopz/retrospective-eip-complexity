    locator: Block structure and validity
    summary: The new header field must be settable and checkable in generated blocks.
  - source: eip.md
    locator: EVM changes / Block processing
    summary: Expected history storage depends on the timestamp gap and ring-buffer indexing.
  rationale: The existing header and environment primitives need a local extension for the beacon root
    field, plus a helper to model expected ring-buffer contents. No shared new abstraction is clearly
