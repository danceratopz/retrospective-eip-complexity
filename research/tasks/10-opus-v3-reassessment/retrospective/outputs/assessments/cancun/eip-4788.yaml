criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification (constants table) "G_beacon_root | 20"
    summary: The new opcode has a constant gas cost of 20.
  - source: eip.md
    locator: Rationale / Gas cost of opcode
    summary: The cost copies BLOCKHASH, although the opcode reads storage, which bypasses the cold/warm
      storage-read pricing.
  - source: eip.md
    locator: EVM changes / Block processing
    summary: The protocol's storage writes happen before any transactions. No gas charge is specified
      for them.
  rationale: No new accounting mechanism is added. There is a new constant gas entry for an instruction
    that reads state outside the existing cold/warm storage pricing, and the system writes are unmetered.
    This fits a parameter-level change (level 1) rather than a new mechanism.
  confidence: medium
  uncertainty_note: The spec does not say whether the read is subject to EIP-2929 warm/cold charging.
    If it were, a new accounting interaction would push this toward 2. A strict reading that a new opcode's
    fixed cost is not an accounting change would give 0.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: EVM changes / New opcode "sload(HISTORY_STORAGE_ADDRESS, slot % SLOTS_PER_HISTORICAL_ROOT)"
    summary: BEACON_ROOT is a new instruction that reads another account's storage.
  rationale: 'A new state-accessing operation needs an ordering rule: when gas is charged relative to
    the read, and whether the read adds HISTORY_STORAGE_ADDRESS or its slot to the accessed sets. This
    meets level 2. No existing opcode class''s ordering changes.'
  confidence: medium
  uncertainty_note: The spec gives no ordering or access-set rule. With a constant charge the ordering
    may be trivial (low end 0).
  exceptional_score_justification: null
