eip:
  number: 4788
  title: Beacon block root in the EVM
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: This revision of EIP-4788 adds a 32-byte parent beacon block root to the execution
    block header, after `withdrawals_root`, starting at FORK_TIMESTAMP. At the start of each post-fork
    block, before any transactions run, the protocol writes that root into the storage of HISTORY_STORAGE_ADDRESS
    (0xff..fd). It writes once for every slot from the parent block's slot up to, but not including, the
    current block's slot, at key `slot % 8192`, so a ring buffer holds the history. A new opcode, BEACON_ROOT
    (0x48), pops a slot number, charges a constant 20 gas and returns `sload(HISTORY_STORAGE_ADDRESS,
    slot % 8192)`. A missing value reads as 0. The revision does not define the slot conversion, Engine
    API delivery, test cases or security considerations.
