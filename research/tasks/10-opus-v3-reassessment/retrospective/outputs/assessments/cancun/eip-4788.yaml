- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Block structure and validity
    summary: Every post-fork header carries the new 32-byte root field.
  - source: eip.md
    locator: EVM changes / Block processing "At the start of processing any execution block where block.timestamp
      >= FORK_TIMESTAMP"
    summary: Every post-fork block performs a protocol-mandated storage write to HISTORY_STORAGE_ADDRESS.
  rationale: Every post-fork block-level test must account for the new header field and the history-storage
    write. The change is gated by timestamp, so pre-fork vectors do not need re-deriving. A universal
