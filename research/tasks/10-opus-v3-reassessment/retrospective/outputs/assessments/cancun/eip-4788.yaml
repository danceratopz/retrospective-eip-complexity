    summary: The EL only stores a 32-byte value computed by the CL. It does not verify it.
  - source: supporting/ethereum-consensus-specs--ssz-simple-serialize.md
    locator: Merkleization
    summary: hash_tree_root is defined in the CL's SSZ specification. The EL never runs it under this
