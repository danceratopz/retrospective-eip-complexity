    locator: Block structure and validity "appended to the current block header structure ... grows after
      (and including) the FORK_TIMESTAMP"
    summary: Header RLP gains a field whose presence depends on the block's timestamp.
  rationale: Header decoding and structural validation must require the 32-byte field from FORK_TIMESTAMP
    onward and reject it before then. This is one rule that depends on another field (timestamp), so it
    is complex (level 2).
  confidence: medium
  uncertainty_note: If treated as a simple local length/presence check this would be 1. The EL cannot
    validate the value itself.
  exceptional_score_justification: null
