    are unnumbered in the supplied documents. There is no multi-EIP vector restructuring, so this is level
    2.
  confidence: medium
  uncertainty_note: Counting the unnumbered STATICCALL, DELEGATECALL and REVERT interactions as separate
    EIPs could argue for level 3.
