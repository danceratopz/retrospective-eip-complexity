  label: Unspecified behavior requiring cross-client consensus
  score: 2
  evidence:
  - source: eip.md
    locator: Specification — "Gas cost for TSTORE is the same as a warm SSTORE of a dirty slot"
    summary: Defines only the cost; it does not say whether the SSTORE stipend check applies.
  - source: eip.md
    locator: Abstract — "state that behaves identically to storage"
    summary: Could be read as inheriting all SSTORE restrictions, including the stipend check.
  - source: supporting/eip-2200.md
    locator: Specification — "If gasleft is less than or equal to gas stipend, fail the current call frame
      with 'out of gas' exception."
    summary: The competing rule that might or might not apply to TSTORE.
  rationale: Whether TSTORE fails when gasleft ≤ 2300 has two competing readings that both rest on normative
    text. The outcome is observable and localized, so expected results need agreement first (level 2).
    Smaller slips, such as TLOAD "pops the value on top of the stack" where it clearly means pushes, have
    one evident intended outcome.
  confidence: medium
  uncertainty_note: Behavior of transient storage around SELFDESTRUCT and failed CREATE is not discussed.
    However, the general revert and end-of-transaction discard rules appear to resolve it.
  exceptional_score_justification: null
- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 2
  evidence:
  - source: supporting/eip-2200.md
    locator: Specification — stipend check
    summary: An SSTORE stipend guard exists. Coordinated cases are needed for TSTORE versus SSTORE at
      gasleft ≤ 2300.
  - source: supporting/eip-3529.md
    locator: Specification — "Reduce the max gas refunded after a transaction to gas_used // MAX_REFUND_QUOTIENT"
    summary: The refund cap is unaffected. A local check confirms TSTORE does not change the refund counter
      or the cap.
  - source: eip.md
    locator: Specification — DELEGATECALL/CALLCODE/STATICCALL paragraphs
    summary: Needs coordinated cases with call types, static context and revert.
  rationale: The interaction with EIP-2200's stipend guard needs coordinated cases. EIP-3529 needs only
