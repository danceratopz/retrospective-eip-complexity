criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification — "Gas cost for TSTORE is the same as a warm SSTORE of a dirty slot ... currently
      100 gas"
    summary: Both new opcodes have a fixed gas cost of 100 and no dynamic component.
  - source: eip.md
    locator: Motivation — "The gas accounting rules are also simpler, since no refunds are required."
    summary: No refund-counter interaction and no change to the existing gas rules.
  rationale: The EIP adds fixed-cost gas-table entries for two new instructions; these are covered under
    Added opcodes. No accounting mechanism is introduced, and no existing charging, metering or settlement
    rule changes. The expected gas results of baseline operations do not change.
  confidence: medium
  uncertainty_note: The spec does not say whether TSTORE inherits the EIP-2200 rule that a store fails
    when gasleft is at or below the 2300 stipend. If it does, there is a new gasleft-based metering condition,
    which would point to level 2.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification — "gas cost of TLOAD is the same as a hot SLOAD"
    summary: Constant cost with no cold/warm distinction and no access-list participation.
  - source: eip.md
    locator: Abstract — "values of transient storage are never deserialized from storage or serialized
      to storage"
    summary: Transient storage does not touch persistent state, so there is no state access to order against
      a gas charge.
  rationale: Charges are constant, the opcodes take no part in warm/cold or access-list tracking, and
    no existing opcode's ordering changes. The only failure cases are out-of-gas and a static-context
    write, and both are exceptional halts with the same observable result whatever their order.
  confidence: medium
  uncertainty_note: Some might treat TSTORE as a new state-accessing operation that needs an ordering
    rule (level 2). Because it touches no trie or access list, level 0 is chosen.
  exceptional_score_justification: null
