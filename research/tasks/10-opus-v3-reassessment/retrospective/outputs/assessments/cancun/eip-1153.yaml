  label: Performance risks
  score: 2
  evidence:
  - source: eip.md
    locator: Security Considerations — "TSTORE presents a new way to allocate memory on a node with linear
      cost ... ~= 9.15MB"
    summary: New per-transaction memory bound that exceeds the single-context MSTORE bound.
  - source: eip.md
    locator: Reference Implementation — "The worst case time complexity can be produced by writing the
      maximum number of keys that can fit in one block, and then reverting."
    summary: Worst case comes from the journal and revert interaction with call frames.
  rationale: 'Two workloads need targeted integrated benchmarks: memory allocated by linear-cost TSTORE,
    and journal rollback on revert across nested frames. Both are a bounded interaction between the new
    store and frame checkpointing; they do not form cross-subsystem coupling.'
  confidence: medium
  uncertainty_note: The supplied DoS argument uses SSTORE (the TryDOS contract) rather than TSTORE; worst-case
    TSTORE fill-then-revert is not demonstrated.
