  title: Transient storage opcodes
  layers:
  - execution
assessment:
  historical_scope_summary: This revision of EIP-1153 adds two EVM opcodes, TLOAD (0xb3) and TSTORE (0xb4).
    They give each contract a word-addressed store that is discarded at the end of every transaction.
    TLOAD and TSTORE take the same stack arguments as SLOAD and SSTORE and each costs a fixed 100 gas.
    Neither opcode produces refunds or uses warm/cold access tracking. Transient storage is owned the
    same way as persistent storage, including under DELEGATECALL and CALLCODE, and writes are rolled back
    when a frame reverts. TSTORE raises an exception inside a STATICCALL context, while TLOAD is allowed
    there.
