- id: security_risks
  label: Security risks
  score: 2
  evidence:
  - source: eip.md
    locator: Specification — "If the TSTORE opcode is called within the context of a STATICCALL, it will
      result in an exception"
    summary: The static-context invariant is extended to a new write path.
  - source: eip.md
    locator: Specification — "the owning contract of the transient storage is the contract that issued
      DELEGATECALL or CALLCODE"
    summary: Isolation boundary per contract and per call type.
  - source: supporting/eip-2200.md
    locator: Motivation — "This danger is easily mitigated if SSTORE is not allowed in low gasleft state"
    summary: Reentrancy protection for the 2300-gas stipend relies on state writes being impossible at
      low gasleft. TSTORE at 100 gas may break that assumption.
  rationale: 'Local checks cover static-context rejection, per-contract isolation, revert rollback and
    discard at end of transaction (no leakage between transactions in a block). TSTORE also changes the
    stipend-based reentrancy assumption used by other contracts: a callee could write transient state
    with only 2300 gas. That needs targeted integration review, which is level 2.'
  confidence: medium
  uncertainty_note: If an EIP-2200-style stipend check is intended for TSTORE, the stipend concern disappears
    and level 1 may suffice.
  exceptional_score_justification: null
