  unresolved_questions:
  - After a same-transaction SELFDESTRUCT, is the account empty for the rest of that transaction, or only
    at the end as originally?
  - In the non-deleting branch with the beneficiary equal to the contract itself, is the balance kept
    or burned?
  - Does a contract count as created in this transaction if its creating frame later reverted, or if it
    was created, self-destructed and re-created?
  - In the non-deleting branch, is the balance explicitly set to 0 (item 2 says so; item 1 does not)?
  - How does the rule apply when SELFDESTRUCT runs through DELEGATECALL/CALLCODE in a contract created
    in this transaction versus a pre-existing one?
