  number: 6780
  title: SELFDESTRUCT only in same transaction
  layers:
  - execution
assessment:
  historical_scope_summary: 'EIP-6780 (draft revision of 2023-03-25) changes the SELFDESTRUCT opcode.
    If the executing contract was not created in the current transaction, SELFDESTRUCT only transfers
    the account''s entire balance to the target and does not delete code or storage. If the contract was
    created in the same transaction, the original behaviour is kept: storage and the account are deleted,
    the balance is transferred and set to 0, and the account then behaves as an empty account "both in
    the same transaction and in all later ones". The EIP-3529 removal of the SELFDESTRUCT refund and the
    EIP-2929 cold-beneficiary charge stay unchanged. The stated breaking change is that a contract can
    no longer be re-created at the same address with CREATE2 after a SELFDESTRUCT in an earlier transaction.'
