assessment:
  historical_scope_summary: 'At FORK_BLOCK, this revision of EIP-2780 lowers the transaction intrinsic
    base cost TX_BASE_COST from 21,000 to 6,000 for every transaction type. It also adds a GAS_NEW_ACCOUNT
    = 25,000 surcharge to intrinsic gas when all of these hold: the transaction is not a CREATE, value
    > 0, `to` is not a precompile, and `to` is "non-existent per EIP-161 emptiness" at the start of transaction
    execution. Calldata pricing, access-list pricing and the EIP-1559 mechanics are explicitly unchanged.
    Typed transactions from EIP-2930, EIP-1559 and EIP-7702 inherit the new base. Because of the surcharge,
    intrinsic gas, and so transaction validity (gas_limit ≥ intrinsic), now depends on account state.
    The EIP asks for Perfnet benchmarks of blocks made entirely of ETH transfers and of minimal contract
    calls.'
