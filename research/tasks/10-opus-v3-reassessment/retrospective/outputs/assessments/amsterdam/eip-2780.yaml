    locator: New-account surcharge — "Apply `GAS_NEW_ACCOUNT` when **all** are true"
    summary: 'Four interacting conditions: create, value, precompile, and existence at transaction start.'
  - source: eip.md
    locator: Intrinsic gas computation
    summary: The new base moves the gas_limit ≥ intrinsic validity boundary.
  - source: supporting/eip-7623.md
    locator: Specification — "Any transaction with a gas limit below `21000 + TOTAL_COST_FLOOR_PER_TOKEN
      * tokens_in_calldata`"
    summary: The floor boundary also uses the base constant.
  rationale: 'Several boundary-sensitive mechanisms change: (1) the intrinsic gas_limit boundary at the
    new base; (2) the surcharge condition, which forms an elevated matrix; (3) the calldata floor-versus-intrinsic
    boundary. The matrix dimensions are: value (0 / >0); recipient state (non-existent, existing-but-empty,
    balance-only, nonce-only, code or 7702 delegation, created earlier in the same block); precompile
    or not; create or call; transaction type (legacy, 1, 2, 3, 4); and gas_limit at intrinsic or intrinsic−1.
    These combine to change validity.'
  confidence: high
