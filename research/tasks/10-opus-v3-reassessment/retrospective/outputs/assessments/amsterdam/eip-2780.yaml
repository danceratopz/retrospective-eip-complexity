- id: performance_risks
  label: Performance risks
  score: 3
  evidence:
  - source: eip.md
    locator: Abstract — "+250% more minimal transactions"
    summary: Up to 3.5x as many minimal transactions fit per block.
  - source: eip.md
    locator: Test Cases — "blocks of just ETH transfers ... Block of txs calling minimal gas contract
      execution with maximal contract size addresses"
    summary: The EIP itself requires integrated perfnet benchmarks across clients.
  - source: eip.md
    locator: Effects on transactions per block — "Above ~457.6 M gas, the 8 MiB size cap dominates"
    summary: Couples transaction count to the EIP-7934 block size cap.
  - source: eip.md
    locator: Security Considerations — "Current gaslimit testing mostly uses a block with a single transaction"
    summary: The baseline benchmark assumptions do not cover many-transaction blocks.
  rationale: 'The cheaper fixed per-transaction cost raises the per-block transaction count. That stresses
    several client subsystems together: signature recovery, per-transaction state and trie updates, receipt
    and root computation, code loading for tx.to (maximum code size per transaction), and the block-size
    cap interaction. The benchmark assumption that a block holds few transactions is invalidated, so integrated
    adversarial stress testing is needed.'
  confidence: medium
  uncertainty_note: The EIP claims existing headroom (>300 MGas/s for transfers), but that claim is not
    supported by supplied data.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 2
  evidence:
  - source: eip.md
    locator: Security Considerations — "As this significantly increases the max tx per block this carries
      risk"
    summary: DoS pricing boundary for per-transaction overhead changes.
  - source: eip.md
    locator: Backwards Compatibility — "Wallets, RPCs, gas estimators ... must update"
    summary: Intrinsic gas is now state-dependent, which affects components such as mempool validation
      and estimation.
  rationale: 'Two bounded interactions change: per-transaction DoS pricing, and the assumption that intrinsic
    gas is stateless. The second affects transaction-pool admission, builders and estimation, because
    validity can change with recipient state. These need targeted integration review. A shared authorization
    invariant across many components is not clearly established.'
  confidence: medium
  uncertainty_note: If the stateless-intrinsic-gas invariant is treated as shared across txpool, builder
    and import, level 3 could apply.
  exceptional_score_justification: null
- id: unspecified_behavior_requiring_cross_client_consensus
  label: Unspecified behavior requiring cross-client consensus
  score: 2
  evidence:
  - source: eip.md
    locator: New-account surcharge — "`to` is **non-existent** per EIP-161 emptiness"
    summary: Conflates non-existent and empty. EIP-161 distinguishes them, with 'dead' covering both.
  - source: supporting/eip-161.md
    locator: Specification — "An account is considered _dead_ when either it is non-existent or it is
      _empty_"
    summary: Defines separate states, so existing-but-empty recipients have an unclear outcome.
  - source: supporting/eip-7623.md
    locator: Specification — tx.gasUsed formula
    summary: The floor formula places the base outside max(); the EIP does not say whether GAS_NEW_ACCOUNT
      is inside the execution side, outside both, or absorbed by the floor.
  - source: eip.md
    locator: Edits and interactions with other EIPs — EIP-7702 "No other changes"
    summary: Does not say whether 'start of transaction execution' is before or after authorization processing,
      which can change whether `to` exists.
  rationale: Several localized questions have competing outcomes. (a) Is an existing-but-empty recipient
    charged? (b) How does the surcharge combine with the EIP-7623 floor? (c) Is existence evaluated before
    or after EIP-7702 authorization processing, or after the sender nonce/fee debit? All three require
    client agreement before expected values can be fixed.
  confidence: medium
  uncertainty_note: The EIP-7702 spec is not supplied, so the ordering of its authorization processing
    relative to intrinsic gas is an evidence gap.
  exceptional_score_justification: null
- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 3
  evidence:
  - source: eip.md
    locator: Edits and interactions with other EIPs
    summary: Names EIP-2930, EIP-7702 and EIP-7623 interactions.
  - source: supporting/eip-161.md
    locator: Specification
    summary: Defines the emptiness and existence semantics that the surcharge depends on.
  - source: supporting/eip-7976.md
    locator: Specification
    summary: A floor formula also hardcodes 21000.
  rationale: The new intrinsic-gas rule couples EIP-161 existence semantics, the EIP-7623 (and possibly
    EIP-7976) floor, and EIP-7702 authorization effects within one validity computation. Coordinated scenarios
    are needed across these interactions, not only independent checks.
  confidence: medium
  uncertainty_note: Whether EIP-7976 is in the same fork is not established.
  exceptional_score_justification: null
