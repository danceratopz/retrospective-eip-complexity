criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: Intrinsic gas computation — "Replace any hardcoded `21,000` with `TX_BASE_COST = 6,000`"
    summary: The intrinsic base charge for every transaction drops from 21,000 to 6,000.
  - source: eip.md
    locator: Intrinsic gas computation — pseudocode "is_nonexistent_per_eip161(state_at_start, tx.to)"
    summary: Adds a new state-dependent conditional term (+25,000) to intrinsic gas.
  rationale: A new accounting rule (a state-dependent surcharge in intrinsic gas) is added. At the same
    time the base charge changes, which alters the expected gas used for every baseline transaction. This
    meets level 3.
  confidence: high
  uncertainty_note: The surcharge could be read as a parameterised extension of intrinsic gas rather than
    a new mechanism (level 1). However, it adds a state-dependent condition that intrinsic gas did not
    have before.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Intrinsic gas computation
    summary: Changes only the pre-execution intrinsic computation; no opcode's access or charge sequence
      changes.
  - source: supporting/eip-2929.md
    locator: Specification — "accessed_addresses is initialized to include the tx.sender, tx.to"
    summary: tx.to is already in the accessed set at transaction start, and this is unchanged.
  rationale: No instruction's state-access or gas-charge ordering changes. The new pre-execution read
    of `to` happens at the transaction level, not inside an opcode.
  confidence: high
  uncertainty_note: No block-level access list specification is supplied. Whether the intrinsic-gas read
    of `to` must be recorded there is outside the supplied evidence.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Abstract — "Calldata and access-list metering are unchanged"
    summary: The EIP does not mention blob gas at all.
  rationale: No blob-gas accounting changes.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 2
  evidence:
  - source: eip.md
    locator: Motivation — "Charging `GAS_NEW_ACCOUNT = 25,000` on value transfers that create an account
      aligns entry points and internalizes state growth"
    summary: 'The existing new-account (state-growth) charge is applied at a new site: top-level value
      transfers.'
  - source: supporting/eip-161.md
    locator: Specification (b)
    summary: The existing 25,000 charge for CALL when the destination is dead and value > 0.
  rationale: 'The existing new-account state-growth charge is applied at a new charging site (top-level
    transfer intrinsic gas). No new state-gas dimension or spill rule is introduced. This matches level
    2: charging added at a new site using an existing mechanism.'
  confidence: low
  uncertainty_note: The baseline has no separate state-gas dimension; the charge is paid in ordinary execution
    gas. An evaluator could therefore assign this entirely to GAS and score 0 here.
  exceptional_score_justification: null
