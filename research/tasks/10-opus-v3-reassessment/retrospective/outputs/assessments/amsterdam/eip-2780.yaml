- id: new_or_modified_transaction_validity_mechanisms
  label: New or modified transaction validity mechanisms
  score: 3
  evidence:
  - source: eip.md
    locator: Intrinsic gas computation — "CalculateIntrinsicGas(tx, state_at_start)"
    summary: Intrinsic gas, which bounds validity, now depends on recipient state at the start of each
      transaction.
  - source: eip.md
    locator: New-account surcharge — "non-existent per EIP-161 emptiness at the start of transaction execution"
    summary: Validity depends on state evolving within the block.
  - source: supporting/eip-7623.md
    locator: Specification — "or below its intrinsic gas cost (take the maximum of these two calculations)
      is considered invalid"
    summary: Intrinsic gas is a validity bound.
  rationale: 'Intrinsic-gas validity was previously a function of transaction fields only; it now needs
    a state read. Testing it requires coordinated transaction/state scenarios. Examples: an earlier transaction
    in the same block creates or funds the recipient, which changes a later transaction''s intrinsic gas
    and validity; empty-but-existing pre-state accounts; type-4 authorizations touching `to`. Validity
    tests therefore need pre-state and intra-block sequencing designed together, not just a parameter
    change.'
  confidence: medium
  uncertainty_note: If the state dependency can be covered by local pre-state variations within existing
    intrinsic-gas tests, level 2 applies.
  exceptional_score_justification: null
