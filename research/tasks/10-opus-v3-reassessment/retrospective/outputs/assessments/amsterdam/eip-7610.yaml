totals:
  primary_score: 10
  complexity_tier: low
under_specification:
  present: true
  summary: The normative text requires retroactive application, while the Backwards Compatibility section
    says a hard fork is required. This leaves expected behavior for pre-Amsterdam fixtures slightly unclear,
    though the normative MUST favors retroactive application. The target also does not say how a storage-only
    account with zero balance (empty under EIP-161) is treated after a failed creation, i.e. whether it
    is touched and deleted.
  affected_criteria:
  - patterns_affecting_pre_existing_tests
  - unspecified_behavior_requiring_cross_client_consensus
  criterion_ranges:
  - criterion: patterns_affecting_pre_existing_tests
    minimum_score: 1
    maximum_score: 2
  - criterion: unspecified_behavior_requiring_cross_client_consensus
    minimum_score: 1
    maximum_score: 2
  plausible_total_range:
    minimum: 9
    maximum: 11
  plausible_tiers:
  - low
  unresolved_questions:
  - Does the rule apply retroactively in pre-Amsterdam test forks, or only from the Amsterdam hard fork?
  - Is a storage-only account with zero balance touched by a failed creation attempt, and so deleted as
    empty under EIP-161 at the end of the transaction?
  - Does 'non-empty storage' refer to committed storage (storage root) or to current in-transaction storage?
