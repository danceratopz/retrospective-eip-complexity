notable_ambiguities:
- Retroactive application (Specification) versus 'requires a hard fork' (Backwards Compatibility).
- The EIP-161 definition of an empty account ignores storage, so storage-only collision targets with zero
  balance may interact with state clearing.
- The EIP says to refill existing tests but gives no new explicit test vectors.
