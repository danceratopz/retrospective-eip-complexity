eip:
  number: 7610
  title: Revert creation in case of non-empty storage
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-7610 extends the EIP-684 address-collision rule for contract creation.
    Creation by a creation transaction, CREATE, CREATE2 or any other route MUST throw, as if the first
    init-code byte were an invalid opcode, when the destination has a nonzero nonce, nonzero code length
    or non-empty storage. Non-empty storage is the new condition. The rule MUST apply retroactively to
    all existing blocks, although the Backwards Compatibility section also says a hard fork is required.
    The EIP says coverage will come from refilling existing tests that deploy to addresses with storage.
