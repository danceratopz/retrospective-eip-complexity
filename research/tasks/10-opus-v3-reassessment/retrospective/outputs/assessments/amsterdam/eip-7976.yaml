assessment:
  historical_scope_summary: 'EIP-7976 changes one parameter of the EIP-7623 calldata floor: TOTAL_COST_FLOOR_PER_TOKEN
    goes from 10 to 15, so the floor becomes 15/60 gas per zero/non-zero byte. STANDARD_TOKEN_COST stays
    at 4. The gasUsed formula, max(standard + execution + creation costs, floor), keeps the same structure
    as EIP-7623. The validity rule also keeps its structure: a transaction''s gas limit must be at least
    the larger of its intrinsic gas and 21000 + floor * tokens. The EIP adds no new transaction type,
    header field, opcode, precompile, system contract or encoding.'
