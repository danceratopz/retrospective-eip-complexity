    locator: Specification
    summary: Baseline floor tests and their expected values are derived from 10.
  rationale: Several families need expected values reworked. These are the EIP-7623 floor/standard crossover
    tests, the intrinsic-gas and gas-limit validity boundary tests, and other calldata-heavy transaction
    tests with little execution, which now fall into the wider floor region (execution below 11*tokens
    rather than 6*tokens). The rule change is a single parameter, and most ordinary tests with significant
    execution are unaffected. This fits localized cases in several families (level 2) rather than a common
    rewrite.
  confidence: medium
