criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification — parameter table
    summary: Existing parameters GAS_STORAGE_UPDATE, GAS_COLD_SLOAD, GAS_COLD_ACCOUNT_ACCESS and GAS_WARM_ACCESS
      get new values, which are still TBD.
  - source: eip.md
    locator: Specification — "access_gas_cost = GAS_WARM_ACCESS*2"
    summary: The existing EIP-2929-style cold/warm access formula for EXTCODESIZE and EXTCODECOPY gains
      one extra GAS_WARM_ACCESS term.
  rationale: 'Existing accounting rules and parameters change: constant repricing plus an additive term
    in an existing cold/warm formula. No new accounting mechanism is introduced, so this is level 1.'
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification — EXTCODESIZE/EXTCODECOPY formula
    summary: Only the charged amount changes. The accessed_addresses check-then-add sequence is the same
      as the existing cold/warm logic.
  - source: eip.md
    locator: Interaction with EIP-7928
    summary: The text does not change which accesses are recorded in the block-level access list.
  rationale: No instruction's order of state access versus gas charging changes, and the definition of
    a recordable access is unchanged.
  confidence: medium
  uncertainty_note: Higher costs move out-of-gas points, which may change whether an access happens before
    a halt. That ordering is defined by EIP-2929 and EIP-7928, not changed by this EIP.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: Only execution-gas parameters for state access are changed. Blob gas is not mentioned.
  rationale: No blob-gas accounting change.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification — "GAS_STORAGE_UPDATE | 5,000 | TBD"
    summary: The existing SSTORE storage-write cost parameter is repriced.
  - source: eip.md
    locator: Motivation
    summary: The repricing is justified by state-access performance, not by state growth.
  rationale: The only state-write-related change is the value of the existing SSTORE update cost parameter.
    No new state-gas mechanism or budget exists, so this is at most level 1.
  confidence: low
  uncertainty_note: GAS_STORAGE_UPDATE could be read purely as an execution-gas access charge, which would
    make this criterion 0.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: No refund mechanism is introduced. Only cost parameters are changed.
  rationale: No new refund mechanism. Any knock-on effect on existing SSTORE restore refunds that derive
    from these parameters is a repricing, which belongs under GAS and PAT.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Specification — "Operations affected" column
    summary: The repricing affects SSTORE, SLOAD, *CALL opcodes, BALANCE, SELFDESTRUCT and EXT* opcodes,
      including warm-access costs.
  - source: eip.md
    locator: Specification — EXTCODESIZE/EXTCODECOPY formula
    summary: The cold and warm expected costs for EXTCODESIZE and EXTCODECOPY change.
  rationale: One common change, the repricing of the warm/cold and storage parameters, changes expected
    gas results in ordinary cases across distinct families. These include storage opcodes (SLOAD and SSTORE
    gas and refund paths), the call family (including calls to warm precompiles), account introspection
    (BALANCE and EXT*) and SELFDESTRUCT. It also changes any test whose gas outcome depends on these opcodes.
  confidence: high
  uncertainty_note: Exact rework depends on the TBD values. If GAS_WARM_ACCESS ends up unchanged, the
    rework is somewhat narrower, but it still spans several families.
  exceptional_score_justification: null
