    summary: All new parameter values are unspecified, so expected gas results cannot be fixed.
  - source: eip.md
    locator: Interaction with EIP-2926 — "EXTCODESIZE should maintain its previous cost formula"
    summary: This contradicts the Specification, which applies the extra GAS_WARM_ACCESS to EXTCODESIZE,
      even though EIP-2926 is a required prerequisite.
  - source: eip.md
    locator: Interaction with EIP-8032
    summary: Two parameter regimes (before and after EIP-8032) are described without a normative selection
      rule or values.
  - source: supporting/eip-2926.md
    locator: Gas cost of code-accessing opcodes — "reading a non-accessed chunk will incur a 200 warming
      cost"
    summary: It is unclear whether the extra EXTCODECOPY warm charge stacks with per-chunk warming.
  rationale: There are localized competing outcomes. The EXTCODESIZE formula conflicts between the Specification
    and the Rationale under the EIP-2926 baseline. The choice between EIP-8032 regimes is open, and how
    EXTCODECOPY combines with chunk warming is unspecified. These need spec and client agreement before
    expected results can be fixed. Previously unobservable behaviour does not become consensus-visible.
  confidence: medium
  uncertainty_note: The EXTCODECOPY and chunk-warming question partly depends on EIP-2926's own incompletely
    specified gas rules.
  exceptional_score_justification: null
- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 2
  evidence:
  - source: eip.md
    locator: Interaction with EIP-8032
    summary: SSTORE pricing combines the new GAS_STORAGE_UPDATE and GAS_COLD_SLOAD with EIP-8032's depth-based
      term above ACTIVATION_THRESHOLD.
  - source: supporting/eip-8032.md
    locator: Gas cost changes — "constant_sstore_gas(addr, slot) + LIN_FACTOR * ..."
    summary: The constant SSTORE part, which this EIP reprices, is added to the depth term.
  - source: eip.md
    locator: Interaction with EIP-2926
    summary: Under EIP-2926, EXTCODESIZE uses the previous formula while EXTCODECOPY gets the extra warm
      charge.
  - source: supporting/eip-2926.md
    locator: Updating existing code — "EXTCODESIZE/EXTCODEHASH/EXTCODECOPY behave the same"
    summary: EIP-7702 delegated accounts and legacy (not yet converted) contracts during the transition
      affect EXTCODE* cases.
  - source: eip.md
    locator: Motivation — EIP-2929
    summary: The repriced parameters are EIP-2929's cold/warm access parameters.
  - source: supporting/eip-7928.md
    locator: Scope and Inclusion — "Targets of BALANCE, EXTCODESIZE, EXTCODECOPY"
    summary: BAL recording of accessed addresses is unchanged, but gas-boundary cases affect which accesses
      occur.
  rationale: The interactions with EIP-8032 (SSTORE below and above the threshold), EIP-2926 (EXTCODESIZE
    vs EXTCODECOPY, converted vs legacy code, delegated accounts) and EIP-2929 (cold/warm paths for each
    repriced opcode) each need coordinated cases. They are largely separable per opcode family rather
    than a coupled multi-EIP restructuring, so this is level 2. EIP-7928 needs only local checks.
  confidence: medium
  uncertainty_note: If SSTORE vectors must jointly cover EIP-2929 cold/warm, EIP-8032 depth and EIP-2926
    states, this could reach level 3.
  exceptional_score_justification: null
