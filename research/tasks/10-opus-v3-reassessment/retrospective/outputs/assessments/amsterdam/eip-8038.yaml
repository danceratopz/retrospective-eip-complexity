assessment:
  historical_scope_summary: 'At this revision, EIP-8038 reprices state access. It raises four existing
    gas parameters: GAS_STORAGE_UPDATE, GAS_COLD_SLOAD, GAS_COLD_ACCOUNT_ACCESS and GAS_WARM_ACCESS. All
    new values are TBD. These parameters affect SSTORE, SLOAD, the *CALL family, BALANCE, SELFDESTRUCT
    and the EXT* opcodes. The EIP also adds one GAS_WARM_ACCESS to the cold and warm access cost of EXTCODESIZE
    and EXTCODECOPY. The Rationale coordinates the values with EIP-8032''s depth-based SSTORE pricing
    and says that under EIP-2926, EXTCODESIZE keeps its previous formula. It adds no new mechanisms, encodings,
    header fields, opcodes or transaction types.'
