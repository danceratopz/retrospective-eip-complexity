    summary: The log is emitted only when value is nonzero (the 0 vs 1 wei boundary) in three separate
      trigger sources.
  - source: eip.md
    locator: Specification / Functionality - "placed before any logs created by EVM execution"
    summary: Ordering rules for the transaction log and in-execution logs.
  rationale: Several boundary-sensitive mechanisms are introduced. These are the nonzero-value triggers
    for transactions, CALL and SELFDESTRUCT; whether the transfer actually executes (insufficient balance,
    call depth, OOG); log ordering; and survival of logs in reverted frames. They can mostly be tested
    independently.
  confidence: medium
  uncertainty_note: 'An elevated matrix is possible: value × call success × enclosing-frame revert × SELFDESTRUCT
    beneficiary self/other. That could justify level 3.'
