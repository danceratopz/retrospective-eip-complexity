criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification / Functionality
    summary: Says to issue a log identical to a LOG3, but gives no gas charge for it.
  - source: eip.md
    locator: Security Considerations - "much more expensive than the LOG3 opcode (1500 gas)"
    summary: Compares transfer cost with LOG3 cost to bound the number of logs. This implies the log is
      not separately charged, but the text does not say so.
  rationale: No execution-gas accounting rule is specified as changing. The log appears to be emitted
    without its own gas charge.
  confidence: medium
  uncertainty_note: The text never says whether LOG3-equivalent gas is charged. If it were, the gas results
    of value-transferring CALL, SELFDESTRUCT and transactions would change (level 1).
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification / Functionality - "placed at the time that the value transfer executes"
    summary: Sets where the log is placed, not the order of state access or gas charging.
  rationale: Emitting a log does not access state. The order of state access and gas charging in CALL
    and SELFDESTRUCT is unchanged, and no access-list rule is introduced.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
