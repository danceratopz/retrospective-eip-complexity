- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Specification / Functionality - "The LOG of a value-transferring transaction should be placed
      before any logs created by EVM execution"
    summary: Existing logs in value-transferring transactions move to later positions, and the logs, bloom
      and receipt commitments change.
  - source: eip.md
    locator: Abstract
    summary: All ETH transfers, including transactions, CALL and SELFDESTRUCT, emit a log.
  rationale: Baseline tests that assert log lists or log indices for value-transferring transactions or
    calls need revised expected logs. Examples are LOG-opcode tests in transactions with value, and CALL
    or SELFDESTRUCT tests with value. Their logs hash, bloom and receipt root also change. This rework
    covers ordinary cases in several log-checking families. It mostly means regenerating expectations
    rather than a common restructuring, so level 2.
  confidence: medium
  uncertainty_note: Logs-hash and receipt-root changes affect nearly every value-transferring fixture.
    Whether that counts as a common cross-family rewrite (level 3) or as regeneration depends on how the
    tests are written.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Specification / Functionality
    summary: Every nonzero-value transaction, CALL or SELFDESTRUCT produces a new log.
  rationale: Baseline tests across many families (plain transfers, value calls, SELFDESTRUCT, contract
    interactions) must now check the new transfer log. Zero-value tests and pre-fork vectors are unaffected,
    so the requirement is neither universal nor re-derived for earlier forks.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification / Functionality - "identical to a LOG3"
    summary: Uses the existing log format, which is already reported in receipts.
  rationale: Logs are already a t8n output. No new input, output field or mechanism is needed.
  confidence: medium
  uncertainty_note: No transition-tool evidence was supplied.
  exceptional_score_justification: null
- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 2
  evidence:
  - source: eip.md
    locator: Specification / Functionality
    summary: The log's topics and data are derived from the transfer (MAGIC, sender, recipient, value).
  rationale: The tests need a new expectation helper that builds the expected transfer log from a transfer
    and places it correctly among the other logs (transaction log first; call logs inline). That is a
    new expectation abstraction within the target's suite.
  confidence: medium
  uncertainty_note: If the framework had to inject expected transfer logs into all existing log-checking
    families automatically, this could reach level 3. A simple log builder could be level 1.
  exceptional_score_justification: null
