- id: performance_risks
  label: Performance risks
  score: 1
  evidence:
  - source: eip.md
    locator: Security Considerations - "does not increase the worst-case number of logs" / "will somewhat
      increase the average number of logs"
    summary: The worst case stays bounded by the 6700-gas minimum transfer cost. Average log volume rises.
  rationale: Receipt and bloom generation and log storage grow on average. Component benchmarks of log-heavy
    value-transfer blocks are enough, and end-to-end assumptions stay bounded according to the spec.
  confidence: low
  uncertainty_note: If the logs are free and the 6700 figure does not apply in some paths, worst-case
    log volume per gas could need validation.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 1
  evidence:
  - source: eip.md
    locator: Motivation
    summary: Exchanges and indexers would rely on these logs to track ETH deposits.
  - source: eip.md
    locator: 'Specification / Parameters - "MAGIC: TBD"'
    summary: The topic is unspecified, so it is undefined whether contracts could forge identical logs
      with LOG3.
  rationale: 'The new security conditions are local: logs must be emitted exactly when a transfer happens,
    logs from reverted frames must not survive, and genuine transfer logs should be distinguishable from
    contract-emitted LOG3 forgeries. No other EL component''s assumptions change.'
  confidence: medium
  uncertainty_note: Without a defined emitter address, forgeability affects off-chain consumers. That
    could warrant targeted review (level 2).
  exceptional_score_justification: null
- id: unspecified_behavior_requiring_cross_client_consensus
  label: Unspecified behavior requiring cross-client consensus
  score: 2
  evidence:
  - source: eip.md
    locator: 'Specification / Parameters - "MAGIC: TBD"'
    summary: The first topic of every transfer log is undefined.
  - source: eip.md
    locator: Specification / Functionality - "identical to a LOG3"
    summary: The log's emitter address field is not specified, especially for the transaction-level log.
  - source: eip.md
    locator: Abstract - "All ETH-transfers"
    summary: The abstract claims all transfers, but the functionality section lists only CALL, SELFDESTRUCT
      and transactions. CALLCODE, CREATE/CREATE2 endowments and creation transactions are ambiguous.
  - source: eip.md
    locator: Rationale / Open questions
    summary: Logging for withdrawals and fee payments is unresolved.
  rationale: 'Several consensus-visible outcomes (receipts and bloom) have competing interpretations:
    the MAGIC value, the log address field, gas charging, coverage of CALLCODE and CREATE, SELFDESTRUCT
    to self or burn, failed value calls, revert handling, and withdrawals and fees. Clients and the spec
    must agree on these before expected results can be fixed.'
  confidence: medium
  uncertainty_note: The emitter address and MAGIC apply to every transfer log. Depending on interpretation,
    that could justify level 3.
  exceptional_score_justification: null
