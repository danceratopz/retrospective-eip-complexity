  number: 7708
  title: ETH transfers emit a log
  layers:
  - execution
assessment:
  historical_scope_summary: 'At this revision, EIP-7708 makes every nonzero-value ETH transfer emit a
    log. That covers three cases: a nonzero-value CALL, a SELFDESTRUCT that transfers nonzero value, and
    a nonzero-value transaction. Each log is "identical to a LOG3". Its three topics are MAGIC (still
    TBD), the sender address and the recipient address. Its data is the 32-byte big-endian transfer value.
    The transaction-level log comes before any logs from EVM execution. CALL and SELFDESTRUCT logs are
    emitted when the transfer executes. Whether withdrawals and fee payments should also emit logs is
    left as an open question. No gas cost, emitter address or revert handling is specified for the logs.'
