eip:
  number: 7981
  title: Increase Access List Cost
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-7981, at the assessed revision, adds a per-byte data charge to the intrinsic
    gas of transactions that carry an access list. The charge is 40 gas for each non-zero byte and 10
    gas for each zero byte, counted across all 20-byte addresses and 32-byte storage keys. It is added
    on top of the existing EIP-2930 per-address cost (2400) and per-storage-key cost (1900). The reference
    implementation applies it to access-list, fee-market, blob and set-code transactions and leaves the
    EIP-7623 calldata floor value unchanged. The stated goal is to stop access lists being used to get
    around EIP-7623 floor pricing and to reduce maximum block size.
