    locator: Specification - 'The formula for access list costs changes to'
    summary: The access-list intrinsic cost becomes the existing per-item cost plus 40 or 10 gas per access-list
      byte.
  - source: eip.md
    locator: Reference Implementation - calculate_intrinsic_cost
    summary: The data cost is added to the existing intrinsic gas sum. The floor value is returned unchanged.
  rationale: 'An existing intrinsic-gas rule changes: the access-list cost gains a per-byte term. Per-byte
    data pricing is an existing pattern from calldata. No new kind of metering or settlement is added,
    so this is level 1.'
  confidence: medium
  uncertainty_note: Byte counting over access-list contents could be read as a new accounting mechanism.
