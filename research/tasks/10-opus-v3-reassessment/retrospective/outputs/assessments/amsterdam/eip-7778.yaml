  title: Block Gas Accounting without Refunds
  layers:
  - execution
assessment:
  historical_scope_summary: 'EIP-7778 (revision 9f795ed, Draft) changes block-level gas accounting so
    that gas refunds, mainly from SSTORE setting slots to zero, are no longer subtracted when computing
    the gas counted against the block gas limit: `block.gas_used += gas_used`, with refunds not subtracted.
    What users pay stays the same (`tx.gas_used = gas_used - gas_refund`). Storage discounts that reflect
    less actual work, such as warm access or reverting a slot to its original value, still count toward
    block gas. Under the new rule, the sum of unrefunded gas across all transactions must not exceed the
    block gas limit. The change needs a hard fork and adds no new transaction types, opcodes, header fields
    or contracts.'
