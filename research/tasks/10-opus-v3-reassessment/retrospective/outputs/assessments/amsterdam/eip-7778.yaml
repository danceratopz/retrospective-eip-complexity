criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification / Block Gas Accounting (Modified)
    summary: Block gas accounting becomes block.gas_used += gas_used without subtracting refunds, while
      tx.gas_used remains gas_used - gas_refund.
  rationale: 'An existing settlement rule changes: the block gas counter now adds pre-refund gas. User-side
    refund settlement is unchanged. No new charging mechanism is added, only a changed increment to an
    existing counter, so level 1.'
  confidence: medium
  uncertainty_note: Separating per-transaction user gas from block gas could be read as a new dual-accounting
    mechanism that changes baseline gas results, which would be level 3.
  exceptional_score_justification: null
