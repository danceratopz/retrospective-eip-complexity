eip:
  number: 8246
  title: Remove SELFDESTRUCT Burn
  layers:
  - execution
assessment:
  historical_scope_summary: 'EIP-8246 changes SELFDESTRUCT for contracts created in the same transaction.
    When such a contract names itself as beneficiary, its balance now stays unchanged. At transaction
    finalization, accounts marked for selfdestruction are no longer deleted: their nonce is reset to 0,
    code and all storage are cleared, and their balance is kept. If the resulting balance is 0, the account
    is empty and EIP-161 deletes it; otherwise it stays in state as a balance-only account that CREATE2
    can still redeploy over. Behavior for contracts not created in the same transaction is unchanged from
    EIP-6780.'
