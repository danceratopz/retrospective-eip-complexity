  - source: supporting/eip-3860.md
    locator: Rules 2 and 4
    summary: Initcode metering in intrinsic gas and in CREATE/CREATE2 now applies to initcode of 48–64KiB.
  - source: eip.md
    locator: Specification
    summary: Changes parameters of both EIP-170 and EIP-3860.
  rationale: Coordinated cases are needed in which a single creation exercises both changed limits, for
