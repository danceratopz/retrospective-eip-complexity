- id: performance_risks
  label: Performance risks
  score: 2
  evidence:
  - source: supporting/eip-170.md
    locator: 'Rationale: "the call can trigger O(n) cost in terms of reading the code from disk, preprocessing
      the code"'
    summary: The code size limit bounds work done per call that gas does not price.
  - source: supporting/eip-3860.md
    locator: Rationale / Reason for size limit of initcode
    summary: The initcode pricing was chosen with a bounded worst case in mind; the bound now grows.
  - source: eip.md
    locator: 'Security Considerations: "may marginally increase the risk of denial-of-service"'
    summary: The target acknowledges more DoS exposure.
  rationale: The resource bounds grow by 33% for code loading and analysis per cold call and for jumpdest
    analysis and hashing of initcode. Worst-case blocks of calls to many maximum-size contracts (disk/state
    reads plus code analysis), and blocks that create from maximum-size initcode, need targeted integrated
    benchmarking under the new bounds. This is a bounded interaction with no new resource coupling, so
    level 2.
  confidence: medium
  uncertainty_note: Component benchmarks of code loading and analysis alone might be judged enough, which
    would give level 1.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 2
  evidence:
  - source: supporting/eip-3860.md
    locator: 'Abstract: "the size limit results in the nice-to-have property that EVM code size, code
      offset (PC), and jump offset fits a 16-bit value"'
    summary: EVM engines may depend on code size fitting in 16 bits.
  - source: eip.md
    locator: 'Specification item 2: "64KiB (0x10000 bytes)"'
    summary: The new initcode limit, 65536, does not fit in an unsigned 16-bit value.
  - source: eip.md
    locator: Security Considerations
    summary: Only DoS is discussed; the 16-bit property is not mentioned.
  rationale: Moving the initcode limit to 0x10000 breaks the 16-bit code-size property that EIP-3860 advertised
    to EVM engines. Interpreter and analysis components that used 16-bit sizes need targeted review and
    fuzzing at sizes 65535 and 65536 (overflow and truncation). The DoS bounds for code loading also change.
    This is a bounded interaction that changes another component's assumptions, so level 2.
  confidence: medium
  uncertainty_note: Whether any engine actually relies on the 16-bit property is not established in the
    supplied documents.
  exceptional_score_justification: null
