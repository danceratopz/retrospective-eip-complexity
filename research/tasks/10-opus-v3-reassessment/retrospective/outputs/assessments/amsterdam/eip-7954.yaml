  number: 7954
  title: Increase Maximum Contract Size
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-7954 (revision e43e899, status Stagnant) is a parameter-only change. It
    raises the EIP-170 limit on deployed contract code from 24KiB (0x6000) to 32KiB (0x8000) and the EIP-3860
    initcode limit from 48KiB (0xC000) to 64KiB (0x10000). The rationale says only the size limits change.
    EIP-3860's per-word initcode metering, the existing failure modes (creation fails as if out of gas,
    CREATE/CREATE2 abort exceptionally, an oversized create transaction is invalid) and every other rule
    stay as they are. Activation is by hard fork.
