criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: Parameter changes
    summary: Seven existing gas parameters are repriced (e.g., GAS_CREATE 32,000→212,800, GAS_STORAGE_SET
      20,000→60,800, PER_AUTH_BASE_COST 12,500→43,700).
  - source: eip.md
    locator: Multidimensional metering for code deposit gas
    summary: Adds an independent metering of code deposit costs with two dimensions, gas and code_deposit_gas.
  - source: eip.md
    locator: Contract deployment cost calculation
    summary: Adds a conditional code deposit charge (zero if the code already exists), plus storage_access_cost
      (warm/cold) and hash_cost = GAS_KECCAK256_WORD * ceil(L/32) for contract creation.
  - source: supporting/eip-7702.md
    locator: Behavior — step 7
    summary: Refund of PER_EMPTY_ACCOUNT_COST - PER_AUTH_BASE_COST; both terms are repriced by the target,
      so the refund changes from 12,500 to 169,100.
  rationale: The EIP adds new accounting mechanisms (separate code_deposit_gas metering, the dedup-dependent
    deposit charge, and access and hash charges at creation). It also changes the expected gas of many
    baseline operations (SSTORE set, CREATE/CREATE2, CALL to a new account, SELFDESTRUCT, EIP-7702 authorizations).
    This meets level 3.
  confidence: high
  uncertainty_note: The exact semantics of the second dimension (whether it is deducted from the transaction's
    gas limit) are under-specified, but level 3 holds under any reading.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Contract deployment cost calculation — "first check whether the code already exists in the
      state trie"
    summary: Creation now performs a code-existence lookup in state and charges GAS_WARM_ACCESS or GAS_COLD_SLOAD
      relative to that access.
  - source: eip.md
    locator: CREATE vs CREATE2
    summary: The runtime-code hash and lookup apply to both CREATE and CREATE2, in addition to CREATE2's
      existing init-code hashing.
  rationale: A new state-accessing step, the code-hash existence check, is added to the return path of
    CREATE, CREATE2 and creation transactions. It needs an ordering rule relative to the hash charge,
    the deposit charge and the out-of-gas point. This affects multiple operations, but no rule for an
    entire opcode class or for recordable accesses changes across operations, so the score is 2.
  confidence: medium
  uncertainty_note: 'Several points are unspecified: what ''warm'' means for a code hash, whether this
    access enters any access-tracking set, and the order of the hash, lookup and deposit charges.'
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: No blob-gas parameters or rules are mentioned.
  - source: supporting/eip-8011.md
    locator: Why are we choosing this resource split? — "not considering the blob resource"
    summary: The metering scheme the target derives from explicitly excludes blobs.
  rationale: The EIP does not change blob-gas accounting.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 3
  evidence:
  - source: eip.md
    locator: Harmonization across state creation — "set cost_per_state_byte to 1900"
    summary: Introduces a unified state-byte rate from which all state-creation parameters are derived.
  - source: eip.md
    locator: Multidimensional metering for code deposit gas
    summary: Code deposit gas is metered in its own dimension, separate from ordinary gas.
  - source: eip.md
    locator: Contract deployment cost calculation — "If CodeExists(...) == true, do not charge code-deposit
      storage gas"
    summary: State-dependent deduplication decides whether a state-writing charge applies.
  rationale: 'Beyond changing state-byte rates (level 1), the EIP introduces a new charging mechanism
    for state writes: a separately metered code_deposit_gas dimension and a charge that is waived based
    on deduplication. This meets level 3.'
  confidence: medium
  uncertainty_note: How the code_deposit_gas dimension interacts with the transaction gas limit and the
    block gas limit is not fully specified.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: No new refund mechanism is defined. Duplicate code is simply not charged rather than refunded.
  - source: supporting/eip-7702.md
    locator: Behavior — step 7
    summary: The existing 7702 refund is only repriced through changed parameters.
  rationale: No additional refund mechanism is introduced. Repricing the existing EIP-7702 refund belongs
    under GAS.
  confidence: high
  uncertainty_note: It is unspecified whether the SSTORE restore refunds derived from GAS_STORAGE_SET
    scale with the new value. Either way, that is a repricing, not a new mechanism.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Parameter changes — "Operations affected"
    summary: The changes affect CREATE, CREATE2, creation transactions, new-EOA funding, SELFDESTRUCT,
      SSTORE and EIP-7702 delegation.
  - source: eip.md
    locator: Contract deployment cost calculation
    summary: Every contract creation picks up access and hash costs and a deposit charge that depends
      on deduplication.
  rationale: 'One common repricing of state creation forces rework of ordinary cases across distinct families:
    SSTORE gas tests, CREATE/CREATE2 and creation-transaction gas, CALL/value-transfer account creation,
    SELFDESTRUCT to a new beneficiary, and 7702 intrinsic gas and refunds. Any test that hardcodes gas
    or relies on contract deployment fitting in a gas budget is affected. This meets level 3.'
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Rationale — Multidimensional metering — "a two-dimensional version of EIP-8011 is still required"
    summary: The target requires the 8011-style metering mechanism, in two dimensions.
  - source: supporting/eip-8011.md
    locator: Block header extension
    summary: In EIP-8011, the metering adds a max_gas_metered header field, computed per block from per-transaction
      gas vectors.
  rationale: If the required two-dimensional metering carries the 8011-style per-block metered-gas output,
    every post-fork block test must check a new value (bottleneck metered gas). Pre-fork vectors are unaffected,
    so the score is 2.
  confidence: low
  uncertainty_note: The target does not state which 8011 outputs (header field, per-transaction vector)
    are required. If none are, no new assertion arises.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 2
  evidence:
  - source: supporting/eip-8011.md
    locator: Gas accounting — "gas_used_vector ... is returned by the execute_transaction function"
    summary: The metering returns a per-transaction gas vector in addition to gas_used.
  - source: eip.md
    locator: Multidimensional metering for code deposit gas
    summary: Two dimensions (gas, code_deposit_gas) must be tracked.
  rationale: The transition tool would need to report per-transaction code_deposit_gas (or a gas vector)
    and the block-level metered gas or header value. That is multiple fields with no new exchange mechanism,
    so the score is 2.
  confidence: low
  uncertainty_note: No supplied tool evidence exists, and which outputs are needed depends on the unspecified
    metering design.
  exceptional_score_justification: null
- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 2
  evidence:
  - source: eip.md
    locator: Multidimensional metering for code deposit gas
    summary: Gas expectations now have two dimensions.
  - source: eip.md
    locator: Duplicated bytecode discount — "Ordering & same-block deployments"
    summary: Tests must build pre-states with or without existing code objects and sequence deployments
      within a block.
  rationale: 'The target''s test suite needs new expectation abstractions: a two-dimensional gas-used
    expectation for creations, and helpers that compute deposit, access and hash costs depending on whether
    the code already exists. This is level 2. Whether that representation must become a shared one that
    changes block-gas and base-fee checks across families depends on unresolved metering details.'
  confidence: low
  uncertainty_note: If the 8011-style header and block metering are adopted, the framework's block gas
    and base-fee model changes for all families, which would be level 3.
  exceptional_score_justification: null
