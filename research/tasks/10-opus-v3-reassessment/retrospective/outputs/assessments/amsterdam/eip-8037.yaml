eip:
  number: 8037
  title: State Creation Gas Cost Increase
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-8037 (revision c47ae3be, requires EIP-2780) reprices state creation using
    a cost of 1,900 gas per state byte. It raises GAS_CREATE, GAS_CODE_DEPOSIT, GAS_NEW_ACCOUNT, GAS_SELF_DESTRUCT_NEW_ACCOUNT,
    GAS_STORAGE_SET, and the EIP-7702 PER_EMPTY_ACCOUNT_COST and PER_AUTH_BASE_COST. It adds a two-dimensional
    metering scheme, derived from EIP-8011, with `gas` and `code_deposit_gas` dimensions, so that code
    deposit cost does not count against the EIP-7825 transaction cap or the block gas limit. It also changes
    how contract deployment is charged. A new code-existence lookup waives the code deposit charge for
    runtime bytecode that is already stored. A warm/cold storage-access charge and a keccak hash charge
    per word of runtime code are added for CREATE, CREATE2 and creation transactions.
