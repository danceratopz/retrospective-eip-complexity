under_specification:
  present: true
  summary: The two-dimensional metering is specified only by reference to EIP-8011, and the target's own
    statements contradict that reference. The target says code deposit counts toward neither the transaction
    cap nor the block gas limit, while 8011 applies the transaction limit to the sum of dimensions and
    the block limit to the bottleneck dimension. As a result, transaction validity under the 7825 cap,
    header contents, block validity and base fee are unresolved. The dedup lookup's warm/cold semantics
    and the visibility of code from reverted or same-transaction creations are also undefined. The EIP-2780
    GAS_NEW_ACCOUNT value conflicts with the target's value.
