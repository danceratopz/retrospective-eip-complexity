notable_ambiguities:
- The target says code deposit gas 'doesn't contribute to the block gas limit or the individual transaction
  limit', but the EIP-8011 model it cites keeps a single transaction gas_limit over the sum of dimensions
  and caps blocks on the bottleneck dimension.
- The rationale table counts '25,000 new account' within a deployment's cost, which is inconsistent with
  the price-impact example that charges only GAS_CREATE. It is unclear whether CREATE also charges GAS_NEW_ACCOUNT.
- GAS_NEW_ACCOUNT is 25,000 in the supplied EIP-2780 and 212,800 in the target.
- The Backwards Compatibility text refers to 'new calldata cost rules' and 'floor cost values', which
  this EIP does not define. This appears to be leftover text.
- '''Empty code handling: Clients can treat empty code as a special case ... making it effectively free''
  is permissive language. It is unclear whether hash and access costs are charged for empty runtime code.'
- How the EIP-7702 refund (now 169,100 per existing authority) interacts with the global refund cap is
  not discussed.
