- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Contract deployment cost calculation
    summary: Deposit charge depends on code existence, the access charge on warm/cold status, and the
      hash cost on ceil(L/32).
  - source: eip.md
    locator: Rationale — Multidimensional metering — "this cap would limit the maximum contract size ...
      to roughly 6kb"
    summary: Independent metering is meant to lift the 7825 cap for code deposit, changing the boundaries
      for maximum deployable size.
  - source: supporting/eip-170.md
    locator: Specification
    summary: The MAX_CODE_SIZE 24,576 boundary still applies.
  - source: eip.md
    locator: Duplicated bytecode discount — "Ordering & same-block deployments" / "Empty code handling"
    summary: Same-block ordering and empty-code special cases.
  rationale: 'Several boundary-sensitive mechanisms change. These include the dedup existence boundary,
    warm/cold access cost, the per-word hash rounding, the out-of-gas point at code deposit, the 7825
    cap versus the separately metered deposit gas, the EIP-170 size limit, and the 2780 new-account surcharge
    conditions. The dedup charge forms an elevated matrix over these dimensions: code existence (prior
    block, earlier transaction, same transaction, reverted creation) × warm/cold × CREATE/CREATE2/creation
    transaction × empty versus non-empty code × size near 24,576. These combinations change the outcome
    together, so the score is 3.'
  confidence: medium
  uncertainty_note: None identified.
  exceptional_score_justification: null
