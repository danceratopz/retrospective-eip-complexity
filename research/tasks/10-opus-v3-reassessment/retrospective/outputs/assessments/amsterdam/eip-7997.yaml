  score: 0
  evidence:
  - source: eip.md
    locator: Specification / Factory Contract
    summary: Only installs bytecode; the factory uses existing instructions under existing gas rules.
      No gas parameter or accounting rule is defined.
  rationale: No execution-gas accounting rule changes. Gas used by factory calls comes from ordinary charges
    for existing instructions, including the CREATE2 hashcost from EIP-1014.
  confidence: medium
  uncertainty_note: The EIP calls 0x0B a 'system contract in the precompile range' but does not say whether
    it joins the set of addresses that are warm by default under EIP-2929, as precompiles are. If it did,
    the access cost for calling 0x0B would change (level 0–1).
