  title: Deterministic Factory Contract
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-7997 (revision f8be9ce, Draft) sets the code of FACTORY_ADDRESS = 0x0B
    to a fixed bytecode when the EIP activates. The bytecode is a minimal factory written for the Constantinople
    instruction set, with no PUSH0. It reverts with empty data if calldata is shorter than 32 bytes. Otherwise
    it treats the first 32 bytes as the salt and the rest as initcode, then runs CREATE2 with all of the
    call's value. On success it returns the new address as a 32-byte word. On failure it reverts with
    the same return data. The EIP adds no opcode, precompile, transaction type, header field, gas rule
    or new cryptography. The work is a one-time code installation at activation, plus behavioural tests
    of a stateless system contract that wraps existing CREATE2 and RETURNDATA semantics.
