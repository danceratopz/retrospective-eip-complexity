  interaction_details:
  - eip: 1014
    interaction: coordinated_cases
    cases: Through the factory, check that the CREATE2 address equals keccak256(0xff ++ 0x0B ++ salt ++
      keccak256(initcode))[12:]. Repeated deployment of the same salt and initcode collides and fails,
      and the factory then reverts. Check empty initcode (calldata exactly 32 bytes), the factory's nonce
      increment after deployments, value endowment forwarding, and CREATE2 hashcost on large initcode.
  - eip: 211
    interaction: coordinated_cases
    cases: When initcode reverts, the factory reverts with identical return data (RETURNDATASIZE/RETURNDATACOPY
