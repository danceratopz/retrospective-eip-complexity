assessment:
  historical_scope_summary: 'EIP-8024, at this revision, adds three legacy EVM instructions: DUPN (0xe6),
    SWAPN (0xe7) and EXCHANGE (0xe8). Each takes a 1-byte immediate and costs a constant 3 gas. DUPN and
    SWAPN reach stack items 17–235, and EXCHANGE swaps defined (n, m) pairs within the top 30 items. The
    immediate is decoded by decode_single or decode_pair. Immediates in the ranges 91–127 (DUPN/SWAPN)
    and 80–127 (EXCHANGE) cause a halt that consumes all gas. These ranges are excluded so that JUMPDEST
    analysis stays unchanged and no existing jump target is created or removed.'
