eip:
  number: 8282
  title: Builder Execution Requests
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: EIP-8282 adds two new predeploys for EIP-7732 builders. One is a builder deposit
    contract that takes 184-byte calldata, checks that the amount is at least 1 ETH and that msg.value
    covers the fee plus the stake, queues the record and emits a LOG0. The other is a builder exit contract
    that takes a 48-byte pubkey, charges a fee and records msg.sender as source_address. Each contract
    reuses the EIP-7002/EIP-7251 request-bus storage layout, EIP-1559-style excess fee and EXCESS_INHIBITOR.
    An end-of-block SYSTEM_ADDRESS call drains each queue (up to 64 deposit and 16 exit records per block)
    into new EIP-7685 request types 0x03 and 0x04, which are committed in requests_hash. The remaining
    changes rewire consensus-layer handling of EIP-7732 builder onboarding and exits, and there is no
    reference bytecode yet.
