- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: 'Block Structure Modification — "bal_hash: Hash32"'
    summary: A new header field and a new body element change how every block is constructed and change
      block hashes.
  - source: eip.md
    locator: Rationale — "SSZ BAL embedded as opaque bytes in RLP block"
    summary: The block RLP layout changes.
  rationale: 'Gas and execution results of baseline tests are unchanged. Tests that hand-construct block
    RLP or headers need reworked inputs: header-validation, RLP block-structure and invalid-block families,
    plus any fixtures with fixed block hashes. That is localized rework in several families without a
    common behavioral rewrite, so level 2. Adding the BAL assertion to ordinary tests is scored under
    INV.'
  confidence: medium
  uncertainty_note: Without a supplied test suite, the breadth of hand-crafted block fixtures is estimated.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: State Transition Function — "The BAL MUST be complete and accurate. Missing or spurious entries
      invalidate the block."
    summary: Every block in the fork must carry a correct BAL and bal_hash, which is a new output checked
      for every executed block.
  rationale: Every baseline blockchain test in the target fork must additionally produce and check a correct
    BAL/bal_hash. The rubric caps a universal assertion at level 2 unless pre-fork vectors must also be
    re-derived, and nothing supplied shows that.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 2
  evidence:
  - source: eip.md
    locator: State Transition Function — validate_bal / build_bal_from_accesses
    summary: The state transition must collect per-transaction accesses, withdrawal changes and system-contract
      changes into a BAL and compare its hash.
  - source: eip.md
    locator: Block Structure Modification
    summary: New header field bal_hash and a BAL body element.
  rationale: 't8n must compute and output the block access list, and possibly its hash. That needs a new
    mechanism: block-wide access tracking across system calls, transactions and withdrawals. Treating
    the BAL and its hash as one semantic output gives level 2: a new mechanism with at most one field.'
  confidence: medium
  uncertainty_note: No t8n specification is supplied. If the BAL, bal_hash and a BAL input for validation
    count as separate fields, the score would be 3.
  exceptional_score_justification: null
- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 3
  evidence:
  - source: eip.md
    locator: SSZ Data Structures
    summary: A nested SSZ BAL (account → field → tx_index → change) must be represented, expected and
      compared.
  - source: eip.md
    locator: State Transition Function — "Missing or spurious entries invalidate the block"
    summary: Every block must carry a correct BAL, which affects block construction in all blockchain-test
      families.
  rationale: The framework's shared block model must include an SSZ BAL body element and the bal_hash
    header field. That changes how every blockchain-test family builds blocks, and invalid-BAL modifiers
    and BAL expectation abstractions are also needed. This is a shared representation that changes construction
    across families, so level 3.
  confidence: medium
  uncertainty_note: If the BAL is produced purely by the client or t8n and checked only in BAL-specific
    tests, level 2 would suffice.
  exceptional_score_justification: null
- id: cryptography
  label: Cryptography
  score: 0
  evidence:
  - source: eip.md
    locator: State Transition Function — "assert block.bal_hash == compute_bal_hash(computed_bal)"
    summary: A commitment hash over the BAL. compute_bal_hash is not defined.
  - source: eip.md
    locator: 'Rationale — "SSZ encoding: Enables efficient Merkle proofs"'
    summary: Hints at SSZ merkleization but does not specify it.
  rationale: Only a commitment to a new structure is added, presumably with an existing hash primitive.
    Changed hashed bytes belong under encoding, so level 0.
  confidence: medium
  uncertainty_note: The hash function is unspecified. If SSZ hash_tree_root is required, which the EL
    baseline does not use, the score could be 1.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: SSZ Data Structures — MAX_TXS, MAX_SLOTS, MAX_ACCOUNTS, MAX_CODE_SIZE, MAX_CODE_CHANGES =
      1, TxIndex = uint16, Balance = uint128
    summary: New SSZ list and type bounds, including at most one code change per account per block.
  - source: eip.md
    locator: SSZ Data Structures — storage writes vs reads
    summary: Classification depends on pre-value, post-value, same-value writes, zeroing and read-then-write.
  - source: eip.md
    locator: 'Edge Cases — "Zero-value transfers: Include address, omit from balance_changes"'
    summary: Zero vs non-zero value transfers produce different BAL entries.
  rationale: 'Several boundary-sensitive mechanisms are introduced: list and size limits, MAX_CODE_CHANGES
    = 1, and the zero-value balance rule. Storage classification is an elevated matrix: whether the slot
    is read, whether the written value equals the original, zero vs non-zero, reverted vs committed frames,
    and multiple transactions touching the same slot all interact to decide between storage_changes, storage_reads
    and absence. Level 3.'
  confidence: medium
  uncertainty_note: Several of these outcomes are also under-specified (see UNSP).
  exceptional_score_justification: null
