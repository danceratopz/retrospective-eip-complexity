  evidence:
  - source: eip.md
    locator: State Transition Function — "Missing or spurious entries invalidate the block."
    summary: Block validity now depends on exact equality between the BAL and execution.
  - source: eip.md
    locator: Motivation — "State reconstruction without executing transactions"
    summary: Syncing nodes may apply BAL diffs without execution, which trusts the BAL.
  - source: eip.md
    locator: Rationale — "Post-execution values enable state reconstruction during sync without individual
