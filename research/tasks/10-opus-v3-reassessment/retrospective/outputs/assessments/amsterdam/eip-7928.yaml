eip:
  number: 7928
  title: Block-Level Access Lists
  layers:
  - execution
assessment:
  historical_scope_summary: At this revision, EIP-7928 adds a mandatory Block-Level Access List (BAL).
    The BAL is an SSZ structure carried in the block body and committed to by a new `bal_hash` header
    field. It records every address accessed during block execution, sorted, along with storage writes
    (slot → [tx_index → new value]), read-only storage keys, and post-transaction balance, nonce and code
    values, each indexed by transaction. It also covers changes made by withdrawals and by system contracts
    (EIP-2935, EIP-4788, EIP-7002, EIP-7251). Block validation re-executes the block, builds the BAL from
    the gathered accesses (with reference to EIP-2929 accessed sets), and requires its hash to equal `bal_hash`.
    Any missing or extra entry makes the block invalid. Gas, opcode and transaction semantics are not
    changed.
