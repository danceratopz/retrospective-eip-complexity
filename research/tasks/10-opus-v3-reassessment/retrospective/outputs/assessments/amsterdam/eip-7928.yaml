criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: The specification adds a header field, an SSZ BAL and BAL validation. It defines no gas charge,
      metering change or limit, and the BAL size is not charged gas.
  rationale: No execution-gas accounting rule changes, so level 0.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 3
  evidence:
  - source: eip.md
    locator: SSZ Data Structures — "Addresses accessed without state changes (e.g., STATICCALL targets,
      BALANCE opcode targets)"
    summary: Every address accessed during block execution must enter the BAL, including targets of read-only
      opcodes.
  - source: eip.md
    locator: 'Edge Cases — "Accessed but unchanged: Include with empty changes (EXTCODEHASH, EXTCODESIZE,
      BALANCE targets)"'
    summary: Defines BAL-recordable accesses across the EXT*, BALANCE, CALL-family and SELFDESTRUCT opcode
      classes.
  - source: eip.md
    locator: State Transition Function — "comparing execution-gathered accesses (per EIP-2929) with the
      BAL"
    summary: Ties BAL inclusion to EIP-2929 access tracking, which is transaction-scoped and reverts with
      its scope.
  - source: supporting/eip-2929.md
    locator: Specification — "if a scope reverts, the access lists should be in the state they were in
      before that scope was entered"
    summary: The baseline access sets revert with the scope and are pre-seeded with precompiles, sender
      and to. How these map to BAL inclusion determines the expected results.
  rationale: 'The rubric counts which accesses enter the block-level access list. This EIP creates a block-wide
    definition of a recordable access that applies to every state-accessing opcode class: SLOAD/SSTORE,
    BALANCE/EXT*, CALL-family, CREATE/CREATE2 and SELFDESTRUCT. Each needs cases for cold/warm, reverted
    vs successful frames, out-of-gas before or after access, and static vs non-static calls. That is a
    definition change across operations, so level 3.'
  confidence: medium
  uncertainty_note: Gas-charge ordering itself does not change. A reading that the EIP only reuses EIP-2929
    sets would support level 2.
  exceptional_score_justification: null
