  title: SLOTNUM opcode
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-7843 (revision 0aefdc9d) adds a SLOTNUM opcode at 0x4b. It takes no inputs,
    pushes the current block's slot number (described as an 8-byte big-endian uint) and costs a fixed
    2 gas. The consensus layer computes the slot number and passes it to the execution layer through a
    new uint64 `slot_number` field in the Engine API `PayloadAttributes`. The execution header encoding
    also gets a uint64 `slot_number` field, so each block carries the value without extra inputs. The
    EIP does not specify the header field's position, how the field is validated, the newPayload/ExecutionPayload
    changes, Engine method versioning, or the genesis value.
