  on how clients consume the values, which is not stated.
- The Prague values (6/9) in the example come from an unsupplied EIP. Any capacity change is attributed
  to that EIP, not to EIP-7840.
- No base fee update fraction or other blob-pricing parameter appears in the schedule, so it is unclear
  whether target/max alone are enough for every EL use.
