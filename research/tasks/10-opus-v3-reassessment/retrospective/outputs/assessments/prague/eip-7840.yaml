eip:
  number: 7840
  title: Add blob schedule to EL config files
  layers:
  - execution
assessment:
  historical_scope_summary: This revision of EIP-7840 is an Informational EIP. It adds a `blobSchedule`
    object to execution-client configuration files that gives a `target` and `max` blob count per block
    for each named fork. Its example lists Cancun as 3/6 and Prague as 6/9. If the current fork has no
    entry, clients use the last specified fork's values; if no fork has an entry, both values are zero.
    The stated motivation is to make the blob parameters adjustable while avoiding an Engine API handshake.
    The rationale gives eth_feeHistory's blobGasUsedRatio as an example of EL use and says the core protocol
    does not specifically need the max.
