  score: 1
  evidence:
  - source: eip.md
    locator: Specification — "return sload(HISTORY_STORAGE_ADDRESS, arg)"
    summary: BLOCKHASH now reads account storage instead of history, so its access to state changes.
  - source: eip.md
    locator: Motivation — "the BLOCKHASH opcode would then access state and not history"
    summary: Confirms that BLOCKHASH becomes a state-accessing instruction.
  rationale: Only BLOCKHASH changes. Tests must fix whether its storage read warms HISTORY_STORAGE_ADDRESS
    or the slot under the baseline access-list rules, and whether it is charged as cold or warm. No general
    ordering rule for an opcode class changes.
  confidence: low
  uncertainty_note: Warm/cold and access-list effects are not specified. If no access-list effect is intended,
