assessment:
  historical_scope_summary: 'This early, Stagnant revision of EIP-2935 makes the protocol store each parent
    block hash in storage at `HISTORY_STORAGE_ADDRESS` (0xff…fe). Before any transactions run in every
    block after `FORK_BLKNUM`, the protocol performs `sstore(HISTORY_STORAGE_ADDRESS, block.number - 1,
    block.prevhash)`. Once `block.number > FORK_BLKNUM + 256`, `BLOCKHASH` changes: it returns that stored
    value for any `arg` with `FORK_BLKNUM <= arg < block.number`, and 0 otherwise. This extends `BLOCKHASH`
    past the 256-block window. The revision specifies no contract code, gas changes, account-creation
    rules, access-list behaviour or test cases.'
