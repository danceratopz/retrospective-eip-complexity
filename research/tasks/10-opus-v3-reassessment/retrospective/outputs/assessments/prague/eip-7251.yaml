  number: 7251
  title: Increase the MAX_EFFECTIVE_BALANCE
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: EIP-7251 (revision faccff3a) raises MAX_EFFECTIVE_BALANCE to 2048 ETH and
    adds MIN_ACTIVATION_BALANCE (32 ETH) and a 0x02 COMPOUNDING_WITHDRAWAL_PREFIX. Its 18-point change
    sketch covers consensus-layer containers, churn, deposit queues, aggregator selection and withdrawal-sweep
    functions. Its Execution layer section says "This requires no changes to the Execution Layer." It
    also lists EL-triggered partial withdrawals as a defining feature and attributes them to EIP-7002.
    The supplied EIP-7002 defines only full exits keyed by a 48-byte pubkey and has no amount field.
