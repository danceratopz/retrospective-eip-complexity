  present: true
  summary: 'The target says the EL needs no changes, yet lists EL-triggered partial withdrawals ''part
    of EIP-7002'' as a defining feature. The supplied EIP-7002 supports only full exits: a 48-byte pubkey
    input and an exit operation without an amount. Whether and how an amount is carried through the EL
    precompile, block body, exits_root and Engine payload is unresolved.'
