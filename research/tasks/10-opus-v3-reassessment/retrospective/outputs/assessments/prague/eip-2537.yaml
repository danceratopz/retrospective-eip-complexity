- id: cryptography
  label: Cryptography
  score: 3
  evidence:
  - source: eip.md
    locator: Abstract
    summary: Adds G1/G2 addition, multiplication, multiexponentiation, pairing and two field-to-curve
      mappings.
  - source: eip.md
    locator: Abstract - "Mapping function does NOT perform mapping of the byte string into field element"
    summary: The mapping exposes only the field-to-curve step of SWU, defined in a separate document that
      was not supplied.
  - source: eip.md
    locator: Subgroup checks - "Subgroup check **is mandatory** during the pairing call"
    summary: Subgroup checks are required only for pairing. The add, mul and multiexponentiation error
      cases list only on-curve checks.
  - source: eip.md
    locator: Benchmarking test cases
    summary: Benchmark vectors are in a separate file that was not supplied.
  rationale: 'Several cryptographic mechanisms are added: group arithmetic in two groups, multiexponentiation,
    pairing with subgroup checks, and SWU map-to-curve. Some behavior differs from standard library APIs.
    Mapping is only a partial hash-to-curve. Add, mul and multiexponentiation accept on-curve points without
    subgroup checks. Infinity is encoded as (0,0) with 64-byte padding. These cases need vectors built
    specifically for this EIP, beyond established resources. That meets level 3.'
  confidence: medium
  uncertainty_note: The test resources and the mapping specification are in documents that were not supplied.
    If established vectors cover these exact behaviors, level 2 would apply.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Field elements encoding
    summary: Field elements must be less than the modulus and the top 16 bytes must be zero. Otherwise
      the precompile returns an error.
  - source: eip.md
    locator: Behavior on empty inputs
    summary: Variable-length operations must return an error on empty input.
  - source: eip.md
    locator: Gas schedule clarifications for G1/G2 Multiexponentiation
    summary: k = floor(len/LEN_PER_PAIR). The gas cost is 0 when k is 0. Lengths that are not divisible
      still produce a gas value but then error.
  - source: eip.md
    locator: G1/G2 Multiexponentiation
    summary: The discount table covers k up to 128, with max_discount used above that.
  - source: eip.md
    locator: Encoding of scalars for multiplication operation
    summary: Scalars are not reduced. Scalars at or above the group order are valid.
  rationale: 'There are several independent boundary-sensitive rules: the field-element range and padding,
    exact or multiple-of input length, empty input, infinity encoding, scalars at or above the group order,
    the discount-table cap at k=128, and on-curve versus subgroup membership. The multiexponentiation
    and pairing gas rules form an elevated matrix. Input length (exact multiple, non-multiple, empty,
    k=0) interacts with the floor-division gas formula, the gas supplied relative to that cost, and the
    later encoding error. Together these decide whether the call fails on gas or on encoding, and they
    cannot be tested independently.'
  confidence: medium
  uncertainty_note: None identified.
  exceptional_score_justification: null
