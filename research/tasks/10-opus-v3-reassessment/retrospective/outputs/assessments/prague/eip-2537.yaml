- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: Gas schedule
    summary: Gives fixed and formula-based gas costs for each new precompile. These are per-precompile
      fees, not changes to execution-gas accounting rules.
  - source: eip.md
    locator: Gas burinig on error - "Following the current state of all other precompiles"
    summary: Burning all gas on a precompile error is the existing behavior, applied here to the new precompiles.
  rationale: No execution-gas charging, metering or settlement rule changes. The new precompile fees are
    ordinary per-function costs and are assessed under Added precompiles. Gas burning on error copies
    existing precompile behavior.
  confidence: medium
  uncertainty_note: Under the baseline's existing warm-precompile rule, adding precompile addresses changes
    cold/warm gas for calls to 0x0c–0x14. That is an existing rule applied to new addresses and is scored
    under PAT, not here.
