assessment:
  historical_scope_summary: 'This revision of EIP-2537 adds nine native precompiles at addresses 0x0c–0x14
    for BLS12-381 operations: G1 and G2 addition, multiplication and multiexponentiation, pairing, and
    mapping Fp to G1 and Fp2 to G2. It defines strict byte encodings: 64-byte padded field elements that
    must be less than the modulus, (0,0) as the point at infinity, and 32-byte scalars that are not reduced.
    Every operation has its own error cases, and an error burns all supplied gas. Six precompiles have
    constant gas. The two multiexponentiation precompiles use a discount table for k up to 128, and pairing
    has a per-pair formula; all three compute k with floor division on the input length. The pairing call
    must perform subgroup checks. Activation is a plain block-number condition.'
