  - source: eip.md
    locator: Specification — "At the end of the transaction, set the contract_code of each signer back
      to empty."
    summary: The code write is temporary; no state-byte accounting is introduced.
  rationale: The EIP introduces no state-gas accounting, state-byte rates or budgets. Its flat per-tuple
    cost is intrinsic execution gas and is scored under GAS.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
