  evidence:
  - source: eip.md
    locator: Backwards Compatibility — "breaks the invariant that an account balance can only decrease
      as a result of transactions originating from that account"
    summary: Changes an invariant relied on by mempool design and other EIPs, such as inclusion lists.
  - source: eip.md
    locator: Specification — "keccak(MAGIC + contract_code)"
    summary: The authorization signature covers no nonce or chain_id, so replay across transactions and
      chains is possible within the rules.
  - source: eip.md
    locator: Security Considerations
    summary: Shares EIP-3074's security considerations; wallets must be careful about which contract_code
