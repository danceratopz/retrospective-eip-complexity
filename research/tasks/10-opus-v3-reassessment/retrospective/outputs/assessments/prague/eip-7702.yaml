  - source: eip.md
    locator: Specification — "At the end of the transaction, set the contract_code of each signer back
      to empty."
    summary: Tests need checks on code that is temporary within the transaction, e.g. observed during
      execution through EXTCODE* or calls and empty in the post-state.
  rationale: The target suite needs a new construction abstraction (authorization tuples signed by arbitrary
    keys and attached to the new transaction type). This is limited to the target's own test suite and
    does not change how other families are built, so level 2.
  confidence: medium
  uncertainty_note: The actual capabilities of existing helpers are not evidenced.
  exceptional_score_justification: null
- id: cryptography
  label: Cryptography
  score: 1
  evidence:
  - source: eip.md
    locator: Specification — "Let signer = ecrecover(keccak(MAGIC + contract_code), y_parity, r, s)"
    summary: Adds a protocol-level secp256k1 signature recovery over a new message domain for each authorization
      tuple.
  - source: supporting/eip-3074.md
    locator: AUTH Behavior — "Signature validity and signer recovery are handled analogously to transaction
      signatures"
    summary: Shows the established precedent for ECDSA recovery rules, including malleability limits,
      in a related design. The target does not adopt these rules explicitly.
  rationale: Exactly one established mechanism (secp256k1 ECDSA recovery with keccak) is added as a new
    protocol validation site. Hashing and recovery primitives are unchanged, but the validity rules for
    authorization signatures are new, so level 1.
  confidence: medium
  uncertainty_note: The s-range, y_parity range and handling of an invalid signature are not stated. If
    reuse of an unchanged primitive is read as no new mechanism, the score would be 0.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 2
  evidence:
  - source: eip.md
    locator: Specification — intrinsic cost paragraph
    summary: Intrinsic gas now depends on tuple count and contract_code byte composition, so the gas-limit
      boundary must be tested.
  - source: eip.md
    locator: Specification — "Verify that the contract code of signer is empty."
    summary: Boundary on prior code state, including duplicate signers in one list (the second check sees
      code already set) and empty versus non-empty code.
  - source: eip.md
    locator: Specification — "[[contract_code, y_parity, r, s], ...]"
    summary: The list may be empty or contain empty contract_code. No size limits on contract_code or
      the list are stated.
  rationale: 'Several boundary-sensitive mechanisms are introduced: the intrinsic-gas threshold, the code-emptiness
    check (including duplicates and order in the list), and signature-value bounds. An elevated matrix
    is plausible (signer identity versus origin or destination × prior code × transaction outcome), but
    the failure outcomes are unspecified, so level 2 is the best-supported score.'
  confidence: medium
  uncertainty_note: Once failure semantics are defined, interactions between signer identity, duplicate
    entries and revert/reset behavior could justify level 3.
  exceptional_score_justification: null
