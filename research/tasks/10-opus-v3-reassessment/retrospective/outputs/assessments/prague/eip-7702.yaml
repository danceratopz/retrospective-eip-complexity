criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 2
  evidence:
  - source: eip.md
    locator: Specification — "Additionally, we add a cost of `16 * non-zero calldata bytes + 4 * zero
      calldata bytes` over each `contract_code`, plus `PER_CONTRACT_CODE_BASE_COST`"
    summary: 'Adds a new intrinsic-gas component for the new transaction type: calldata-style pricing
      over each contract_code plus 5000 per tuple.'
  - source: eip.md
    locator: Specification — "Add the `signer` account to `accessed_addresses`"
    summary: Signers are pre-warmed, which changes cold/warm costs for later accesses to them, but only
      inside the new transaction type.
  rationale: The EIP adds a new intrinsic-gas accounting mechanism for authorization tuples, and signer
    pre-warming uses the existing EIP-2929 mechanism. Both apply only to the new transaction type, so
    existing rules and baseline gas results do not change. This fits level 2.
  confidence: high
  uncertainty_note: The text does not say whether the signer warming is reverted if the transaction later
    fails; warming at transaction start is presumably not revertible.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification — "At the start of executing the transaction, for each [contract_code, y_parity,
      r, s] tuple"
    summary: The state accesses (reading signer code, setting code, warming) happen in transaction-level
      processing, not inside any instruction.
  - source: eip.md
    locator: Rationale — "It does not require adding any opcodes"
    summary: No instruction's sequence of access and gas charging is changed.
  rationale: No opcode's state-access or gas-charge ordering changes. The new access sequence (recover,
    check code, set code, warm) is transaction-level setup rather than instruction execution, so level
    0 is the best fit.
  confidence: medium
  uncertainty_note: If the authorization processing were treated as a new state-accessing operation that
    needs an ordering rule, level 2 could be argued.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
