  title: Set Code for EOAs
  layers:
  - execution
assessment:
  historical_scope_summary: This revision of EIP-7702 adds a new EIP-2718 transaction type whose payload
    carries a list of `[contract_code, y_parity, r, s]` authorization tuples. When the transaction starts,
    each tuple's signer is recovered with `ecrecover(keccak(MAGIC + contract_code), ...)`. The signer's
    code must be empty; it is then set to `contract_code`, and the signer is added to the EIP-2929 `accessed_addresses`
    set. Every signer's code is set back to empty when the transaction ends. Intrinsic gas is the EIP-2930
    formula plus calldata-style per-byte costs over each `contract_code` and 5000 per tuple. The EIP adds
    no opcodes, precompiles, system contracts or header fields.
