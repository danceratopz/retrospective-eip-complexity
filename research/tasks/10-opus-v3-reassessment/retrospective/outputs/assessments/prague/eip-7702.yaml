  rationale: The EIP changes shared authorization and trust invariants across several components. EOAs
    can execute arbitrary code signed once with no replay protection; balances can drop without the owner
    sending a transaction (affecting mempool and inclusion lists); and EOA-versus-contract assumptions
    in contracts change. Coordinated adversarial scenarios are needed, so level 3.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
