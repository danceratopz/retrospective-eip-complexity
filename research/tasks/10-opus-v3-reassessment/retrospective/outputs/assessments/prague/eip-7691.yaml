eip:
  number: 7691
  title: Blob throughput increase
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: 'At this revision, EIP-7691 raises the blob target from 3 to 6 blobs per block
    and the maximum from 6 to 9 when Prague activates. On the execution layer it only swaps parameters:
    MAX_BLOB_GAS_PER_BLOCK becomes 1179648, TARGET_BLOB_GAS_PER_BLOCK becomes 786432 and BLOB_BASE_FEE_UPDATE_FRACTION_ELECTRA
    is 5007716. These values replace the EIP-4844 values at the fork timestamp. It adds no new transaction
    type, header field, opcode, precompile, Engine API change or activation migration. The consensus-layer
    constants MAX_BLOBS_PER_BLOCK_ELECTRA (9) and TARGET_BLOBS_PER_BLOCK_ELECTRA (6) are consumed by consensus
    clients.'
