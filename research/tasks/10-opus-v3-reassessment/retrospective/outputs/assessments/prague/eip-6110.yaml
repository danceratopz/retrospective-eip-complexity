  title: Supply validator deposits on chain
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: EIP-6110 (revision 46d979f9, Draft) adds a list of validator deposit operations
    to the EL block body and a new `deposits_root` header field, the trie root over that list. Starting
    at FORK_BLOCK, which is selected by timestamp, a block is valid only if its `deposits_root` matches
    the body list. The body list must also equal the deposits parsed, in transaction order, from logs
    that the configured DEPOSIT_CONTRACT_ADDRESS emits in the block's receipts. On the CL side, the supporting
    specs add a `deposit_receipts` field to `ExecutionPayload`/`ExecutionPayloadHeader` (capped at 8,192).
    They also add a `deposit_receipts_start_index` value that drives the transition away from Eth1Data
    voting. The EIP adds no gas, opcode, precompile or transaction-type changes.
