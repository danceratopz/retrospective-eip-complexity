eip:
  number: 7642
  title: eth/69 - history expiry and simpler receipts
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-7642 (revision at commit 0ddb8e91) defines a new wire-protocol version,
    eth/69, for the 'eth' p2p protocol. It removes total difficulty (td) from the Status handshake and
    adds earliestBlock, latestBlock and latestBlockHash, moving the block hash to the end. It replaces
    the consensus receipt encoding in the Receipts (0x10) message with a flat list [tx-type, post-state-or-status,
    cumulative-gas, logs] that omits the Bloom field, so receivers must recompute the bloom to verify
    the receipt hash. It also adds a BlockRangeUpdate (0x11) notification that clients send at most once
    per epoch. The EIP states that it does not change EVM consensus rules and does not need a hard fork.
