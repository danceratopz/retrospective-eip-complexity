  - source: supporting/eip-1559.md
    locator: Specification — "gas_refund = transaction.gas_limit - gas_used"
    summary: Gas used feeds sender refunds, coinbase priority fees and cumulative block gas, so expected
      balances and block values change too.
  rationale: 'Baseline tests that send nonzero calldata with little execution need new expected gas, balances,
    receipt cumulative gas and block gas_used. These cases appear in several families: intrinsic-gas/calldata,
