  number: 7623
  title: Increase calldata cost
  layers:
  - execution
assessment:
  historical_scope_summary: 'At this revision, EIP-7623 changes how a transaction''s gas used is calculated.
    It counts calldata "tokens" as zero bytes plus 4 × nonzero bytes. A transaction is then charged the
    larger of two amounts: the standard cost (4 gas per token, plus EVM gas used, plus any contract-creation
    cost) or a floor of 12 gas per token. In both cases the 21000 base cost is added. The goal is to make
    data-heavy transactions with little execution pay up to 48 gas per nonzero byte, which cuts the maximum
    block size. It adds no new transaction types, header fields, opcodes, precompiles or Engine API changes.'
