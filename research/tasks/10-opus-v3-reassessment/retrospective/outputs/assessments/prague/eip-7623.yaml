criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification — "The formula for determining the gas used per transaction changes to"
    summary: Gas used becomes 21000 + max(standard calldata + evm_gas_used + creation cost, TOTAL_COST_FLOOR_PER_TOKEN
      * tokens_in_calldata).
  - source: eip.md
    locator: Rationale — "increase the cost of calldata to 48 gas for transactions that do not exceed
      a certain threshold"
    summary: Transactions with little execution relative to calldata get a different gas result than before.
  rationale: 'The proposal adds a new settlement rule: a floor applied with max() after execution. It
    also changes the expected gas used for existing calldata-heavy, low-execution transactions. That meets
    level 3: a new mechanism that also changes the gas results of baseline operations.'
  confidence: medium
  uncertainty_note: One could read this as a reprice of an existing rule (level 1). However, the max-with-floor
    settlement is structurally new. Its interaction with refunds and access-list costs is not specified.
  exceptional_score_justification: null
