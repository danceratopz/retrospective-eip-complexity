notable_ambiguities:
- The abstract says requests are 'inherently' exposed to the CL, yet the CL and Engine API representation
  is left to future proposals.
- The rationale says the type ordering makes it easier to verify that all committed requests were found
  in the block, but the specification never states that verification rule.
- Intra-type ordering is delegated to future request types, so for now no ordering inside a type can be
  tested.
- The 'Opaque byte array' rationale mentions 'the transaction payload', apparently meaning the request
  payload.
