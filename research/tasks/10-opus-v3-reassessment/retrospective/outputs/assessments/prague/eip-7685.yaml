eip:
  number: 7685
  title: General purpose execution layer requests
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: At this revision, EIP-7685 sets up a general framework for execution-layer
    requests that are passed to the consensus layer. A request is a request_type byte followed by opaque
    request_data. The block body gains a list of requests, sorted in ascending order by type. The execution
    header gains a 32-byte requests_root, which is the Merkle-Patricia trie root of that list keyed by
    index, built the same way as the transactions root. The revision defines no request types, system
    contracts, sources or validation rules for requests. It also leaves the consensus-layer and Engine
    API representation to later proposals.
