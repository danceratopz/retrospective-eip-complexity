  title: Warm COINBASE
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-3651 (revision a6dfa1ed, Stagnant) makes one change. At the start of transaction
    execution, the `accessed_addresses` set from EIP-2929 also includes the address returned by `COINBASE`
    (0x41). Under Paris, this means access to the block's fee recipient is charged the warm cost (100)
    instead of the cold cost (2600) the first time it is accessed. This applies to BALANCE, EXTCODESIZE,
    EXTCODECOPY, EXTCODEHASH and the CALL family, and SELFDESTRUCT to the coinbase no longer pays the
    extra cold charge. The EIP introduces no new opcode, transaction type, header field, encoding or system
    contract. It states that there are no backward-compatibility or security issues.
