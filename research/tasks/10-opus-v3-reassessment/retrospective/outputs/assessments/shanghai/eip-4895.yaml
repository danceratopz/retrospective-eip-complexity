- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 1
  evidence:
  - source: eip.md
    locator: State transition — "processed **after** any user-level transactions are applied"
    summary: Withdrawal credits apply after transaction effects such as fee payments and account deletions.
  - source: eip.md
    locator: Motivation — "more involved than the prior EIP-4863"; "pull-based alternatives (e.g. EIP-4788
      ...)"
    summary: EIP-4788 and EIP-4863 are cited as alternative designs, not as prerequisites or co-scheduled
      mechanisms.
  rationale: 'The target interacts with existing block-processing behavior, needing local compatibility
    checks: credits to the coinbase after fee crediting, to accounts destroyed or created earlier in the
    block, and to empty accounts. Its core behavior can otherwise be tested on its own. EIP-4863 is a
    superseded alternative, and EIP-4788 is a cited alternative not established in the same-fork scenario,
    so neither needs target-specific cases.'
  confidence: medium
  uncertainty_note: If EIP-4788 were scheduled in the same fork, block-start beacon-root writes and block-end
    withdrawals would need joint block-structure and processing checks. The supplied text does not establish
    that scenario.
  exceptional_score_justification: null
  interacting_eips: []
  unidentified_interactions:
