- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 1
  evidence:
  - source: eip.md
    locator: Commitment to withdrawals — "The execution block header gains a new field"
    summary: Post-fork headers carry an extra field, so Paris-shaped headers become structurally invalid
      after the fork.
  - source: eip.md
    locator: 'New field in the execution block: withdrawals'
    summary: The block body gains a new list element.
  rationale: 'Baseline header and block-structure validation cases (for example field-count and malformed-header
    RLP cases, and fork-transition block shapes) need reworked inputs and expectations for post-fork blocks.
    This is confined to one family: block structure/import validation. Ordinary state-execution tests
    keep their behavior. The new commitment value itself is counted under INV.'
  confidence: medium
  uncertainty_note: Whether regenerating block hashes in every post-fork blockchain test counts as rework
    or only as the new-commitment assertion is a matter of interpretation. I attribute it to INV.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Block validity — "assert block_header.withdrawals_root == compute_trie_root_from_indexed_data(block.withdrawals)"
    summary: Every post-fork block must carry a correct withdrawals_root commitment, including over an
      empty list.
  - source: eip.md
    locator: Specification — "Beginning with the execution timestamp `FORK_TIMESTAMP`"
    summary: The rule is timestamp-gated, so pre-fork vectors are unaffected.
  rationale: Every blockchain/import test in the fork has to produce and check the new header commitment,
    even when its withdrawals list is empty. Because activation is gated by fork timestamp, pre-fork vectors
    do not need to be re-derived. Under the template's note, a universal assertion without pre-fork vector
    changes is level 2.
  confidence: high
  uncertainty_note: If the logs/receipts TODO were resolved by adding receipts for withdrawals, a further
    commitment assertion would follow. That would still be level 2.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 2
  evidence:
  - source: eip.md
    locator: 'System-level operation: withdrawal — "supplied from the consensus layer"'
    summary: The state transition needs a withdrawals list as an input that is not a transaction.
  - source: eip.md
    locator: Commitment to withdrawals — "constructed identically to the transactions root"
    summary: A new root is computed analogously to the transactions root, which the transition tool produces.
  rationale: The transition tool needs a new input (the withdrawals list, applied after transactions).
    By analogy with the transactions root, it also plausibly needs a new output, withdrawalsRoot. That
    makes multiple semantic fields with no new exchange mechanism, which is level 2.
  confidence: medium
  uncertainty_note: No transition-tool documentation was supplied. If the framework computes the root
    itself, only the input field changes (level 1).
  exceptional_score_justification: null
- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 2
  evidence:
  - source: eip.md
    locator: 'System-level operation: withdrawal'
    summary: A new block-level object type that is distinct from transactions.
  - source: eip.md
    locator: 'New field in the execution block: withdrawals'
    summary: Blocks must be built with a withdrawals list and a matching root.
  rationale: The framework needs a Withdrawal construction abstraction, block builders that attach withdrawals
    and compute withdrawals_root, and post-state balance expectations driven by withdrawals. These are
    new construction and expectation abstractions within the target's suite. Other families only see an
    empty default list, so level 3 is not met.
  confidence: medium
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: cryptography
  label: Cryptography
  score: 0
  evidence:
  - source: eip.md
    locator: Commitment to withdrawals — "constructed identically to the transactions root"
    summary: The spec reuses the existing Merkle-Patricia trie and Keccak hashing unchanged.
  rationale: An existing primitive and commitment scheme are reused unchanged. No cryptographic verification
    or rule changes.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 2
  evidence:
  - source: eip.md
    locator: Specification — "Beginning with the execution timestamp `FORK_TIMESTAMP`"
    summary: There is a timestamp boundary for when the withdrawals field and rules apply.
  - source: eip.md
    locator: 'System-level operation: withdrawal — "`index` as a `uint64` ... `amount` ... 256-bit value"'
    summary: Field-width bounds for index and amount, including zero and maximum values.
  - source: eip.md
    locator: State transition — "This balance change is unconditional and **MUST** not fail."
    summary: Boundary outcomes for amount zero, credits to nonexistent or empty accounts, and large amounts.
  rationale: 'There are several independent boundary-sensitive rules: the fork-timestamp activation boundary
    for the block/header structure; field-width bounds on index and amount in decoding; and the amount/recipient
    boundaries (zero amount, nonexistent or empty recipient, list empty versus many). No interacting matrix
    whose combinations change the result is clearly established, so this is level 2.'
  confidence: medium
  uncertainty_note: How zero-amount credits to empty accounts behave, and whether amount overflow is possible,
    is unspecified. This could create a combined matrix (amount × account state × same-block transaction
    effects).
  exceptional_score_justification: null
- id: block_syncing_changes
  label: Block syncing changes
  score: 3
  evidence:
  - source: eip.md
    locator: 'New field in the execution block: withdrawals'
    summary: New RLP body element that must be decoded during import.
  - source: eip.md
    locator: Commitment to withdrawals
    summary: New header field.
  - source: eip.md
    locator: Block validity — "ensure that the `withdrawals_root` matches the expected value"
    summary: A cross-field validation of the header commitment against the body contents.
  rationale: 'Several structural rules change: body decoding with the new withdrawals list, header decoding
    with the new field (timestamp-gated presence), and Withdrawal element decoding. The root-matches-body
    check depends on another field (the body list), so at least one rule is complex. That is level 3.'
  confidence: high
  uncertainty_note: None identified.
