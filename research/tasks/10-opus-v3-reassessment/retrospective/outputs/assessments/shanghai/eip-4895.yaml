eip:
  number: 4895
  title: Beacon chain push withdrawals as operations
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: At the supplied revision, EIP-4895 adds a new block-level "operation", the
    `Withdrawal`. Each withdrawal is RLP([index uint64, address 20 bytes, amount uint256 wei]) and is
    supplied by the consensus layer. Blocks gain a `withdrawals` list, and the header gains a `withdrawals_root`
    commitment built like the transactions root (an MPT keyed by list position), with a new block-validity
    check that the two match. From `FORK_TIMESTAMP` onward, withdrawals are processed after all user transactions
    as unconditional, gas-free balance increases that MUST NOT fail. Whether withdrawals emit logs or
    receipts is left as a TODO.
