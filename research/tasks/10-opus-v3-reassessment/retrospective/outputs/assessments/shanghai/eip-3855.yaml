assessment:
  historical_scope_summary: This revision of EIP-3855 adds the instruction PUSH0 at opcode 0x5f, starting
    at a fork block HF. PUSH0 has no immediate data and pops nothing. It pushes the constant 0 onto the
    stack and costs a fixed 2 gas, which the text labels "verylow". The listed test cases cover a single
    PUSH0, 1024 consecutive PUSH0s (succeeds) and 1025 (stack overflow). The Security Considerations section
    says jumpdest analysis is unaffected because there is no immediate data. Already-deployed code containing
    0x5f may behave differently after the fork.
