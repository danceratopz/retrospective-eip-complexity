assessment:
  historical_scope_summary: EIP-6049 is a Meta EIP that formally deprecates the SELFDESTRUCT opcode and
    discourages its use. It warns that a breaking change to SELFDESTRUCT is likely in the future. Its
    only specified action is to update documentation, which the EIP describes as non-normative Yellow
    Paper text, to warn against using the opcode. The EIP says no client changes apply, so SELFDESTRUCT's
    execution semantics, gas, availability and all other protocol rules stay as they were in Paris.
