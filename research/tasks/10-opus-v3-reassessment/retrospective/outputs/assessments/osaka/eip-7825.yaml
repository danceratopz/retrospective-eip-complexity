  - execution
assessment:
  historical_scope_summary: This revision of EIP-7825 sets a fixed protocol-level cap of 30,000,000 gas
    on any single transaction's gasLimit. The cap does not depend on the block gas limit, which can still
    be higher. A transaction whose gasLimit exceeds 30M is rejected from the txpool. A block containing
    such a transaction is invalid and is rejected during validation before processing. The EIP adds no
    new transaction type, header field, opcode, precompile or system contract.
