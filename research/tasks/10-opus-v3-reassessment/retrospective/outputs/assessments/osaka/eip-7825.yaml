criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Protocol Adjustment — "The `GAS_LIMIT` parameter for transactions will be capped in client
      implementations at 30 million"
    summary: Adds a fixed upper bound on the per-transaction gas limit. Gas charging and metering rules
      are otherwise unchanged.
  rationale: The available execution gas per transaction is now bounded by a constant instead of only
    by the block gas limit. This changes an existing limit parameter without adding a new accounting mechanism
    (opcode costs, refunds and settlement are unchanged), so level 1 fits.
  confidence: medium
  uncertainty_note: The cap could instead be treated purely as a transaction-validity rule (TXV), which
    would make this 0.
  exceptional_score_justification: null
