    − MARGIN)? What is GOSSIP_UPPER_LIMIT?
  - 'Exactly which structure is RLP-encoded for the check: the full EL block (header, transactions, ommers,
    withdrawals) or another representation?'
  - How does the check apply to payloads received through engine_newPayload? Is a specific status or error
    expected?
  - Does the rule apply from the first block at or after the fork activation timestamp?
  - Is there any normative builder rule for transaction selection near the cap, beyond 'must ensure ...
