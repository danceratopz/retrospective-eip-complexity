eip:
  number: 7934
  title: RLP Execution Block Size Limit
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-7934 (revision 040800a, Draft) adds a consensus rule that an execution
    block is invalid if its RLP encoding is larger than MAX_RLP_BLOCK_SIZE. That limit is defined as MAX_BLOCK_SIZE
    (10 MiB = 10,485,760 bytes) minus a 512 KiB margin (524,288 bytes), giving 9,961,472 bytes. Block
    producers must not build blocks over the limit, and nodes must reject such blocks during validation
    and propagation. The check does not depend on gas metrics. The EIP adds no header fields, transaction
    types, opcodes, gas rules or Engine API changes.
