      includes a margin of 512 KiB"
    summary: The abstract frames the cap as 10 MiB.
  - source: eip.md
    locator: Block Size Cap — "MAX_RLP_BLOCK_SIZE = GOSSIP_UPPER_LIMIT - SAFETY_MARGIN"
    summary: The pseudocode uses an undefined constant (GOSSIP_UPPER_LIMIT) and names the margin SAFETY_MARGIN,
      while the bullets name it MARGIN and define the limit as MAX_BLOCK_SIZE - MARGIN.
  - source: eip.md
    locator: Block Size Cap — "Any RLP-encoded block"
    summary: Which block encoding counts is not stated beyond 'block'. It does not address the Engine
      API payload versus the reconstructed RLP block.
  rationale: The text contradicts itself on the exact limit. The abstract says 10 MiB; the bullets give
    10 MiB minus 512 KiB = 9,961,472 bytes; the code uses an undefined GOSSIP_UPPER_LIMIT. The validity
    outcome for blocks between 9,961,473 and 10,485,760 bytes therefore needs spec or client agreement
    before fixtures can be fixed. These are localized competing outcomes (level 2).
  confidence: medium
  uncertainty_note: Most readers would probably resolve GOSSIP_UPPER_LIMIT as MAX_BLOCK_SIZE, giving 9,961,472
