under_specification:
  present: true
  summary: The exact limit is internally inconsistent. The abstract says the cap is 10 MiB; the bullets
    define MAX_RLP_BLOCK_SIZE = 10 MiB − 512 KiB; the pseudocode uses an undefined GOSSIP_UPPER_LIMIT
    and a differently named SAFETY_MARGIN. The EIP also does not define which 'block' encoding is measured
    beyond rlp.encode(block), how the rule maps to payloads received through the Engine API, or the expected
    builder behavior when the next transaction would exceed the cap.
