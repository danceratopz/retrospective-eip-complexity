eip:
  number: 7935
  title: Set default gas limit to 60M
  layers:
  - execution
assessment:
  historical_scope_summary: 'EIP-7935, at this revision, is an Informational EIP. It asks execution-layer
    clients to raise the gas limit in their default configurations from the current 36M on mainnet to
    a target of ''XX0M'' by the Fusaka release. The Security Considerations section names 60M as the value
    to test. It adds no consensus rule, transaction type, opcode, header field or encoding change. The
    specification only asks clients to update their default configuration values. The required work is
    mostly performance and safety validation: devnets running all EL/CL client combinations with full
    synthetic blocks, a check of worst-case block size against the 10 MiB CL gossip limit, and coordinated
    scheduling with a separately proposed 30M transaction gas limit cap.'
