    summary: Requires integrated stress testing across all client combinations at the higher limit.
  - source: eip.md
    locator: Security Considerations — "Synthetic transactions will be created until blocks are full,
      and network and node health monitored"
    summary: Full-block workloads at 60M must be validated for block execution, node health and networking.
  - source: eip.md
    locator: Security Considerations — "current worst-case block size of 1.79 MiB would reach the current
      10MiB CL gossip limit"
    summary: Adversarial block-size constructions couple the execution gas limit with the CL gossip size
      bound.
  - source: eip.md
    locator: Motivation — "we expect to find bugs in clients at higher gas limits"
    summary: Higher execution capacity is expected to expose new client performance issues.
  rationale: 'Raising the default gas limit from 36M to about 60M raises the resource bound for every
    existing workload. The affected assumptions are worst-case block execution and validation time within
    a slot, state and IO load, and block size versus the 10 MiB CL gossip limit. The EIP itself requires
    adversarial and full-block stress testing across EL/CL client combinations and networking. This meets
    level 3: adversarial workload combinations need integrated stress testing across distinct execution
    and client subsystems.'
  confidence: medium
  uncertainty_note: The EIP changes only defaults, not consensus rules. It also says the block-size coupling
