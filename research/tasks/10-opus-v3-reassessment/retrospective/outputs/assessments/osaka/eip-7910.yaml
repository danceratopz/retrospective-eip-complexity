  primary_score: 7
  complexity_tier: low
under_specification:
  present: true
  summary: The revision has internal inconsistencies and deferred definitions that affect the observable
    RPC output and its hashes. The blob field is named "blobsSchedule" in the spec but "blobSchedule"
    in the examples. The member count is wrong. Null conditions for currentHash and currentForkId are
    stated in terms of the next configuration. activationTime is called required, yet the text also says
    it should be omitted for an unscheduled fork. Whether the EIP-7892 maxBlobsPerTx field is included
    is unresolved. The Osaka field set is deferred to a meta-EIP that was not supplied, and how BPO forks
    affect FORK_HASH is unstated.
  affected_criteria:
  - new_test_framework_primitives
  - edge_boundary_conditions
  - engine_api_changes
  - encoding_changes_rlp_ssz
  - cross_eip_interactions
  criterion_ranges:
  - criterion: new_test_framework_primitives
    minimum_score: 1
    maximum_score: 2
  - criterion: edge_boundary_conditions
    minimum_score: 1
    maximum_score: 2
  - criterion: engine_api_changes
    minimum_score: 0
    maximum_score: 2
  - criterion: encoding_changes_rlp_ssz
    minimum_score: 0
    maximum_score: 3
  - criterion: cross_eip_interactions
    minimum_score: 1
    maximum_score: 2
  plausible_total_range:
    minimum: 5
    maximum: 13
  plausible_tiers:
  - low
  - medium
  unresolved_questions:
  - Is the canonical key "blobsSchedule" or "blobSchedule"? The choice changes the CRC-32 hash.
  - Is maxBlobsPerTx (EIP-7892) included in the blob schedule object?
  - When are currentHash and currentForkId null, given that current always exists?
  - Is nextForkId the FORK_HASH including the next fork's timestamp, and how do BPO forks enter FORK_HASH?
  - Does an unscheduled next fork omit activationTime or the whole config?
  - What are the Osaka precompile names and system contracts, given that the meta-EIP was not supplied?
  - Is Engine API exposure standardized, and if so, with what schema?
