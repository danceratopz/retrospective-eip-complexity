  number: 7910
  title: eth_config JSON-RPC Method
  layers:
  - execution
assessment:
  historical_scope_summary: 'EIP-7910 (revision 59c5b17) adds a public JSON-RPC method, `eth_config`.
    It takes no parameters and returns the full configuration objects for the current, next and last known
    forks: activationTime, blob schedule, chainId, active precompiles and system contracts. For each object
    it also returns a CRC-32 hash of the RFC-8785 canonical JSON and the EIP-6122 FORK_HASH. BPO forks
    from EIP-7892 are treated as new forks that inherit from their parent and change only blob schedule
    values. The EIP is an Interface-category change. It changes no consensus, EVM, encoding or block-validation
    rule; exposing the method through the Engine API is optional (MAY).'
