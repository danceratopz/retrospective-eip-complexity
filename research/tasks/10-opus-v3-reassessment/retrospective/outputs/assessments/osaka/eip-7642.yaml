  number: 7642
  title: eth/69 - history expiry and simpler receipts
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-7642 defines a new devp2p wire protocol version, eth/69. It removes the
    `td` field from the `Status (0x00)` handshake message and drops the `bloom` field from legacy and
    typed receipts in the `Receipts (0x10)` message. Receiving nodes recompute blooms from the logs. The
    EIP says it changes no EVM consensus rules and needs no hard fork. Older clients can keep using eth/68,
    which is defined by the prerequisite EIP-5793.
