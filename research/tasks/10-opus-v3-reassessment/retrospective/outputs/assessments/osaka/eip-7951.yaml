  number: 7951
  title: Precompile for secp256r1 Curve Support
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-7951, at the revision supplied, adds one native precompile, P256VERIFY,
    at address 0x100. It performs ECDSA signature verification over secp256r1 (P-256). It accepts exactly
    160 bytes (h, r, s, qx, qy) and charges a constant 3450 gas. It returns 32 bytes holding 1 for a valid
    signature and empty output for any failure, and it never reverts. It requires r and s in (0, n), qx
    and qy below p, an on-curve public key that is not the point at infinity, a check that the computed
    R' is not infinity, and a comparison of R'.x with r modulo n. It is described as interface-compatible
    with RIP-7212 and as fixing RIP-7212's missing infinity check and non-modular comparison.
