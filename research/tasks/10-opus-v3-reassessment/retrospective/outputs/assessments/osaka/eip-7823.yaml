  number: 7823
  title: Set upper bounds for MODEXP
  layers:
  - execution
assessment:
  historical_scope_summary: This revision of EIP-7823 adds an upper bound to the MODEXP precompile at
    address 0x05, which EIP-198 defines. Each of the three declared length fields (length_of_BASE, length_of_EXPONENT,
    length_of_MODULUS) must be at most 1024 bytes (8192 bits). If any length is larger, the precompile
    stops, returns an error and consumes all gas. The input format, output format and gas pricing function
    are otherwise unchanged. The Backwards Compatibility and Security Considerations sections are still
    TODO placeholders.
