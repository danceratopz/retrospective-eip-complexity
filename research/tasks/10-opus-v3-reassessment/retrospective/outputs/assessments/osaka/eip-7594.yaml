  number: 7594
  title: PeerDAS - Peer Data Availability Sampling
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: EIP-7594 (revision 4353b530, Networking category) adds peer data availability
    sampling for beacon nodes. EIP-4844 blobs are extended with a one-dimensional erasure code and split
    into cells, each verifiable against the blob's KZG commitment. Columns of cells are spread across
    gossip subnets, and each node custodies a set of columns chosen deterministically from its node ID.
    Nodes sample columns from peers each slot and can rebuild the full matrix once they hold at least
    50% of the columns. All detailed rules are delegated to the consensus-specs das-core document. That
    document defines only consensus-layer containers, helpers, custody, gossip and sampling, and states
    no execution-layer, Engine API or blob-gas parameter changes.
