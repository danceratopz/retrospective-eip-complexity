assessment:
  historical_scope_summary: EIP-7939 (revision c43098e, Draft) adds one EVM instruction, CLZ (0x1e). It
    pops a single 256-bit word and pushes the number of leading zero bits, or 256 when the input is zero.
    It has a fixed gas cost of 3, the same as ADD. It has no immediate data and does not access state.
    The specification gives reference implementations in Solidity, Python and C++, plus six input/output
    test vectors. It changes no transactions, headers, Engine API, system contracts or precompiles.
