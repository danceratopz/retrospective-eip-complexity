  title: ModExp Gas Cost Increase
  layers:
  - execution
assessment:
  historical_scope_summary: EIP-7883, at the assessed revision, changes only the gas cost of the existing
    ModExp precompile at 0x05. It changes three things in the EIP-2565 pricing formula. The minimum price
    goes from 200 to 500 gas. The per-byte multiplier for exponents longer than 32 bytes goes from 8 to
    16. Multiplication complexity doubles when the base or modulus is longer than 32 bytes. The precompile's
    interface and arithmetic are unchanged. The EIP gives an updated table of gas results for named test
    vectors.
