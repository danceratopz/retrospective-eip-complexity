notable_ambiguities:
- TX_BASE_COST is undefined in the supplied documents.
- The strict '>' comparison sends the exact-parity case to the subtracting branch. Tests should cover
  equality.
- get_base_fee_per_blob_gas(parent) uses the parent's excess_blob_gas, so the comparison is made on parent-block
  fees, not on the child's fees. The Rationale lists alternatives using the updated fees, which are not
  normative.
- How the fork-dependent blob parameters on the Prague baseline relate to the 4844 constant names is unspecified
  in the supplied text.
