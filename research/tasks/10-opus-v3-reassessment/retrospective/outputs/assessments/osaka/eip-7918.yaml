eip:
  number: 7918
  title: Blob base fee bounded by execution cost
  layers:
  - execution
assessment:
  historical_scope_summary: 'This revision of EIP-7918 changes one consensus function: EIP-4844''s `calc_excess_blob_gas()`.
    Under the old rule, the parent''s blob gas used is added to the excess and `TARGET_BLOB_GAS_PER_BLOCK`
    is subtracted. Under the new rule, that subtraction is skipped when `TX_BASE_COST * parent.base_fee_per_gas`
    is greater than `TARGET_BLOB_GAS_PER_BLOCK * get_base_fee_per_blob_gas(parent)`. This links the blob
    fee update to the execution base fee and stops the blob base fee from staying far below the execution
    cost of a blob-carrying transaction. The EIP adds no transactions, header fields, opcodes, precompiles,
    system contracts or Engine API changes. Its effect reaches clients through header validation of `excess_blob_gas`
    and through every value derived from the blob base fee.'
