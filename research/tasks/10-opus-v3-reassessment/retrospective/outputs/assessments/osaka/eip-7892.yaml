- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 2
  evidence:
  - source: eip.md
    locator: Specification — "block timestamps at which these parameters MAY change"
    summary: Parameter switching happens at a timestamp boundary.
  - source: eip.md
    locator: Requirements — "timestamp ... MUST align with the start of the epoch"
    summary: Activation timestamps are tied to epoch boundaries.
  rationale: Several boundary-sensitive rules change at each BPO timestamp. (1) The per-block blob-count
    limit switches to the new max, so blob counts at old max, new max and new max+1 must be tested before
    and after the boundary. (2) The excess blob gas calculation switches to the new target, including
    the first block after the boundary. (3) The blob base fee update fraction switches. Consecutive BPO
    entries and BPO entries next to named forks add cases. These can mostly be tested per parameter, with
    no clearly elevated matrix, so level 2.
  confidence: medium
  uncertainty_note: The rule for computing excess blob gas across the boundary is unspecified. If target
    and fraction combine with the boundary block in result-changing ways, an elevated matrix could apply.
  exceptional_score_justification: null
- id: block_syncing_changes
  label: Block syncing changes
  score: 1
  evidence:
  - source: eip.md
    locator: 'Specification — "Blob Limit (blob_limit): The maximum number of blobs per block"'
    summary: Block-level blob limit validation depends on the timestamp schedule.
  rationale: 'Block import must apply the scheduled max (blob gas used limit) and target (excess_blob_gas
    header check) according to the block timestamp. The rules are unchanged and only parameter selection
    changes, so this is scored conservatively at level 1: one changed local validation dimension that
    sync/import tests across BPO boundaries must exercise.'
  confidence: low
  uncertainty_note: If parameter-only changes are not treated as rule changes, the score would be 0. If
    both the blob-gas-used limit and the parent-dependent excess_blob_gas check count as changed rules,
    it could be scored up to 3.
  exceptional_score_justification: null
