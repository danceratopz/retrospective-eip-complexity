    after a named fork and several BPO entries in a row. Blob pricing rules from the 4844 lineage (excess
    blob gas, base fee fraction) must be exercised across BPO boundaries. EIP-7594 needs only a local
    compatibility check. Level 2.
  confidence: medium
  uncertainty_note: EIP-4844's blob gas rules are not supplied. Their interaction across BPO boundaries
    is noted, but its exact semantics are unconfirmed.
