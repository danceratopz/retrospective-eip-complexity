- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 1
  evidence:
  - source: eip.md
    locator: Rationale — "Why specify parameters in the node configuration instead of code?"
    summary: Blob parameters come from external configuration rather than code, so test tooling must supply
      them.
  - source: eip.md
    locator: Specification — "extended to allow for an arbitrary number of block timestamps"
    summary: Parameters depend on timestamp-keyed schedule entries, not only on the named fork.
  rationale: To test BPO behavior, the transition tool must receive the blob schedule, including timestamp-keyed
    entries, or an equivalent fork/parameter input, because the parameters are no longer fixed by fork
    name. That is one semantic input (the blob schedule/parameter set) without a new exchange mechanism,
    so level 1.
  confidence: low
  uncertainty_note: No t8n interface evidence is supplied. If the tool already takes a blob schedule,
    the change could be 0. If it needs separate target/max/fraction fields plus timestamp-based selection
    logic, it could be 2.
  exceptional_score_justification: null
- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 2
  evidence:
  - source: eip.md
    locator: Specification — blobSchedule example with "1740693335" keys
    summary: Forks can be defined by timestamp and a parameter set rather than by a named fork.
  - source: eip.md
    locator: Rationale — "Testing teams can investigate different parameters with minimal involvement
      from client implementers"
    summary: Testing different parameter sets is an explicit goal.
  rationale: 'The framework needs a new construction abstraction: a parameter-only fork, or a fork transition
    at an arbitrary timestamp, defined by (target, max, fraction), possibly several in a row. Blob tests
    then have to be generated against it and the schedule emitted into client configuration. This sits
    within the blob-related test suite, so level 2.'
  confidence: medium
  uncertainty_note: If fork representation is shared across all families and BPO forks require changing
    it globally, this could reach 3. A plain parameterized fork may only need a local extension (1).
  exceptional_score_justification: null
- id: cryptography
  label: Cryptography
  score: 0
  evidence:
