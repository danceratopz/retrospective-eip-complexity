  title: Blob Parameter Only Hardforks
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: 'EIP-7892 (Informational, Draft at the assessed revision) defines Blob Parameter
    Only (BPO) hard forks. These hard forks change only the blob target, the blob limit (max) and baseFeeUpdateFraction.
    On the execution layer, it extends the EIP-7840 `blobSchedule` client-configuration object so that,
    besides named forks, it accepts any number of block-timestamp keys at which these parameters may change.
    On the consensus layer, it adds a `BPO_FORK` epoch/max_blobs configuration. EL and CL schedules must
    agree: timestamps must align with epoch starts and `max` must equal `max_blobs`. Actual values and
    schedules are out of scope, and the EIP specifies no new opcode, transaction, header field, Engine
    API or state-transition change.'
