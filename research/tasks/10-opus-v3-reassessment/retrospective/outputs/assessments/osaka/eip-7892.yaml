- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification — "blob_target", "blob_limit", "baseFeeUpdateFraction"
    summary: Blob target, max and base fee update fraction may change at arbitrary timestamps.
  - source: supporting/eip-7840.md
    locator: Specification — "Clients must configure the target, max and baseFeeUpdateFraction per-fork"
    summary: The baseline already has per-fork blob parameters; BPO adds timestamp-keyed entries.
  rationale: 'Existing blob-gas accounting (excess blob gas from target, blob base fee from the update
    fraction, per-block max) keeps its rules, but its parameters can now change at any scheduled timestamp.
    That fits level 1: existing parameters change without a new accounting mechanism. Tests must confirm
    that the parameters switch at each BPO timestamp.'
  confidence: medium
  uncertainty_note: The EIP does not say how excess blob gas is computed for the first block after a BPO
    boundary (parent's or child's target, and whether anything is reset). If a special transition rule
    were needed, this could be read as a new mechanism (level 2).
  exceptional_score_justification: null
