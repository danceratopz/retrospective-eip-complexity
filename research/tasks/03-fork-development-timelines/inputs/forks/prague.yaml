unknowns:
  - EIP-7642 is explicitly optional for Pectra and was added to the Meta EIP after the numbered devnet series; no Pectra devnet or activation marker is assigned to it.
  - Pectra devnet-7 has no located explicit EIP list; EIP-7549 and EIP-7685 participation are retained as medium-confidence fork-spec inferences.
  - Pectra devnet-6 launch is preserved at day precision from ACDC 150 because the generated configuration's earlier genesis timestamp is not evidence of the public launch time.
