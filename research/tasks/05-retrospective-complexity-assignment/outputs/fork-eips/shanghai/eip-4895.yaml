eip:
  number: 4895
  title: Beacon chain push withdrawals as operations
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: >-
    At the information cutoff, this draft proposed a new system-level withdrawal
    object, distinct from transactions, carrying a consensus-layer-supplied index,
    recipient, and amount. Post-fork execution blocks would gain an RLP-encoded
    withdrawals list and a header withdrawals root built like the transactions
    root; execution clients would validate the commitment and, after all user
    transactions, apply every withdrawal as an unconditional, gas-free balance
    increase. The draft left the fork timestamp and whether to add logs, receipts,
    and a receipts commitment unresolved, while assuming consensus-layer
    validation and a small bound on withdrawal volume.
