  - source: supporting/eip-2929.md
    locator: Specification - Storage read changes, lines 60-65
    summary: EIP-2929 charges account-targeting operations differently according to whether the target is already in accessed_addresses.
  rationale: >-
    Adding COINBASE to the initially warm set updates the existing EIP-2929
    warm/cold gas-accounting mechanism. It does not create a separate gas
    mechanism, matching score 1.
