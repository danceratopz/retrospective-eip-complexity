eip:
  number: 3651
  title: Warm COINBASE
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    EIP-3651 changes the EIP-2929 transaction access-set initialization so that
    the address returned by COINBASE starts warm. This changes the gas charged
    by the existing warm/cold account-access rules when an operation targets
    that address, while introducing no new opcode, transaction type, field, or
    persistent state transition.
