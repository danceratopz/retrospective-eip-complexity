eip:
  number: 3860
  title: Limit and meter initcode
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-3860 extended EIP-170 with a 49,152-byte
    maximum for initcode supplied by creation transactions, CREATE, and CREATE2.
    It also charged 2 gas per 32-byte initcode word through transaction intrinsic
    gas and through an extra opcode charge taken before address calculation and
    initcode execution. Oversized creation transactions became invalid, while an
    oversized CREATE or CREATE2 returned zero; the stated purpose was to meter
    linear jump-destination analysis and bound its resource exposure.
