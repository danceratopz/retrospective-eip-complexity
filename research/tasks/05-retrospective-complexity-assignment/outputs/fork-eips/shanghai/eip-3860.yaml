criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification — Parameters and Rules, lines 42-58
    summary: >-
      The proposal defines a new per-word initcode cost, adds it to creation-
      transaction intrinsic gas, and charges it to CREATE and CREATE2 before
      address calculation and initcode execution.
  - source: supporting/eip-1014.md
    locator: Specification, lines 11-15
    summary: >-
      CREATE2 already has a per-word hashcost deducted with its existing creation
      charges, so the proposed initcode charge changes an established dynamic-gas
      path.
  rationale: >-
    This is a new gas-accounting mechanism applied through existing transaction
    intrinsic-gas and opcode-gas mechanisms, including the pre-existing CREATE2
    hashcost path. It therefore affects existing mechanisms and their tests,
    matching score 3.
  confidence: high
  uncertainty_note: >-
    The exact charge ordering for an over-limit CREATE or CREATE2 is not fully
    explicit, but that does not change the anchor level.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Specification — Rules, lines 53-58
    summary: >-
      Both CREATE and CREATE2 receive a new charge that must be deducted before
      calculation of the resulting contract address and before execution of the
      initcode.
  - source: supporting/eip-1014.md
    locator: Specification, lines 13-15
    summary: >-
      CREATE2's existing hashcost is deducted before evaluation of its resulting
      address and initcode, identifying the existing execution point with which
      the new charge is combined.
  rationale: >-
    The new up-front charge changes the gas-boundary path before address-derived
    state work for two state-affecting opcodes. This is a multiple-opcode ordering
    consequence, but it does not redefine recordable access or a broad opcode
    class, matching score 2.
  confidence: medium
  uncertainty_note: >-
    The proposal fixes the new charge relative to address calculation and
    initcode execution, but does not completely order the oversize check, memory
    expansion, base creation charge, and CREATE2 hashcost against one another.
  exceptional_score_justification: null
