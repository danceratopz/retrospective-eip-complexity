  title: PUSH0 instruction
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the recorded cutoff, EIP-3855 proposed activating a single new EVM opcode,
    PUSH0 (0x5f), at the fork boundary. The opcode has no immediate data, pops no
    stack items, pushes the value zero, and costs 2 gas under the existing verylow
    cost class. The proposal aimed to reduce bytecode size and reliance on
    context-sensitive zero-producing instructions, while noting that deployed code
    containing the formerly unavailable opcode could change behavior.
