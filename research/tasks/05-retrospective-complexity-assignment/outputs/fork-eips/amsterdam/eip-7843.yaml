  title: SLOTNUM opcode
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7843 was a Draft proposal for a new
    fixed-cost SLOTNUM opcode at 0x4b that returns the current block's slot
    number as an eight-byte unsigned value. The slot number was to be
    calculated by the consensus layer, carried to the execution layer through
    the Engine API, committed in a new uint64 block-header field, and supplied
    in a new uint64 PayloadAttributes field. The proposal presented EIP-4788
    proof-based access as an existing but more expensive alternative, and it
    supplied no test cases or substantive security analysis.
