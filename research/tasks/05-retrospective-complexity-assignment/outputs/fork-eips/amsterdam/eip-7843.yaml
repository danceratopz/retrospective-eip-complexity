under_specification:
  present: true
  summary: >-
    Material details of the new consensus value's complete path are unresolved:
    the header field's exact position and canonical encoding, its representation
    in payload validation and Engine API messages beyond PayloadAttributes, the
    rule by which execution clients validate the consensus-computed value, and
    the mapping of the stated eight-byte value into an EVM stack word. These
    omissions affect the size of the interface, syncing, regression-test, and
    security work without changing the explicit existence of the opcode or
    header field.
