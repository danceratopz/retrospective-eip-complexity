eip:
  number: 7708
  title: ETH transfers emit a log
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7708 proposed automatically emitting an
    existing-style log for every nonzero-value transaction, CALL, and
    value-transferring SELFDESTRUCT. Each generated log would carry a MAGIC
    topic, sender and recipient topics, and a 32-byte transfer value, with the
    transaction log ordered before EVM-created logs and the other logs emitted
    when their transfers execute. The MAGIC value, treatment of withdrawals
    and fees, and test cases remained unresolved.
