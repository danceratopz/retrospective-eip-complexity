      The mechanism is intended to reshape disk reads, transaction validation, and EVM execution through parallelism.
  - source: eip.md
    locator: Rationale / Block Size Considerations and Asynchronous Validation, lines 439-457
    summary: >-
      The draft reports about 40 KiB average compressed overhead, a 0.93 MiB worst case at 36m gas, and concurrent BAL verification with I/O and EVM work.
  - source: eip.md
    locator: Security Considerations, lines 463-471
    summary: >-
      Validation overhead and increased propagation size are acknowledged explicitly.
  rationale: >-
