  - source: eip.md
    locator: Specification / State Transition Function, lines 417-419
    summary: >-
      Missing and spurious entries are consensus-invalid, requiring reusable exact-BAL expectations and mutation support.
  rationale: >-
    Because every post-fork block needs this artifact, BAL derivation, encoding, commitment, and invalid-entry expectations must be framework-level primitives used by unrelated EIP tests, not helpers confined to EIP-7928's own cases.
  confidence: medium
  uncertainty_note: >-
    The historical package contains no test-framework design, so the exact primitive split remains an implementation choice.
  exceptional_score_justification: null
