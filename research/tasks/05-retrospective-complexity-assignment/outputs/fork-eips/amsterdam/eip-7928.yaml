      A computed BAL must match the new header commitment, and completeness and absence of spurious entries are mandatory block-validity conditions.
  rationale: >-
    Regardless of what an execution test principally exercises, every test instantiated at the fork must additionally satisfy and check the BAL commitment and exact-content invariant. Existing scenarios carried into the fork therefore require mechanically re-derived BAL data.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
