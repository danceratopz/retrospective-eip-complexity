- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Specification / Block Structure Modification, lines 29-45
    summary: >-
      Every post-fork block gains a header commitment and a body-level BlockAccessList.
  - source: eip.md
    locator: Specification / State Transition Function, lines 417-419
    summary: >-
      Any missing or spurious BAL entry invalidates the block, and clients must compare the supplied list with execution-gathered accesses.
  rationale: >-
    Existing post-fork block and execution scenarios across diverse opcode, transaction, system-action, and sync categories must be reworked to carry a correctly derived BAL and commitment. This is a major, diverse subset rather than a narrow contrived class.
  confidence: high
  uncertainty_note: >-
    The draft does not describe a test migration plan, but the fork-wide block-validity consequence is explicit.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
