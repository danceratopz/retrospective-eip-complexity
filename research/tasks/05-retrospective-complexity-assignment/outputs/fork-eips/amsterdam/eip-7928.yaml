  - source: eip.md
    locator: Motivation and Specification, lines 17-20, 159-177, and 417-419
    summary: >-
      The proposal contrasts EIP-2930 lists, relies on EIP-2929 access gathering, records EIP-7702 authority nonces, and incorporates effects attributed to EIPs 7002, 7251, 2935, and 4788.
  - source: supporting/eip-2930.md
    locator: Abstract and Specification, lines 17-21 and 75-104
    summary: >-
      EIP-2930 populates the EIP-2929 accessed sets before execution, creating a coordinated question about whether declared-but-unused items belong in the BAL.
  - source: supporting/eip-7792.md
    locator: Front matter and Abstract, lines 1-16
    summary: >-
      The packaged target of the draft's EIP-7702 hyperlink is actually EIP-7792, Verifiable logs, exposing a historical cross-reference ambiguity rather than establishing a verifiable-logs interaction.
  rationale: >-
    The BAL has strong, test-relevant interdependencies with seven identified EIPs: 2929, 2930, 7702, 7002, 7251, 2935, and 4788. Access-set initialization and per-opcode tracking, authority nonce changes, and four system-transition paths each need coordinated expected BAL cases. A base score of 3 plus one increment for four additional EIPs beyond the first three yields 4.
  confidence: medium
  uncertainty_note: >-
    The authority reference names EIP-7702 but links to the packaged EIP-7792; 7702 is retained because it is the number stated in the normative sentence, while 7792 is not counted as an interaction. Some system EIP timing is contradictory.
  exceptional_score_justification: >-
    Cross-EIP interactions is explicitly uncapped. Seven identified interacting EIPs leave four beyond the first three, which triggers one rubric-defined +1 increment and produces score 4.
  interacting_eips: [2929, 2930, 7702, 7002, 7251, 2935, 4788]
  unidentified_interactions: []
totals:
  primary_score: 40
  complexity_tier: high
under_specification:
  present: true
  summary: >-
    The draft establishes exact BAL validity without fully specifying how every execution path maps into the list, how the SSZ object is committed and embedded in the RLP body, or how system and withdrawal effects are ordered and indexed. It also omits transition-tool and Engine API representations and contains an EIP-7702 hyperlink that resolves to the packaged EIP-7792. These are material because distinct client choices can produce different bal_hash values for the same execution.
  affected_criteria:
  - state_access_ordering_within_opcode_execution
  - transition_tool_interface_changes
  - edge_boundary_conditions
  - block_syncing_changes
  - engine_api_changes
  - modified_system_contracts
  - encoding_changes_rlp_ssz
  - unspecified_behavior_requiring_cross_client_consensus
  - cross_eip_interactions
  plausible_total_range:
    minimum: 37
    maximum: 41
  plausible_tiers:
  - high
  unresolved_questions:
  - What exact SSZ serialization or tree root does compute_bal_hash use, is compression consensus-visible, and where are the opaque BAL bytes placed in the RLP block body?
  - Do failed, reverted, out-of-gas, or declared-but-unused EIP-2930 accesses remain in the BAL, and at what exact point does each state-accessing operation become recordable?
  - Are EIP-7002 and EIP-7251 processed only after transactions, are EIP-2935 and EIP-4788 processed only before them, and why does the generic pseudocode process all four in both calls?
  - Do system effects use transaction_count or transaction_count + 1, and how are they distinguished from withdrawals that also use transaction_count in the pseudocode?
  - Which new fields are inputs or outputs of transition-tool and Engine API interfaces, and which component derives bal_hash?
  - Does the authority nonce rule intend EIP-7702 as written, or EIP-7792 as linked, whose packaged text instead specifies verifiable logs?
hindsight_control:
  internet_access_attempted: false
  prohibited_source_exposure: false
  exposure_details: []
