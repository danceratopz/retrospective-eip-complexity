eip:
  number: 8038
  title: State-access gas cost update
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-8038 was a Draft proposal to increase four
    existing warm/cold state-access gas parameters affecting SSTORE, SLOAD,
    call-family, BALANCE, SELFDESTRUCT, and EXT-family operations. It also
    specified an extra warm-access charge for EXTCODESIZE and EXTCODECOPY, with
    conditional treatment when EIP-2926 or EIP-8032 applies. The actual gas
    values and supporting stateful benchmark results were not yet finalized.
