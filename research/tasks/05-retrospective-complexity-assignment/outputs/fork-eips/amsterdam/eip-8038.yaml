  - source: supporting/eip-2926.md
    locator: Code merkleization, lines 44-68
    summary: >-
      EIP-2926 adds codeSize to contract accounts and separately changes code
      storage and creation costs, confirming why EXTCODESIZE treatment differs.
  - source: supporting/eip-7928.md
    locator: Abstract and Scope and Inclusion, lines 13-15 and 96-118
    summary: >-
