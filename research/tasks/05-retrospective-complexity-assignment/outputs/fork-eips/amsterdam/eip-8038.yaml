  - source: eip.md
    locator: Specification, lines 24-45
    summary: >-
      The proposal updates four existing gas-model parameters and revises the
      EXTCODESIZE/EXTCODECOPY charge to add one existing warm-access cost.
  rationale: >-
    This updates the existing EVM warm/cold gas-accounting mechanism rather than
    introducing a separate accounting mechanism, matching anchor 1.
  confidence: high
  uncertainty_note: >-
    The numerical values are TBD, but that does not change the mechanism-level
    classification.
  exceptional_score_justification: null
