eip:
  number: 8037
  title: State Creation Gas Cost Increase
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, this Draft proposed repricing seven existing
    state-creation-related gas parameters spanning contract creation, new
    accounts, storage, self-destruction, and EIP-7702 delegation. It also made
    contract-deployment charging depend on whether the exact runtime bytecode
    already existed in live state, adding warm/cold lookup and hashing costs
    while waiving the code-deposit charge for duplicates. To avoid the
    per-transaction cap constraining contract size, it required an independent
    two-dimensional gas/code-deposit-gas meter derived from EIP-8011 and relied
    on EIP-2780 to close the fresh-account funding bypass.
