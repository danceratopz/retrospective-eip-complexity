criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification / Parameter changes, lines 30-46
    summary: >-
      Seven existing gas parameters are increased and an independent
      code-deposit-gas meter is introduced alongside ordinary gas.
  - source: eip.md
    locator: Specification / Contract deployment cost calculation, lines 48-59
    summary: >-
      Deployment charging becomes conditional on live-state code existence and
      adds warm/cold lookup and runtime hashing charges for CREATE, CREATE2, and
      creation transactions.
  rationale: >-
    This is anchor 3: it introduces a new multidimensional gas-accounting
    mechanism and makes it interact with existing creation accounting, while
    also repricing several existing mechanisms and therefore their gas tests.
  confidence: high
  uncertainty_note: >-
    The existence of the new mechanism is explicit, although its complete
    limit and exhaustion semantics are not.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Specification / Contract deployment cost calculation, lines 48-59
    summary: >-
      Contract creation first checks CodeExists against live state, then applies
      conditional deposit charging plus a warm/cold access charge and a runtime
      hash charge; the text expressly covers both CREATE and CREATE2.
  rationale: >-
    This is anchor 2 because a new state access and gas-charge sequence applies
    to multiple creation operations. The ordering must be exercised at gas
    boundaries for both CREATE and CREATE2, rather than for only one opcode.
  confidence: medium
  uncertainty_note: >-
    The draft does not identify which address or code object is warmed, whether
    the lookup is recorded as an access, or the exact ordering at failure and
    out-of-gas boundaries.
  exceptional_score_justification: null
