eip:
  number: 8246
  title: Remove SELFDESTRUCT Burn
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-8246 proposed removing the remaining ETH-burn
    cases for SELFDESTRUCT executed by a contract created in the same transaction.
    It preserves the account balance while clearing nonce, code, and storage at
    transaction finalization, lets EIP-161 delete a resulting empty account, and
    leaves behavior outside the same-transaction creation case unchanged from
    EIP-6780. The proposal also resets nonce to zero so a later CREATE2 remains
    possible; it requires a hard fork and identifies a large combinatorial
    multi-call/create test surface, but its concrete test cases were still TBD.
