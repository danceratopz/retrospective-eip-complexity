under_specification:
  present: true
  summary: >-
    The proposal defines the high-level split between refunded transaction gas and
    unrefunded block gas, but does not fully specify how the two quantities map to
    consensus block and receipt values or exhaustively define the boundary between
    excluded refunds and retained storage discounts. These omissions affect exact
    vector baselines without changing the proposal's core accounting direction.
