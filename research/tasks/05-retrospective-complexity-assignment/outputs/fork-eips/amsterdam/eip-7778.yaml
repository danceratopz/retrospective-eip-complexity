  - medium
  unresolved_questions:
  - >-
    Does block.gas_used denote the encoded block-header gas-used value, only an
    internal validity accumulator, or both?
  - >-
    What gas values should receipts and cumulative transaction-gas fields expose
    when transaction accounting remains refunded but block accounting is gross?
  - >-
    Which adjustments are refunds excluded from block accounting, and which are
    discounts that remain applied, especially for reverting storage to its original
    value?
  - >-
    Must a transition-tool interface expose both net transaction gas and gross block
    gas separately, or is changing an existing result sufficient?
