eip:
  number: 7778
  title: Block Gas Accounting without Refunds
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7778 proposed retaining existing gas refunds for
    user transaction costs while counting gas before refunds toward the block gas
    limit. It required the sum of unrefunded transaction gas to remain within the
    block limit, while retaining discounts described as reflecting reduced work,
    and identified a hard fork plus block-producer transaction-selection changes.
