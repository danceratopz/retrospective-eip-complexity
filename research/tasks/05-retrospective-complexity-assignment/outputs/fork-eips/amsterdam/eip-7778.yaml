notable_ambiguities:
- >-
  The notation block.gas_used is not tied explicitly to the block header, receipts,
  or an internal-only accumulator.
- >-
  The examples distinguish refunds from storage discounts, but do not provide a
  complete classification of adjustments for consensus testing.
- >-
  Backwards compatibility says only producers need to adjust transaction selection,
  while the specification also imposes a consensus block-limit rule that validators
  must evaluate.
