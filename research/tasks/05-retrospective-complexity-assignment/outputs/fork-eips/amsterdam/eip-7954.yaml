eip:
  number: 7954
  title: Increase Maximum Contract Size
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7954 proposed raising the maximum deployed
    contract code size from 24,576 to 32,768 bytes and the maximum initcode size
    from 49,152 to 65,536 bytes. This changes the EIP-170 contract-creation
    result threshold and the EIP-3860 create-transaction and CREATE/CREATE2
    initcode thresholds, while the proposal states that only the size limits
    change. Activation requires a network upgrade, and the proposal identifies
    a marginal denial-of-service risk from permitting larger contracts.
