notable_ambiguities:
- >-
  The increased initcode maximum lets the unchanged EIP-3860 metering formula
  apply over a larger admissible range. This assessment treats that as a validity
  and opcode-behavior change, not an EVM gas-accounting rule change, because no
  cost or formula is modified.
- >-
  The supporting EIP-3860 text mentions CREATE2's EIP-1014 hash-cost mechanism,
  but EIP-7954 neither identifies EIP-1014 as a requirement nor changes that gas
  mechanism; therefore only EIPs 170 and 3860 are recorded as interacting EIPs.
