  summary: >-
    Material but localized under-specification is present. The formal algorithms read
    code[pc + 1] without explicitly defining a missing immediate at end-of-code, and
    stack-fault behavior is left to implicit base-EVM conventions. This chiefly affects
    boundary baselining rather than the proposal's overall design.
  affected_criteria:
