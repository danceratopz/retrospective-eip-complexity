eip:
  number: 8024
  title: Backward compatible SWAPN, DUPN, EXCHANGE
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, the proposal added three execution-layer opcodes at
    0xe6 through 0xe8 for immediate-encoded deep duplication, deep swapping, and
    pairwise exchange of stack items. Each opcode carries a one-byte immediate and
    charges a fixed 3 gas, while selected immediate values are forbidden so that
    existing JUMPDEST and PUSH interpretation remains unchanged. The stated scope
    is opcode semantics, encoding and decoding, assembly/disassembly, and execution;
    it does not introduce transaction, block, state, precompile, or external-interface
    changes.
