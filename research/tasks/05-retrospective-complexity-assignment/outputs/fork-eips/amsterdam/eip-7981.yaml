eip:
  number: 7981
  title: Increase Access List Cost
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7981 was a draft execution-layer proposal that
    added an intrinsic-gas charge of 40 gas per non-zero byte and 10 gas per zero
    byte in every address and storage key contained in an existing access list.
    It retained EIP-2930's per-address and per-storage-key charges and access-list
    format, while applying the additional charge to existing access-list-bearing
    transaction classes to close the EIP-7623 block-size pricing loophole.
