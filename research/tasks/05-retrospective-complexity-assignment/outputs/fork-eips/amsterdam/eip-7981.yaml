    locator: Specification, lines 24-62
    summary: >-
      The proposal retains the existing address and storage-key charges and adds
      zero-byte and non-zero-byte terms to the access-list gas-cost formula.
  rationale: >-
    This updates the existing intrinsic-gas accounting mechanism for access lists;
    it does not introduce a separate gas-accounting mechanism, matching anchor 1.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
