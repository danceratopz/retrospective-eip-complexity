    summary: >-
      The new charge is computed by calculate_intrinsic_cost before execution and
      is added to the transaction's intrinsic cost; no opcode execution is changed.
  rationale: >-
    Because the proposal neither moves a state access inside an opcode nor changes
    when opcode gas is charged relative to such an access, anchor 0 applies.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
