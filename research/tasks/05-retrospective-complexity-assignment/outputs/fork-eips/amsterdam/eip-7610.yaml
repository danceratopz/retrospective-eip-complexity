eip:
  number: 7610
  title: Revert creation in case of non-empty storage
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the selected historical revision, EIP-7610 extends the contract-creation
    collision rule so that creation transactions, CREATE, CREATE2, and any other
    creation path must fail when the destination has non-empty storage, in
    addition to the existing nonzero-nonce and nonzero-code conditions. It
    amends EIP-684 to protect legacy accounts whose zero nonce and zero-length
    code could coexist with storage before EIP-161, and specifies the same
    invalid-init-code failure behavior for all creation paths. The EIP expects
    existing non-empty-storage deployment tests to provide coverage after their
    expected results are refilled.
