eip:
  number: 7976
  title: Increase Calldata Floor Cost
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7976 was a draft execution-layer proposal to
    raise EIP-7623's existing calldata floor from 10/40 to 15/60 gas per
    zero/non-zero byte for data-heavy transactions. It retained the existing
    max-based transaction gas-used formula, including EIP-3860's initcode term,
    and raised the corresponding minimum gas-limit validity threshold while
    leaving EVM-heavy transactions on standard calldata pricing.
