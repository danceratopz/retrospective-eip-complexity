  summary: >-
    The specification's equation and test guidance require final transaction
    gasUsed to meet the calldata floor, but the adjacent prose says valid cases
    can have gasUsed below the floor. The likely intended distinction is between
    pre-floor execution consumption and final charged gas, but that distinction
    is not stated explicitly.
