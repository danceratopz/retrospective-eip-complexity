criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification — Request queue and system call, lines 76-78
    summary: >-
      Each new predeploy is invoked with a dedicated 30,000,000 gas allowance whose consumption is excluded from the block gas limit, and a failed call invalidates the block.
  rationale: >-
    The proposal extends the existing exceptional system-call gas-accounting path to two additional calls, fitting an update to an existing mechanism. It does not alter opcode costs or ordinary transaction gas accounting.
  confidence: medium
  uncertainty_note: >-
    The rubric boundary is whether adding calls to an already-defined gas-exempt system-call mechanism counts as updating EVM gas accounting; this assessment treats it as score 1 rather than 0.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Backwards Compatibility, lines 162-166
    summary: >-
      The execution-layer change is described as additive through contracts at previously empty addresses, with existing validator contracts left unchanged.
  rationale: >-
    Contract calls and storage operations are added, but no opcode's internal state-access position or gas-charge ordering is changed.
  confidence: high
  uncertainty_note: "None identified."
  exceptional_score_justification: null
