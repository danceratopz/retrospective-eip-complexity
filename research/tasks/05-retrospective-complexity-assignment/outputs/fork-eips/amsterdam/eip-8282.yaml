  title: Builder Execution Requests
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: >-
    At the recorded cutoff, EIP-8282 proposed two stateful predeploys that accept builder deposits and exits, queue them under demand-responsive fees, and expose bounded batches through end-of-block system calls as two EIP-7685 request types. The consensus layer would register or top up builders from deposit records, authorize exits through a builder's execution address, and replace EIP-7732's post-fork validator-deposit and voluntary-exit routing while retaining one-time fork-transition onboarding. The draft specified the normative queue and lifecycle behavior in detail, but its request-type allocation, signing-domain constant, runtime bytecode, deployment artifacts, reference implementation, and tests were not yet final.
