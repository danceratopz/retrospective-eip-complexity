assessment:
  historical_scope_summary: >-
    At the 2023-09-14 information cutoff, this Draft EIP specified one new
    constant-cost EVM opcode, BLOBBASEFEE at 0x49, which takes no stack input
    and pushes the current block's EIP-4844 blob gas price. It deliberately
    follows EIP-3198's BASEFEE design and says the value is already available
    before EVM execution, so it adds no new blob-pricing formula, transaction
    type, header field, or state access. In the sealed package, however,
    EIP-4844 also assigns 0x49 to BLOBHASH, and the EIP does not settle that
    opcode conflict or the representation of a blob gas price wider than an
    EVM stack word.
