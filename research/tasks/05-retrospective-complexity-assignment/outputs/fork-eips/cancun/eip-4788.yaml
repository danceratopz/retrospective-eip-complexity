eip:
  number: 4788
  title: Beacon block root in the EVM
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: >-
    At the assessment cutoff, EIP-4788 proposed appending the 32-byte parent
    beacon-block hash-tree root to every post-fork execution header. Before
    transactions, execution processing would write that root into a slot-keyed,
    modulo-8192 state ring buffer, and a new fixed-cost BEACON_ROOT opcode would
    expose reads from that storage. The document was still Draft and left its
    tests, reference implementation, security analysis, and several
    consensus-critical details unresolved.
