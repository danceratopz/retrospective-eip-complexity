    summary: The design explicitly considers work under skipped-slot conditions and chooses the block root to limit added work relative to a state-root design.
  rationale: The write loop, state-trie interaction, and dependence on slot gaps require validation in full block processing and can affect existing block benchmarks, but the specified impact is bounded to this pre-block mechanism rather than clearly substantial across the system.
