- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 2
  evidence:
  - source: eip.md
    locator: Specification constants and New opcode, lines 25-31 and 72-83
    summary: The proposal assigns the new BEACON_ROOT operation a gas constant and specifies a fixed-cost storage-reading opcode.
  rationale: A gas charge is introduced for a new operation without changing an existing opcode's accounting or refund behavior, matching the anchor for a new, isolated accounting mechanism.
  confidence: medium
  uncertainty_note: The constants table names G_beacon_root, while the opcode text names the undefined G_beacon_state_root.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Specification / EVM changes / New opcode, lines 72-85
    summary: BEACON_ROOT pops a slot from the stack and then performs an SLOAD-like read from the history address.
  rationale: The EIP introduces a new state-accessing operation whose stack, gas-charge, and storage-access ordering must be made consensus-exact, which is the score-2 anchor.
  confidence: medium
  uncertainty_note: The pseudocode orders the pop and read but does not say where gas is charged or how exceptional execution is ordered relative to the read.
  exceptional_score_justification: null
