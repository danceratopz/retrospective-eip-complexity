    maximum: 16
  plausible_tiers:
  - medium
  unresolved_questions:
  - >-
    Precisely which successful creation events mark an address as created in the
    transaction, and how is that status rolled back across reverted nested scopes?
  - >-
    If an address is destroyed, accessed, or recreated again within the same
    transaction, which branch applies and at what point must it behave as empty?
  - >-
    When the SELFDESTRUCT target equals the executing account, must the non-creation
    branch end with a zero balance, as the creation branch explicitly requires?
  - >-
    Does "caller" in the abstract mean the beneficiary/target, or does it prescribe
    a different recipient from the target named in the specification?
