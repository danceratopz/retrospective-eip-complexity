  summary: >-
    Material localized under-specification remains around the definition and rollback
    lifecycle of "created in the same transaction," address reuse after destruction,
    and the balance result when the SELFDESTRUCT target is the executing account. The
    abstract's "caller" terminology also conflicts with the specification's "target."
