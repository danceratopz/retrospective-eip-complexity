  title: SELFDESTRUCT only in same transaction
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the 2023-03-30 information cutoff, draft EIP-6780 changed the existing
    SELFDESTRUCT opcode so that a contract not created in the current transaction
    retained its code and storage while transferring its balance to the target.
    Contracts created and self-destructed in the same transaction retained the
    prior deletion behavior, with the existing EIP-2929 access rules, EIP-3529
    no-refund rule, and EIP-6049 deprecation left in place. The proposal identified
    CREATE2 address recreation across transactions as its breaking application
    pattern.
