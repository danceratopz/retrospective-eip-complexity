notable_ambiguities:
- >-
  The front matter requires EIP-2681, but the normative text does not explain how
  its account-nonce limit participates in EIP-6780.
- >-
  The same-transaction branch explicitly sets the source balance to zero after
  transfer, while the other branch states only that the entire balance is transferred.
- >-
  The alternative EIP-6046 is characterized briefly in EIP-6780, so it is treated
  as a design conflict rather than as a co-activated dependency.
overall_confidence: medium
