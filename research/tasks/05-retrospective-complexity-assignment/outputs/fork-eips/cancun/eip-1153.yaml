criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 2
  evidence:
  - source: eip.md
    locator: Specification, lines 53-55
    summary: TLOAD and TSTORE receive newly specified constant execution-gas costs, each defined by reference to an existing warm or hot storage-operation cost.
  - source: eip.md
    locator: Rationale, lines 85-90
    summary: The proposal states that existing operation semantics remain unchanged and characterizes the new opcodes' accounting as simpler.
  rationale: >-
    The two opcodes add new execution-gas charging sites, so this is a new EVM
    gas rule. Their fixed 100-gas schedule neither changes an existing opcode's
    accounting nor introduces refunds, matching score 2 rather than score 3.
  confidence: high
  uncertainty_note: >-
    The wording does not make fully explicit whether the costs are permanently
    100 or track the named warm/hot referent costs, but that does not change the
    anchor score at the cutoff.
  exceptional_score_justification: Not applicable; score 4 is not used.
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Abstract and Specification, lines 17-17 and 55-57
    summary: Transient values are never loaded from or written to persistent storage, have fixed warm/hot-equivalent costs, and are discarded at transaction end.
  rationale: >-
    The text introduces no cold/warm recording, block-level access-list effect,
    or change to gas-versus-access ordering for an existing opcode. Transient
    map access is the new opcodes' result mechanism, but the proposal provides
    no recordable persistent-state access whose internal ordering changes under
    this anchor.
  confidence: medium
  uncertainty_note: >-
    The proposal calls transient storage "state"; this assessment treats its
    non-persistent, fixed-cost map access as outside the rubric's recordable
    state-access-ordering concern.
  exceptional_score_justification: Not applicable; score 4 is not used.
