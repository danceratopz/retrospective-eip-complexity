- id: performance_risks
  label: Performance risks
  score: 2
  evidence:
  - source: eip.md
    locator: Reference Implementation, lines 101-108 and 201-201
    summary: The recommended journal is constant-time on normal paths but reverse-linear on revert; a worst-case reverting transaction performs twice the writes, although the EIP compares this with existing state journaling.
  - source: eip.md
    locator: Security Considerations, lines 225-245
    summary: TSTORE permits linear node-memory allocation up to about 9.15 MB at the stated block gas limit, and the EIP compares this with call-reset memory allocation up to about 20 MB.
  rationale: >-
    Loads and normal stores can be benchmarked directly, but total cost cannot
    be validated wholly in isolation because checkpoints, nested reverts, and
    transaction-wide allocation interact with call execution and journaling.
    The EIP's comparison to existing worst cases supports limited rather than
    substantial benchmark impact, matching score 2.
