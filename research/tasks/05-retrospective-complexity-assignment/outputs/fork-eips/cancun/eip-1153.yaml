totals:
  primary_score: 15
  complexity_tier: medium
under_specification:
  present: true
  summary: >-
    The normative TLOAD sentence says that after fetching a word the opcode
    "pops" the value on top of the stack, conflicting with its SLOAD-like load
    role and failing to state the expected pushed result. The intended reading
    is strongly signaled, but literal cross-client vectors require agreement;
    address lifecycle and whether gas values are fixed or referential are also
    not fully explicit.
  affected_criteria:
  - evm_gas_rule_changes
  - edge_boundary_conditions
  - added_opcodes
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 15
    maximum: 16
  plausible_tiers:
  - medium
  unresolved_questions:
  - Does TLOAD push the fetched word, despite the normative sentence saying it pops a value?
  - Is transient storage identity strictly address-keyed if an address is destroyed and recreated within one transaction?
  - Are both opcode costs fixed at 100 gas, or do they track the named warm/dirty SSTORE and hot SLOAD referent costs?
hindsight_control:
  internet_access_attempted: false
  prohibited_source_exposure: false
  exposure_details: []
  contaminated: false
  attestation: >-
    I assessed only the sealed historical EIP revision, the pinned assessor
    rubric, and the three allowlisted supporting EIPs at the recorded cutoff. I
    did not use internet access, later implementations, later specifications,
    fork outcomes, other EIP assessments, project-management records, or any
    dedicated assessment skill.
notable_ambiguities:
- The TLOAD specification says it fetches a word and then "pops" the value instead of specifying a pushed result.
- The warm/hot cost analogies and parenthetical 100-gas values do not clearly state whether the schedule is referential or fixed.
- The state-access-ordering anchor is rubric-sensitive because the EIP calls the map state while expressly excluding persistent storage and any cold/warm access-recording rule.
overall_confidence: medium
