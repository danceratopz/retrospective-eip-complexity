  title: Transient storage opcodes
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the 2022-12-08 information cutoff, EIP-1153 added two constant-cost EVM
    opcodes, TLOAD and TSTORE, backed by contract-private transient storage that
    is shared across the owning contract's frames and discarded after each
    transaction. The proposal specified storage-like addressing, call-type
    ownership, nested-revert rollback, and static-context behavior without
    changing existing opcode semantics or using the refund counter. It also
    supplied a map-and-journal reference design and analyzed worst-case memory
    allocation and revert work.
