  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Specification — Header extension, lines 177-219
    summary: >
      Every post-fork header gains excess_data_gas, whose expected value is derived
