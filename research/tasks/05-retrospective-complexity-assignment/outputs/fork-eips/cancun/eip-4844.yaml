criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification — Opcode to get versioned hashes and Point evaluation precompile, lines 237-274
    summary: >
      The new DATAHASH opcode has a fixed three-gas cost and the new point-evaluation
      precompile has a fixed 50,000-gas cost.
  rationale: >
    The normal EVM gas mechanism is extended with fixed charges for one opcode and
    one precompile, but no new execution-gas meter or interaction with existing EVM
    gas rules is introduced. The independent data-gas mechanism is scored in its
    dedicated criterion, leaving this at the anchor-1 existing-mechanism update.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification — Opcode to get versioned hashes, lines 237-242
    summary: >
      DATAHASH reads an index and returns a value from the transaction's versioned-hash
      list or zero; it neither accesses state nor changes gas charging around a state
      access.
  rationale: >
    No existing opcode's state-access path or gas-charge ordering is changed, and the
    sole new opcode is not state-accessing. The anchor therefore remains zero.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification — Header extension and Gas accounting, lines 177-219 and 276-312
    summary: >
      A persistent excess-data-gas header value drives an independent exponential
      data-gas price; blob transactions gain affordability and fee-cap validity
      checks, and the actual data fee is deducted and burned even on failure.
  - source: eip.md
    locator: Rationale — Data gasprice update rule, lines 422-433
    summary: >
      The new self-correcting price responds to cumulative use relative to a target
      and is explicitly modeled after, but distinct from, EIP-1559.
  rationale: >
    This is a new blob-gas accounting mechanism with persistent block state, its own
    target and pricing curve, transaction balance checks, fee caps, deduction, and
    burn. Its header and block-validity consequences affect ordinary block-processing
    and regression vectors, satisfying anchor 3.
  confidence: high
  uncertainty_note: >
    The pricing pseudocode contains a header/parent naming inconsistency, but the
    existence and breadth of the mechanism are unambiguous.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification — Gas accounting, lines 276-312
    summary: >
      The proposal defines data gas for blobs and a balance deduction; it does not
      define state-byte charging, a state-gas budget, or a spill path into execution
      gas.
  rationale: >
    The new meter prices blob data rather than state writes, so none of the rubric's
    state-gas mechanisms is changed.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Specification — Gas accounting, lines 296-312
    summary: >
      The proposal states that the data fee is burned and is not refunded when a
      transaction fails.
  rationale: >
    No new EVM refund mechanism is introduced; the only explicit refund rule denies
    a data-fee refund.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Specification — New transaction type through Beacon chain validation, lines 102-235
    summary: >
      The proposal changes typed-transaction contexts, adds an SSZ transaction and
      network wrapper, extends every post-fork header, and requires beacon block,
      gossip, sync, and validator changes.
  - source: eip.md
    locator: Specification — Gas accounting and Networking, lines 276-349
    summary: >
      Block validity, sender affordability, fee deduction, transaction propagation,
      and wrapper validation all gain new rules.
  rationale: >
    Existing transaction, block/header, fork-transition, networking, syncing, and
    execution/consensus integration patterns require reworking across diverse test
