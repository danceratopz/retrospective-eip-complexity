  rationale: >
    A broad category of pre-existing block tests must mechanically assert the new
    header field and its recurrence even when blob behavior is not their subject.
    The text does not establish that every test or pre-fork vector must be re-derived,
    so anchor 2 is the best fit rather than anchor 3.
  confidence: medium
