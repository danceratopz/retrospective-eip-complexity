  title: Shard Blob Transactions
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: >
    At the information cutoff, this draft introduced an EIP-2718 blob-carrying
    transaction whose signed payload used SSZ and whose network form additionally
    carried blobs, KZG commitments, and an aggregate proof. It added a block-header
    excess-data-gas field, an independent data-gas fee market and burn, a DATAHASH
    opcode, and a KZG point-evaluation precompile. It also assigned blob persistence
    and availability to the consensus layer through separately propagated sidecars
    and changed execution-layer transaction propagation to announcement and
    on-demand retrieval.
