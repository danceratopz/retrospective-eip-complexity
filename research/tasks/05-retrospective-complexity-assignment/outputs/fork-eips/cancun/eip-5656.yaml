assessment:
  historical_scope_summary: >-
    At the 2023-05-25 information cutoff, EIP-5656 introduced the single MCOPY
    instruction at opcode 0xb7 to copy an arbitrary byte range within EVM memory.
    It specified three stack inputs, no output, memmove-like overlap semantics,
    memory expansion, and dynamic gas by adding the instruction to the existing
    W_copy group. The proposal did not change state, transactions, blocks,
    interfaces, precompiles, or system contracts.
