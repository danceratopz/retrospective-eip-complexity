eip:
  number: 6110
  title: Supply validator deposits on chain
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-6110 appended an ordered list of validator
    deposit operations to each post-fork execution block and added a header trie
    root committing to that list; the list was required to equal deposits parsed
    from deposit-contract logs produced by the block. It also extended the
    consensus ExecutionPayload and BeaconState, processed the new receipts while
    winding down the former Eth1Data deposit path, and made validator indices
    branch-dependent. The packaged fork document specified an irregular
    consensus-state upgrade, while several activation and interface details
    remained work in progress.
