totals:
  primary_score: 14
  complexity_tier: medium
under_specification:
  present: true
  summary: >-
    The proposal does not fully define the semantics and validity of advertised
    range endpoints and their hash, handling of malformed or discontinuous
    ranges, precise BlockRangeUpdate triggers, detailed receipt-field validity,
    or receiver and peer-management behavior. These gaps are localized to wire
    interoperability and integrated sync behavior rather than EVM consensus.
  affected_criteria:
  - edge_boundary_conditions
  - performance_risks
  - security_risks
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 11
    maximum: 15
  plausible_tiers:
  - low
  - medium
  unresolved_questions:
  - Are earliestBlock and latestBlock inclusive, and must available history be contiguous?
  - What relationship must latestBlockHash have to latestBlock, and how should a peer handle inconsistent announcements?
  - How are an empty available range, invalid endpoint ordering, and values beyond the peer's known chain represented and handled?
  - Which range changes require BlockRangeUpdate, and what exact timing satisfies both the update recommendation and once-per-epoch limit?
  - What validation, disconnect, or penalty behavior applies to malformed receipts and range messages?
