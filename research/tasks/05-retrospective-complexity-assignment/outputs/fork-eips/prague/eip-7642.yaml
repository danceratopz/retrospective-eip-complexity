  title: eth/69 - history expiry and simpler receipts
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the recorded cutoff, EIP-7642 introduced eth/69 by changing the eth
    wire-protocol Status message to advertise a node's available block range,
    replacing receipt transfer with a flat encoding that omits the bloom, and
    adding a BlockRangeUpdate notification. It also removed total difficulty
    from the handshake and moved the latest block hash, while retaining eth/68
    as the backward-compatible alternative. The proposal explicitly did not
    change EVM consensus rules or require a hard fork.
