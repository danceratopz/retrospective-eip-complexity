    locator: Motivation / Removing Bloom in Receipts, lines 32-40
    summary: Existing receipt serving is described as regenerating and transferring roughly 530 GB of bloom data per sync.
  - source: eip.md
    locator: Rationale / Receipts changes, lines 108-121
    summary: The new encoding shifts bloom recomputation to the receiver while substantially reducing serving CPU and sync bandwidth.
  - source: eip.md
    locator: Motivation and Specification / BlockRangeUpdate, lines 42-46 and 79-87
    summary: Peers can alter fetching based on advertised history, while update traffic is limited to once per 32 blocks.
  rationale: >-
    Validation spans serving-node regeneration, wire transfer, receiving-node
