under_specification:
  present: true
  summary: >-
    The EIP defines the high-level schedule shape and two fallback outcomes but omits
    normative field types and ranges, malformed or partial-entry behavior, the ordering
    used to identify the last fork, whether its displayed values are normative, and the
    full set of consumers. These gaps are localized to configuration interpretation and
    do not justify projecting unspecified protocol mechanisms into other anchors.
  affected_criteria:
  - blob_gas_accounting_changes
  - patterns_affecting_pre_existing_tests
  - edge_boundary_conditions
  - new_fork_activation_mechanism
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 3
    maximum: 10
  plausible_tiers:
  - low
  unresolved_questions:
  - Are the Cancun and Prague target/max values normative or merely an example of the object shape?
  - What ordering determines the last specified fork, especially for unknown, duplicate, or out-of-order fork keys?
  - What field types and ranges are valid, and how are missing, partial, malformed, or negative entries handled?
  - Which execution-client activities beyond eth_feeHistory consume target and max, and which consequences must agree across clients?
