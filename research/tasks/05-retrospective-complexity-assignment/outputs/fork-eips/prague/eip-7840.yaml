eip:
  number: 7840
  title: Add blob schedule to EL config files
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, this informational proposal extended execution-client
    configuration files with a blobSchedule object mapping forks to target and maximum
    blob counts. It defined inheritance from the most recently specified fork and a
    zero-value default when no prior entry exists, motivated by execution-layer consumers
    such as eth_feeHistory while avoiding a per-block Engine API handshake. It did not
    specify changes to block or transaction encoding, EVM operations, or contracts.
