eip:
  number: 7623
  title: Increase calldata cost
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7623 was a draft execution-layer proposal that
    retained the existing weighted calldata-token calculation but added a
    transaction total-cost floor of 12 gas per token. The normal branch combined
    calldata, EVM execution, and contract-creation costs, so the floor would mainly
    raise the effective nonzero-calldata cost for low-computation data-availability
    transactions while leaving sufficiently computation-heavy transactions on the
    existing branch. Its stated purpose was to reduce maximum block size and make
    room for more blobs, and it required a scheduled network upgrade.
