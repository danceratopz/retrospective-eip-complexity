under_specification:
  present: true
  summary: >-
    The draft establishes the numerical calldata floor but not its consensus-critical
    integration into transaction gas-limit checking, execution failure, unused-gas
    settlement, access-list and other intrinsic charges, receipts/block gas totals,
    or all existing transaction envelopes. The pseudocode is also syntactically
    incomplete, although the intended maximum is readable.
  affected_criteria:
  - patterns_affecting_pre_existing_tests
  - edge_boundary_conditions
  - new_or_modified_transaction_validity_mechanisms
  - performance_risks
  - security_risks
  - unspecified_behavior_requiring_cross_client_consensus
  - cross_eip_interactions
  plausible_total_range:
    minimum: 11
    maximum: 22
  plausible_tiers:
  - low
  - medium
  unresolved_questions:
  - >-
    Is the total-cost floor an up-front intrinsic-gas requirement, a post-execution
    adjustment to gas used, or another charging phase?
  - >-
    What happens when execution fits within the transaction gas limit under the
    normal branch but the floor exceeds that limit?
  - >-
    Does evm_gas_used mean gas before or after EVM refund accounting, and how does
    the floor affect the sender's unused-gas refund and fee settlement?
  - >-
    Where do access-list charges and any other type-specific intrinsic costs enter
    relative to the maximum?
  - >-
    Does the rule apply identically to legacy, EIP-1559, and EIP-4844 transaction
    envelopes, including blob transactions that also pay independent blob gas?
  - >-
    What complete normative expression was intended by the unclosed pseudocode, and
    which existing EIP defines the referenced InitCodeWordGas interaction?
