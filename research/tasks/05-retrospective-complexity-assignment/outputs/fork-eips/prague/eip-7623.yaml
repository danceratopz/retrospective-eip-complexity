- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification, lines 32-65
    summary: >-
      The draft defines calldata tokens and replaces the prior additive transaction
      gas formula with a maximum between the existing-cost branch and a new
      12-gas-per-token total-cost floor.
  rationale: >-
    The maximum is a new transaction gas-accounting mechanism, not merely a constant
    substitution. It competes with the existing calldata, execution, and creation
    cost calculation and therefore changes existing gas outcomes and vectors,
    matching anchor 3.
  confidence: high
  uncertainty_note: >-
    The floor's charging phase is not specified, but the introduction and effect of
    the new gas rule are explicit.
  exceptional_score_justification: null
