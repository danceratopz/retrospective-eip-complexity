assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7691 raised the consensus-layer blob target and
    maximum from the EIP-4844 values to 6 and 9 blobs per block and raised the
    corresponding execution-layer blob-gas target and maximum. It also selected a
    new blob-base-fee update fraction to account for the asymmetric distance from
    the new target to empty and full blocks. All replacements were specified to
    activate with the Electra/Prague fork, without adding a transaction format,
    header field, opcode, precompile, or cryptographic mechanism.
