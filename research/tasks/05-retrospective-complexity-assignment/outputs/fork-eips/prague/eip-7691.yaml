under_specification:
  present: true
  summary: >-
    The normative values and intended fork split are clear, but the execution-layer
    activation phrase combines an epoch identifier with timestamp semantics and the
    new maximum/target constants reuse the old names. These are localized rather
    than design-wide gaps, and the evident intended behavior is to select all new
    values together at the Prague/Electra boundary.
  affected_criteria:
  - blob_gas_accounting_changes
  - new_fork_activation_mechanism
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 15
    maximum: 17
  plausible_tiers:
  - medium
  unresolved_questions:
  - What exact execution-layer fork signal is intended by "starting at PECTRA_FORK_EPOCH timestamp," and how is it aligned with the consensus-layer epoch boundary?
  - Are MAX_BLOB_GAS_PER_BLOCK and TARGET_BLOB_GAS_PER_BLOCK intended to be explicitly fork-scoped constants despite retaining their pre-fork names?
hindsight_control:
  internet_access_attempted: false
  prohibited_source_exposure: false
  exposure_details: []
  contaminated: false
  attestation: >-
    I assessed only the sealed historical EIP revision, its packaged rubric, and the
