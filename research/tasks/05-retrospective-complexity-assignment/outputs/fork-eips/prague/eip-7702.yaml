eip:
  number: 7702
  title: Set Code for EOAs
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    The historical draft introduces a new EIP-2718 typed transaction, derived from
    EIP-2930, that carries an array of contract-code blobs and ECDSA authorization
    tuples. Before transaction execution, the client recovers each signer, requires
    that signer to have empty code, temporarily installs the authorized code, and
    warms the signer under EIP-2929; after execution, it clears each signer's code.
    The transaction origin may differ from every code signer, enabling EOA batching,
    sponsorship, and privilege de-escalation without adding opcodes.
