- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 2
  evidence:
  - source: eip.md
    locator: Specification, lines 42-52
    summary: >-
      The new transaction inherits EIP-2930 intrinsic gas and adds per-byte gas for
      each code blob plus a 5000-gas base charge for every authorization entry.
  rationale: >-
    This is a new intrinsic-gas mechanism scoped to the new transaction type. It
    composes with existing intrinsic accounting without changing pre-existing
    transaction types, matching score 2.
  confidence: medium
  uncertainty_note: >-
    Malformed-entry, arithmetic-overflow, and non-code authorization-byte charging
    rules are not fully specified.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
