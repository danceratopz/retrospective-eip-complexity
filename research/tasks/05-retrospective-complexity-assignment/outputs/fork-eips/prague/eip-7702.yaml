      Code checking, installation, and warming occur during transaction setup, while
      clearing occurs at transaction end.
  - source: eip.md
    locator: Rationale, lines 82-85
    summary: The proposal explicitly states that it does not add opcodes.
  rationale: >-
    The change is at transaction boundaries, not inside an opcode's execution, so no
    opcode-level state-access or gas-charge ordering changes.
  confidence: high
  uncertainty_note: None identified.
  exceptional_score_justification: null
