  title: Precompile for BLS12-381 curve operations
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-2537 proposed nine precompiles at addresses
    0x0c through 0x14 for BLS12-381 G1/G2 addition, multiplication,
    multiexponentiation, pairing, and field-to-curve mapping. It specified
    field and point encodings, call ABIs, validation and error behavior, and
    fixed or input-length-dependent gas schedules. The mapping algorithms were
    delegated to a separately linked document that is not present in the sealed
    package, while two sections gave conflicting pairing gas formulas.
