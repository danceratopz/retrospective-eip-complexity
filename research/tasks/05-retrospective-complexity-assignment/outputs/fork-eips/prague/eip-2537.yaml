under_specification:
  present: true
  summary: >-
    The packaged EIP does not contain the algorithms and parameters needed to
    determine the outputs of its two mapping precompiles, instead referring to
    a separate document. It also gives two incompatible pairing gas formulas
    and leaves the activation block as X. The first two gaps require a normative
    resolution before complete cross-client vectors can be baselined.
