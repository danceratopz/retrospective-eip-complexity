criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 2
  evidence:
  - source: eip.md
    locator: Validator Exit precompile / Gas cost, lines 150-154
    summary: >-
      The proposal introduces metering for a new native precompile, but leaves its
      gas cost TBD pending an estimate of the native computation cost.
  - source: eip.md
    locator: Rationale / Utilizing CALL to return excess payment, lines 326-334
    summary: >-
      The selected refund path uses a 2300-gas nested CALL specifically so that the
      precompile can have fixed rather than dynamic gas accounting.
  rationale: >-
    This is a new gas-charged EVM execution mechanism, but it is confined to calls
    to a previously unused precompile address and therefore does not, as written,
    alter existing gas-accounting mechanisms or their tests. That matches score 2;
    the actual amount and final fixed-versus-dynamic rule are not yet specified.
  confidence: medium
  uncertainty_note: >-
    The precompile gas cost is explicitly TBD, so a finalized dynamic schedule or
    interaction with existing CALL charging could move this score.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Validator Exit precompile / trigger_exit pseudocode, lines 79-125
    summary: >-
      A CALL to the new precompile performs fee validation, several state reads and
      writes, queue insertion, and then a nested value-returning CALL in a specified
      high-level sequence.
  rationale: >-
    The proposal adds a new state-accessing operation behind CALL, and the positions
    of its state accesses, failure points, gas charging, and nested CALL must be
    settled and tested. It does not rewrite ordering for an existing class of
    opcodes, so score 2 is the applicable anchor rather than score 3.
  confidence: medium
  uncertainty_note: >-
    The gas charge point and revert behavior around the state writes and excess
    payment are not fully specified.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
