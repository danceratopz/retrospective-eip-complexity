eip:
  number: 7002
  title: Execution layer triggerable withdrawals
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: >-
    At the selected revision, EIP-7002 proposed a new stateful, value-accepting
    precompile through which an execution-layer withdrawal credential could queue
    a validator exit. The execution layer would maintain a persistent FIFO queue
    and an EIP-1559-style dynamic exit fee, append up to 16 queued exits and an
    exits-root commitment to each block, and update the queue and fee state after
    block execution. The consensus-layer portion was only a sketch: exits would be
    carried in the ExecutionPayload and processed with voluntary-exit-like rules
    whose validation failures would not invalidate the block.
