eip:
  number: 2935
  title: Serve historical block hashes from state
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    The proposal writes each preceding block hash into storage at a reserved
    address before transaction processing in every block after the configured
    fork boundary. After a further 256-block delay, it changes BLOCKHASH to
    return stored hashes for prior fork-era blocks while retaining zero outside
    the specified range. The proposal explicitly leaves its fork number, tests,
    and implementation unfinished at the assessment-time revision.
