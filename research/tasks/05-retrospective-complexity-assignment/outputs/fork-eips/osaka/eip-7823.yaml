  title: Set upper bounds for MODEXP
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the selected draft revision, EIP-7823 modified the EIP-198 MODEXP
    precompile by limiting each of its three declared input lengths to 1024
    bytes. An over-limit length was specified to stop the precompile, return an
    error, and consume all gas, while the existing pricing and allowed-input
    computation were otherwise left unchanged. The draft identified the change
    as backwards incompatible, but its compatibility and security discussions
    remained incomplete.
