totals:
  primary_score: 18
  complexity_tier: medium
under_specification:
  present: true
  summary: >-
    Concrete parameter values and activation schedules are intentionally out of
    scope, and the draft does not define parsing/selection and failure behavior
    for missing, incomplete, conflicting, misaligned, or cross-layer-mismatched
    schedules. It also does not say how transition tools or test frameworks
    represent an arbitrary sequence of BPO activations. These gaps chiefly vary
    the size and baseline of schedule-boundary, regression, performance, and
    security testing; they are not counted as separate high-complexity mechanisms.
  affected_criteria:
  - patterns_affecting_pre_existing_tests
  - transition_tool_interface_changes
  - new_test_framework_primitives
  - edge_boundary_conditions
  - performance_risks
  - security_risks
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 13
    maximum: 21
  plausible_tiers:
  - medium
  unresolved_questions:
  - >-
    How must clients handle a missing or incomplete entry for a scheduled BPO
    activation, including omission of only one of the three parameters?
  - >-
    What precisely constitutes a conflict with another fork schedule, and must
    clients reject conflicting configuration or apply a deterministic precedence?
  - >-
    What behavior is required when execution and consensus schedules disagree on
    activation alignment or maximum blob count?
  - >-
    How are multiple consensus-layer BPO_FORK entries uniquely represented and
    selected at and around epoch boundaries?
  - >-
    Which concrete values and activation points define the test matrix for any
    actual BPO fork?
hindsight_control:
  internet_access_attempted: false
  prohibited_source_exposure: false
  exposure_details: []
  contaminated: false
  attestation: >-
    I assessed only the sealed historical EIP revision, pinned assessor-view
