  title: PeerDAS - Peer Data Availability Sampling
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7594 proposed replacing universal blob-data
    download with PeerDAS, a consensus-networking protocol built on EIP-4844.
    It extended blobs into an erasure-coded column matrix, authenticated cells
    against blob KZG commitments, and assigned deterministic column custody to
    nodes. Nodes would discover diverse peers, gossip and request columns,
    sample availability each slot, and reconstruct data from at least half of
    the columns, while the precise fork-choice integration remained unfinished.
