  summary: The central >30,000,000 block-validity predicate is testable as written, but the draft is not
    fully normative about fork activation, whether its broad wording covers every transaction form without
    exception, or whether references to gas usage are exclusively references to the declared gasLimit.
    Its proposed pool error code is only an example. These gaps are material to finalizing the test matrix
    but are localized and do not obscure the primary validity rule.
