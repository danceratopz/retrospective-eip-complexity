  unresolved_questions:
  - What exact fork activation condition makes the new transaction and block rule effective?
  - Does "any single transaction" cover every transaction form carrying a gasLimit, with no protocol-level
    exceptions?
  - Are the abstract's references to maximum gas usage intended solely as checks of the sender-declared
    gasLimit, as the concrete validation clauses state?
  - Is any exact transaction-pool error code normative, or is only rejection required?
