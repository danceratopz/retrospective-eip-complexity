  title: Transaction Gas Limit Cap
  layers:
  - execution
assessment:
  historical_scope_summary: At the information cutoff, this draft proposed a protocol-wide maximum declared
    transaction gasLimit of 30,000,000, independent of the block gas limit. A transaction above the cap
    would be excluded during transaction-pool validation, and a block containing one would be invalid
    before processing. The proposal did not change EVM gas prices or accounting, transaction encoding,
    opcodes, or block fields.
