  title: Precompile for secp256r1 Curve Support
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, this draft introduced P256VERIFY at address 0x100,
    accepting exactly 160 input bytes for secp256r1 ECDSA verification and charging
    a fixed 3450 gas. It specified the curve parameters, encodings, validation
    checks, verification algorithm, fixed success and failure outputs, and uniform
    gas consumption on invalid inputs. It aimed to retain RIP-7212 interface
    compatibility while correcting recovered-point-at-infinity and modular-comparison
    edge cases; it specified no transaction, block, state, Engine API, or opcode
    changes.
