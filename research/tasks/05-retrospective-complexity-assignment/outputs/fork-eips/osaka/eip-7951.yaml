    does not expressly state how the 32-byte message hash becomes the integer used
    in scalar multiplication, and its absolute no-revert wording does not expressly
    carve out insufficient supplied gas. Both gaps are localized and have strong
    intended readings from the adjacent encoding and gas rules.
