eip:
  number: 7939
  title: Count leading zeros (CLZ) opcode
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7939 proposed one new execution-layer opcode,
    CLZ at byte 0x1e, that consumes one 256-bit stack word and returns its count
    of leading zero bits, with zero explicitly returning 256. The opcode is
    stateless, has no data portion or dynamic stack behavior, and has a fixed gas
    cost of 3; the proposal also supplied reference algorithms and representative
    boundary test cases.
