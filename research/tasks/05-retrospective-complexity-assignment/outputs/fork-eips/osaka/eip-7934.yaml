assessment:
  historical_scope_summary: At the historical cutoff, EIP-7934 proposed a protocol-level upper bound of
    10 MiB minus a 512 KiB safety margin on the RLP-encoded execution block. Block builders had to stay
    at or below that bound, while validating nodes had to reject blocks above it and apply the check during
    validation and propagation. The limit was explicitly independent of gas metrics and added no new encoding,
    transaction, header, or EVM feature.
