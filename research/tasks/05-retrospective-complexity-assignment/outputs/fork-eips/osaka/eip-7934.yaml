under_specification:
  present: true
  summary: The draft's prose and pseudocode use inconsistent names for the 10 MiB upper limit and 512
    KiB margin, and GOSSIP_UPPER_LIMIT is not defined in the code fragment. It also does not formally
    define the full Block serialization scope or whether each validation and propagation path measures
    received bytes or a canonical re-encoding. The intended 10 MiB minus 512 KiB, strict greater-than
    rule is nevertheless apparent.
  affected_criteria:
  - block_syncing_changes
  - new_test_framework_primitives
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 7
    maximum: 9
  plausible_tiers:
  - low
  unresolved_questions:
  - Is MAX_RLP_BLOCK_SIZE normatively 10,485,760 minus 524,288 bytes despite the pseudocode's undefined
    GOSSIP_UPPER_LIMIT name?
  - Does block size mean the canonical result of rlp.encode(Block), or the exact received byte sequence,
    and which execution-block components are included in Block?
  - At which validation and propagation entry points must the limit be enforced, and do exact-size test
    construction needs require a reusable test helper?
