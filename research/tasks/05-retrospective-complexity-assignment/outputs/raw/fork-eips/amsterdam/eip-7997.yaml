  title: Deterministic Factory Contract
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7997 proposed an activation-time insertion of
    fixed runtime bytecode at address 0x0B, creating a minimal factory available
    at the same address on adopting EVM chains. The factory interprets calldata
    as a 32-byte salt followed by variable-length initcode, forwards all call
    value to CREATE2, returns the created address on success, and propagates
    failure returndata by reverting. It adds no transaction type, opcode, or
    custom gas schedule; its protocol changes are the predeployed system account
    and the one-time state change that installs it.
