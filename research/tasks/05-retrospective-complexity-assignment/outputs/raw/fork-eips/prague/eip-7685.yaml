eip:
  number: 7685
  title: General purpose execution layer requests
  layers:
  - execution
  - consensus
assessment:
  historical_scope_summary: >-
    At the information cutoff, this draft defined a generic container for
    execution-layer requests intended for consensus-layer processing. It appended
    an ordered list of typed opaque requests to the RLP block body and added a
    32-byte header commitment computed as an indexed Merkle-Patricia trie root.
    Concrete request provenance and validity, intra-type ordering, and
    consensus-layer type extensions were left to request-specific proposals.
