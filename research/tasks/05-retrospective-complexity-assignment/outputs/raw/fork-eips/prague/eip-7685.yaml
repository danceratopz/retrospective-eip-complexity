totals:
  primary_score: 34
  complexity_tier: high
under_specification:
  present: true
  summary: >-
    The draft deliberately defers normative request provenance and validity,
    intra-type ordering, and consensus-layer type extensions to request-specific
    proposals. It also leaves Engine API transport, malformed or unknown request
    handling, size and rate limits, activation semantics, tests, and security
    analysis unstated, preventing a complete generic cross-client baseline.
  affected_criteria:
  - patterns_affecting_pre_existing_tests
  - new_invariant_on_pre_existing_tests
  - transition_tool_interface_changes
  - new_test_framework_primitives
  - edge_boundary_conditions
  - block_syncing_changes
  - engine_api_changes
  - new_fork_activation_mechanism
  - performance_risks
  - security_risks
  - unspecified_behavior_requiring_cross_client_consensus
  - cross_eip_interactions
  plausible_total_range:
    minimum: 22
    maximum: 37
  plausible_tiers:
  - medium
  - high
  unresolved_questions:
  - >-
    What exact request sources are consensus-valid, and how is completeness of the
    body request list validated against execution?
  - >-
    What is the width and valid range of request_type, and how are empty, malformed,
    duplicate-type, or unknown-type request items handled?
  - >-
    What intra-type ordering is required for each request type, and which proposal
    owns that rule?
  - >-
    Which Engine API fields or endpoints transport requests and their commitment,
    and which consensus-layer types carry them?
  - >-
    What request count, byte-size, or rate limits apply, and how do those limits
    interact with block validity and performance?
  - >-
    What activation, empty-list, and pre-fork compatibility rules govern the new
    body and header fields?
