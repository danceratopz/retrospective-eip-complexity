notable_ambiguities:
- >-
  The request_type representation is not given an explicit width or registry, even
  though examples use single-byte values and cross-type ordering is normative.
- >-
  The text says requests_root commits to the body list but does not separately
  spell out malformed-list, unknown-type, mismatch, or empty-list validation.
