eip:
  number: 7918
  title: Blob base fee bounded by execution cost
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, this Draft EIP changed EIP-4844's
    parent-derived `calc_excess_blob_gas()` update. When the parent blob-gas
    total is at least the target and the execution cost represented by
    `TX_BASE_COST` exceeds the target blobs' blob fee, the update retains the
    full parent total instead of subtracting the blob-gas target. The stated
    goal was to keep the blob fee auction responsive rather than allowing the
    blob base fee to collapse while execution cost carries the price signal.
