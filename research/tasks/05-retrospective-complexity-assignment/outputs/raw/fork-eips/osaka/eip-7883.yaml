  title: ModExp Gas Cost Increase
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, this draft changed only the gas-pricing algorithm
    for the existing ModExp precompile, building on EIP-2565. It raised the
    minimum charge from 200 to 500, doubled the exponent-length contribution
    above 32 bytes, and doubled multiplication complexity when the base or
    modulus exceeds 32 bytes. The interface and arithmetic algorithms remained
    unchanged, and existing vectors were to be reused with updated gas values.
