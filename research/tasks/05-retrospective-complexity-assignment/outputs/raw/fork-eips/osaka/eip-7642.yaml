notable_ambiguities:
- >-
  The manifest and output template title EIP-7642 as "eth/69 - history expiry
  and simpler receipts," while the sealed EIP front matter titles it "eth/69 -
  Drop pre-merge fields." The EIP number and sealed blob identity match, so the
  assessment follows the contents of that blob while preserving populated
  provenance.
- >-
  The manifest labels the layer as execution, whereas the sealed EIP categorizes
  itself as Networking and specifies peer wire messages; the rubric is applied
  to that historical networking scope without changing the populated layer.
