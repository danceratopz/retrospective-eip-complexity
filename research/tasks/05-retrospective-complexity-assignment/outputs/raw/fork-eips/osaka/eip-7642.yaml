eip:
  number: 7642
  title: eth/69 - history expiry and simpler receipts
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    EIP-7642 introduces eth/69 by removing the obsolete total-difficulty field
    from the Status message and omitting the bloom field from both legacy and
    typed receipts sent in the Receipts message. Receiving peers reconstruct a
    receipt bloom from its logs. The change is versioned so older peers can
    continue using eth/68, and the proposal expressly makes no EVM consensus
    change and requires no hard fork.
