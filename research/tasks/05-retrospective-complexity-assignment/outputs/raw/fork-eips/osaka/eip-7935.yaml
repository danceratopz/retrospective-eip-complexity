eip:
  number: 7935
  title: Set default gas limit to 60M
  layers:
  - execution
assessment:
  historical_scope_summary: >-
    At the information cutoff, EIP-7935 was a draft informational proposal asking
    execution-layer clients to raise the gas limit produced by their default
    configurations for the Fusaka release. It introduced no new protocol feature
    or gas-accounting rule, but called for full-block, multi-client devnet testing
    and incremental increases to establish that the higher operational limit was
    safe. The normative target was still written as XX0M, while the security
    section discussed testing 60M.
