    locator: Motivation, lines 17-19; Security Considerations, lines 33-35
    summary: >-
      The authors expect client bugs at higher limits and require devnets covering
      all EL/CL client combinations, synthetic full blocks, node and network health
      monitoring, iterative fixes, and incremental increases.
  rationale: >-
    The performance effect cannot be validated fully in isolation: it depends on
    sustained full blocks, heterogeneous clients, and network behavior, with an
    explicitly anticipated need to find and fix client bugs. This substantially
    affects existing execution and propagation performance and matches score 3.
  confidence: medium
  uncertainty_note: >-
