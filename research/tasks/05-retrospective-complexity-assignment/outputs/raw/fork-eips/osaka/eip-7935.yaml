  - unspecified_behavior_requiring_cross_client_consensus
  - cross_eip_interactions
  plausible_total_range:
    minimum: 7
    maximum: 11
  plausible_tiers:
  - low
  unresolved_questions:
  - >-
    Is the required default gas limit 60M, or another value represented by XX0M?
  - >-
    Which generated default configurations must change, and precisely when does
    the new default take effect relative to the fork release?
  - >-
    What workload duration, health thresholds, and pass/fail criteria establish
    that a candidate gas limit is safe, and what increments are required?
  - >-
    What is the numeric identifier of the proposed 30M transaction-gas-limit EIP,
    and what coordination beyond scheduling is required?
