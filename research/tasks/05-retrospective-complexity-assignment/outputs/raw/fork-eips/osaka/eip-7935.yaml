notable_ambiguities:
- >-
  The manifest identifies the assignment as "Set default gas limit to 60M," but
  the sealed EIP's title and specification retain XX0M; only its security section
  names 60M.
- >-
  The backwards-compatibility section requires coordination with another EIP but
  gives no identifier that can be entered as a bare integer.
- >-
  The proposal ties a client-default update to a hard-fork release without
  defining an activation-block consensus transition.
overall_confidence: medium
