      and node health, repeated patch-and-retest cycles, incremental increases,
      and worst-case block size relative to the CL gossip limit.
  rationale: >-
    A substantially higher default block capacity stresses multiple critical
    components across execution, propagation, and consensus-client networking.
    The prescribed system-wide adversarial and health testing indicates security
    assumptions cannot be validated as a self-contained mechanism, matching
    score 3.
  confidence: medium
  uncertainty_note: >-
