  summary: >-
    Material under-specification is present. The normative target remains XX0M
    even though 60M is discussed for safety testing; the affected default
    configurations and release timing are not enumerated; objective safety gates
    and the incremental increase procedure are not defined; and the interacting
    transaction-limit EIP is unnamed.
