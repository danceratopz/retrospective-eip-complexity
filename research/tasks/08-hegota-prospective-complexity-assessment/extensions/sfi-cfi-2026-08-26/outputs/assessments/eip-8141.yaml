criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Gas Accounting
    summary: >-
      Defines a new intrinsic-cost formula, explicit per-frame execution and
      state pools, transaction settlement, calldata-floor handling, and
      separate block-accounting dimensions.
  - source: eip.md
    locator: Specification > Gas Accounting > Transaction settlement
    summary: >-
      Composes unused frame gas, the existing storage refund counter, the
      calldata floor, and payer settlement into new transaction-level formulas.
  rationale: >-
    The proposal introduces a broad gas-accounting mechanism and changes how
    existing refund, calldata-floor, warm/cold, and block-accounting mechanisms
    apply to the new transaction, requiring regression coverage of those
    existing mechanisms.
  confidence: high
  uncertainty_note: >-
    The scope is clear, although some fee-settlement details are separately
    recorded as under-specified.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Frame Transaction > Behavior
    summary: >-
      Requires the resolved target's warm/cold access charge before the balance
      check and dispatch, and places new-account state charging after the
      balance check but before frame code executes.
  - source: eip.md
    locator: Specification > APPROVE Instruction (0xaa) > Behavior
    summary: >-
      Places a conditional sender-creation state-gas charge immediately before
      nonce increment and approval effects.
  rationale: >-
    New frame-entry and APPROVE state-accessing operations have
    consensus-critical access and charge positions that must be tested, but the
    proposal does not reorder an existing class of state-accessing opcodes.
  confidence: high
  uncertainty_note: >-
    EIP-8037 opcode charge points are explicitly retained; the score is for the
    new frame-level and APPROVE ordering boundaries.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Gas Accounting > Blob handling
    summary: >-
      Makes blobs optional for frame transactions, makes the dynamically chosen
      payer the blob-fee payer, applies the blob base fee directly, and counts
      frame-transaction blobs against existing fork limits.
  - source: supporting/eip-4844.md
    locator: Specification > Gas accounting
    summary: >-
      Defines the pre-existing independent blob-gas and sender-paid blob-fee
      mechanism that EIP-8141 extends to its new envelope.
  rationale: >-
    A new blob-capable transaction and payer rule are introduced without
    changing the existing blob transaction's mechanism, so new tests are needed
    while pre-existing blob behavior remains intact.
  confidence: high
  uncertainty_note: >-
    The general blob path is explicit; broader fee-settlement omissions are
    tracked under under-specification.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Gas Accounting > Frame gas pools
    summary: >-
      Replaces the EIP-8037 reservoir inside frame transactions with independent
      per-frame execution and state pools that cannot borrow from one another.
  - source: eip.md
    locator: Specification > Gas Accounting > State-gas attribution and refills
    summary: >-
      Introduces frame ownership records, cross-frame receipt reductions,
      frame-local refill rules, and journaling across call, frame, and atomic
      batch rollback boundaries.
  rationale: >-
    This is a new state-gas charging and attribution mechanism, including a
    deliberate change to the execution/state spill relationship and extensive
    interactions with existing state-gas tests.
  confidence: high
  uncertainty_note: >-
    No uncertainty affects the anchor level; individual omitted settlement
    details are recorded separately.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Gas Accounting > Transaction settlement
    summary: >-
      Retains the EIP-3529 transaction-scoped storage refund counter and
      distinguishes state-gas refills, which directly reverse state charges,
      from capped EVM refunds.
  rationale: >-
    No new EVM refund mechanism is introduced; the complex state-gas refill and
    attribution behavior is scored under state gas accounting rather than
    duplicated here.
  confidence: high
  uncertainty_note: >-
    Unused-budget repayment and state-gas refills are not treated as new EVM
    gas-refund mechanisms under this anchor.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 1
  evidence:
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      Changes ORIGIN only in frame transactions and requires new two-dimensional
      estimation behavior, while leaving ordinary transaction execution outside
      the new envelope unchanged.
  - source: eip.md
    locator: Specification > Introspection
    summary: >-
      Assigns formerly unavailable instruction bytes and specifies exceptional
      halts for those instructions outside frame transactions.
  rationale: >-
    A minor subset of existing invalid-instruction, generic transaction,
    receipt, and fork-transition tests must be adjusted; most existing tests do
    not change unless exercised through the new transaction type.
  confidence: medium
  uncertainty_note: >-
    No packaged test inventory is available, so the affected subset is inferred
    from the protocol deltas rather than measured.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Frame Transaction > Receipt Encoding
    summary: >-
      The new payer and per-frame receipt values exist only for frame
      transactions rather than becoming an output of every transaction or test.
  rationale: >-
    The proposal does not require tests unrelated to frame transactions to add
    a new universal assertion.
  confidence: high
  uncertainty_note: >-
    Activation-state tests are specific to this EIP and therefore do not
    constitute a new invariant on unrelated pre-existing tests.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Frame Transaction > Payload Encoding
    summary: >-
      Adds multiple nested transaction inputs for frames, signatures, fees,
      execution/state limits, and optional blob hashes.
  - source: eip.md
    locator: Specification > Frame Transaction > Receipt Encoding
    summary: >-
      Adds a payer plus a variable list of per-frame status, two-dimensional gas
      usage, and logs, including later mutation of earlier state-gas usage.
  rationale: >-
    Transition tooling needs multiple new input and output fields together with
    a new multi-frame execution/result mechanism, satisfying the highest
    ordinary anchor.
  confidence: medium
  uncertainty_note: >-
    The EIP does not specify a concrete transition-tool mapping, so exact field
    placement is an implementation question recorded under under-specification.
  exceptional_score_justification: null
- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Frame Transaction > Receipt Encoding
    summary: >-
      Tests must express and inspect ordered per-frame receipts whose state-gas
      values can be changed by later frames.
  - source: eip.md
    locator: Specification > Frame Transaction > Behavior
    summary: >-
      Tests must construct frame sequences, approval context, skipped frames,
      and atomic-group rollback outcomes not representable as ordinary single
      top-level calls.
  rationale: >-
    Reusable transaction builders and per-frame receipt/rollback expectation
    primitives are required within this EIP's suite, but the package does not
    establish adoption by other EIP suites.
  confidence: medium
  uncertainty_note: >-
    The package contains no test-framework design, so the exact primitive split
    is not specified.
  exceptional_score_justification: null
- id: cryptography
  label: Cryptography
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Transaction Signatures
    summary: >-
      Introduces protocol-handled SECP256K1 and P256 signature schemes alongside
      structurally checked ARBITRARY witnesses, each with distinct encodings and
      costs.
  - source: eip.md
    locator: Specification > Signature Validation
    summary: >-
      Specifies canonical scalar bounds, low-s rules, signer recovery or public
      key derivation, and P256 proof verification before frame execution.
  rationale: >-
    Multiple well-known cryptographic verification mechanisms are added to
    transaction validity; no novel cryptosystem is defined by the package.
  confidence: medium
  uncertainty_note: >-
    The P256VERIFY helper is referenced but not defined or linked to a numbered
    EIP in the package.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Frame Transaction > Constraints
    summary: >-
      Defines numerous numeric, length, count, mode/flag, target, batch, blob,
      signature, and aggregate-gas boundaries, including a 64-frame maximum.
  - source: eip.md
    locator: Specification > Gas Accounting > State-gas attribution and refills
    summary: >-
      Requires outcomes across success, revert, exceptional halt, later refill,
      call rollback, frame rollback, and atomic-batch rollback.
  rationale: >-
    Multiple boundary-prone mechanisms combine multiplicatively, especially
    frame ordering, cold/warm state, delegated/default/precompile dispatch, two
    gas pools, approvals, and nested rollback modes; this requires an elevated
    test matrix.
  confidence: high
  uncertainty_note: >-
    Some unspecified cases may add vectors, but the documented cases already
    satisfy score 3.
  exceptional_score_justification: null
- id: block_syncing_changes
  label: Block syncing changes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Frame Transaction > Payload Encoding
    summary: >-
      Introduces a deeply nested RLP transaction payload with variable frame and
      signature lists.
  - source: eip.md
    locator: Specification > Frame Transaction > Receipt Encoding
    summary: >-
      Introduces a distinct nested receipt payload with payer and per-frame
      status, gas, and logs.
  - source: eip.md
    locator: Specification > Networking
    summary: >-
      Requires sync/network paths to distinguish plain and blob-wrapped frame
      transactions and to encode the new receipt form.
  rationale: >-
    Syncing clients face multiple RLP validation mechanisms, including complex
    transaction and receipt payloads; at least one is complex.
  confidence: high
  uncertainty_note: >-
    The score concerns execution-client block and receipt processing, not the
    consensus-layer sidecar protocol.
  exceptional_score_justification: null
- id: engine_api_changes
  label: Engine API changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Networking
    summary: >-
      Specifies execution-network Receipts, PooledTransactions, and BlockBodies
      behavior but no Engine API field or endpoint.
  rationale: >-
    The frame transaction is carried within existing payload transaction bytes;
    the EIP introduces no Engine API fields, objects, or methods.
  confidence: high
  uncertainty_note: >-
    EIP-7843 Engine API changes in a supporting document belong to that EIP and
    are not assigned to EIP-8141.
  exceptional_score_justification: null
- id: added_system_contracts
  label: Added system contracts
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Expiry Verifier Frame
    summary: >-
      Requires clients to install fixed runtime code at EXPIRY_VERIFIER on
      activation; the code only checks calldata against block timestamp and has
      no persistent writes or system action.
  rationale: >-
    One non-stateful system contract is added and it triggers no new consensus
    request or other system action.
  confidence: high
  uncertainty_note: >-
    How installation interacts with pre-existing state at the address is
    separately under-specified, but the contract's normal behavior is stateless.
  exceptional_score_justification: null
- id: modified_system_contracts
  label: Modified system contracts
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Expiry Verifier Frame
    summary: >-
      Defines a newly installed verifier rather than changing the code or state
      of any pre-existing system contract.
  rationale: >-
    No pre-existing system contract is directly or indirectly modified by the
    specified frame-transaction behavior.
  confidence: high
  uncertainty_note: >-
    Ordinary ability to call an existing contract from a frame is not itself a
    modification of that contract.
  exceptional_score_justification: null
- id: added_opcodes
  label: Added opcodes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > APPROVE Instruction (0xaa)
    summary: >-
      Adds a three-operand instruction that exits a call frame, returns memory,
      and conditionally updates approval, payer, nonce, balance, and state gas.
  - source: eip.md
    locator: Specification > Introspection
    summary: >-
      Adds TXPARAM, FRAMEDATALOAD, FRAMEDATACOPY, FRAMEPARAM, SIGPARAM, and
      SIGDATACOPY, including dynamically metered memory-copy instructions.
  rationale: >-
    Seven instructions are introduced and several are complex due to dynamic
    data, memory, stack, state, or transaction-context behavior.
  confidence: high
  uncertainty_note: >-
    No uncertainty affects the count or complexity classification.
  exceptional_score_justification: null
- id: modified_opcodes
  label: Modified opcodes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Frame Transaction > Behavior
    summary: >-
      Changes ORIGIN in every call depth of a frame transaction to return the
      frame caller rather than the traditional transaction origin.
  - source: eip.md
    locator: Specification > Gas Accounting > Blob handling
    summary: >-
      Extends existing BLOBHASH behavior to return the frame transaction's blob
      hashes in every frame.
  rationale: >-
    At least ORIGIN has a non-gas behavioral modification for the new
    transaction context, which mechanically selects score 3.
  confidence: high
  uncertainty_note: >-
    The score does not duplicate gas-only changes, which are handled in the gas
    anchors.
  exceptional_score_justification: null
- id: added_precompiles
  label: Added precompiles
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Signature Validation
    summary: >-
      Uses ecrecover and P256VERIFY as existing helpers and explicitly discusses
      the related precompiles; it does not allocate a new precompile address.
  rationale: >-
    No precompile is added.
  confidence: high
  uncertainty_note: >-
    Protocol-level invocation of an existing verification primitive is scored
    under cryptography, not as a new precompile.
  exceptional_score_justification: null
- id: modified_precompiles
  label: Modified precompiles
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Signature Validation
    summary: >-
      States only that out-of-EVM signature checks must not add their related
      precompiles to the block-level access list; no precompile logic or gas
      schedule is changed.
  rationale: >-
    Existing precompiles are invoked without modification.
  confidence: high
  uncertainty_note: >-
    The access-list side effect is a transaction-processing rule rather than a
    change to precompile behavior.
  exceptional_score_justification: null
- id: encoding_changes_rlp_ssz
  label: Encoding changes (RLP/SSZ)
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Frame Transaction > Payload Encoding
    summary: >-
      Defines a new transaction-level RLP layout containing nested frames,
      limits, signatures, fees, and blob hashes.
  - source: eip.md
    locator: Specification > Frame Transaction > Receipt Encoding
    summary: >-
      Defines a new receipt-level encoding with payer and nested frame receipts.
  rationale: >-
    Transaction and receipt encoding changes mechanically select score 3.
  confidence: high
  uncertainty_note: >-
    This score concerns the existence of the encoding change; individual field
    representation ambiguities are recorded separately.
  exceptional_score_justification: null
- id: new_transaction_types
  label: New transaction types
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Frame Transaction
    summary: >-
      Introduces an EIP-2718 transaction with FRAME_TX_TYPE 0x06.
  rationale: >-
    A new transaction type mechanically selects score 3.
  confidence: high
  uncertainty_note: >-
    No uncertainty affects this binary anchor.
  exceptional_score_justification: null
- id: new_or_modified_transaction_validity_mechanisms
  label: New or modified transaction validity mechanisms
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Frame Transaction > Constraints
    summary: >-
      Adds extensive structural and aggregate validity rules for the outer
      payload, signatures, frames, modes, flags, blobs, and gas limits.
  - source: eip.md
    locator: Specification > Frame Transaction > Behavior
    summary: >-
      Makes nonce, signature validation, VERIFY success, sender approval, payer
      approval, and post-execution payer presence transaction-validity gates.
  rationale: >-
    The new validity model is execution-dependent and broad enough to require
    extensive transaction-test and validation-infrastructure work.
  confidence: high
  uncertainty_note: >-
    Several missing fee and helper details add uncertainty but cannot lower the
    documented mechanism below score 3.
  exceptional_score_justification: null
- id: new_block_header_fields
  label: New block / header fields
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Gas Accounting > Block-level gas accounting
    summary: >-
      Uses the block header gas_used, block gas limit, and EIP-8037 accounting
      without defining an additional block or header field.
  rationale: >-
    No new block or header field is introduced by EIP-8141.
  confidence: high
  uncertainty_note: >-
    Internal block-output counters are not header fields.
  exceptional_score_justification: null
- id: new_fork_activation_mechanism
  label: New fork activation mechanism
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Expiry Verifier Frame
    summary: >-
      Requires clients to install prescribed runtime bytecode at address 0x8141
      at activation.
  rationale: >-
    Activation modifies state by installing contract code, mechanically
    selecting score 3.
  confidence: high
  uncertainty_note: >-
    Collision and account-field handling at the destination are not specified,
    but the required state modification itself is explicit.
  exceptional_score_justification: null
- id: performance_risks
  label: Performance risks
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Mempool
    summary: >-
      Requires signature validation, validation-prefix simulation, dependency
      tracking, payer reservation, replacement accounting, and selective
      re-simulation for public propagation.
  - source: eip.md
    locator: Security Considerations > Transaction Propagation
    summary: >-
      Identifies denial-of-service vectors from arbitrary EVM validation,
      shared-state invalidation, and explicit sender state-read amplification.
  rationale: >-
    Performance cannot be validated in isolation because transaction admission,
    arbitrary validation execution, state dependency tracking, multi-frame
    journaling, payer exposure, and blob networking interact with core client
    paths and existing benchmarks.
  confidence: high
  uncertainty_note: >-
    The package provides no measurements, but it explicitly establishes the
    coupled mechanisms and DoS workload requiring validation.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 3
  evidence:
  - source: eip.md
    locator: Security Considerations
    summary: >-
      Documents propagation DoS, deploy front-running, sender-read amplification,
      signature malleability, cross-frame visibility, state-gas isolation, and
      over-broad execution approval hazards.
  - source: eip.md
    locator: Specification > APPROVE Instruction (0xaa) > Behavior
    summary: >-
      Moves authentication, sender authority, nonce consumption, fee escrow, and
      payer selection into contract-driven frame execution.
  rationale: >-
    The proposal substantially alters security assumptions across transaction
    authentication, account authority, fee payment, mempool admission,
    networking, execution, and rollback, requiring extensive review and fuzzing.
  confidence: high
  uncertainty_note: >-
