assessment:
  snapshot_scope_summary: >-
    Execution-layer-only assessment of the draft FOCIL proposal at the sealed
    snapshot. The scored surface is the post-payload inclusion-list satisfaction
    check, its payload-construction implications, and its Engine API inputs,
    endpoint, and status. Committee selection, beacon-state containers,
    consensus fork choice, validator timing, CL gossip/RPC, and BLS signatures
    are cross-layer context and are not scored as execution-layer complexity.
