- id: performance_risks
  label: Performance risks
  score: 3
  evidence:
  - source: eip.md
    locator: Security Considerations > Payload Construction
    summary: >-
      Naive payload construction can require O(n^2) validity checks; the proposed
      mitigation tracks nonce and balance changes of involved EOAs throughout
      payload construction, including AA-induced balance changes.
  - source: eip.md
    locator: Roles And Participants > Builder
    summary: >-
      The builder must update its payload with collected IL transactions inside
      a time-sensitive slot workflow, and the exact timing is deferred pending
      tests and benchmarks.
  rationale: >-
    The mechanism interacts continuously with existing payload construction and
    state changes, cannot be validated solely as an isolated fixed-cost check,
    and has an explicit quadratic naive path plus latency sensitivity.
  confidence: high
  uncertainty_note: >-
    The optimized algorithm, maximum effective transaction count, and timing
    budget are not normatively fixed in the package.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Execution Layer; Specification > Engine API Changes
    summary: >-
      Post-state transaction classification produces a new Engine API status
      that the CL uses to decide whether the otherwise-valid block satisfies ILs.
  - source: eip.md
    locator: Security Considerations > Consensus Liveness; Security Considerations > Payload Construction
    summary: >-
      Canonical block production depends on builders receiving and satisfying
      ILs in time, while correct construction must account for interdependent
      nonce and balance changes among listed transactions.
  rationale: >-
    On the EL surface, correctness spans critical payload execution,
    state-dependent hypothetical validity, builder construction, and the
    Engine-API result consumed by fork choice; errors can impair liveness or the
    intended censorship-resistance guarantee and warrant extensive review and
    fuzzing.
  confidence: high
  uncertainty_note: >-
    Consensus gossip, committee behavior, and attester logic are excluded; the
    score rests on the EL classification and construction boundary alone.
  exceptional_score_justification: null
- id: unspecified_behavior_requiring_cross_client_consensus
  label: Unspecified behavior requiring cross-client consensus
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Execution Layer, steps 1-3
    summary: >-
      The consensus-relevant INCLUSION_LIST_UNSATISFIED decision is stated in
      terms of T.gas, T.origin, presence, nonce, and balance without fully
      defining transaction identity, ordering/duplication handling, or exact
      validity and affordability calculations across transaction forms.
  - source: eip.md
    locator: Specification > Engine API Changes
    summary: >-
      The endpoint changes are listed without normative request/response types,
      IL aggregation rules, or versioned signatures for the modified methods.
  rationale: >-
    A newly observable cross-layer status directly controls attestation, while
    constructible cases affecting that status lack a unique EL answer. Clients
    must agree on these details before authoritative vectors can be baselined.
  confidence: high
  uncertainty_note: >-
    This score reflects the sealed Draft text only; prohibited implementation,
    devnet, discussion, and later-revision information was not consulted.
  exceptional_score_justification: null
- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 1
  evidence:
  - source: eip.md
    locator: Rationale > Core Properties > Same-slot
    summary: >-
      FOCIL explicitly contrasts its same-slot constraints with the forward
      inclusion-list design of EIP-7547 and calls the removed one-slot delay an
      improvement.
  - source: supporting/eip-7547.md
    locator: Specification > Execution layer
    summary: >-
      EIP-7547 defines overlapping inclusion-list retrieval, forkchoiceUpdated,
      newPayload, and EL validation surfaces, but with summary and exclusion
      objects rather than EIP-7805's committee IL input.
  - source: eip.md
    locator: Security Considerations > Payload Construction
    summary: >-
      The optimization must notice EOA balance changes caused by Account
      Abstraction transactions, an interaction named without an EIP number.
  rationale: >-
    The identified EIP-7547 relationship is a limited alternative-design
    interaction requiring compatibility and vector consideration, not a stated
    dependency. The package also identifies a bounded AA behavior interaction
    without assigning it an EIP number.
  confidence: high
  uncertainty_note: >-
    The proposal does not state coexistence, replacement, or dependency
    semantics for EIP-7547, so the interaction is kept at the limited score.
  exceptional_score_justification: null
  interacting_eips:
  - 7547
  unidentified_interactions:
  - Account Abstraction transactions that change tracked EOA balances during payload construction
totals:
  primary_score: 20
  complexity_tier: medium
under_specification:
  present: true
  summary: >-
    Material EL details are unresolved: the exact hypothetical transaction
    validity/affordability predicate, transaction identity and list
    normalization, and normative Engine API schemas are not defined. The builder
    timing and optimization are also deferred. These gaps chiefly affect the
    new side-input/result tooling, boundary matrix, performance/security
    validation, and cross-client baselining; they are not reused to inflate
    unrelated gas, opcode, encoding, or transaction-type anchors.
  affected_criteria:
  - transition_tool_interface_changes
  - new_test_framework_primitives
  - edge_boundary_conditions
  - performance_risks
  - security_risks
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 14
    maximum: 23
  plausible_tiers:
  - medium
  - high
  unresolved_questions:
  - >-
    What exact transaction-validity and balance-affordability rules, including
    fee components and transaction forms, define validly includable at post-state S?
  - >-
    How are transaction presence, duplicates, ordering, and aggregation across
    multiple committee ILs normalized before the EL check?
  - >-
    What are the normative request and response schemas and versioned signatures
    for getInclusionList, forkchoiceUpdated, and newPayload?
  - >-
    Is gas_left tested independently for each missing transaction, and what
    exact transaction gas value is denoted by T.gas?
  - >-
    Which payload-construction algorithm and timing budget are normative rather
    than implementation guidance?
notable_ambiguities:
- >-
  The text says an unsatisfied block is valid while requiring the EL to return a
  special status to the CL, leaving the exact Engine API validity/status model
  unspecified.
- >-
  The phrase nonce and balance checks does not fully specify the hypothetical
  append-validity predicate for all existing transaction forms.
- >-
  Consensus-layer SignedInclusionList containers and gossip rules provide
  context but are intentionally excluded from this execution-only score.
