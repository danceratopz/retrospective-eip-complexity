  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Engine API Changes
    summary: >-
      Existing forkchoiceUpdated and newPayload flows are modified to carry IL
      data, and newPayload can return INCLUSION_LIST_UNSATISFIED.
  rationale: >-
    A minor, focused subset of pre-existing Engine API and payload-processing
    tests must be adapted for the added IL input and response path; the EIP does
    not rework broad EVM or transaction-test categories.
  confidence: medium
  uncertainty_note: >-
    Exact endpoint schemas and versioning are absent, so the precise count of
    pre-existing API vectors needing edits is not determined.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Execution Layer; Specification > Engine API Changes
    summary: >-
      The new status is conditional on supplied IL transactions and the EIP
      states that an unsatisfied block remains valid; it does not prescribe a
      new assertion for unrelated tests.
  rationale: >-
    Tests not exercising FOCIL do not gain a specified additional invariant or
    universally required assertion.
  confidence: medium
  uncertainty_note: >-
    The missing concrete API schema leaves test plumbing open, but no new
    unrelated-test assertion is stated.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Execution Layer; Specification > Engine API Changes
    summary: >-
      Evaluating the new post-state rule requires IL transactions that are not
      block contents, and produces a distinct INCLUSION_LIST_UNSATISFIED outcome.
  rationale: >-
    Transition testing requires a new side-input mechanism for the IL set and a
    distinguishable satisfaction result, which is more than a single ordinary
    field even though the exact tool schema is not specified.
  confidence: medium
  uncertainty_note: >-
    The EIP specifies Engine API behavior, not the transition-tool mapping, so
    the exact number and shape of tool fields remain open.
  exceptional_score_justification: null
- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Engine API Changes
    summary: >-
      Tests must provide IL transactions to modified calls, exercise a new
      getInclusionList endpoint, and recognize INCLUSION_LIST_UNSATISFIED.
  rationale: >-
    Existing endpoint and result helpers need minor extension for the new IL
    input and status, but the package does not establish a reusable permanent
