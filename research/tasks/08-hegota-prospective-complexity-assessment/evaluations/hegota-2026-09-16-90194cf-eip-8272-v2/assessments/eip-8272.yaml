  - source: eip.md
    locator: Specification > Recent root verifier frame
    summary: >-
      Target access and storage reads follow normal warm and cold access rules.
  rationale: >-
    No opcode's internal state-access or gas-charge order changes. The
    equivalence rule for an optional optimized evaluation preserves, rather than
