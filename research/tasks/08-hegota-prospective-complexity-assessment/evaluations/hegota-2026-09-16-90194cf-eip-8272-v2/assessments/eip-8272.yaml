criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Recent root verifier frame
    summary: >-
      The frame consumes ordinary EVM gas, uses normal warm/cold access and
      EIP-8141 data pricing, and adds no special intrinsic gas, warming rule, or
      block-gas exemption.
  rationale: >-
    The proposal creates additional ordinary EVM work but does not introduce or
    update an EVM gas-accounting rule.
  confidence: high
  uncertainty_note: >-
    RECENT_ROOT_CODE is TBD, so exact gas-use vectors cannot yet be fixed, but
    the specified accounting mechanism remains the existing one.
  exceptional_score_justification: null
