- id: performance_risks
  label: Performance risks
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Public mempool handling
    summary: >-
      Nodes must index storage and expiry dependencies, update them atomically on
      replacement, and selectively recheck transactions after slot changes,
      reorgs, storage changes, or code and activation changes.
  - source: eip.md
    locator: Security Considerations
    summary: >-
      Reorganizations or synchronized expiry may evict many transactions sharing
      a popular root, while dependency indexing is intended to avoid scanning
      unrelated transactions.
  - source: eip.md
    locator: Specification > Entry and storage keys
    summary: >-
      Persistent storage can grow by up to 8192 keys for each written source_id.
  rationale: >-
    Although one validation call is bounded to sixteen tuples, end-to-end
    performance couples transaction-pool indexing, replacement, expiry, chain
    reorganization, direct-EVM equivalence, and unbounded numbers of root
    sources; that interaction cannot be fully benchmarked in isolation.
  confidence: medium
  uncertainty_note: >-
    The package supplies bounds and mitigations but no workload or benchmark
    data, and canonical bytecode needed for exact per-frame measurements is TBD.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Public mempool handling
    summary: >-
      The proposal makes a narrow exception to shared-storage-read bans and
      requires exact code matching, bounded execution, dependency recording,
      atomic replacement, reorg-aware rechecks, and eviction.
  - source: eip.md
    locator: Security Considerations
    summary: >-
      The text identifies signature-binding requirements, last-write semantics,
      publication risk, cross-chain domain binding, persistent state growth, and
      mass eviction after reorg or expiry.
  rationale: >-
    The mechanism touches critical state, EVM execution, account validation, and
    public transaction-pool invariants. Incorrect dependency tracking, optimized
    evaluation, reorg handling, or application binding can affect nodes and
    users, warranting extensive targeted and cross-component review and fuzzing.
  confidence: high
  uncertainty_note: >-
    The specified mitigations reduce exposure but do not eliminate the
    multi-component security review surface.
  exceptional_score_justification: null
- id: unspecified_behavior_requiring_cross_client_consensus
  label: Unspecified behavior requiring cross-client consensus
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Constants
    summary: RECENT_ROOT_CODE is explicitly listed as TBD.
  - source: eip.md
    locator: Specification > Activation; Specification > Public mempool handling
