assessment:
  snapshot_scope_summary: >-
    Execution-layer assessment of draft EIP-8272 at the sealed Hegotá snapshot.
    The proposal installs one stateful recent-root contract, defines canonical
    recent-root VERIFY frames for EIP-8141 frame transactions, extends public
    mempool admission and revalidation policy, and performs a first-active-block
    state transition. It reuses EIP-7843 slotNumber/SLOTNUM and existing EVM gas,
    state access, frame encoding, and transaction semantics.
