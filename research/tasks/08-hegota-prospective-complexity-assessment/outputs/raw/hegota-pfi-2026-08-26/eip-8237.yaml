assessment:
  snapshot_scope_summary: >-
    Execution-layer-only assessment of draft EIP-8237 at the sealed Hegota PFI
    snapshot. The scored surface adds a consensus-critical partial_header_hash to
    ExecutionPayload and the execution block header, requires independent EL
    computation and validation of that value, and requires a new Engine API lookup
    method; consensus-layer range-sync behavior is treated only as boundary context.
