caveats:
- Scores cover execution-layer and execution-client-networking surfaces only; cross-layer consensus work
  is not scored.
- EIP-8163 and EIP-8173 were explicitly excluded by the project owner because they introduce no current
  L1 protocol or client behavior change.
- Proposal splitting and cross-EIP interactions can overlap complexity, so the score sum is not an additive
  estimate of implementation effort.
- The PFI snapshot may change after the frozen information cutoff; later scope churn is outside this study.
- No consensus-layer rubric was applied, so this is not a total-complexity estimate for all Hegota protocol
  work.
