criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > SSTORE refund rules
    summary: >-
      STORAGE_CLEAR_REFUND and the two SSTORE refund rules using it are removed,
      while the SSTORE charging rules remain unchanged.
  - source: eip.md
    locator: Specification > Removal of the refund cap
    summary: >-
      End-of-transaction gas settlement replaces the capped refund with direct
      subtraction of the refund counter.
  rationale: >-
    The proposal updates the existing EVM refund-accounting and transaction
    settlement rules; it does not introduce a new gas-accounting mechanism.
  confidence: high
  uncertainty_note: The affected existing mechanisms and their replacement formulas are explicit.
  exceptional_score_justification: null
