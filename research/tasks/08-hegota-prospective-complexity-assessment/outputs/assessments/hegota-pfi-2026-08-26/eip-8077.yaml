    locator: Rationale > Overhead
    summary: The proposal calls the added B_20 and variable-size field overhead significant and leaves quantitative details TBD.
  - source: eip.md
    locator: Rationale > Alternatives
    summary: Bandwidth depends on peer fanout, announcement redundancy, push-versus-pull selection, and optional detailed-announcement strategies.
  - source: eip.md
    locator: Specification > Changes to message handling
    summary: Implementations may revisit eager-push versus announcement selection because announcements become larger.
  rationale: >-
    End-to-end benefit and cost cannot be fully benchmarked in isolation: every detailed announcement is larger,
