criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Behavior, steps 1 and 7; Parameters
    summary: >-
      SETDELEGATE deducts EMPTY_ACCOUNT_COST, conditionally adds
      EMPTY_ACCOUNT_COST minus BASE_COST to the refund counter, and defines both
      constants numerically.
  rationale: >-
    The opcode introduces its own gas-accounting rule, including a
    state-dependent refund, while leaving the gas rules of existing opcodes
    unchanged. This is a new mechanism confined to the new operation.
  confidence: high
  uncertainty_note: >-
    The treatment of repeated writes to an account that begins absent is not
    fully determined by the phrase "already exists in the trie," but the
    presence and general scope of the new gas rule are clear.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Behavior, steps 1-10
    summary: >-
      The new operation charges gas, checks static mode, derives and warms a
      location, reads its code and existence, writes code and nonce, and returns
      the location in a specified sequence.
  - source: supporting/eip-2929.md
    locator: Specification > Storage read changes
    summary: >-
      EIP-2929 makes the timing and rollback behavior of additions to
      accessed_addresses transaction-observable.
  rationale: >-
    SETDELEGATE is a new state-accessing operation whose charge, warm-access,
    read, refund, and write positions require boundary testing. It does not
    change the ordering rule for an existing class of opcodes, so score 2 rather
    than 3 applies.
  confidence: high
  uncertainty_note: >-
    The word "Halt" does not say whether the warm-address update at step 5 is
    retained or rolled back when step 6 rejects the location, increasing the
    uncertainty at that particular boundary.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Behavior; Parameters
    summary: >-
      The proposal defines only execution gas constants and opcode behavior; it
      introduces no blob-gas rule or blob-related field.
  rationale: No blob gas accounting mechanism is introduced or modified.
  confidence: high
  uncertainty_note: No blob-gas ambiguity is visible in the sealed proposal.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Behavior, steps 7-9; Parameters
    summary: >-
      The operation writes code and may increment a nonce, but the only charging
      terms specified are EMPTY_ACCOUNT_COST, BASE_COST, and an execution-gas
      refund; no state-gas charge is defined.
  - source: supporting/eip-8141.md
    locator: Mempool > Validation Trace Rules
    summary: >-
      The snapshot's frame-transaction proposal explicitly permits SETDELEGATE
      to install code during a deploy frame, where separate state budgets exist.
  rationale: >-
    As written, EIP-7819 neither adjusts an existing state-gas rate nor defines
    a new state-gas charging site. The apparent omission for its durable code
    and nonce writes is recorded as material under-specification rather than
    repaired by assigning an unstated mechanism.
  confidence: low
  uncertainty_note: >-
    It is unresolved whether SETDELEGATE should receive a new state-gas charge
    for code and account-state growth in the Hegota setting; such a resolution
    could move this row to score 2.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Behavior, step 7
    summary: >-
      The opcode conditionally adds 12,500 gas to the transaction-global refund
      counter when the derived location already exists in the trie.
  - source: eip.md
    locator: Security Considerations > Multiple Delegation Changes Within a Single Transaction
    summary: >-
      The same derived location may be updated, cleared, and reset multiple
      times within one transaction.
  rationale: >-
    This is a simple conditional refund, but it shares the global refund counter
    with existing refund behavior and has state-dependent interactions under
    repeated writes, so targeted mixed-refund and cap testing is required.
  confidence: medium
  uncertainty_note: >-
    The proposal does not define whether "already exists in the trie" refers to
    original or current transaction state, so the refund outcome for repeated
    creation, clearing, and rollback is uncertain.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 1
  evidence:
  - source: eip.md
    locator: Specification
    summary: A new instruction is assigned to opcode byte 0xf6.
  rationale: >-
    Existing fork/opcode-validity coverage for byte 0xf6 must distinguish the
    activation boundary and the new behavior. That is a minor, localized subset
