  label: Cross-EIP interactions
  score: 3
  evidence:
  - source: eip.md
    locator: Front matter requires; Specification > Behavior, steps 5 and 8-9
    summary: >-
      EIP-7819 requires EIP-7702, uses EIP-2929 accessed_addresses, creates the
      same delegation indicators as EIP-7702, and uses nonce initialization to
      satisfy EIP-7523 account non-emptiness.
  - source: supporting/eip-7702.md
    locator: Specification > Delegation indicator
    summary: >-
      Delegation indicators use EIP-3541's 0xef marker and alter code execution
      and code-reading dispatch for several operations.
  - source: supporting/eip-8141.md
    locator: Mempool > Validation Trace Rules > Banned Opcodes
    summary: >-
      EIP-8141 explicitly recognizes SETDELEGATE in the first deploy frame and
      requires the deployment to install code at the frame transaction sender.
  rationale: >-
    SETDELEGATE strongly extends EIP-7702's shared delegation object, must
    coordinate access warming with EIP-2929 and non-empty-account preservation
    with EIP-7523, relies on the EIP-3541 marker convention, and is explicitly
    integrated into EIP-8141 deployment and mempool validation. These multiple
    interdependencies require coordinated cross-EIP execution, failure,
    introspection, and deployment tests.
  confidence: high
  uncertainty_note: >-
    ERC-721, ERC-1155, ERC-1167, ERC-1967, and ERC-4337 are cited as use cases or
    comparisons, not counted as protocol-test interactions requiring their own
    coordinated vectors.
  exceptional_score_justification: null
