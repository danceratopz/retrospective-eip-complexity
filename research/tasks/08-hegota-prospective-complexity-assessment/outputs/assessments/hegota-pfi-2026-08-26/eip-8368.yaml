    maximum: 15
  plausible_tiers:
  - low
  - medium
  unresolved_questions:
  - What new reference block gas limit replaces the 150M reference?
  - What exact integer CPSB value results, including the intended rounding rule?
  - What derivation and empirical assumptions justify the selected value?
  - What security and economic effects follow from the selected magnitude?
  - >-
    Which CPSB-derived expected values, including the system-call gas allowance,
    are intended to be explicitly rebaselined?
notable_ambiguities:
- >-
  The statement that all other parameters are unaffected is clear about formulas
  and semantics, but the proposal does not enumerate derived numerical values
  that necessarily change when CPSB changes.
- >-
  'The same methodology as EIP-8037' does not state how an approximate derived
  ratio is converted into the final integer CPSB.
