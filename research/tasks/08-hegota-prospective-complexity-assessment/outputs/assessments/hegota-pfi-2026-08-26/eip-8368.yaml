under_specification:
  present: true
  summary: >-
    EIP-8368 is explicitly a placeholder. It does not provide the new reference
    block gas limit, the re-derived CPSB integer, the calculation and rationale
    supporting that integer, or substantive security analysis. These omissions
    prevent exact gas vectors and quantitative performance or risk validation;
    they do not evidence any mechanism beyond the stated CPSB adjustment.
