    locator: Abstract; Specification
    summary: >-
      The proposal changes only CPSB, the unit cost per new state byte, and says
      every other EIP-8037 parameter, mechanism, and semantic remains unchanged.
  - source: supporting/eip-8037.md
    locator: Specification / Multidimensional metering for state creation costs
    summary: >-
      EIP-8037 assigns state-creation costs using CPSB to the separate state-gas
      dimension, while other operation costs remain execution-gas.
  rationale: >-
    The targeted parameter is a state-gas cost, not an EVM execution-gas
    accounting rule; no execution-gas accounting mechanism is changed.
