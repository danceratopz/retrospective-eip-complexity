- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Preregistration Request Contract
    summary: >-
      Dispatch depends on system versus non-system caller, calldata lengths 0,
      176, or other, attached value, fee sufficiency, and empty/non-empty system
      calldata.
  - source: eip.md
    locator: Specification > Execution layer > Preregistration Request Contract > System Call
    summary: >-
      Queue draining is capped at four, head/tail reset when empty, excess is
      updated across the target boundary, and the inhibitor has activation,
      disable, and re-enable behavior.
  - source: eip.md
    locator: Security Considerations > System call failure
    summary: A failed system call makes the block invalid.
  rationale: >-
    Several independent boundary-prone mechanisms combine: dispatch and value
    matrices, exact fee/excess arithmetic, queue empty/partial/capped states,
    activation/inhibitor transitions, and fatal system-call outcomes. Fee growth
    and persistent queue indices require an elevated set of boundary cases.
  confidence: high
  uncertainty_note: >-
    Exact bytecode-level edge results remain unbaselineable until the runtime
    bytecode is supplied.
  exceptional_score_justification: null
- id: block_syncing_changes
  label: Block syncing changes
