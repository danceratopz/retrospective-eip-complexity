criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Preregistration Request Contract > System Call
    summary: >-
      The mandatory call has a dedicated 30,000,000 gas limit; assigned and
      consumed gas are excluded from block-gas checks, and EIP-1559 burn
      semantics do not apply.
  - source: supporting/eip-7002.md
    locator: Specification > Execution layer > Withdrawal Request Contract > System Call
    summary: >-
      The same dedicated, block-gas-excluded system-call accounting already
      exists for withdrawal requests.
  rationale: >-
    The proposal extends the established system-call gas-accounting pattern to
    one additional mandatory call. This updates where that existing mechanism
    applies, without changing opcode gas schedules or ordinary transaction gas
    accounting.
  confidence: high
  uncertainty_note: >-
    Runtime bytecode is TBD, but the consensus-critical gas treatment of the
    system call is explicit.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Preregistration Request Contract
    summary: >-
      The execution change is a contract and post-block call; it does not alter
      any opcode's internal state-access or gas-charge sequence.
  rationale: >-
    Contract SLOAD/SSTORE activity does not change where state is accessed inside
    an opcode, and the proposal adds or modifies no opcode ordering rule.
  confidence: high
  uncertainty_note: >-
    The missing contract bytecode affects implementation completeness, not the
    specified absence of opcode-internal ordering changes.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Configuration > Execution layer
    summary: >-
      Configuration defines preregistration request fees and queue parameters,
      with no blob-gas variable or rule.
  rationale: >-
    The request fee is an independent contract fee; no blob-gas accounting
    mechanism is introduced or modified.
  confidence: high
  uncertainty_note: No blob-gas behavior is present in the sealed proposal.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Preregistration Request Contract > Add Preregistration Request
    summary: >-
      Queue writes use ordinary SSTORE pseudocode and define no StateGasCosts,
      state-byte rate, state-gas budget, reservoir, or spill rule.
  rationale: >-
    Writing contract storage is not itself a change to the rubric's separate
    state-gas accounting mechanism.
  confidence: high
  uncertainty_note: >-
    Bytecode is missing, but the draft specifies no state-gas charging site or
    budget interaction.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Security Considerations > Fee overpayment
    summary: The system contract does not refund excess request-fee payment.
  - source: eip.md
    locator: Specification > Execution layer > Preregistration Request Contract
    summary: No EVM gas-refund mechanism is specified on any contract path.
  rationale: >-
    The proposal neither creates nor changes an EVM gas refund; its explicit
    no-refund rule concerns excess ETH request fees, not gas accounting.
  confidence: high
  uncertainty_note: No material uncertainty for this anchor.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 1
  evidence:
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      A new system contract and EIP-7685 request type make execution-layer block
      structure and validation backward-incompatible at the fork.
  - source: supporting/eip-7685.md
    locator: Specification > Execution Layer > Block Header
    summary: >-
      Block requests are ordered by request type, hashed, and committed through
      requests_hash; empty request data is excluded.
  rationale: >-
    Existing post-fork tests around EIP-7685 request construction, request
    ordering, block validation, and fork allocations need a localized update.
    Empty request data remains commitment-neutral, so the evidence does not show
    broad reworking of unrelated execution tests.
  confidence: medium
  uncertainty_note: >-
    The TBD address, type allocation, bytecode, and deployment prevent fixing the
    exact subset of existing fork and request tests that changes.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 0
  evidence:
  - source: supporting/eip-7685.md
    locator: Rationale > Removing empty requests in commitment
    summary: >-
      Empty request elements are excluded so the empty requests hash is stable
      across forks.
  - source: eip.md
    locator: Specification > Execution layer > Preregistration Request Contract > System Call
    summary: >-
      Only dequeued preregistration records must newly appear in the existing
      EIP-7685 requests list.
  rationale: >-
    Tests not exercising preregistration do not gain a new universally required
    assertion: an empty result leaves the existing request commitment stable.
  confidence: medium
  uncertainty_note: >-
    Launcher or framework conventions for exposing empty per-type results are
    not specified, but no protocol-level new assertion is shown for every test.
  exceptional_score_justification: null
