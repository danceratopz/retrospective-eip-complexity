- id: performance_risks
  label: Performance risks
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Preregistration Request Contract > System Call
    summary: >-
      Every block executes a 30,000,000-gas-budget system call that reads and
      writes queue state and drains up to four 176-byte records.
  - source: eip.md
    locator: Security Considerations > DoS and state growth
    summary: >-
      Submissions can create sustained queue/state load; the fee reacts only in
