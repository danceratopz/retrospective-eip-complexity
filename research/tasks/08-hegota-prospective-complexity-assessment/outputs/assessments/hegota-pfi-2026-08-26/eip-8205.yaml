assessment:
  snapshot_scope_summary: >-
    Execution-layer-only assessment of the draft EIP-8205 surface: one new
    stateful EIP-7685 request predeploy, ordinary-call submission and fee-getter
    paths, a mandatory end-of-block system call, fixed-width request production,
    fork activation, and the resulting block-validity, performance, security,
    and cross-EIP testing effects. Consensus-layer preregistration storage,
    signature verification, expiry, and deposit enforcement are boundary context
    only and are not independently scored.
