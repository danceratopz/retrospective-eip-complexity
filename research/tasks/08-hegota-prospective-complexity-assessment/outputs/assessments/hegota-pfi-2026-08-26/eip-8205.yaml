  label: New fork activation mechanism
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Preregistration Request Contract > System Call
    summary: >-
      Starting at FORK_BLOCK, every block performs the system call; the first call
      changes EXCESS_INHIBITOR to zero and resets per-block state.
  - source: eip.md
    locator: Specification > Execution layer > Preregistration Request Contract > Fee calculation
