- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 4
  evidence:
  - source: eip.md
    locator: Front matter requires; Specification > Execution block; Rationale > Forward compatibility
    summary: EIP-7807 requires EIPs 7495, 7773, and 7916 and retains EIP-2718 typed transaction and receipt envelopes inside the SSZ block.
  - source: supporting/eip-7495.md
    locator: Specification > ProgressiveContainer(active_fields)
    summary: EIP-7495 supplies the forward-compatible container and depends on EIP-7916 progressive Merkleization.
  - source: supporting/eip-7773.md
    locator: Specification
    summary: EIP-7773 is the required hard-fork meta proposal and identifies EIP-7843 SLOTNUM and EIP-7928 Block-Level Access Lists, whose outputs correspond to slot_number and block_access_list fields in EIP-7807.
  - source: supporting/eip-7916.md
    locator: Specification > ProgressiveList[type] and ProgressiveBitlist
    summary: EIP-7916 supplies the unbounded progressive list and byte-list types used repeatedly by the new payload.
  rationale: >-
    The block format has strong coordinated dependencies on three required EIPs and
    embeds EIP-2718 envelopes, EIP-7843 slot data, and EIP-7928 block access lists, so
