  rationale: Replacing the block-level RLP/header validation path with SSZ and a new hash is a single complex synchronization-validation migration.
  confidence: medium
  uncertainty_note: The devp2p message encoding, validation sequence, fork negotiation, and invalid-block rules are not specified, preventing a supported score for multiple mechanisms.
