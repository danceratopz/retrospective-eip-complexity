totals:
  primary_score: 34
  complexity_tier: high
under_specification:
  present: true
  summary: >-
    The Draft fixes the core SSZ payload and hash rule but does not normatively define
    transition-tool representation, Engine API endpoint/version/framing changes,
    devp2p wire and invalid-input handling, context-specific bounds for progressive
    lists, or historical and activation-boundary hash behavior. These are recorded as
    distinct gaps and are not used to inflate unrelated anchors.
  affected_criteria:
  - transition_tool_interface_changes
  - new_test_framework_primitives
  - block_syncing_changes
  - engine_api_changes
  - edge_boundary_conditions
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 32
    maximum: 39
  plausible_tiers:
  - high
  unresolved_questions:
  - What exact transition-tool fields or encoding carry the new payload, header summary, receipts, and resulting block hash?
  - Which Engine API methods and versions use binary ForkDigest-context encoding, how are messages framed, and is block_hash removal normative?
  - How are SSZ blocks negotiated, encoded, and rejected in devp2p synchronization across the activation boundary?
  - What execution-layer bounds apply to each ProgressiveList and ProgressiveByteList before allocation, decoding, and Merkleization?
  - How must BLOCKHASH and external block-hash lookups treat pre-activation blocks when executed or queried after activation?
notable_ambiguities:
- >-
  The statement that the Engine API can drop block_hash and adopt binary encoding is
  rationale, not a normative endpoint specification; score 1 reflects one identified
  field modification while keeping confidence low.
- >-
  The execution payload includes block_access_list and slot_number, but the package
  does not allocate their semantic origin among EIP-7807 and its fork/dependency
  context; the block/header-field anchor scores the explicit resulting definition.
- >-
  Transactions and receipts retain EIP-2718 envelopes while withdrawals and the block
  access list retain RLP, so SSZ validation must preserve and commit to nested bytes
  without treating those inner objects as migrated SSZ values.
overall_confidence: medium
