- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Execution block
    summary: New blocks use a normalized SSZ payload and an SSZ-summary header while retaining typed-envelope and selected RLP-encoded elements.
  - source: eip.md
    locator: Specification > Execution block hash computation
    summary: The SSZ hash-tree root becomes the block hash for opcode, JSON-RPC, devp2p, and consensus references.
  rationale: >-
    Existing block, header, receipt-root, block-hash, RPC, opcode, and synchronization
    expectations span diverse test categories and must be reworked for the new
    representation and hash, meeting the major-subset anchor.
  confidence: high
  uncertainty_note: Exact test inventories are unavailable by package policy, but the specification explicitly changes all listed execution-block contexts.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Execution block; Execution block hash computation; JSON-RPC
    summary: Existing block representation, hash, and logsBloom expectations change, but the EIP does not require tests unrelated to it to assert an additional product.
  rationale: The proposal changes existing expected values and encodings rather than adding a separate assertion to otherwise unchanged tests.
  confidence: medium
  uncertainty_note: Test-suite assertion structure is not present in the package; this score distinguishes changed expectations from the anchor's additional-invariant requirement.
  exceptional_score_justification: null
