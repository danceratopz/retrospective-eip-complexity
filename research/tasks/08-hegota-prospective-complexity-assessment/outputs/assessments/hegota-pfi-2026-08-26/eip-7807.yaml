- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Execution block
    summary: Tests must construct and hash a ProgressiveContainer payload, ProgressiveLists, ProgressiveByteLists, and an SSZ-summary header.
  - source: supporting/eip-7495.md
    locator: Specification > ProgressiveContainer(active_fields) > Merkleization
    summary: Progressive containers add active-field-aware progressive Merkleization.
  - source: supporting/eip-7916.md
    locator: Specification > Progressive Merkle tree; ProgressiveList[type] and ProgressiveBitlist
    summary: Progressive list types add a recursive Merkle-tree shape and length-mixed roots.
  rationale: >-
    Generic construction, serialization, summary, and hash-tree-root support for the
    new permanent block format and its reusable progressive SSZ types is a
    framework-level primitive, not merely EIP-specific test code.
  confidence: medium
  uncertainty_note: The package excludes the actual test framework, so the amount of pre-existing SSZ support cannot be observed.
  exceptional_score_justification: null
- id: cryptography
  label: Cryptography
  score: 1
  evidence:
  - source: eip.md
    locator: Security Considerations
    summary: The new SSZ block hash is SHA256-based and shares a namespace with existing keccak256-based block hashes.
  rationale: A well-known hash mechanism is newly used for execution block identity, fitting the single well-known cryptographic-mechanism anchor.
  confidence: high
  uncertainty_note: The package asserts no significant collision risk but does not remove the need for cross-context hash-vector testing.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Execution block
    summary: The payload combines fixed and variable fields, multiple progressive lists, retained typed/RLP elements, and a derived summary header.
  - source: supporting/eip-7916.md
    locator: Specification > Progressive Merkle tree
    summary: Progressive roots change shape at recursively increasing chunk thresholds and define a distinct empty-list root.
  - source: supporting/eip-7495.md
    locator: Specification > ProgressiveContainer(active_fields)
    summary: Progressive containers constrain active-field configurations and mix those bits into their Merkle roots.
  rationale: >-
    Empty and non-empty lists, recursive subtree growth thresholds, variable-offset
    serialization, active-field roots, summary-versus-payload equivalence, and mixed
    nested encodings create multiple boundaries; progressive-tree thresholds require
    an elevated vector set.
  confidence: high
  uncertainty_note: Context-specific size bounds for unbounded progressive lists are not supplied by EIP-7807.
  exceptional_score_justification: null
- id: block_syncing_changes
  label: Block syncing changes
