criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Gas amounts
    summary: Gas values are regrouped into SSZ containers, with no rule changing how execution gas is charged.
  rationale: The proposal changes representation of gas amounts and fees, not EVM gas accounting.
  confidence: high
  uncertainty_note: No gas-charging rule is specified anywhere in the proposal.
  exceptional_score_justification: null
