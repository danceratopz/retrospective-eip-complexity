- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Fork Activation
    summary: >-
      Activation block F must contain the post-state root of F-1, and the steady
      delayed rule applies from F+1 onward.
  - source: eip.md
    locator: Security Considerations > Reorganization Handling
    summary: >-
      A reorganization requires recomputing last_computed_state_root for every
      block on the new canonical chain.
  - source: eip.md
    locator: Specification > Header Validation
    summary: Headers with number below 1 are explicitly invalid under the specified validation.
  rationale: >-
    Activation/first-successor behavior and branch changes are multiple boundary
    mechanisms. Reorg tests require an elevated matrix over branch depth,
    activation position, and valid versus stale delayed roots.
  confidence: high
  uncertainty_note: >-
    The exact reorg test matrix is not enumerated, but per-block recomputation on
    the replacement branch is normative.
  exceptional_score_justification: null
- id: block_syncing_changes
