- id: performance_risks
  label: Performance risks
  score: 3
  evidence:
  - source: eip.md
    locator: Motivation
    summary: >-
      State-root computation is identified as a significant production
      bottleneck, and the proposal moves it out of the attestation critical path.
  - source: eip.md
    locator: Rationale > BAL Synergy
    summary: >-
      The intended path uses the preceding block's BAL for parallel proof
      generation and may let builders construct without fully executing the
      preceding block.
  - source: eip.md
    locator: Security Considerations > Pre-state Availability
    summary: >-
      Clients must retain the pre-state until its root is committed in the next
      block.
  rationale: >-
    The feature changes timing and retention in the existing block-production and
    validation pipeline and has complex interaction with BAL-assisted root
    computation. Its impact cannot be validated fully in isolation and directly
    targets a substantial existing performance bottleneck.
  confidence: high
  uncertainty_note: >-
    The package gives qualitative claims but no benchmark results; the score is
    for breadth and coupling of required performance validation, not claimed gain.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 3
