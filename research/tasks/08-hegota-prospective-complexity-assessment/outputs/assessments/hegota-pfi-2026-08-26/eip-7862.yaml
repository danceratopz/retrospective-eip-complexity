assessment:
  snapshot_scope_summary: >-
    Execution-layer-only assessment of the sealed EIP-7862 draft. The proposal
    changes the semantics of the existing EL header state_root to commit to the
    parent post-state, tracks the next root internally, and initializes that
    internal value at activation. EIP-7732 and EIP-7928 are considered only for
    their stated interactions; no consensus-layer complexity or linked-EIP
    implementation complexity is attributed to EIP-7862.
