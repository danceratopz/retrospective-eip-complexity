- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Abstract
    summary: >-
      Every block header changes from committing to its own post-state to
      committing to the preceding block's post-state.
  - source: eip.md
    locator: Specification > Header Validation; State Transition
    summary: >-
      Header validation compares state_root with a carried prior root, while the
      current post-state root is computed for the next block.
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      The change requires a hard fork and unmodified clients reject delayed-root
      blocks.
  rationale: >-
    Existing post-fork block tests across transaction contents and block
    sequences must re-derive a consensus-critical header expectation and its
    validation timing. This is a major, diverse regression surface rather than a
    contrived category.
  confidence: high
  uncertainty_note: >-
    The package provides no test inventory, so the exact number of rewritten
    vectors is unknown, but the rule applies to every post-activation block.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Header
    summary: >-
      No field is added; the already-existing state_root field receives different
      semantics.
  rationale: >-
    Tests must change an existing state-root expectation, scored above as test
    rework, but do not gain a separate new artifact or assertion.
  confidence: high
  uncertainty_note: >-
    Internal last_computed_state_root bookkeeping need not be exposed as an
    additional test invariant.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > BlockChain; State Transition; Fork Activation
    summary: >-
      The prior root is represented as internal BlockChain state, is initialized
      from the current State at activation, and is updated from the resulting
      State after each block.
  rationale: >-
    The proposal requires transition logic changes but evidences no new external
    transition-tool field: the delayed header value and current State provide the
    values needed by the specified transition.
  confidence: medium
  uncertainty_note: >-
    No transition-tool contract is included in the package, so this score is
    limited to the absence of a required external interface change in the EIP.
  exceptional_score_justification: null
- id: new_test_framework_primitives
