      only state_root receives new semantics.
  rationale: No blob-gas accounting rule is added or modified.
  confidence: high
  uncertainty_note: None; blob-gas fields are outside the specified change.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > State Transition
    summary: >-
      The only post-body addition is computing and storing the root for the next
      block; no state-gas budget, rate, charging site, or spill path is defined.
  rationale: State-root computation timing is not a state-gas charging change.
  confidence: high
  uncertainty_note: None; the proposal contains no state-gas mechanism.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
