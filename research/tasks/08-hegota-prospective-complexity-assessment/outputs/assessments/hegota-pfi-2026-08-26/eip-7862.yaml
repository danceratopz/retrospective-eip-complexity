  - source: eip.md
    locator: Abstract; Specification > Header Validation
    summary: >-
      Validators may attest without waiting for current state-root computation,
      while header validity instead checks the carried preceding-state root.
  - source: eip.md
    locator: Security Considerations > Reorganization Handling; Pre-state Availability
    summary: >-
      Correctness depends on recomputing the carried root on a new canonical
      branch and retaining the prior state through the delayed commitment.
  - source: eip.md
    locator: Rationale > Light Client Impact
    summary: State proofs acquire one slot of additional latency.
  rationale: >-
    A core state-commitment invariant is changed across header validation, state
    transition bookkeeping, reorg handling, retained state, and proof consumers.
    These include critical components and require extensive branch, invalid-root,
    and delayed-commitment review and fuzzing.
  confidence: high
  uncertainty_note: >-
    The EIP states that the light-client security model is unchanged, but that
    claim does not remove implementation risk from the altered commitment timing.
  exceptional_score_justification: null
