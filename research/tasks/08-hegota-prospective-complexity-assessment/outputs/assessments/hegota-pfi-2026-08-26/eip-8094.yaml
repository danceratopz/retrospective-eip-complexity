- id: performance_risks
  label: Performance risks
  score: 3
  evidence:
  - source: eip.md
    locator: Motivation
    summary: Replacement transactions currently redistribute full blob content during fee volatility and network overload, amplifying traffic at the worst time.
  - source: eip.md
    locator: Rationale / Implementation options / Option 3 (selected)
    summary: Separate blob retrieval can add a round trip per hop, while pushing sidecar-free transactions and reusing known blobs is intended to offset latency and bandwidth.
  - source: eip.md
    locator: Specification / PooledBlobs
    summary: An optional compact blob representation is discussed specifically as a bandwidth and reconstruction-CPU tradeoff.
  rationale: Performance depends on interacting peer, mempool, replacement, cache-availability, validation, latency, and bandwidth behavior, so it cannot be fully benchmarked in isolation and materially changes existing blob propagation performance.
  confidence: high
  uncertainty_note: Request sizing, cache retention, final blob encoding, and peer scheduling are unspecified, preventing a precise benchmark matrix.
  exceptional_score_justification: Not applicable; the score is below 4.
