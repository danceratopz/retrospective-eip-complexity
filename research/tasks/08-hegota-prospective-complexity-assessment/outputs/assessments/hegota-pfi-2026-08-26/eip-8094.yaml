under_specification:
  present: true
  summary: >-
    The draft leaves message codes, final blob response encoding, partial-response
    correlation, request and failure bounds, security/resource controls, protocol
    version designation, and order-dependent integration with EIP-8070 unresolved.
    These are material to interoperable networking tests but do not alter the many
    zero-scored EVM and consensus anchors.
