- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Engine API
    summary: >-
      BAL and payload delivery are split, getPayload returns the BAL separately,
      and the new notify call must precede newPayload for the same block hash.
  - source: supporting/eip-7928.md
    locator: Specification > Engine API
    summary: >-
      The inherited BAL flow put blockAccessList in ExecutionPayloadV4 and had
      engine_newPayloadV5 validate that supplied field.
  rationale: >-
    Existing Engine API tests for the EIP-7928 BAL path require considerable but
    category-local reworking to remove BAL delivery from newPayload, issue the
    notification first, and pair both calls by block hash.
  confidence: medium
  uncertainty_note: >-
    The package seals no implementation or test inventory, so the affected test
