- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Engine API
    summary: >-
      For a given blockHash, engine_notifyBlockAccessListV1 must be called before
      engine_newPayloadV5, and the EL may rely on BAL presence at payload delivery.
  rationale: >-
    The broad class of post-fork Engine API payload tests gains a mechanical
    ordering-and-pairing invariant even when the test's subject is not sidecar
    propagation; this is broader than a contrived case but not every EL test.
  confidence: medium
  uncertainty_note: >-
    The package does not define which test families exercise CL-to-EL delivery,
