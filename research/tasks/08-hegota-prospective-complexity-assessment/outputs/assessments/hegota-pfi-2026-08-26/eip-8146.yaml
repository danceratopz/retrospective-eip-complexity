  - source: eip.md
    locator: Rationale > No Separate Signature
    summary: No separate sidecar signature or new signature scheme is introduced.
  rationale: >-
    Existing Keccak-256 commitment verification is reused; no new cryptographic
    mechanism is added on the execution layer.
  confidence: high
  uncertainty_note: >-
    A new CL dependency on an existing Keccak implementation is not new
    cryptography and is outside the scored EL surface.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Engine API
    summary: >-
      BAL and payload are separate calls keyed by blockHash, with mandatory
      ordering and a best case in which the BAL precedes the payload.
  - source: eip.md
    locator: Specification > Fork Choice > Modified on_execution_payload_envelope
    summary: >-
      The envelope-first arrival case is cached and replayed only after the BAL is
      delivered, establishing an EL-facing ordering boundary.
  rationale: >-
    Multiple boundary-prone cases require testing: BAL/payload hash pairing,
    separate arrival timing, missing or mismatched notifications, and minimum or
    maximum BAL payloads. The EIP constrains the valid call order, limiting the
    combinatorial burden below the highest anchor.
  confidence: medium
  uncertainty_note: >-
    Duplicate, conflicting, late, and orphaned notifications are not specified,
    so the final number of execution-client boundary cases is uncertain.
  exceptional_score_justification: null
- id: block_syncing_changes
