criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: "Specification > Parameters; Specification > Gas Costs"
    summary: "SETCODEFROM introduces a 3000-gas base charge plus a source-dependent warm/cold account-access charge, yielding 3100 or 5600 under the stated EIP-2929 constants."
  - source: supporting/eip-2929.md
    locator: "Specification > Storage read changes"
    summary: "The existing transaction-wide accessed-address mechanism charges cold or warm costs and changes the cost of later account operations after an address is warmed."
  rationale: "This is a new dynamic opcode-gas rule, and executing it participates in the existing transaction-wide warmth mechanism, so it can change gas charged by later existing account-access operations. That reaches score 3 rather than a self-contained constant schedule."
  confidence: medium
  uncertainty_note: "The score assumes participation in accessed_addresses follows the cited active warm/cold mechanism; EIP-8298 does not fully order the base charge, account access, warming, and exceptional-context checks."
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: "Specification > SETCODEFROM; Specification > Gas Costs"
    summary: "The instruction reads live source.codeHash, validates source code, charges warm/cold source access, exceptionally halts in initcode or static context, and conditionally writes the current account's codeHash."
  - source: supporting/eip-2929.md
    locator: "Specification > Parameters; Specification > Storage read changes"
    summary: "Account access both charges gas and updates the transaction-scoped accessed_addresses set at opcode execution time, with scope-reversion behavior defined for the set."
  rationale: "A new state-accessing operation is introduced, and the position of its source access and warmth update relative to gas charging and exceptional-context checks must be settled. This matches the score-2 anchor for one new state-accessing operation."
  confidence: high
  uncertainty_note: "The draft does not say whether static/initcode failure, insufficient gas, or a failed source-validity check occurs before or after the source is recordably accessed and warmed."
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: "Specification > Parameters; Specification > Gas Costs"
    summary: "The only specified charges are EVM base gas and warm/cold source-account access gas."
  rationale: "No blob-gas counter, price, limit, or charging rule is introduced or modified."
  confidence: high
  uncertainty_note: "No blob-related behavior appears in the sealed proposal."
