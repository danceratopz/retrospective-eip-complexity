  - source: supporting/eip-8037.md
    locator: "Specification > Multidimensional metering for state creation costs"
    summary: "State gas is separately charged for state-creation operations, while other operations are charged to execution gas."
  rationale: "SETCODEFROM reuses already-stored bytecode and introduces no state-gas rate, budget change, reservoir rule, or state-gas charging site. Its specified charge is execution gas."
  confidence: medium
  uncertainty_note: "The proposal does not explicitly use the state-gas vocabulary for its codeHash write, but its no-new-bytecode rationale and complete SETCODEFROM_GAS formula provide no package evidence for a state-gas change."
  exceptional_score_justification: null
