assessment:
  snapshot_scope_summary: >-
    Draft execution-layer assessment of EIP-8372 as sealed in the Hegotá PFI
    snapshot. The proposal modifies EIP-8037 by selecting a new cost per state
    byte, scaling the raw block state-gas limit, and normalizing raw state-gas
    usage before comparing it with execution-gas usage for the existing header
    gas_used value. Transaction formats, block-header fields, the transaction
    reservoir, transaction-level accounting, and receipt semantics remain
    unchanged.
