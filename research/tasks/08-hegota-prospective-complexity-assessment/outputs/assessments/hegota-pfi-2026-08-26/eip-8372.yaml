- id: performance_risks
  label: Performance risks
  score: 2
  evidence:
  - source: eip.md
    locator: Motivation
    summary: >-
      Intends to let state gas and execution gas both approach their targets by
      changing which resource becomes the block bottleneck.
  - source: eip.md
    locator: Security Considerations
    summary: >-
      Requires stress-testing selected parameters across plausible demand
      elasticities and notes only approximate capacity invariance under rounding.
  rationale: >-
    The arithmetic itself is isolated, but its workload impact depends on mixed
    block execution/state demand and therefore cannot be fully benchmarked in
    isolation. The existing benchmark impact is limited by proportional CPSB and
    state-limit scaling intended to preserve maximum byte capacity.
  confidence: medium
  uncertainty_note: >-
    Missing parameter values prevent quantifying whether the selected calibration
    is contractionary or expansionary in raw state gas and realized mixed-block
    load.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 2
  evidence:
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      Identifies consensus disagreement risks in transaction inclusion, block
