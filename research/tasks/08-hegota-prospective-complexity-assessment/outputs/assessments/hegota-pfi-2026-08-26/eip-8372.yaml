  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Transaction validation; Specification > Block-level gas accounting
    summary: >-
      Uses floor division in both the scaled raw limit and inverse
      normalization, combines equality limits for raw and normalized counters,
      and selects the maximum of execution and normalized state gas.
  - source: eip.md
    locator: Security Considerations
    summary: >-
      Notes that proportional scaling preserves maximum state-byte capacity only
      approximately because of integer rounding.
  rationale: >-
    Tests need multiple boundary families: floor-division remainders, exact-limit
