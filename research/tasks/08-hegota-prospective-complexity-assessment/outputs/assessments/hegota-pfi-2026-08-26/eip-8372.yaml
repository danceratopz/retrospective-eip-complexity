criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Block-level gas accounting
    summary: >-
      Replaces EIP-8037's block-level gas_used calculation with the maximum of
      execution gas and normalized raw state gas, with two associated validity
      checks.
  rationale: >-
    An existing gas-accounting mechanism is updated at block level. The change
    does not introduce another EVM transaction gas pool or replace the inherited
    reservoir mechanism, so the score matches an update rather than a new
    general EVM gas mechanism.
  confidence: high
  uncertainty_note: >-
    This row treats the block-level gas_used rule as EVM gas accounting while
    leaving the state-specific budget and normalization impact to the dedicated
    state-gas row.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      States that the EIP-8037 reservoir model and transaction-level gas
      accounting remain unchanged; the stated changes concern post-activation
      constants, block limits, and normalized block accounting.
  - source: supporting/eip-8037.md
    locator: Specification > Pre-state and post-state gas validation
    summary: >-
      The inherited proposal defines where opcode-level state gas is charged;
      EIP-8372 supplies no replacement for those ordering rules.
  rationale: >-
    No opcode's state access, gas-charge position relative to access, or
    definition of a recordable access is changed.
  confidence: high
  uncertainty_note: >-
    The new pre-transaction state-gas availability arithmetic does not move an
    access or charge within opcode execution.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Abstract
    summary: >-
      Defines the proposal solely as scaling and normalizing EIP-8037 state gas
      and explicitly introduces no transaction or block-header fields.
  rationale: >-
    No blob-gas counter, price, target, limit, or accounting rule is modified.
  confidence: high
  uncertainty_note: >-
    Blob accounting is outside the mechanisms specified by this proposal.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Transaction validation
    summary: >-
      Scales the raw state-gas block limit relative to block_gas_limit and uses
      that scaled budget to compute state_gas_available.
  - source: eip.md
    locator: Specification > Block-level gas accounting
    summary: >-
      Normalizes raw block state-gas usage before the max comparison while
      retaining the raw state-gas counter and enforcing both raw and normalized
      limits.
  rationale: >-
    The block-level state-gas budget is modified and a normalization is added.
    This is the rubric's score-2 case. The transaction reservoir and its spill
    path into execution gas are expressly retained, so score 3 is not warranted.
  confidence: high
  uncertainty_note: >-
    The exact numeric budget is unavailable because CPSB and
    STATE_GAS_LIMIT_SCALE are still TBD, but the kind of mechanism is clear.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      Says transaction-level gas accounting, the EIP-8037 reservoir model, and
      receipt semantics remain unchanged.
  rationale: >-
    The proposal adds no refund or refill mechanism and does not modify the
    inherited refund rules.
  confidence: high
  uncertainty_note: >-
    Normalization is applied to block state-gas usage after inherited
    transaction accounting; it is not a gas refund.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      Warns that non-implementing clients may disagree on transaction inclusion,
      block validity, or header gas_used and requires builders, clients, and
      estimators to adopt the new rules.
  - source: eip.md
    locator: Specification > Transaction validation; Specification > Block-level gas accounting
    summary: >-
      Changes both the state-gas availability calculation and expected
      block-level gas_used/validity outcomes.
  rationale: >-
    A considerable but focused category of pre-existing EIP-8037 state-gas and
    block-validation tests must be reworked for the scaled budget and normalized
    gas_used. The impact is not a major, diverse rewrite across unrelated test
    categories.
  confidence: medium
  uncertainty_note: >-
    The package contains no test inventory, so the breadth is inferred only from
    the specified consensus surfaces and backwards-compatibility statement.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 0
  evidence:
  - source: eip.md
    locator: Abstract; Specification > Block-level gas accounting
    summary: >-
      Adds no output field; instead it changes how the existing gas_used value
      and existing state-gas limit validation are computed.
  rationale: >-
    Existing affected tests must change expected values and validity outcomes,
