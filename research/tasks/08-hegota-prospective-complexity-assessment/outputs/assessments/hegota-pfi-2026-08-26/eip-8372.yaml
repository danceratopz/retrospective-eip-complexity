  unidentified_interactions: []
totals:
  primary_score: 19
  complexity_tier: medium
under_specification:
  present: true
  summary: >-
    The state-gas price and raw-limit scale are both normative consensus inputs
    to every changed formula but remain TBD. The algorithms are specified, so
    the gap is localized, yet concrete validity vectors, rounding boundaries,
    workload magnitude, and calibration risk cannot be finalized. The rationale
    gives a proportional selection formula, but the normative parameter section
    requires only that both values be positive integers.
  affected_criteria:
  - edge_boundary_conditions
  - performance_risks
  - security_risks
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 18
    maximum: 21
  plausible_tiers:
  - medium
  unresolved_questions:
  - What final positive integer value is selected for CPSB?
  - What final positive integer value is selected for STATE_GAS_LIMIT_SCALE?
  - >-
