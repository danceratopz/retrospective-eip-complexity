criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: "Specification > Transaction Diff Lookup Opcode > Gas Cost"
    summary: "TXDIFF params 0x00–0x05 use EIP-2929 cold/warm costs and add the queried address or slot to the shared access list after the call."
  - source: eip.md
    locator: "Specification > Results Ordering > EVENTDATACOPY opcode"
    summary: "EVENTDATACOPY uses CALLDATACOPY-style fixed, copying, and memory-expansion charges."
  rationale: "The proposal adds several opcode-specific gas rules, including dynamic memory/copy charging and state-dependent cold/warm charging. TXDIFF also changes shared warmness, so it can change the gas charged by later existing operations; this reaches score 3."
  confidence: medium
  uncertainty_note: "TXTRACE_GAS_COST and the constants-table EVENTDATACOPY_GAS_COST remain TBD, and no opcode-wide charge/error ordering is fully specified."
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: "Specification > Transaction Diff Lookup Opcode > Gas Cost"
    summary: "For TXDIFF params 0x00–0x05, cost depends on pre-call warmness; the address or slot is added to EIP-2929 access lists after the call and recorded in the EIP-7928 BAL where active."
  - source: supporting/eip-7928.md
    locator: "Specification > Gas Validation Before State Access"
    summary: "BAL inclusion is consensus-critical at gas boundaries: pre-state validation must pass before the target is accessed and recorded."
  rationale: "TXDIFF is a new state-accessing operation whose gas validation, live-state read, warmness update, and BAL recording position must be fixed. This matches the score-2 anchor for a new state-accessing operation whose ordering must be settled."
  confidence: medium
  uncertainty_note: "The draft says the access-list addition occurs after the call but does not define ordering for invalid params, reserved operands, failed reads, or insufficient gas."
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: "Specification > Transaction Trace Opcode"
    summary: "For blob transactions, gas_pre_charge reports the existing blob-fee component as blob_count × GAS_PER_BLOB × blob_base_fee."
  - source: supporting/eip-4844.md
    locator: "Specification > Gas accounting"
    summary: "EIP-4844 already defines blob gas, GAS_PER_BLOB, and blob fee calculation."
  rationale: "EIP-7906 exposes an already-computed blob fee through TXTRACE but does not alter blob-gas charging, limits, base-fee calculation, or refund behavior."
  confidence: high
  uncertainty_note: "The exposed gas_pre_charge value is underspecified in other respects, but the package contains no blob-gas accounting change."
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: "Specification > The POST_TX Frame Mode"
    summary: "POST_TX executes as STATICCALL and disallows state manipulation, including the APPROVE exception."
  - source: eip.md
    locator: "Specification > Transaction Diff Lookup Opcode > Gas Cost"
    summary: "The new opcode costs are EIP-2929 execution-gas access charges or a flat TXTRACE cost, not state-gas charges."
  rationale: "The proposal observes state differences but introduces no state write, state-gas charging site, state budget change, or spill/reservoir rule."
  confidence: high
  uncertainty_note: "This is limited to EIP-7906; the underlying EIP-8141 transaction already has a separate state-gas model."
  exceptional_score_justification: null
