totals:
  primary_score: 16
  complexity_tier: medium
under_specification:
  present: true
  summary: >-
    The proposal is materially but narrowly under-specified for zero-value PAY
    to a nonexistent address: it gives the gas branch and warm-set update but
    does not normatively state whether account-touch/account-creation bookkeeping
    occurs or define the account-existence predicate. EIP-7523 strongly constrains
    the intended result, so this is recorded once under the consensus-ambiguity
    criterion and is not multiplied across other anchors.
  affected_criteria:
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 15
    maximum: 16
  plausible_tiers:
  - medium
  unresolved_questions:
  - Does zero-value PAY to a nonexistent address only warm the address, or also touch or create an account for state-transition bookkeeping?
  - What exact account-existence predicate governs GAS_NEW_ACCOUNT and recipient creation for PAY on EIP-7523-compatible networks?
notable_ambiguities:
- >-
  The specification's ordered list places gas charging before warming, but the
  existence lookup needed to calculate gas necessarily precedes the charge;
  tests should distinguish lookup, charge, recorded access, and transfer at
  exact gas boundaries.
- >-
  PAY to the current address and PAY to a delegated EOA are constructible
  balance-transfer cases; the general transfer wording implies ordinary balance
  semantics while expressly excluding recipient code execution.
overall_confidence: medium
