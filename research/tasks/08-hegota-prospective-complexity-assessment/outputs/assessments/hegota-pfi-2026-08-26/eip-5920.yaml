criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Gas Cost
    summary: >-
      PAY has a new dynamic gas schedule summing warm/cold account access,
      new-account, and nonzero-value charges.
  - source: supporting/eip-2929.md
    locator: Specification > Parameters; Specification > Storage read changes
    summary: >-
      The referenced warm/cold constants and transaction-wide
      accessed_addresses mechanism supply the account-access component.
  rationale: >-
    A new opcode-specific dynamic gas calculation is introduced using existing
    gas constants and access-list machinery; the proposal does not reprice or
    rewrite the gas rule of an existing opcode.
  confidence: high
  uncertainty_note: >-
    The schedule reuses existing mechanisms, but its three-part conditional sum
    is still a new charging rule, placing it at the score-2 anchor.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Behavior
    summary: >-
      PAY checks static mode, pops and validates inputs, charges gas, warms the
      address, then conditionally transfers value and pushes success.
  - source: supporting/eip-2929.md
    locator: Specification > Storage read changes
    summary: >-
      EIP-2929 establishes that account-access gas and warming timing are
      consensus-visible and that reverted scopes restore access sets.
  rationale: >-
    PAY is a new state-accessing operation whose ordered gas charge, warm-set
    update, balance check, and transfer must be tested at each reachable gas
    boundary. This matches the score-2 new-operation anchor.
  confidence: high
  uncertainty_note: >-
    The broad order is explicit. Boundary coverage still multiplies across
    cold/warm, static/non-static, validity, balance, value, and outcome cases.
  exceptional_score_justification: null
