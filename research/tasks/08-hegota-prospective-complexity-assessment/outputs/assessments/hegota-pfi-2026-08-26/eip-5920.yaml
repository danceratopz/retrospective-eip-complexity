assessment:
  snapshot_scope_summary: >-
    Execution-layer-only assessment of the sealed Draft EIP-5920 snapshot. The
    proposal adds one state-accessing, dynamically priced PAY opcode that moves
    ether without executing recipient code. The principal test matrix combines
    gas-boundary ordering with warm/cold, static/non-static, valid/invalid
    address, existing/nonexistent recipient, zero/nonzero value,
    sufficient/insufficient balance, success/revert, and direct/delegated
    recipient cases; independent dimensions multiply rather than merely add.
