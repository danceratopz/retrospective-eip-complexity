criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification; Backwards Compatibility
    summary: >-
      The identity address stops using precompile handling and instead executes fixed
      EVM code; the proposal explicitly says the resulting gas costs are slightly different.
  rationale: >-
    Existing identity-precompile metering is replaced by ordinary opcode, copy, and
    memory-expansion metering. This updates an existing gas-accounting path without
    introducing a new gas-accounting mechanism.
  confidence: high
  uncertainty_note: >-
    The text does not enumerate the exact gas deltas, but the fixed bytecode determines
    the post-activation execution path under existing EVM rules.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: >-
      The change installs code at the activation boundary and removes precompile treatment;
      it specifies no reordering of state access or gas charging inside any opcode.
  rationale: >-
    No opcode's internal state-access or gas-charge ordering is changed. The activation
    write is a block-boundary transition and is outside this anchor.
  confidence: high
  uncertainty_note: >-
    Calls to 0x04 take a different callee execution path, but the package does not change
    the within-opcode ordering measured by this anchor.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: The specification is limited to address 0x04 code and precompile treatment.
  rationale: No blob-gas rule or mechanism is introduced or modified.
  confidence: high
  uncertainty_note: No blob-related behavior appears anywhere in the proposal.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: >-
      The proposal mandates a one-time code assignment at activation but defines no
      StateGasCosts, state-byte rate, state-gas budget, reservoir, or spill rule.
  rationale: >-
    The irregular activation state change does not introduce a state-gas charging site
    or alter state-gas accounting; its complexity is scored under fork activation.
  confidence: high
  uncertainty_note: >-
    The EIP does not discuss charging the protocol-directed activation write, so no
    state-gas mechanism can be scored from the sealed text.
  exceptional_score_justification: null
