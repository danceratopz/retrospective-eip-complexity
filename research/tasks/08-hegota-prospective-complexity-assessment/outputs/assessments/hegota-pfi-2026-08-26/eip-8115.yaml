    locator: "Specification > Priority fee processing"
    summary: "Per-transaction EIP-1559 priority-fee credits are replaced by one accumulated credit after transaction processing."
  - source: supporting/eip-1559.md
    locator: "Specification > reference implementation, World.validate_block transaction loop"
    summary: "The existing mechanism credits block.author with gas_used multiplied by priority_fee_per_gas after each transaction."
  rationale: "The proposal updates an existing gas-linked fee-accounting mechanism's settlement timing. It introduces no new gas meter and does not change gas consumed, effective gas price, or the sender's gas charge, so the existing-mechanism score of 1 applies."
  confidence: high
