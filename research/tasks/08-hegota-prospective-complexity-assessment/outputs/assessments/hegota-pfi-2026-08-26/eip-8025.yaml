- id: performance_risks
  label: Performance risks
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Execution Layer > Host-side input construction
    summary: Witness construction is coupled to block execution, trie data, code reads, ancestor headers, and post-state-root reconstruction.
  - source: eip.md
    locator: Security Considerations > Verifier-prover decentralisation asymmetry
    summary: Provers retain full EL state and run a non-trivial stack whose cost scales as O(n log^2 n) in witnessed computation size.
  - source: eip.md
    locator: Rationale > Build operational experience
    summary: Proof size, generation latency, verifier throughput, and prover diversity require live operational measurement.
  rationale: >-
    Proving performance cannot be fully isolated from payload execution, state/trie
    access, witness shape, and proof-system choice, and the proposal identifies a
    substantial, superlinear proving burden with complex interactions.
  confidence: high
  uncertainty_note: Concrete proof systems are unpinned, so exact resource envelopes remain unknown.
  exceptional_score_justification: null
