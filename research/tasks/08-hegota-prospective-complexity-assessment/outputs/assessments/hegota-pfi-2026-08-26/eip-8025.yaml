  uncertainty_note: The consensus-layer threshold k is also open, but is excluded from this execution-layer score.
  exceptional_score_justification: null
- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 4
  evidence:
  - source: eip.md
    locator: Front matter > requires
    summary: The proposal explicitly requires EIPs 4844, 6110, 7002, 7251, 7688, 7732, 7928, and 8282.
  - source: eip.md
    locator: Specification > Execution Layer > Stateless input and output
    summary: NewPayloadRequest and its SSZ commitment combine blob hashes, three established request families, two builder request families, progressive SSZ, delayed execution context, and the BAL.
  - source: eip.md
    locator: Specification > Execution Layer > Host-side input construction
    summary: Witness generation reuses the BAL tracker and must cover request-driven system actions and fork-specific payload execution.
  rationale: >-
    There are strong coordinated interactions with 4844 (blob hashes and blob
    fields), 6110 (deposits), 7002 (withdrawals), 7251 (consolidations), 7688
    (progressive SSZ), 7732 (delayed execution-validation window and payload
    context), 7928 (BAL and access tracker), and 8282 (builder requests). The
    uncapped rule gives base score 3 for strong multi-EIP interdependence plus 1
    for the first complete group of three among the five interactions beyond the
    first three.
  confidence: high
  uncertainty_note: All eight interactions are explicit in the sealed package; no unidentified interaction is added.
  exceptional_score_justification: >-
    Score 4 is mechanically required by the uncapped anchor: eight interacting EIPs
    produce base 3 plus floor((8 - 3) / 3) = 1, and each changes a distinct input,
    schema, timing, or witness axis requiring coordinated cases.
