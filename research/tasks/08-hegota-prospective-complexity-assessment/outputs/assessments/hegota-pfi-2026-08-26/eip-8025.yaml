  label: Security risks
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Execution Layer
    summary: Acceptance binds proof verification to the guest program, successful result, payload-request root, chain ID, and schema ID.
  - source: eip.md
    locator: Specification > Execution Layer > Guest validation
    summary: Security-sensitive logic covers witness-backed state, state-root recomputation, fork rules, payload validity, and transaction-signature/public-key equivalence.
  - source: eip.md
    locator: Security Considerations > Soundness and consensus implications
