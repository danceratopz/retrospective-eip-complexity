  label: New test-framework primitives
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Execution Layer > Stateless input and output
    summary: Tests must construct a new StatelessInput and check a new StatelessValidationResult.
  - source: eip.md
    locator: Specification > Execution Layer > SSZ encoding
    summary: Inputs require schema-prefixed SSZ and progressive-container/list serialization with fixed subordinate bounds.
  rationale: >-
    Reusable EIP-specific primitives are needed to assemble witnesses and payload
    requests, serialize the guest input, run it, and assert structured success or
    sentinel-failure output.
  confidence: medium
