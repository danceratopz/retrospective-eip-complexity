  exceptional_score_justification: null
- id: cryptography
  label: Cryptography
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Terminology
    summary: A proof system proves guest computation and may vary in proof format, verifier logic, cost, and security assumptions.
  - source: eip.md
    locator: Specification > Execution Layer
    summary: The execution result is accepted only after proof verification and binding to the expected guest, request root, chain, and schema.
  rationale: >-
    Proving full stateless payload validation is one novel cryptographic mechanism,
    while the concrete proof system is deliberately not fixed; this fits the
    single-novel-mechanism anchor.
  confidence: medium
  uncertainty_note: Concrete proof systems and their testing resources are not identified, so the eventual mechanism count may differ.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Execution Layer > Guest validation
    summary: Cases include decode failure sentinels, bounded and contiguous ancestor headers, missing witness data, invalid payloads, and transaction-key verification.
  - source: eip.md
    locator: Specification > Execution Layer > Host-side input construction
    summary: Witness creation must capture reads, writes, code, ancestors, and sibling trie nodes while reproducing the expected post-state root.
  - source: eip.md
    locator: Specification > Execution Layer > SSZ encoding
    summary: Schema IDs, progressive collections, and several fixed byte/header bounds add serialization boundaries.
  rationale: >-
    Multiple boundary-prone mechanisms compose across malformed schemas, empty or
    non-contiguous header witnesses, trie-node completeness, code and public-key
    lists, invalid execution, fork selection, and post-state reconstruction. Witness
    completeness across arbitrary blocks requires an elevated case count.
  confidence: high
  uncertainty_note: Concrete proof-format boundaries remain unknown and are not added to this score.
  exceptional_score_justification: null
