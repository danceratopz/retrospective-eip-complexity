totals:
  primary_score: 21
  complexity_tier: medium
under_specification:
  present: true
  summary: >-
    Material execution-layer details remain open: concrete proof systems and
    ProofType-to-guest/verifier dispatch, the exact adaptation between the proof's
    chain configuration and the guest's chain/schema output, production fork-rule
    selection, and the conformance-runner interface. The separate consensus-layer
    threshold k is also open but is not used to score the execution surface.
  affected_criteria:
  - transition_tool_interface_changes
  - new_test_framework_primitives
  - cryptography
  - performance_risks
  - security_risks
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 17
    maximum: 25
  plausible_tiers:
  - medium
  - high
  unresolved_questions:
  - Which concrete proof systems and ProofType values are supported, and how is each value bound to an exact guest program and verifier?
  - How is PublicInput.chain_config mapped to or checked against the execution guest's chain_id and schema_id result?
  - What fork-activation data is supplied to a production guest, and what exact timestamp/fork-selection failures must it return?
  - Is the stateless guest exercised through a new transition-tool mechanism or a standalone conformance runner, and what reusable expectations are required?
  - What value of k defines proof verification on the consensus side, noting that this does not affect the execution-layer score?
notable_ambiguities:
- >-
  The abstract describes proof verification as a path that decouples verification
