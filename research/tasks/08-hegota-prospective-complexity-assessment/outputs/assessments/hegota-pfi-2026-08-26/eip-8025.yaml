  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Consensus Layer > Proof types and containers
    summary: ProofType values and new proof systems are socialized out of band, with proof-system support configured dynamically.
  - source: eip.md
    locator: Specification > Execution Layer
