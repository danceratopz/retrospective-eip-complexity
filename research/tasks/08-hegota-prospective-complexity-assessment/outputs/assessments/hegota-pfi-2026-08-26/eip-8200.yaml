criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Gas Costs
    summary: >-
      Calls to all three addresses change from precompile-specific formulas to
      the standard costs of the EVM opcodes executed by the deployed code.
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      The proposal explicitly states that gas costs will differ and may affect
      contracts relying on precise gas calculations.
  rationale: >-
    Three existing special gas schedules are replaced by the existing EVM
    execution-accounting mechanism. This updates gas accounting but does not
    introduce a new metering mechanism, matching score 1.
  confidence: high
  uncertainty_note: >-
    The exact deltas cannot be calculated because all three bytecodes and gas
    comparisons are absent, but that omission does not change the anchor class.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Deployment
    summary: >-
      The specified change installs code at three addresses and ends native
      precompile treatment; it states no change to the internal ordering of an
      opcode's state access and gas charging.
  rationale: >-
    No opcode state-access or gas-charge ordering rule is modified. The
    fork-time code write is an activation transition, not an ordering change
    inside opcode execution.
  confidence: medium
  uncertainty_note: >-
    The bytecode is unspecified, but the snapshot contains no normative rule
    that changes state-access ordering for an opcode.
  exceptional_score_justification: null
