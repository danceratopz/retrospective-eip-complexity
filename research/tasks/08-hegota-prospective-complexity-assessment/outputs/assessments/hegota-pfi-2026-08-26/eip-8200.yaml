totals:
  primary_score: 28
  complexity_tier: high
under_specification:
  present: true
  summary: >-
    Material consensus inputs are absent: none of the three deployment bytecodes
    is specified, all gas comparisons are TODOs, and Test Cases is entirely TODO.
    The omissions prevent exact activation state, gas baselines, executable edge
    semantics, performance bounds, and test infrastructure needs from being fixed.
  affected_criteria:
  - evm_gas_rule_changes
  - patterns_affecting_pre_existing_tests
  - new_invariant_on_pre_existing_tests
  - transition_tool_interface_changes
  - new_test_framework_primitives
  - cryptography
  - modified_precompiles
  - performance_risks
  - security_risks
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 26
    maximum: 36
  plausible_tiers:
  - high
  unresolved_questions:
  - What exact byte sequence must be installed at each of the three addresses?
  - How does each bytecode normatively reproduce every valid output and every invalid-input failure mode of the replaced precompile?
  - What are the exact gas costs and compatibility effects across each input-size and fixed-forwarded-gas boundary?
  - What activation-block inputs or transition-tool interface, if any, are required to perform and verify the code installation?
  - Which existing tests must be reworked, which unrelated tests gain assertions, and which new framework primitives are required?
notable_ambiguities:
- >-
  Functional equivalence is stated as a goal but is not executable or
  byte-for-byte deterministic without the three missing bytecodes.
