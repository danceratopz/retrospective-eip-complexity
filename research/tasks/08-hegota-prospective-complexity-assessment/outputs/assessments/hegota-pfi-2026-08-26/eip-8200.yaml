  label: Cryptography
  score: 2
  evidence:
  - source: eip.md
    locator: Abstract; Motivation
    summary: >-
      The proposal replaces RIPEMD-160, modular exponentiation, and BLAKE2f with
      EVM implementations while preserving functionality.
  - source: supporting/eip-152.md
    locator: Specification
    summary: >-
      BLAKE2f is a cryptographic compression function with a precisely encoded
      state, message, counters, round count, and final-block flag.
  rationale: >-
    Multiple well-known cryptographic mechanisms must be reimplemented and
    equivalence-tested in a new execution form. This matches the multiple
    well-known mechanisms at score 2; no novel cryptography is introduced.
  confidence: high
  uncertainty_note: >-
    The concrete EVM implementations are absent, so implementation-specific
    cryptographic testing details remain unknown.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: supporting/eip-152.md
    locator: Specification; Test Cases
    summary: >-
      BLAKE2f has an exact 213-byte input, a restricted final flag, a 32-bit
      rounds value, and vectors for short, long, invalid-flag, zero-round, and
      maximum-round inputs.
  - source: supporting/eip-7823.md
    locator: Specification; Rationale > Analysis
    summary: >-
      MODEXP has three independently encoded length fields, zero-length cases,
      and an 8192-bit bound whose violation consumes all gas.
  - source: eip.md
    locator: Security Considerations
    summary: >-
      Each bytecode must match all valid outputs, all invalid-input handling, and
      changed fixed-gas-call behavior.
  rationale: >-
    Three distinct variable-input mechanisms expose multiple boundaries, and
    MODEXP length combinations plus BLAKE2f length, flag, and round boundaries
    require an elevated case set. This matches score 3.
  confidence: high
  uncertainty_note: >-
    Missing bytecode prevents enumerating implementation-created boundaries, but
    the inherited interface boundaries already satisfy score 3.
  exceptional_score_justification: null
