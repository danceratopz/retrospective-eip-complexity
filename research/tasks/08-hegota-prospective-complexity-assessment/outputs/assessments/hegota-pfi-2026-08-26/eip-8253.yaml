assessment:
  snapshot_scope_summary: >-
    Draft execution-layer EIP-8253 in the sealed Hegotá snapshot. It specifies a
    one-time fork-activation transition that sets the nonce to 1 for a fixed
    Mainnet list of 28 zero-nonce, empty-code, non-empty-storage accounts,
    preserves all other account fields, runs before system calls and
    transactions, consumes no gas, and conditionally records the changes in an
    EIP-7928 block-level access list. The referenced account-list and methodology
    assets are not present in the assessment package.
