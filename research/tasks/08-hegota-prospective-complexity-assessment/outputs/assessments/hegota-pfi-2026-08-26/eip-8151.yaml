totals:
  primary_score: 22
  complexity_tier: medium
under_specification:
  present: true
  summary: >-
    The proposal does not completely order recovery, gas sufficiency,
    accessed-address warming, and the raw-code read when a successful recovery
    has insufficient gas for the added EIP-2929 charge. The normative steps and
    split reference functions therefore do not fix the consensus-visible
    outcome at every gas boundary.
  affected_criteria:
  - state_access_ordering_within_opcode_execution
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 21
    maximum: 23
  plausible_tiers:
  - medium
  - high
  unresolved_questions:
  - >-
    If recovery succeeds but the call cannot pay the warm or cold surcharge,
    is recovered_address added to accessed_addresses before the call fails?
  - >-
    Is the raw-code read attempted only after the entire surcharge is confirmed
    available, and what access is recorded at each exact gas boundary?
notable_ambiguities:
- >-
  Special consideration: recovery success or failure, warm or cold status,
  static or non-static call context, permitted or disallowed code, later
  reversion or success, and exact gas sufficiency create a multiplicative test
  matrix rather than independent additive cases.
- >-
  The normative specification composes dynamic gas and raw-code permission,
  while the reference implementation presents them separately and omits an
  integrated gas call from its ecRecover function.
overall_confidence: medium
