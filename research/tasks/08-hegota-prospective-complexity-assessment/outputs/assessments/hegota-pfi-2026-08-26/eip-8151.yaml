assessment:
  snapshot_scope_summary: >-
    Execution-layer assessment of the sealed Draft snapshot of EIP-8151. The
    proposal changes the existing ecRecover precompile so successful recovery
    performs an EIP-2929-priced raw-code account access and suppresses recovered
    addresses whose code is neither empty nor an EIP-7702 delegation indicator.
    Consensus-layer behavior is out of scope; no such surface is specified.
