criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Gas Cost
    summary: >-
      Every successful recovery adds either 100 gas for a warm recovered
      address or 2600 gas for a cold one, while failed recovery remains at
      3000 gas.
  - source: supporting/eip-2929.md
    locator: Specification > Storage read changes
    summary: >-
      EIP-2929 defines the existing accessed-address warm/cold mechanism and
      its 100 and 2600 gas costs.
  rationale: >-
    The proposal updates ecRecover to use an existing EIP-2929 account-access
    gas mechanism; it does not introduce a new gas-accounting model.
  confidence: high
  uncertainty_note: >-
    The warm/cold amounts and success/failure split are explicit; exact
    out-of-gas sequencing is recorded separately as under-specification.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Modified ecRecover Behavior, steps 1-3
    summary: >-
      Recovery failure performs no state access, whereas successful recovery
      incurs warm/cold account cost and then checks the recovered account's raw
      code.
  - source: supporting/eip-2929.md
    locator: Specification > Storage read changes
    summary: >-
      The inherited mechanism normally charges gas and updates
      accessed_addresses at the time of access, with scope reversion behavior.
  rationale: >-
    A new state-accessing operation is introduced within execution of calls to
    the precompile. Its position after successful recovery, and relative to
    dynamic charging and the code read, creates consensus-visible gas and
    access-set boundaries.
  confidence: medium
  uncertainty_note: >-
    The text does not fully determine whether a recovered address becomes warm
    when the call cannot pay the added warm/cold charge.
  exceptional_score_justification: null
