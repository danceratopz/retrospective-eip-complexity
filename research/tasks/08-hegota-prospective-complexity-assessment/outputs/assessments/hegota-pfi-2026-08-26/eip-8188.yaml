  confidence: high
  uncertainty_note: None.
  exceptional_score_justification: null
- id: modified_precompiles
  label: Modified precompiles
  score: 0
  evidence:
  - source: eip.md
    locator: Specification / Account rules
    summary: >-
      The proposal changes generic account metadata on balance mutation but defines
