  rationale: >-
    Despite the substantial state RLP change, this rubric anchor is expressly
    limited to transaction, block, and interface encoding, none of which changes.
  confidence: high
  uncertainty_note: >-
    State-leaf encoding complexity is captured by affected tests, invariants,
    transition representation, edge cases, and performance rather than this narrow anchor.
  exceptional_score_justification: null
- id: new_transaction_types
  label: New transaction types
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: The proposal defines no transaction envelope or transaction type.
