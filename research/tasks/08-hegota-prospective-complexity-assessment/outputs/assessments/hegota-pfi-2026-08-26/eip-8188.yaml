  confidence: high
  uncertainty_note: None.
  exceptional_score_justification: null
- id: new_or_modified_transaction_validity_mechanisms
  label: New or modified transaction validity mechanisms
  score: 0
  evidence:
  - source: eip.md
    locator: Abstract
    summary: The proposal adds state metadata and expressly introduces no gas changes.
  - source: eip.md
    locator: Specification
    summary: No transaction-validity or intrinsic-gas rule is defined.
  rationale: >-
    State output changes do not alter transaction envelope validity or intrinsic-gas
    calculation. EIP-8037's own validity mechanisms are not changes introduced by EIP-8188.
  confidence: high
  uncertainty_note: The possible EIP-8037 byte-rate adjustment is a state-gas issue, not a transaction-validity rule.
  exceptional_score_justification: null
- id: new_block_header_fields
  label: New block / header fields
  score: 0
  evidence:
  - source: eip.md
    locator: Specification / Block Update Rule
    summary: Existing block_number supplies metadata values; no new block or header field is defined.
  rationale: The proposal consumes an existing block number and adds no header field.
  confidence: high
  uncertainty_note: None.
  exceptional_score_justification: null
- id: new_fork_activation_mechanism
  label: New fork activation mechanism
  score: 0
  evidence:
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      No tree transition occurs; legacy entries remain encoded as before and adopt
      the new encoding only upon their first post-fork mutation.
  rationale: No state or existing internal value is modified at the activation block itself.
  confidence: high
  uncertainty_note: Implementations must activate new mutation rules, but initialization of a semantic field and lazy decoding are not an activation-block modification under this anchor.
  exceptional_score_justification: null
- id: performance_risks
  label: Performance risks
  score: 3
  evidence:
  - source: eip.md
    locator: Rationale / How does extra metadata affect the state size?
    summary: >-
      The proposal estimates roughly 10.8 GB of raw overhead once all current state
      has been rewritten and says impact must be benchmarked across clients.
  - source: eip.md
    locator: Security Considerations
    summary: >-
      Every written account or slot grows, increasing data touched by writes and the
      size of state witnesses and proofs.
  rationale: >-
    The mechanism affects pervasive existing write, trie-hashing, database, witness,
    and proof behavior and cannot be fully validated in isolation; its substantial
    cross-client storage and commit-path impact warrants score 3.
  confidence: high
  uncertainty_note: Client tiering optimizations are optional and unspecified, so only the mandatory metadata overhead and write-path effects are scored.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 2
  evidence:
  - source: eip.md
    locator: Security Considerations
    summary: >-
      Added bytes increase state-resource usage and witness sizes; without matching
      EIP-8037 byte rates, new accounts and slots would be underpriced.
  - source: eip.md
    locator: Specification / Reads and Reverts
    summary: >-
      Consensus correctness requires reads not to mutate metadata and reverted
      frames to restore it exactly with accompanying state.
  rationale: >-
    The metadata interacts with critical state-root, journaling, and state-pricing
    components, slightly altering their invariants and requiring targeted review and
    fuzzing. The text bounds DoS exposure by existing write rules, so score 3 is not used.
  confidence: medium
  uncertainty_note: >-
    The security consequence of the ambiguous EIP-8037 parameter adjustment and
    omitted mutation cases cannot be fully resolved from the package.
  exceptional_score_justification: null
- id: unspecified_behavior_requiring_cross_client_consensus
  label: Unspecified behavior requiring cross-client consensus
  score: 3
  evidence:
  - source: eip.md
    locator: Front matter and Abstract
    summary: >-
      The proposal is Draft and makes previously unrecorded write-age information
      consensus metadata that changes the state root.
  - source: eip.md
    locator: Specification / Account rules
    summary: >-
      The enumerated account updates cover balance, nonce, storage, creation, and
      SELFDESTRUCT but do not state an exhaustive rule for every account-field mutation.
  - source: supporting/eip-8037.md
    locator: Specification / Parameter changes
    summary: >-
      The required EIP-8037 package text includes existing-account EOA delegation
      writes, a mutation class not resolved by EIP-8188's account-rule list.
  rationale: >-
    Previously unobservable write timing becomes consensus-critical, while testable
    cases such as unlisted account-field mutations and no-net balance transfers are
    not fully reconciled with the general mutation rule. Different readings produce
    different leaf encodings and state roots, requiring cross-client agreement.
  confidence: medium
  uncertainty_note: >-
    The allowed package contains no implementation, devnet, test, or discussion
    evidence with which to determine whether these Draft gaps already have a shared
    resolution.
  exceptional_score_justification: null
- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 2
  evidence:
  - source: eip.md
    locator: Front matter and Rationale / Relation with state creation cost (EIP-8037)
    summary: >-
      EIP-8188 requires EIP-8037 and proposes coordinated changes to two of its
      per-byte state-creation parameters.
  - source: eip.md
    locator: Specification / Account rules / SELFDESTRUCT
    summary: SELFDESTRUCT metadata behavior is explicitly branched according to EIP-6780.
  - source: eip.md
    locator: Rationale / Why do reads not update the block?
    summary: Read behavior is designed to preserve EIP-214 STATICCALL state immutability.
  rationale: >-
    EIPs 8037, 6780, and 214 require coordinated consideration for pricing, deletion
    and balance branches, and static-call invariants, but the interactions remain
    limited enough for mostly focused testing. Exactly three identified EIPs add no
    uncapped-row quantity bonus.
  confidence: high
  uncertainty_note: >-
    The proposal also anticipates an unnumbered future state-tiering pricing EIP;
    its design and test interaction cannot be assessed from this snapshot.
  exceptional_score_justification: null
  interacting_eips:
  - 214
  - 6780
  - 8037
  unidentified_interactions:
  - A separate, unnumbered state-tiering gas-pricing proposal is expected to consume the last-written-block metadata.
totals:
  primary_score: 26
  complexity_tier: high
under_specification:
  present: true
  summary: >-
    Material gaps remain around whether EIP-8188 itself changes EIP-8037 state-gas
    rates, the exhaustive set of account mutations that update metadata, ordinary
    no-net balance transfers, mixed-encoding canonicalization, and the concrete
    transition-tool and test-framework representation. These gaps can change several
    anchor scores but do not erase the broad mandatory state-root impact.
  affected_criteria:
  - state_gas_accounting_changes
  - transition_tool_interface_changes
  - new_test_framework_primitives
  - modified_system_contracts
  - security_risks
  - unspecified_behavior_requiring_cross_client_consensus
  - cross_eip_interactions
  plausible_total_range:
    minimum: 22
    maximum: 29
  plausible_tiers:
  - medium
  - high
  unresolved_questions:
  - >-
    Are the EIP-8037 parameter changes normative changes in EIP-8188, despite the
    statements that this proposal introduces no gas changes and leaves pricing separate?
  - >-
    Must every mutation of an existing account field update last_written_block,
    including the EOA-delegation code write described by EIP-8037, or only the
    account-rule cases explicitly enumerated in EIP-8188?
  - >-
    Does an ordinary nonzero value transfer from an address to itself update account
    metadata even though there is no net balance change, and how does that align with
    the explicit SELFDESTRUCT self-beneficiary exception?
  - >-
    What canonical transition-tool and test-fixture representation distinguishes
    legacy implied-zero metadata from explicitly encoded zero metadata?
  - >-
    Do stateful system-call paths require any special metadata, rollback, or fixture
    handling beyond the generic account and storage rules?
notable_ambiguities:
- >-
  The Abstract's no-gas-change scope conflicts with the normative SHOULD and concrete
  EIP-8037 STATE_BYTES_PER_* replacements in the Rationale.
- >-
