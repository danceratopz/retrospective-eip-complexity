criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: Abstract
    summary: The proposal expressly says that the metadata introduces no gas changes.
  - source: eip.md
    locator: Motivation
    summary: Gas pricing based on the metadata is left to a separate proposal.
  rationale: >-
    EIP-8188 introduces no execution-gas accounting rule. Its state-gas parameter
    interaction is assessed only in the dedicated state-gas anchor.
  confidence: high
  uncertainty_note: >-
    The EIP-8037 parameter recommendation creates a scope tension, but it concerns
    state-gas rates rather than a separate EVM execution-gas rule.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification / Block Update Rule
    summary: >-
      The text defines when metadata changes alongside mutations but does not move
      an existing state access or gas charge within any opcode.
  rationale: >-
    The proposal changes the state written by existing operations, not the ordering
    of a pre-existing state access or gas charge inside opcode execution.
  confidence: medium
  uncertainty_note: >-
    The precise implementation sequence of the metadata write is not stated, but
    the rubric scores specified changes to access or charging order, and none is
    introduced here.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Abstract
    summary: >-
      The scope is account and storage-slot metadata and the text expressly says
      that it introduces no gas changes.
  rationale: No blob-gas mechanism or blob-gas rate is added or modified.
  confidence: high
  uncertainty_note: No blob behavior appears anywhere in the proposal specification.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 1
  evidence:
  - source: eip.md
    locator: Rationale / Relation with state creation cost (EIP-8037)
    summary: >-
      The proposal says STATE_BYTES_PER_NEW_ACCOUNT should rise from 120 to 125
      and STATE_BYTES_PER_STORAGE_SET should rise from 64 to 70.
  - source: supporting/eip-8037.md
    locator: Specification / New parameters
    summary: >-
      EIP-8037 defines the existing 120-byte account and 64-byte storage-slot
      state-gas rates that EIP-8188 proposes adjusting.
  rationale: >-
    The stated SHOULD adjustments change two existing STATE_BYTES_PER_* rates,
    which matches score 1; no new charging site, budget, reservoir, or spill rule
    is introduced by EIP-8188 itself.
  confidence: medium
  uncertainty_note: >-
    The Abstract says there are no gas changes and pricing is separate, while the
    Rationale normatively says the EIP-8037 rates SHOULD increase. Whether those
    adjustments are part of EIP-8188 is materially ambiguous.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Specification / Reverts
    summary: >-
      Rolled-back metadata is restored like ordinary state; no gas credit or refund
      rule is defined.
  rationale: State journaling on revert is not a gas-refund mechanism.
  confidence: high
  uncertainty_note: The proposal explicitly disclaims gas changes.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Specification / Block Update Rule
    summary: >-
      Storage changes, deletion, creation, balance transfers, nonce increments,
      account creation, SELFDESTRUCT, reads, and reverts all receive metadata rules.
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      Post-fork writes change trie-leaf encodings and state-root computation while
      untouched legacy entries retain their prior encoding.
  rationale: >-
    A major and diverse set of existing execution tests must be reworked or
    re-derived because common account and storage mutations now produce different
    consensus state and roots, with fork, legacy, revert, and SELFDESTRUCT variants.
  confidence: high
  uncertainty_note: >-
    The sealed package contains no test inventory, so the exact number of affected
    vectors cannot be counted; the specified mutation surface is nevertheless broad.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Encoding Changes
    summary: >-
      Accounts and storage slots gain a consensus last_written_block value that is
      incorporated into their RLP and therefore into trie hashing.
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      Legacy entries default to zero and migrate only on a post-fork mutation; no
      tree transition occurs at activation.
  rationale: >-
    A broad category of otherwise unrelated post-fork state-transition tests gains
    a mechanical metadata or resulting-state-root assertion. Score 3 is not used
    because untouched pre-fork state remains valid and is not globally re-derived.
  confidence: medium
  uncertainty_note: >-
    The package does not describe the test harness or whether it asserts the field
    directly, through post-state objects, or only through the state root.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 2
  evidence:
  - source: eip.md
    locator: Encoding Changes
    summary: >-
      The state model adds metadata to both account objects and individual storage
      slots, with distinct legacy and post-fork representations.
  rationale: >-
    A transition interface must be able to convey or emit the new account-level and
    slot-level metadata, amounting to multiple new fields or an equivalent state
    representation mechanism.
  confidence: medium
  uncertainty_note: >-
    EIP-8188 specifies consensus RLP but no transition-tool schema, so the exact
    number and placement of interface fields are not determined by the package.
  exceptional_score_justification: null
- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 1
  evidence:
  - source: eip.md
    locator: Encoding Changes
    summary: >-
      Tests need to represent and compare last_written_block on accounts and slots,
      including legacy entries that imply zero.
  rationale: >-
    Existing account and storage expectation structures need at least a minor
    extension for the new metadata, but the package does not establish a new
    reusable expectation or modifier abstraction.
  confidence: low
  uncertainty_note: >-
    No test-framework design is present in the sealed sources; existing primitives
    could require either only fields or a new metadata-aware expectation.
  exceptional_score_justification: null
- id: cryptography
  label: Cryptography
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: >-
      The complete mechanism consists of RLP state metadata and mutation rules; no
      cryptographic primitive or cryptographic functionality is added or changed.
  rationale: Trie hashing reflects changed bytes, but the cryptographic mechanism itself is unchanged.
  confidence: high
  uncertainty_note: No cryptographic testing surface is specified.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Specification / Block Update Rule
    summary: >-
      The rules distinguish changed, deleted, no-op, and new slots; repeated writes;
      balance and nonce changes; reads; frame reverts; and multiple SELFDESTRUCT cases.
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      Post-fork execution permits a persistent mixture of legacy entries defaulting
      to zero and newly encoded entries after their first mutation.
  rationale: >-
    Multiple boundary-prone mechanisms form an elevated cross-product: mutation
    kind, legacy versus new encoding, same-block repetition, success versus revert,
    and SELFDESTRUCT creation and beneficiary branches.
  confidence: high
  uncertainty_note: >-
    Some account-mutation cases are not exhaustively enumerated, increasing the
    boundary surface recorded under under-specification.
  exceptional_score_justification: null
- id: block_syncing_changes
  label: Block syncing changes
  score: 0
  evidence:
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      The RLP changes apply to account and storage trie leaves and state-root
      computation; the proposal introduces no block-RLP validation mechanism.
  rationale: The anchor is limited to block RLP validation, which EIP-8188 does not modify.
  confidence: high
  uncertainty_note: State synchronization may need mixed leaf decoding, but that is outside this anchor's block-RLP scope.
  exceptional_score_justification: null
- id: engine_api_changes
  label: Engine API changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: >-
      The specification changes only execution state encoding and mutation metadata;
