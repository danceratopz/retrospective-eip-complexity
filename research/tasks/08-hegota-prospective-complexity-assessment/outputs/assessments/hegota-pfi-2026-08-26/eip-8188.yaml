  rationale: No Engine API change is introduced.
  confidence: high
  uncertainty_note: None within the sealed proposal scope.
  exceptional_score_justification: null
- id: added_system_contracts
  label: Added system contracts
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: The proposal adds state metadata and no contract deployment or system address.
  rationale: No system contract is introduced.
  confidence: high
  uncertainty_note: None within the sealed proposal scope.
  exceptional_score_justification: null
- id: modified_system_contracts
  label: Modified system contracts
  score: 1
  evidence:
  - source: eip.md
    locator: Specification / Storage slot rules
    summary: Every qualifying SSTORE changes both slot metadata and containing-account metadata.
  - source: supporting/eip-8037.md
    locator: Specification / System contracts and system transactions
    summary: Existing system-call paths can write new storage slots through stateful system contracts.
  rationale: >-
    EIP-8188 does not change system-contract code, but stateful system contracts are
    indirectly subject to the new metadata and state-root effects when they write.
    The EIP requires no irregular activation transition.
  confidence: low
  uncertainty_note: >-
    EIP-8188 does not enumerate affected system contracts or special system-call
    semantics, so the extent of this indirect effect is not fixed in the package.
  exceptional_score_justification: null
- id: added_opcodes
  label: Added opcodes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification
    summary: The update rules attach metadata to existing state operations and define no opcode number or new instruction.
  rationale: No opcode is added.
  confidence: high
  uncertainty_note: None.
  exceptional_score_justification: null
- id: modified_opcodes
  label: Modified opcodes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification / Storage slot rules
    summary: Existing SSTORE executions now update slot and account metadata for value changes, deletion, and creation.
  - source: eip.md
    locator: Specification / Account rules
    summary: Existing value-transfer, creation, and SELFDESTRUCT paths now produce additional consensus state effects.
  rationale: >-
    At least SSTORE and SELFDESTRUCT, plus value-bearing call and creation paths,
    have modified non-gas state behavior. The rubric permits only 0 or 3 for this anchor.
  confidence: high
  uncertainty_note: >-
    The exact exhaustive opcode set is not stated, but one modified existing opcode
