- id: encoding_changes_rlp_ssz
  label: Encoding changes (RLP/SSZ)
  score: 0
  evidence:
  - source: eip.md
    locator: Specification / Encoding Changes
    summary: >-
      RLP changes are confined to account and storage-slot trie-leaf values, not
