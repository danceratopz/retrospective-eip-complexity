assessment:
  snapshot_scope_summary: >-
    Execution-layer-only assessment of Draft EIP-8188 at the sealed Hegotá PFI
    snapshot. The proposal adds consensus last-written-block metadata to account
    and storage-slot state encodings, updates it on state mutation with lazy
    legacy compatibility, and directly interacts with EIPs 214, 6780, and 8037.
    No implementation, test, devnet, discussion-thread, or post-snapshot evidence
    is included.
