- id: performance_risks
  label: Performance risks
  score: 3
  evidence:
  - source: eip.md
    locator: 'Specification > Reference validity; Bounded validation work'
    summary: >-
      Adds up to sixteen pre-execution storage checks with two Keccak
      computations per reference and explicitly bounds the validation work.
  - source: eip.md
    locator: 'Specification > Public mempool handling'
    summary: >-
      Requires indexing by reference and expiry plus rechecks on head change,
      slot advance, and relevant reorgs.
  - source: eip.md
    locator: 'Rationale > Implicit source creation; Security Considerations'
    summary: >-
