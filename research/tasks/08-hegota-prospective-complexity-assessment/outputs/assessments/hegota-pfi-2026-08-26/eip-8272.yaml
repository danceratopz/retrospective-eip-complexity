  - source: eip.md
    locator: 'Specification > Activation'
    summary: >-
      Adds timestamp-boundary, pre-existing-account, and reorg-across-fork cases.
  rationale: >-
    The feature combines multiple elevated test matrices: zero through sixteen
    references, uint64 and RLP limits, current/future/old slot boundaries,
    8192-entry modulo wraparound, same-slot overwrite order, duplicates,
    warm-set deduplication, call modes, competing blocks, reorgs, and activation.
    At least the slot-window/ring-buffer and activation matrices require an
    elevated number of cases, meeting anchor 3.
  confidence: high
  uncertainty_note: >-
    Exact system-contract bytecode may add gas-boundary cases, but the specified
