assessment:
  snapshot_scope_summary: >-
    Execution-layer-only assessment of the sealed Draft EIP-8272 delta to
    EIP-8141 frame transactions. The proposal adds declared recent-root
    references, state-backed pre-execution reference validation, a stateful
    recent-root system contract, intrinsic/calldata gas additions, transaction
    introspection, one new opcode, transaction-pool handling, and fork-boundary
    initialization. No consensus-layer complexity is scored; the execution
    layer consumes the EIP-7843 slotNumber value as specified in the package.
