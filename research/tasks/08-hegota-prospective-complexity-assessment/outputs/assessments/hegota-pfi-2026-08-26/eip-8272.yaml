  rationale: >-
    Per-transaction work is bounded, yet realistic validation cannot be assessed
    solely in isolation because storage reads, warm sets, head-dependent
    validity, slot-driven expiry, reorg invalidation, transaction-pool indices,
    and unbounded aggregate source creation interact with existing critical
    paths. Those complex interactions meet anchor 3.
  confidence: medium
  uncertainty_note: >-
    RECENT_ROOT_CODE and workload distributions are unspecified, so the exact
    performance magnitude remains uncertain even though validation is capped at
    sixteen references per transaction.
  exceptional_score_justification: null
