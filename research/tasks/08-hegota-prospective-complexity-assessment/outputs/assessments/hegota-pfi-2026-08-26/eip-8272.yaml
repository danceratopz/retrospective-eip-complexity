criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: 'Specification > Gas accounting'
    summary: >-
      Defines per-reference intrinsic gas and adds reference calldata cost,
      intrinsic gas, and calldata tokens to EIP-8141 gas quantities.
  - source: supporting/eip-8141.md
    locator: 'Specification > Frame Transaction > Gas Accounting'
    summary: >-
      Defines the existing standard gas limit, calldata floor, max gas, and
      settlement quantities that EIP-8272 changes.
  rationale: >-
    A new per-reference intrinsic charge is introduced and is wired into the
    existing frame-transaction standard limit, calldata floor, token count,
    maximum gas, and settlement path. This changes existing gas vectors and
    therefore meets anchor 3.
  confidence: high
  uncertainty_note: >-
    RECENT_ROOT_CODE is TBD, so exact gas vectors for calls to the system
    contract cannot yet be baselined; the score follows from the fully specified
    transaction-level accounting changes.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: 'Specification > Reference validity'
    summary: >-
      Places recent-root storage checks after the nonce check and before frame
      execution, outside opcode execution.
  - source: eip.md
    locator: 'Specification > TXPARAM and RECENTROOTREFLOAD'
    summary: >-
      States that RECENTROOTREFLOAD reads only signed-envelope fields and does
      not read recent-root contract storage.
  rationale: >-
    The proposal adds a transaction-level pre-execution state check, but it does
    not move a state access or gas charge within any opcode. The new opcode is
    envelope introspection without state access, so this anchor is zero.
  confidence: high
  uncertainty_note: No material uncertainty for this anchor in the sealed text.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: 'Specification > Transaction payload'
    summary: >-
      Inserts recent_root_references after blob_versioned_hashes and states that
      no other payload field is changed.
  - source: eip.md
    locator: 'Specification > Gas accounting'
    summary: >-
      Changes execution/calldata gas quantities while leaving EIP-8141 max_gas,
      gas_used, and fee settlement definitions in place.
  rationale: >-
    The blob hash field is only an insertion point in the payload. No blob gas
    price, limit, usage, or fee-accounting rule is changed.
  confidence: high
  uncertainty_note: No blob-gas behavior is left open by the proposal.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: 'Specification > Recent root contract'
    summary: >-
      Specifies ordinary storage writes and says successful calls follow normal
      EVM execution and gas accounting.
  - source: eip.md
    locator: 'Security Considerations'
    summary: >-
      Describes persistent state growth and leaves any future registration or
      first-write surcharge to a future version.
  rationale: >-
    Recent-root writes use the already applicable state-write charging rules.
    This EIP neither adjusts a state-gas rate nor creates a new state-gas site,
    budget, reservoir, or spill mechanism.
  confidence: medium
  uncertainty_note: >-
    The system-contract bytecode is TBD, but the normative text explicitly
    assigns its writes normal accounting rather than a new state-gas mechanism.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: 'Specification > Gas accounting'
    summary: >-
      Defines additive intrinsic and calldata charges without defining a refund
      counter change or refund condition.
  rationale: No gas-refund mechanism is introduced or modified.
  confidence: high
  uncertainty_note: No material uncertainty for this anchor in the sealed text.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: 'Specification > Transaction payload'
    summary: >-
      Inserts a mandatory field into the existing frame-transaction payload and
      changes the canonical signing payload.
  - source: eip.md
    locator: 'Specification > Gas accounting'
    summary: >-
      Changes gas quantities even when the new reference list is represented in
      an otherwise existing frame-transaction test.
  - source: eip.md
    locator: 'Specification > Activation'
    summary: >-
      Changes the accepted payload and signature domain across the activation
      boundary and requires pre-fork transactions to be regenerated.
  rationale: >-
    Existing frame-transaction encoding, signing, intrinsic-gas, fork-boundary,
    validation, and mempool cases require reworking. The affected cases span
    multiple diverse test categories rather than a contrived subset, meeting
    anchor 3.
  confidence: medium
  uncertainty_note: >-
    The package contains no test inventory; breadth is derived from the proposal's
    normative changes to every post-activation frame-transaction envelope.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 1
  evidence:
  - source: eip.md
    locator: 'Specification > Activation'
    summary: >-
      Requires the activation block to create or initialize RECENT_ROOT_ADDRESS
      before executing any transaction.
  rationale: >-
    Pre-existing activation-boundary state-transition cases gain a narrow new
    state invariant for the initialized recent-root account even when their
    transaction logic is unrelated. The invariant is confined to fork-boundary
    cases, so anchor 1 applies rather than a broad mechanical assertion.
  confidence: medium
  uncertainty_note: >-
    The package does not describe how test vectors expose implicit activation
    state, so the score is limited to the clearly required narrow invariant.
  exceptional_score_justification: null
