criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: '§ Abstract; § Specification > Gas costs; § Test Cases bullets 2-4'
    summary: >-
      In-window BLOCKHASH keeps its own charge and additionally applies cold or
      warm SLOAD cost for the corresponding history slot.
  rationale: >-
    The gas accounting of an existing opcode is updated by composing it with the
    existing SLOAD schedule; no separate new gas-accounting mechanism is defined.
  confidence: high
  uncertainty_note: >-
    The amounts are inherited from the active fork, while their exact ordering is
    handled separately under state-access ordering and under-specification.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 1
  evidence:
  - source: eip.md
    locator: '§ Specification, resolve_blockhash pseudocode and following SLOAD-effects list'
    summary: >-
      A single existing opcode now conditionally performs an SLOAD-like access,
      charge, warm-up, and state-access record after its window checks.
  - source: eip.md
    locator: '§ Test Cases bullets 1-4'
    summary: >-
      Out-of-window calls have no storage effects, while in-window calls distinguish
      cold and warm slots and retain the BLOCKHASH charge.
  rationale: >-
    The state-access and gas-charge path changes for the one BLOCKHASH opcode, which
    matches the single-opcode anchor.
  confidence: medium
  uncertainty_note: >-
    The text does not explicitly order the original BLOCKHASH charge, the SLOAD
    charge, access recording, and warming at every insufficient-gas boundary.
  exceptional_score_justification: null
