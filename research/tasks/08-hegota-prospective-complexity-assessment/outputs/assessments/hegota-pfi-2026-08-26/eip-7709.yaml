totals:
  primary_score: 20
  complexity_tier: medium
under_specification:
  present: true
  summary: >-
    The draft fixes the result, slot, and required SLOAD-like effects, but does not
    explicitly specify their ordering relative to the original BLOCKHASH charge at
    insufficient-gas boundaries. It also leaves the fork timestamp and concrete
    satisfaction of the EIP-2935 history-age prerequisite unresolved.
  affected_criteria:
  - state_access_ordering_within_opcode_execution
  - edge_boundary_conditions
  - unspecified_behavior_requiring_cross_client_consensus
  - cross_eip_interactions
  plausible_total_range:
    minimum: 18
    maximum: 21
  plausible_tiers:
  - medium
  unresolved_questions:
  - >-
    In what exact order are the base BLOCKHASH charge, cold/warm determination, SLOAD
    charge, state-access recording, and slot warming applied when available gas ends between steps?
  - >-
    What FORK_TIMESTAMP will be used, and how is the requirement for at least 256 prior
    EIP-2935 blocks (or genesis activation) guaranteed for each activated network?
  - >-
    If that activation-age assumption is violated, is the value read from the unfilled
    history slot authoritative, or must clients apply another behavior?
notable_ambiguities:
- >-
  “Entire semantics and effects of SLOAD” is clear about the required effect set but
  not about its placement relative to the pre-existing BLOCKHASH charge.
- >-
  Three resolution strategies are allowed, so clients must demonstrate identical gas,
  warming, and access-recording behavior without a single prescribed execution path.
- >-
  The activation section states prerequisites as assumptions and does not normatively
  define behavior for a deployment that violates them.
overall_confidence: medium
