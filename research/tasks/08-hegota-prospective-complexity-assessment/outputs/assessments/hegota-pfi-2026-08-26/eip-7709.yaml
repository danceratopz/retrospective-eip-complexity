assessment:
  snapshot_scope_summary: >-
    Execution-layer assessment of the draft EIP-7709 snapshot. The proposal changes
    the existing BLOCKHASH opcode so that in-window lookups have the gas, warming,
    and state-access-recording effects of an SLOAD from the EIP-2935 history
    contract's ring-buffer slot, while preserving the existing return-value window.
