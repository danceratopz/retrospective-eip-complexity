  - source: eip.md
    locator: Test Cases
    summary: >-
      Requires cases for the calldata-plus-SLOAD boundary, cold SSTORE, net-zero
      and repeated writes, and reverted value-bearing calls.
  rationale: >-
    Existing gas-boundary and state-transition tests across diverse opcode,
    revert, creation, delegation, and transaction-content categories require
