assessment:
  snapshot_scope_summary: >-
    Execution-layer assessment of the Draft EIP-8279 snapshot. The proposal
    extends the EIP-8131 transaction-content floor with per-transaction runtime
    metering of EIP-7928 BAL bytes, a static per-authorization BAL term, an
    SSTORE value-byte subtraction, runtime floor OOG checks, and a final
    max(execution_gas_used, floor_gas_used) charge. System calls and withdrawals
    remain outside the per-transaction floor and are left to EIP-7928's
    block-level item buffer.
