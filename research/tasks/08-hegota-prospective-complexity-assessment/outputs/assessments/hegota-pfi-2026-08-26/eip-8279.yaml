criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Data meter and floor accumulator
    summary: >-
      Introduces per-transaction bal_data_bytes and floor_gas_used counters,
      extends the floor at runtime, and raises OutOfGasError when the new floor
      exceeds tx.gas.
  - source: eip.md
    locator: Specification > Final charge
    summary: Sets tx.gasUsed to the maximum of execution gas and the runtime floor.
  rationale: >-
    A new runtime gas-floor mechanism changes the existing EIP-7623/EIP-8131
    charging shape, transaction OOG behavior, and final gas used across existing
    state-accessing operations, so existing gas tests are affected.
  confidence: high
  uncertainty_note: >-
    The SSTORE subtraction's revert handling is under-specified separately; it
    does not change that a broad new runtime gas mechanism exists.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Data meter and floor accumulator
    summary: >-
      Requires meter_bal_data before the matching BAL insertion or state
      mutation, with OOG aborting the operation before an unpaid BAL byte exists.
  - source: eip.md
    locator: Specification > Runtime data metering
    summary: >-
      Applies this placement rule to cold account and storage access, SSTORE,
      value-bearing CALL and SELFDESTRUCT, and CREATE/CREATE2 nonce, balance, and
      code changes.
  rationale: >-
    The new consensus-visible floor check is inserted before BAL growth or state
    mutation for a whole class of state-accessing operations. Its OOG boundary
    therefore changes whether an access or change occurs across many opcodes.
  confidence: high
  uncertainty_note: >-
    Exact placement relative to every existing gas deduction is not enumerated,
    increasing implementation uncertainty without reducing the anchored breadth.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Static floor seed
    summary: >-
      Reuses EIP-8131 tx_floor as the static seed and adds BAL bytes per
      authorization; it specifies no blob-gas budget, price, or fee update.
  rationale: >-
    Blob versioned hashes are already part of the inherited static transaction
    floor, but EIP-8279 makes no change to blob gas accounting itself.
  confidence: high
  uncertainty_note: No blob-gas mechanism is described in the proposal.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Rationale > Counter, not a reservation
    summary: >-
      States that execution gas accounting is untouched and the counters only
      determine the transaction floor and final retained gas.
  rationale: >-
    The proposal changes the ordinary transaction gas floor, not StateGasCosts,
    per-state-byte write rates, a block state-gas budget, or its spill path.
  confidence: high
  uncertainty_note: No state-gas construct defined by this anchor appears in the package.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Runtime data metering
    summary: >-
      Subtracts 32 bytes from bal_data_bytes when SSTORE returns a slot to its
      pre-transaction value and recomputes floor_gas_used.
  - source: eip.md
    locator: Rationale > Meter before; refund only when bytes leave the BAL
    summary: >-
      Defines the subtraction by EIP-7928's no-op-write rule and explicitly
      distinguishes it from the EIP-3529 SSTORE gas refund.
  rationale: >-
    This is a new state-dependent reduction of charged floor gas. It is narrower
    than the global refund counter but affects SSTORE/floor test outcomes and
    requires per-slot original/current-value tracking, satisfying score 2.
  confidence: medium
  uncertainty_note: >-
    The package conflicts on whether a subtraction made inside a later-reverted
    frame is retained or undone; that material gap is recorded below.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Runtime data metering
