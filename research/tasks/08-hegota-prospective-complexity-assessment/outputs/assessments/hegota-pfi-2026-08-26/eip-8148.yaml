  - source: eip.md
    locator: Specification > Execution layer > Set sweep threshold request contract > System Call
    summary: Every block executes a new gas-exempt system call with a dedicated 30,000,000 gas limit and invalidates the block if it fails.
  - source: eip.md
    locator: Specification > Execution layer > Set sweep threshold request contract > Fee calculation
