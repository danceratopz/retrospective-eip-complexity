  - source: eip.md
    locator: Specification > Execution layer > Set sweep threshold request
    summary: EIP-8148 adds one request type and opaque request data but specifies no transition-tool field.
  rationale: The existing EIP-7685 request mechanism can carry type 0x03 without a specified tool-interface change.
  confidence: medium
