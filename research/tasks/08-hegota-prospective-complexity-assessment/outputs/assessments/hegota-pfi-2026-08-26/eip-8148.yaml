criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Set sweep threshold request contract > System Call
    summary: >-
      The new system call has a dedicated 30,000,000 gas limit; its gas is excluded
      from block gas accounting and block gas-limit checks, it transfers no value under
      EIP-1559 semantics, and it is exempt from the EIP-7825 transaction cap.
  - source: supporting/eip-7002.md
    locator: Specification > Execution layer > Withdrawal Request Contract > System Call
    summary: >-
      The sealed baseline already defines the same dedicated, block-excluded gas treatment
      for an existing request-predeploy system call.
  rationale: >-
    EIP-8148 extends an existing special system-call gas-accounting pattern to one new
    mandatory call. This updates the set of calls using the existing mechanism rather
    than creating a distinct gas-accounting mechanism.
  confidence: medium
  uncertainty_note: >-
    The gas exclusions are explicit, but the rubric does not state whether another
    instance of an existing system-call pattern should be treated as a mechanism update
    or a new mechanism.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Set sweep threshold request contract > Bytecode
    summary: >-
      The proposal supplies bytecode for a new contract using existing EVM operations;
      it specifies no change to state access or gas-charge ordering inside an opcode.
  rationale: >-
    Contract-level SLOAD and SSTORE sequencing is new program behavior, not a change to
    the consensus semantics or internal state-access ordering of any opcode.
  confidence: high
  uncertainty_note: No package evidence indicates an opcode-internal ordering change.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Constants > Execution layer
    summary: >-
      The constants define request-queue, fee, and system-contract parameters and no blob
      gas parameter or blob gas rule.
  rationale: The execution-layer proposal does not alter blob gas accounting.
  confidence: high
  uncertainty_note: No blob mechanism appears in any specified EIP-8148 execution path.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Set sweep threshold request contract
    summary: >-
      The contract performs ordinary EVM storage reads and writes for its queue, count,
      and excess value; it defines no StateGasCosts, state-byte rate, state budget, or spill path.
  rationale: Persistent contract storage is introduced, but no state-gas accounting rule is changed.
  confidence: high
  uncertainty_note: No rubric-defined state-gas mechanism is specified in the package.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Set sweep threshold request contract > Add Set Sweep Threshold Request
    summary: >-
      The call only requires msg.value to cover the dynamic request fee and specifies no
      EVM gas refund or modification to refund accounting.
  rationale: The request fee is value paid to a contract, not an EVM gas-refund mechanism.
  confidence: high
  uncertainty_note: No refund behavior is introduced by the execution-layer specification.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Set sweep threshold request contract > System Call
    summary: >-
      Every execution block from FORK_BLOCK performs an additional stateful system call
      after all transactions, and missing code or call failure invalidates the block.
  - source: eip.md
    locator: Backwards Compatibility
    summary: >-
      The proposal states that it makes backwards-incompatible changes to block structure
      and block validation rules.
  rationale: >-
    Existing post-fork block/state-transition cases across transaction, gas-boundary,
    invalid-block, and synchronization categories must incorporate the mandatory call,
    predeploy state, and request output, so a diverse major subset is reworked.
  confidence: medium
  uncertainty_note: >-
    The package contains no test inventory, so the exact fraction of pre-existing vectors
    is uncertain even though the every-block transition is explicit.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Execution layer > Set sweep threshold request
    summary: >-
      Dequeued requests must be emitted as type 0x03 request data, with threshold encoded
      little-endian.
  - source: supporting/eip-7685.md
    locator: Specification > Execution Layer > Block Header
    summary: >-
      All non-empty request objects are ordered by request type and committed through
      requests_hash, while empty request data is excluded.
  rationale: >-
    A broad set of post-fork request-aware vectors gains mechanical expected-output and
    commitment checks for type 0x03. The stable empty-request hash prevents this from
    forcing a new non-empty assertion in every test or re-deriving pre-fork vectors.
  confidence: medium
  uncertainty_note: >-
    The sealed package does not describe the test harness, so whether all broad request
    assertions are already generic is not established.
  exceptional_score_justification: null
