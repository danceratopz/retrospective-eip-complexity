- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 3
  evidence:
  - source: eip.md
    locator: Front matter > requires
    summary: The proposal normatively requires EIP-7251 and EIP-7685.
  - source: eip.md
    locator: Specification > Execution layer > Set sweep threshold request contract > System Call
    summary: The new call is explicitly exempted from EIP-7825 and EIP-1559 behavior and aligns with EIP-7002 system-call behavior.
  - source: supporting/eip-7685.md
    locator: Specification > Execution Layer > Block Header
    summary: Requests from all types share ordered request hashing, requiring mixed type 0x01, 0x02, and 0x03 cases.
  rationale: >-
    EIP-8148 strongly depends on 7251 for compounding-validator semantics and on 7685 for
    transport and commitment. It coexists with the 7002 and 7251 request predeploys and
    has explicit gas-semantic exceptions for 1559 and 7825. These five interactions span
    request ordering/hash, end-of-block execution, gas rules, and validator-request
    semantics, requiring coordinated cross-EIP tests. Five interacting EIPs do not reach
    the rubric's first +1 threshold, which starts at six.
  confidence: high
  uncertainty_note: EIP-7002 is partly a design analogue, but mixed request ordering and shared system-call processing make its interaction test-relevant.
