  exceptional_score_justification: null
- id: performance_risks
  label: Performance risks
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Index tables
    summary: >-
      Each block's transactions and every log address/topic produce variable-length
      entries that must be sorted, hashed, and Merkleized.
  - source: eip.md
    locator: Specification > Block processing
    summary: >-
      Five levels are maintained, and higher-level table merges must finish by
      table-size-dependent delayed block-processing deadlines.
  - source: eip.md
    locator: Specification > Initializing after chain/state sync
    summary: The worst first post-sync update requires data from 319 recent blocks.
  rationale: >-
    Work scales with transaction and log content, interacts with receipt production,
    periodic multi-level merging, block deadlines, storage updates, and sync recovery.
    End-to-end and adversarial-content performance cannot be established by one
    isolated microbenchmark and can substantially affect validation behavior.
  confidence: high
  uncertainty_note: >-
    The EIP asserts low single-block cost and asynchronous larger merges but gives no
    processing bounds, benchmark results, or maximum entry/tree size.
  exceptional_score_justification: null
- id: security_risks
  label: Security risks
  score: 2
  evidence:
  - source: eip.md
    locator: Security Considerations
    summary: >-
      The hot system-contract storage branches are identified as susceptible to
      branch-poisoning attempts intended to slow state-root updates.
  - source: eip.md
    locator: Abstract
    summary: The stored roots are intended to authenticate trustless log and transaction lookups.
  - source: eip.md
    locator: Specification > Indexing rules
    summary: Commitments combine block hashes, transaction hashes, and receipt logs.
  rationale: >-
    Root correctness and update availability affect trustless proofs and consensus
    state, while hot storage creates a targeted resource-attack surface. The
    interactions are concentrated in index derivation and its system contract, so
    targeted review and fuzzing fit better than the broadest security anchor.
  confidence: medium
  uncertainty_note: >-
    Missing commitment parameters and deployment constants prevent complete proof-
    soundness and adversarial-storage analysis at this snapshot.
  exceptional_score_justification: null
- id: unspecified_behavior_requiring_cross_client_consensus
