  rationale: >-
    Previously uncommitted transaction/log indexing becomes consensus-visible through
    contract storage and the block state root, yet root-defining SSZ parameters and
    activation deployment values are absent. Constructible blocks therefore lack a
    unique expected state until clients agree and the draft is amended.
  confidence: high
  uncertainty_note: >-
    No package evidence establishes implementations, devnet baselines, or resolutions
