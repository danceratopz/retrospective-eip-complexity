    needed to derive roots is not stated; the index-contract address and most fields
    of its synthetic deployment are TBD; and the transition/testing interface and
    bounded asynchronous merge obligations are not specified. These are recorded
    once here rather than being multiplied across otherwise unrelated zero-score anchors.
