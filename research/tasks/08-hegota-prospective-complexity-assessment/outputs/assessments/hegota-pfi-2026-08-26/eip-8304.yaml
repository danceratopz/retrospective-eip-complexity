  exceptional_score_justification: null
- id: cross_eip_interactions
  label: Cross-EIP interactions
  score: 3
  evidence:
  - source: eip.md
    locator: Front matter; Specification > Block processing; Specification > EIP-161 handling
    summary: >-
      EIP-8304 requires 4788, reuses its system-operation convention, adopts 1559
      burn exceptions, and applies 161 deployment-cleanup handling.
  - source: eip.md
    locator: Motivation > Synergy with ZKP batched pre-checks; Specification > Alternative index contracts
    summary: The proposal identifies interactions with frame transactions and ETH-transfer logs.
  - source: supporting/eip-7708.md
    locator: Specification > ETH transfer logs
    summary: EIP-7708 adds protocol-generated logs that become EIP-8304 index entries.
  - source: supporting/eip-8141.md
    locator: Specification > Receipt Encoding
    summary: >-
      Frame receipts define transaction logs as concatenated per-frame logs for block
      bloom and log indexing, requiring coordinated entry extraction.
  rationale: >-
    Coordinated vectors are required for EIPs 161, 1559, and 4788 around deployment
    and system-call semantics, and for EIPs 7708 and 8141 around newly generated logs
    and frame-receipt indexing. These span multiple strong interactions, but five
    identified EIPs do not trigger the rubric's first three-additional-EIP bonus.
  confidence: high
  uncertainty_note: >-
    The precise fork combination is outside the package; the score uses only the
    explicit and supporting-document interactions sealed here.
  exceptional_score_justification: null
