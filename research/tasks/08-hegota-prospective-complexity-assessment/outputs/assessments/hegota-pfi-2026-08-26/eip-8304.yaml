assessment:
  snapshot_scope_summary: >-
    Execution-layer assessment of the Draft EIP-8304 snapshot. The proposal derives
    SSZ/SHA2-256 index-table roots from every block's transactions, receipts, logs,
    and delayed parent block hash; periodically merges those tables across five
    levels; and writes the roots through a new stateful system contract. No
    consensus-layer behavior is scored.
