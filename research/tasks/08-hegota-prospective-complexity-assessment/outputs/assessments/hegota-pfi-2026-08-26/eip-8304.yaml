criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Block processing
    summary: >-
      Each root update is a 30,000,000-gas system call that must complete, is
      excluded from the block gas limit, and does not apply EIP-1559 burn semantics.
  - source: eip.md
    locator: Specification > Gas costs
    summary: The proposal explicitly leaves LOG-operation gas costs unchanged.
  rationale: >-
    The proposal applies the existing gas-exempt system-operation convention to a
    new mandatory call, updating an existing accounting path without changing
    opcode prices or introducing a new metering mechanism.
  confidence: medium
  uncertainty_note: >-
    The text is explicit about the system call and unchanged LOG costs, but does
    not separately classify this convention as an EVM gas-rule change.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Block processing
    summary: The new root-write call occurs after processing all transactions.
  - source: eip.md
    locator: Specification > Gas costs
    summary: Existing LOG operations retain their gas cost.
  rationale: >-
    The new work is a block-level post-transaction operation; no opcode's internal
    state-access point or gas-charge ordering is changed.
  confidence: high
  uncertainty_note: No opcode-internal ordering change is specified.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Block processing
    summary: The specified accounting exception concerns only the index-contract system call.
  rationale: No blob gas rule, charge, budget, or field is introduced or modified.
  confidence: high
  uncertainty_note: The proposal contains no blob-gas behavior.
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Index contract > set
    summary: Root updates use ordinary storage writes in the index contract.
  - source: eip.md
    locator: Specification > Block processing
    summary: The proposal specifies only the system call's execution-gas treatment.
  rationale: >-
    The stateful contract adds storage writes but defines no new state-gas rate,
    charging site, budget, reservoir, or execution-gas spill rule.
  confidence: medium
  uncertainty_note: >-
    The draft does not state how its gas-exempt system operation relates to a
    separate state-gas regime; that omission is recorded as under-specification,
    not scored as an introduced mechanism.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Gas costs
    summary: The only gas-cost statement is that LOG costs need not increase.
  rationale: No gas-refund mechanism is added or changed.
  confidence: high
  uncertainty_note: The proposal contains no refund behavior.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Indexing rules
    summary: >-
      Every transaction, every log address/topic, and a delayed parent block hash
      contribute entries to the index.
  - source: eip.md
    locator: Specification > Block processing
    summary: >-
      Every active block generates a level-0 table and may generate delayed
      higher-level tables, with all resulting roots written to contract storage.
  rationale: >-
    Existing post-fork block tests across transactions, empty blocks, logs, state
    roots, block hashes, and periodic boundaries must incorporate the mandatory
    index transition. This is a major, diverse regression surface.
  confidence: high
  uncertainty_note: >-
    The package does not expose the existing test corpus, so the exact count of
    reworked vectors is unknown; the mandatory behavior itself spans diverse test categories.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Block processing
    summary: Every active block commits generated table roots into index-contract storage.
  - source: eip.md
    locator: Specification > Index tables > Table root hash calculation
    summary: Each expected root commits to the sorted encoded-entry list.
  rationale: >-
    A broad category of post-fork tests gains a mechanically derived index-root and
    system-state expectation even when indexing is not the test's subject. The rule
    does not apply before activation, so the score stops below the every-vector anchor.
  confidence: high
  uncertainty_note: >-
    Test harnesses may assert this indirectly through the state root rather than as
    a dedicated field, but the new expected state is still mandatory.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Initializing after chain/state sync
    summary: >-
      A client can require the latest 319 blocks to construct a highest-level root
      for the first validated block after sync.
  - source: eip.md
    locator: Specification > Block processing
    summary: Higher-level outputs depend on delayed merging of earlier block ranges.
  rationale: >-
    A single-block transition interface needs a new mechanism to supply or retain
    recent blocks and prior table material so it can derive periodic roots. That is
    more than one isolated scalar field, but the EIP does not prescribe the exact interface.
  confidence: medium
  uncertainty_note: >-
    No transition-tool schema is included, so whether implementations use one
    history object, several fields, or externally prepared tables remains open.
  exceptional_score_justification: null
- id: new_test_framework_primitives
  label: New test-framework primitives
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > Index tables
    summary: >-
      Tests must generate typed binary entries, sort them lexicographically, hash
      them, and construct fixed-depth SSZ-list roots.
  - source: eip.md
    locator: Specification > Block processing
    summary: Tests must also schedule immediate and delayed roots across five levels.
  rationale: >-
    Reusable index-table construction, merge, and delayed-schedule expectations are
    new primitives needed throughout this EIP's tests, rather than ordinary test
    functions using only scalar expectations.
  confidence: medium
  uncertainty_note: >-
    The sealed package contains no test-framework inventory, so permanence or reuse
    outside this EIP cannot be established.
  exceptional_score_justification: null
- id: cryptography
  label: Cryptography
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Index tables > Table root hash calculation
    summary: >-
      The root is the SSZ-list root of SHA2-256 hashes of the binary encoded entries.
  rationale: >-
    The proposal introduces one commitment construction composed of established
    SHA2-256 hashing and SSZ Merkleization; it is well known rather than novel.
  confidence: high
  uncertainty_note: >-
    The construction's missing fixed depth/list limit is a consensus-specification
    gap, but does not make the underlying cryptography novel.
  exceptional_score_justification: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Indexing rules
    summary: >-
      Block entries are delayed by one block, genesis has no block entry, and
      multi-block ranges use an offset block-hash interval.
  - source: eip.md
    locator: Specification > Block processing
    summary: >-
      Five levels have alignment and activation conditions, while higher levels
      use table-size-dependent delays.
  - source: eip.md
    locator: Specification > Index contract > get
    summary: >-
      Reads enforce calldata length, divisibility, initialization, validity, and
      ring-buffer overwrite conditions relative to the current block number.
  rationale: >-
    Genesis, activation, empty tables, level alignment, delayed availability,
    five table sizes, and 1,024-slot wraparound create multiple interacting boundary
    mechanisms. The schedule-by-level and overwrite combinations require an elevated case count.
  confidence: high
  uncertainty_note: >-
    The missing SSZ depth/list limit prevents the exact empty and maximum-table
    boundary vectors from being baselined.
  exceptional_score_justification: null
- id: block_syncing_changes
  label: Block syncing changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Initializing after chain/state sync
    summary: >-
      The EIP explicitly says the sync protocol need not be extended; tables can be
      regenerated from recent blocks, with up to 319 blocks required.
  rationale: >-
    Regeneration adds local post-sync work, but no block-RLP validation mechanism or
    sync-protocol encoding is introduced, which is the scope of this anchor.
  confidence: high
  uncertainty_note: >-
    The 319-block retention/download requirement is a performance and initialization
    concern, not a scored RLP syncing change.
  exceptional_score_justification: null
- id: engine_api_changes
  label: Engine API changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Block processing
