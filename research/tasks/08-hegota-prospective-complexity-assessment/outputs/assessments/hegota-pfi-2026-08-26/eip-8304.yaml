  label: New fork activation mechanism
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Index contract > Deployment
    summary: A synthetic deployment transaction is specified for the new system contract.
  - source: eip.md
    locator: Specification > EIP-161 handling
    summary: The deployed account has code and nonce 1 and is exempt from empty-account cleanup.
  - source: eip.md
    locator: Specification > Block processing
    summary: Tables are generated only when the EIP was active at the table's first block.
  rationale: >-
    Activation installs code and initializes an account nonce, an explicit irregular
