- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Transaction floor; Specification > Charging
    summary: >-
      Defines a content-count-based tx_floor and uses it in transaction gas-limit
      validity and gas-used maximum calculations.
  - source: supporting/eip-7623.md
    locator: Specification
    summary: >-
      Defines the pre-existing calldata floor and the max-shaped transaction gas
      accounting that EIP-8131 says it preserves.
  rationale: >-
    EIP-8131 updates the existing transaction floor by adding content categories
    and unifying the rate; it does not introduce a separate gas meter or replace
    the max-based accounting shape.
  confidence: medium
  uncertainty_note: >-
    The score treats the proposal as an update to the EIP-7623 family of floor
    rules. The undefined scope of execution_gas_used is recorded separately as
