totals:
  primary_score: 18
  complexity_tier: medium
under_specification:
  present: true
  summary: >-
    The charging rule does not define execution_gas_used, and its compact formula
    does not state how ordinary intrinsic components are combined with the new
    floor. In addition, saying that EIP-7981 is folded into the unified rule while
    keeping intrinsic gas unchanged leaves unclear whether its flat access-list
    data surcharge is retained, replaced, or double-counted. These are localized
    gas-accounting and validity questions. Separately, the 108-byte authorization
    constant is clear to implement but does not match the claimed maximum under
    the linked EIP-7702 field bounds.
  affected_criteria:
  - evm_gas_rule_changes
  - new_or_modified_transaction_validity_mechanisms
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 17
    maximum: 21
  plausible_tiers:
  - medium
  unresolved_questions:
  - >-
    Does execution_gas_used in tx.gasUsed include TX_BASE, standard calldata and
