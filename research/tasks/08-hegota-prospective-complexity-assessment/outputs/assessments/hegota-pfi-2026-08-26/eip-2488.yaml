under_specification:
  present: true
  summary: >-
    The specification says only that post-fork CALLCODE always returns 0. It does
    not determine whether existing gas processing or state access occurs before
    that result, which other existing instruction effects remain, or a concrete
    FORK_BLOCK value. Test cases, implementation, and security considerations
    are also TBA.
  affected_criteria:
  - evm_gas_rule_changes
  - state_access_ordering_within_opcode_execution
  - unspecified_behavior_requiring_cross_client_consensus
  plausible_total_range:
    minimum: 10
    maximum: 12
  plausible_tiers:
  - low
  - medium
  unresolved_questions:
  - Does CALLCODE retain its existing gas accounting before returning the forced failure value?
  - Does CALLCODE perform any state access after activation, and where is gas charged relative to it?
  - Which existing CALLCODE effects other than its returned result remain in force?
  - What concrete activation block replaces FORK_BLOCK?
notable_ambiguities:
- >-
  "Always returns 0" does not say whether the instruction follows any of its
  existing execution path before producing that result.
- >-
  The backwards-compatibility claim about valuable contracts is explicitly
  unvalidated, and security considerations are absent.
