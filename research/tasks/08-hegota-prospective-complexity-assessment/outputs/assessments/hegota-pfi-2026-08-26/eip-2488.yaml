assessment:
  snapshot_scope_summary: >-
    Execution-layer assessment of the proposal to change CALLCODE (0xf2) at
    FORK_BLOCK so that it always returns 0. The sealed package describes a
    localized but breaking opcode deprecation, declares EIP-7 as a dependency,
    and leaves detailed opcode effects, tests, implementation, and security
    considerations unresolved.
