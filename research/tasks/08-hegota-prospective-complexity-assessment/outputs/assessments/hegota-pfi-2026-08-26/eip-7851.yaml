criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 1
  evidence:
  - source: eip.md
    locator: Specification > Parameters; Specification > SETSELFDELEGATE
    summary: SETSELFDELEGATE has a fixed cost of 9500 for every execution attempt.
  rationale: >-
    Adding a fixed charge for one opcode updates the existing opcode gas-cost
    mechanism; it does not introduce a separate or dynamic execution-gas model.
  confidence: high
  uncertainty_note: >-
    The amount is explicit, but charge ordering relative to checks and state
    access is unspecified and scored in the state-access-ordering row.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 2
  evidence:
  - source: eip.md
    locator: Specification > SETSELFDELEGATE, execution rules 1-3
    summary: >-
      The new opcode charges 9500, checks the authority's raw code, and may
      replace that code, without explicitly ordering the charge and accesses.
  rationale: >-
    A new state-accessing and state-writing operation is introduced whose
    position in the gas/access order must be settled, matching score 2.
  confidence: high
  uncertainty_note: >-
    Ordering relative to the static check, raw-code read, no-op branches, and
    code write is not specified.
  exceptional_score_justification: null
