    Execution-layer assessment of the Draft EIP-7851 snapshot. The proposal
    extends EIP-7702 with an ECDSA-disabled delegation prefix, adds the
    state-writing SETSELFDELEGATE opcode, changes delegated-code recognition,
    and adds authorization, transaction-validity, and transaction-pool rules.
