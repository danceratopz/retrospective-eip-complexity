    summary: >-
      The EIP fixes a custom length-tagged Poseidon2 BN254 sponge and three
      Merkle-tree constructions with domain-separated commitment formulas.
  - source: eip.md
    locator: 'Sections 4, 5.5, and 8.1, split proofs and verification'
    summary: >-
      A fork-managed Groth16 proof, permissionless auth proofs, embedded
      verification key, and two-value cross-proof coupling jointly enforce the
      spend relation.
  rationale: >-
    Multiple mechanisms are introduced, including a custom Poseidon2 sponge
    construction and a compound Groth16/auth-proof protocol with commitments,
    nullifiers, and Merkle membership. At least the composed relation and
    cross-proof binding are proposal-specific and demand dedicated vectors and
    adversarial testing.
  confidence: high
  uncertainty_note: >-
