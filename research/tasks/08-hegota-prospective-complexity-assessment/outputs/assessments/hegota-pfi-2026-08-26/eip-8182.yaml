- id: performance_risks
  label: Performance risks
  score: 2
  evidence:
  - source: eip.md
    locator: 'Sections 5.2, 5.4, and 5.5; Security Considerations, State Growth'
    summary: >-
      Each spend combines Groth16 verification over 19 public inputs,
      auth-verifier staticcall, multiple state-set writes, three tree
      insertions, payload hashing, and optional external asset transfer; pool
      state is append-only and not safely prunable.
  - source: eip.md
    locator: 'Rationale, Groth16 BN254 Pool Proof System'
    summary: >-
      Verification gas is dominated by 19 scalar multiplications and a final
      pairing.
  rationale: >-
    Core proof and tree operations can be benchmarked directly, but cumulative
    state growth, arbitrary auth-verifier code, ERC-20 behavior, payload sizes,
    and root-history throughput prevent complete isolation. The EIP adds a new
    path rather than broadly changing existing execution benchmarks, fitting
    score 2.
  confidence: medium
  uncertainty_note: >-
