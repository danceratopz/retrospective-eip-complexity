  rationale: >-
    The mechanism touches multiple critical components and custody invariants;
    an implementation error can compromise pool funds or authorization while
    other errors can cause replay, lockout, leakage, or denial of service. It
    requires extensive security review and fuzzing.
  confidence: high
  uncertainty_note: >-
