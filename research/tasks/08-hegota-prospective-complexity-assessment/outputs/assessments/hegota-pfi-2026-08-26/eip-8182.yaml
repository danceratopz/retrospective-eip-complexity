- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: 'Abstract; Section 5, System Contract'
    summary: >-
      The EIP limits its protocol change to installing a system contract and
      specifies ordinary contract execution without a new EVM gas-accounting
      rule.
  rationale: >-
    Contract calls and proof verification consume existing EVM gas, but no gas
    schedule or accounting mechanism is created or changed.
  confidence: high
  uncertainty_note: >-
    Exact system-contract bytecode is pending, but that does not by itself
    specify a change to EVM gas accounting.
  exceptional_score_justification: null
