    every sponge and Merkle-tree context described by the prose?
  - >-
    What measured execution and state-growth costs follow from the finalized
    bytecode, proof verifier, auth-verifier calls, and allowed payload sizes?
notable_ambiguities:
- >-
  Same-block auth-policy roots are intentionally not retained after later
  same-block mutations, so transaction ordering determines whether an
  intermediate root remains usable; the EIP recommends waiting a block but does
  not make that wallet behavior mandatory.
- >-
  ERC-20 compatibility is deliberately narrower than the nominal interface:
  fee-on-transfer and rebasing behavior can fail or under-deliver, and the
  supporting EIP-20 snapshot contains no normative body for comparison.
- >-
  Auth verifier proof formats and verification-key derivation are delegated to
  companion standards, while the pool contract accepts any user-registered
  verifier satisfying only the staticcall envelope.
overall_confidence: medium
