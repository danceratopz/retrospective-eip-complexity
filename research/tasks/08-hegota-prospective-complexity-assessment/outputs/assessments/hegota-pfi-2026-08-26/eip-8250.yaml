criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 3
  evidence:
  - source: eip.md
    locator: "Specification > Nonce consumption, steps 1-5"
    summary: >-
      A payment-scoped APPROVE reads every keyed slot, counts first uses,
      charges KEYED_NONCE_FIRST_USE_GAS per zero-valued slot, and makes the
      charge part of frame and transaction gas accounting.
  - source: eip.md
    locator: "Specification > Transaction payload"
    summary: >-
      RLP encodings of nonce_keys and nonce_seq are newly included in both
      standard gas-limit and calldata-token calculations inherited from the
      frame transaction.
  rationale: >-
    This introduces a dynamic first-use execution-gas mechanism inside
    APPROVE and integrates it with existing frame gas-used, settlement, and
    unpaid-gas-refund calculations. Existing frame-transaction gas cases are
    affected, matching score 3.
  confidence: high
  uncertainty_note: >-
    The surcharge and its accounting destinations are explicit; the sealed
    package contains no executable test inventory with which to count affected
    vectors.
  exceptional_score_justification: null
- id: state_access_ordering_within_opcode_execution
  label: State-access ordering within opcode execution
  score: 1
  evidence:
  - source: eip.md
    locator: "Specification > Nonce consumption, paragraphs before and after steps 1-5"
    summary: >-
      APPROVE first performs all pre-existing exceptional checks and ordinary
      costs, then keyed reads, then the conditional surcharge, then nonce
      writes, and only then commits the remaining approval effects atomically.
  rationale: >-
    The state-access and gas-charge order of one opcode, APPROVE, changes.
    Testing is multiplicative across legacy versus keyed domains, first versus
    subsequent use, key count, payment scope, gas boundaries, and
    success/revert/atomic-batch paths, but the rubric's score-1 anchor is the
    exact structural match because only one opcode's ordering changes.
  confidence: high
  uncertainty_note: >-
    The intra-APPROVE order is explicit. The separate question of recording
    these protocol accesses in a block-level access list is not specified and
    is recorded under under-specification rather than changing this score.
  exceptional_score_justification: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: "Specification > Transaction payload"
    summary: >-
      The delta states that no payload field other than the nonce replacement
      changes and adds nonce bytes only to standard/calldata-token accounting.
  - source: supporting/eip-8141.md
    locator: "Specification > Frame Transaction > Blob handling"
    summary: >-
      The base frame transaction already defines optional blob handling and
      blob-gas accounting.
  rationale: >-
    EIP-8250 neither adds nor modifies a blob-gas mechanism; its added bytes
    are execution-calldata priced. Score 0 applies.
  confidence: high
  uncertainty_note: "No material uncertainty in the sealed text."
  exceptional_score_justification: null
- id: state_gas_accounting_changes
  label: State gas accounting changes
  score: 0
  evidence:
  - source: eip.md
    locator: "Specification > Nonce consumption, final two paragraphs"
    summary: >-
      The first-use surcharge is deducted from the executing frame's gas and
      keyed writes are protocol bookkeeping explicitly excluded from ordinary
      SSTORE pricing.
  - source: supporting/eip-8141.md
    locator: "Specification > Frame Transaction > Gas Accounting"
    summary: >-
      The base proposal separately defines state gas as the durable-state
      dimension with per-frame state budgets and specific charge points.
  rationale: >-
    Although keyed slots create persistent state, EIP-8250 prices that growth
    with execution gas and does not adjust StateGasCosts, a STATE_BYTES rate,
    a state-gas charge site, or the block state-gas budget. Under this anchor's
    narrow definition, the score is 0.
  confidence: high
  uncertainty_note: >-
    This score follows the rubric's distinction between a state-growth
    surcharge paid in execution gas and the named state-gas mechanism.
  exceptional_score_justification: null
- id: new_evm_gas_refund
  label: New EVM gas refund
  score: 0
  evidence:
  - source: eip.md
    locator: "Specification > Nonce consumption"
    summary: >-
      The surcharge is included in EIP-8141's existing unpaid-gas refund
      calculation; no refund counter, eligibility rule, or refund amount is
      introduced for keyed nonces.
  rationale: >-
    Referencing an existing settlement refund does not create a new EVM gas
    refund mechanism. Score 0 applies.
  confidence: high
  uncertainty_note: "No material uncertainty in the sealed text."
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: "Specification > Transaction payload; Stateful validity; Nonce consumption; Transaction introspection"
    summary: >-
      The delta changes every post-fork frame transaction's nonce fields and
      signing payload, replaces its stateful nonce check and payment-approval
      nonce effect, and changes transaction introspection.
  - source: eip.md
    locator: "Specification > Activation; Mempool"
    summary: >-
      It also invalidates pre-fork frame transactions at the boundary and
      changes frame-transaction identity, dependencies, and revalidation.
  rationale: >-
    Existing EIP-8141 tests require broad reworking across encoding,
    signature hashes, validity, gas boundaries, APPROVE/revert behavior,
    activation, and mempool behavior. These are diverse test categories, so
    score 3 applies.
  confidence: high
  uncertainty_note: >-
    The breadth follows directly from the delta, though the package includes
    no pre-existing test catalog for a mechanical case count.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
  label: New invariant on pre-existing tests
  score: 2
  evidence:
  - source: eip.md
    locator: "Specification > Activation"
    summary: >-
      The first post-fork block must initialize NONCE_MANAGER with fixed code,
      at least nonce 1, empty storage, and balance-preservation rules before
      any transaction executes.
  rationale: >-
    A broad category of fork-transition and post-activation state assertions
    gains a mechanical invariant for the NONCE_MANAGER account even when a
    test does not send a keyed-nonce transaction. The text does not establish
    that literally every test vector and every pre-fork vector must be
    re-derived, so score 2 rather than 3 applies.
  confidence: medium
  uncertainty_note: >-
    The package does not describe how the test corpus supplies or asserts
    fork-initialized system state.
  exceptional_score_justification: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  score: 3
  evidence:
  - source: eip.md
    locator: "Specification > Transaction payload"
    summary: >-
