      fields nonce_keys and nonce_seq.
  - source: eip.md
    locator: "Specification > Activation"
    summary: >-
      NONCE_MANAGER initialization occurs only when the current timestamp is
      post-fork and the parent timestamp is pre-fork, before transaction
      execution, and must be reversible across reorgs.
  rationale: >-
    A transition tool must represent multiple new transaction fields and must
    support a fork-boundary-only pre-transaction state transition whose
    selection depends on both current and parent timestamps. This matches the
    score-3 combination of multiple fields and a new mechanism.
  confidence: medium
  uncertainty_note: >-
    No transition-tool interface is included, so the exact field names and
