  rationale: Changing the reported gas quantity does not create an EVM gas-refund mechanism.
  confidence: high
  uncertainty_note: Refunds are not mentioned in the sealed proposal.
  exceptional_score_justification: null
- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  score: 3
  evidence:
  - source: eip.md
    locator: Specification > Receipt construction
    summary: All receipts emitted after activation must contain individual transaction gasUsed rather than cumulativeGasUsed.
  - source: eip.md
    locator: Backwards Compatibility
    summary: Applications using verified gasUsed or cumulativeGasUsed values must adapt to the new on-chain semantics.
  rationale: Every post-activation receipt changes its consensus value, so the broad set of existing vectors that commits to or verifies receipts must be re-derived rather than only a contrived corner category.
  confidence: medium
  uncertainty_note: The EIP has no testing section or inventory of the existing corpus, so the exact number and categories of affected vectors are not package-evidenced.
  exceptional_score_justification: null
- id: new_invariant_on_pre_existing_tests
