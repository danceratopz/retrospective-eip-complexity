    locator: Specification > Receipt construction
    summary: An existing cumulative receipt value is replaced by an individual value; the proposal does not add a separate receipt property or assertion.
  rationale: Existing receipt expectations require changed values, scored as test rework above, but tests do not gain an additional invariant to assert.
  confidence: medium
  uncertainty_note: The sealed EIP does not describe test assertions, but its specified operation is replacement rather than addition.
  exceptional_score_justification: null
