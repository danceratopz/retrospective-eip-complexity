criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  score: 0
  evidence:
  - source: eip.md
    locator: Specification > Receipt construction
    summary: The proposal changes which already-computed gas quantity is stored in receipts; it specifies no EVM gas charging rule.
  rationale: Receipt representation changes do not update or introduce an EVM gas-accounting mechanism.
  confidence: high
  uncertainty_note: The sealed specification contains no gas schedule, gas charge, or metering change.
  exceptional_score_justification: null
