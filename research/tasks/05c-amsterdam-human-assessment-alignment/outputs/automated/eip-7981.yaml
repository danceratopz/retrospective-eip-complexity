- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  definition_present: true
  allowed_scores:
  - 0
  - 1
  - 2
  - 3
  - 4
  score: 1
  evidence:
  - source: eip.md
    locator: Specification
    summary: The existing per-address and per-storage-key access-list cost is augmented by 10 gas per zero byte and 40 gas per non-zero byte.
  rationale: The proposal updates the existing intrinsic access-list gas-accounting mechanism, matching the score-1 anchor.
  confidence: high
  uncertainty_note: The added byte-count component could be described as a new sub-mechanism, but it is integrated directly into the existing access-list cost rather than establishing an independent accounting system.
  exceptional_score_justification: Not applicable; the score is not 4.
