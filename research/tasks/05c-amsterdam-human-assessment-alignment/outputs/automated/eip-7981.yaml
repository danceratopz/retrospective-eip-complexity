assessment:
  historical_scope_summary: >-
    In the sealed proposal state, EIP-7981 adds zero-byte and non-zero-byte data
    charges to the existing intrinsic access-list cost for every access-list-bearing
    transaction class shown by the reference implementation. It changes neither the
    access-list encoding nor execution semantics, but it is a backwards-incompatible
    gas repricing intended to close EIP-7623's block-size loophole and requires a
    scheduled network upgrade.
