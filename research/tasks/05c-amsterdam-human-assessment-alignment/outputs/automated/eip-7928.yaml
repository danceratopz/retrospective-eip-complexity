    summary: "Every BAL must exactly match execution-gathered accesses and changes; missing or spurious entries invalidate the block."
  - source: eip.md
    locator: "Backwards Compatibility"
    summary: "The proposal changes the block structure incompatibly and requires a hard fork."
  rationale: "A mandatory, execution-derived validation object affects valid and invalid block construction across ordinary transfers, contract execution, withdrawals, exceptional halts, and system operations, requiring broad reworking of pre-existing block/state-transition test patterns."
  confidence: high
  uncertainty_note: "The package contains no test inventory, so the exact number of affected suites is not measurable; the score follows from the rule applying to every post-fork block and diverse execution categories."
  exceptional_score_justification: null
