criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  definition_present: true
  allowed_scores:
  - 0
  - 1
  - 2
  - 3
  - 4
  score: 1
  evidence:
  - source: eip.md
    locator: "## Specification > ### Gas Accounting Changes"
    summary: >-
      User transaction gas remains net of refunds, while block accounting changes to
      accumulate gas before subtracting refunds.
  rationale: >-
    This updates the existing block gas accounting mechanism, matching score 1; the
    proposal does not introduce a separate gas domain independent of existing gas use.
  confidence: high
  uncertainty_note: >-
    The accounting intent is explicit, although the exact propagation of the two gas
    quantities is under-specified elsewhere in the draft.
  exceptional_score_justification: null
