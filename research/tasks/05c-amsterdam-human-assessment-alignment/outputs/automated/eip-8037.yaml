criteria:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  definition_present: true
  allowed_scores:
  - 0
  - 1
  - 2
  - 3
  - 4
  score: 3
  evidence:
  - source: eip.md
    locator: "Specification > Parameter changes; Multidimensional metering for code deposit gas"
    summary: >-
      Seven existing gas parameters are repriced and a separate code_deposit_gas dimension
      is introduced for contract deployment.
  - source: eip.md
    locator: "Specification > Contract deployment cost calculation"
    summary: >-
      CREATE-family charging now depends on runtime-code existence, warm/cold access,
      runtime hashing, and bytecode length.
  rationale: >-
    This introduces a new gas-accounting mechanism and changes existing CREATE, CREATE2,
    creation-transaction, SSTORE, SELFDESTRUCT, account-creation, and EIP-7702 charging,
    necessarily affecting existing mechanisms and their tests; this matches score 3.
  confidence: high
  uncertainty_note: >-
    The exact mechanics of the second gas dimension are under-specified, but the presence
    and broad interaction of the new mechanism are explicit.
  exceptional_score_justification: "Not applicable; score is not 4."
