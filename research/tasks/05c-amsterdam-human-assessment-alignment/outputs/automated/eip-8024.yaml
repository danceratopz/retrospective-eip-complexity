under_specification:
  present: true
  summary: "The specification does not explicitly define behavior when the immediate byte is absent at end of code, when the referenced stack item is unavailable, or when DUPN would exceed the stack limit; it also says invalid immediates 'revert, consuming all gas' without defining the exact exceptional-halt semantics. These omissions are recorded once here rather than added as separate complexity in unrelated rows."
