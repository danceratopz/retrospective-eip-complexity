assessment:
  historical_scope_summary: "At the sealed historical cutoff, Draft EIP-7976 raises EIP-7623's calldata floor from 10/40 to 15/60 gas per zero/non-zero byte by changing `TOTAL_COST_FLOOR_PER_TOKEN` from 10 to 15. It retains the existing max-based transaction gas-used mechanism, updates the minimum gas-limit validity threshold, and targets lower worst-case execution-payload size while leaving EVM-heavy transactions on standard calldata pricing."
