    locator: "Specification — parameter table and `tx.gasUsed` formula"
    summary: "Sets `TOTAL_COST_FLOOR_PER_TOKEN` to 15 and applies it through the existing maximum of standard execution cost and calldata floor cost."
  - source: supporting/eip-7623.md
    locator: "Specification — parameter table and changed `tx.gasUsed` formula"
    summary: "Defines the pre-existing floor mechanism with the same formula and a floor parameter of 10."
