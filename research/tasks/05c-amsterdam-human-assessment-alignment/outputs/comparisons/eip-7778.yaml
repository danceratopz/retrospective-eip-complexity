confounds:
  input_alignment:
    classification: substantive_drift
    summary: 'Substantive intervening revisions: Adds a note to the user gas-cost rule: because receipts
      store the post-refund gas_used value, validating block gas limits from receipts requires tracking
      refunds during transaction execution and adding them back to each transaction''s gas_used when computing
      cumulative block gas usage.'
    classification_source: research/tasks/01-fork-eip-history/outputs/eips/eip-7778.yaml
  intervening_eip_commits:
  - id: eip7778-e04
    event_kind: revision
    authored_at: '2025-12-04T16:21:25-07:00'
    committed_at: '2025-12-04T23:21:25+00:00'
    commit: 3a8ab8c6bc1a4df8f413d198005e2a1b09577621
    path: EIPS/eip-7778.md
    change_type: clarification
    semantic_effect: substantive
    summary: 'Adds a note to the user gas-cost rule: because receipts store the post-refund gas_used value,
      validating block gas limits from receipts requires tracking refunds during transaction execution
      and adding them back to each transaction''s gas_used when computing cumulative block gas usage.'
    rationale: First statement of how the new block accounting interacts with the existing receipt encoding.
      It tells implementers that receipts alone are insufficient for block gas-limit validation, which
      is directly implementation- and test-relevant even though no rule is restated.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-3a8ab8c6bc1a
    - gh-pr-map-eip-7778
  template_match:
    classification: exact
    rationale: Anchor inventory, definitions, score domains, nominal maximum, and thresholds match.
  human_timing_exposure:
    classification: low_exposure
    rationale: The assessment uses proposal-level reasoning about refunds and block gas limits without
      identifying an implementation, devnet, or completed test effort.
    evidence_source: the exact historical human assessment blob
