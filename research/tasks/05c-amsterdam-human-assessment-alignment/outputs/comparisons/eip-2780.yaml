    committed_at: '2025-10-23T17:20:37Z'
    commit: c91dc31f164fa50bc58e8b6c68fd44774a1f1828
    path: EIPS/eip-2780.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Extends the proposal into a granular state-operation gas model (PR #10594, ''Include Call
      changes''): TX_BASE_COST 6,000 to 4,500; introduces STATE_UPDATE = 1,000, COLD_ACCOUNT_COST_CODE
      = 2,600, COLD_ACCOUNT_COST_NOCODE = 500, WARM_STATE_READ = 100; reprices value-moving calls (CALL_VALUE_COST
      9,000 to 2,000, or 26,000 when creating an account); specifies a PAY-style primitive''s warmth/code-load
      behavior, self-transfer rule, and warmth policy; adds transaction reference cases; EIP-2929 described
      as ''refined by this EIP''.'
    rationale: Major expansion of normative scope from intrinsic gas into EVM gas-schedule adjustments
      with a parameter change.
    change_group: null
    confidence: high
    source_ids:
    - git-c91dc31f164f
    - gh-pr-map-eip-2780
  - id: eip2780-e24
    event_kind: revision
    authored_at: '2025-10-23T22:57:38Z'
    committed_at: '2025-10-23T22:57:38Z'
    commit: 5ed360f38d7867c0f677104c10aabe657da60f11
    path: EIPS/eip-2780.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Adds an explicit warmth-pricing specification that overrides EIP-2929''s ''all tx addresses
      are warm'' rule (per-type charges for tx.sender and tx.to, precompiles warm, access-list override),
      plus a ''Monetary Context'' motivation section (PR #10595, ''Add context'').'
    rationale: The warmth-decomposition block is normative and changes how intrinsic accounts are charged
      relative to EIP-2929.
    change_group: null
    confidence: high
    source_ids:
    - git-5ed360f38d78
    - gh-pr-map-eip-2780
