confounds:
  input_alignment:
    classification: substantive_drift
    summary: 'Substantive intervening revisions: Extends the proposal into a granular state-operation
      gas model (PR #10594, ''Include Call changes''): TX_BASE_COST 6,000 to 4,500; introduces STATE_UPDATE
      = 1,000, COLD_ACCOUNT_COST_CODE = 2,600, COLD_ACCOUNT_COST_NOCODE = 500, WARM_STATE_READ = 100;
      reprices value-moving calls (CALL_VALUE_COST 9,000 to 2,000, or 26,000 when creating an account);
      specifies a PAY-style primitive''s warmth/code-load behavior, self-transfer rule, and warmth policy;
      adds transaction reference cases; EIP-2929 described as ''refined by this EIP''. | Adds an explicit
      warmth-pricing specification that overrides EIP-2929''s ''all tx addresses are warm'' rule (per-type
      charges for tx.sender and tx.to, precompiles warm, access-list override), plus a ''Monetary Context''
      motivation section (PR #10595, ''Add context''). | Clarifications with normative effect (PR #10598):
      CALL_VALUE_COST = 2,000 applies to all value-carrying calls regardless of prior account updates
      (2300-gas stipend safety); EIP-7702 senders must not trigger a disk code-load for classification;
      new-account surcharge component table restated; test vectors 7-14 added (warmth/access-list interplay,
      7702 cases, precompile transfers, self-transfer, internal CALL repricing, Perfnet stress, SELFDESTRUCT);
      SELFDESTRUCT/EIP-6780 security note; throughput/payload/basefee levers section.'
    classification_source: research/tasks/01-fork-eip-history/outputs/eips/eip-2780.yaml
  intervening_eip_commits:
