confounds:
  input_alignment:
    classification: substantive_drift
    summary: 'Substantive intervening revisions: Adds an explicit EIP-7702 non-interference statement
      to the Specification (PR #10734): ''This EIP will not affect EIP-7702, since the authority''s nonce
      is always incremented after an authorization is applied, which conflicts with the condition required
      for contract deployment.'' Simultaneously deletes the Rationale sentence ''As one of the core tenets
      of smart contracts is that its code will not change...''.'
    classification_source: research/tasks/01-fork-eip-history/outputs/eips/eip-7610.yaml
  intervening_eip_commits:
  - id: eip7610-e05
    event_kind: revision
    authored_at: '2025-09-29T00:06:02Z'
    committed_at: '2025-09-29T00:06:02Z'
    commit: fa587161f3f3b8ade481c5fc6478ad25c3518a90
    path: EIPS/eip-7610.md
    change_type: editorial
    semantic_effect: non_substantive
    summary: 'Spelling fixes (PR #10272): ''instanace'' to ''instance'' in the Rationale and ''imutability''
      to ''immutability'' in Security Considerations.'
    rationale: Typographical corrections only.
    change_group: null
    confidence: high
    source_ids:
    - git-fa587161f3f3
    - gh-pr-map-eip-7610
  - id: eip7610-e06
    event_kind: revision
    authored_at: '2025-11-06T01:04:36Z'
    committed_at: '2025-11-06T01:04:36Z'
    commit: 7707fe333322ed68d1b5efa50bdb4f35909255a7
    path: EIPS/eip-7610.md
    change_type: dependency
    semantic_effect: substantive
    summary: 'Adds an explicit EIP-7702 non-interference statement to the Specification (PR #10734): ''This
      EIP will not affect EIP-7702, since the authority''s nonce is always incremented after an authorization
      is applied, which conflicts with the condition required for contract deployment.'' Simultaneously
      deletes the Rationale sentence ''As one of the core tenets of smart contracts is that its code will
      not change...''.'
    rationale: Adds a new explicit cross-EIP interaction statement inside the normative Specification
      section, materially clarifying how the new creation condition interacts with EIP-7702 delegated
      accounts; this is implementation- and test-relevant.
    change_group: null
    confidence: high
    source_ids:
    - git-7707fe333322
    - gh-pr-map-eip-7610
  template_match:
    classification: exact
    rationale: Anchor inventory, definitions, score domains, nominal maximum, and thresholds match.
  human_timing_exposure:
