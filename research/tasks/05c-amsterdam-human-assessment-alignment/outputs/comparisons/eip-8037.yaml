    path: EIPS/eip-8037.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Defines success-vs-failure gas accounting for contract deployment: GAS_NEW_ACCOUNT, GAS_CODE_DEPOSIT*L
      and HASH_COST(L) are charged only on the success path, with explicit total-gas formulas and check
      ordering; removes the duplicated-code deposit-exemption sentence from the abstract; reformats the
      parameter table.'
    rationale: Materially specifies when deployment charges apply, replacing the previous duplication-check
      design.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-4e9dba1082fb
  - id: eip8037-e02
    event_kind: revision
    authored_at: '2025-10-28T11:20:33+01:00'
    committed_at: '2025-10-28T10:20:33+00:00'
    commit: dee539a58f206ce2a3bf08130605adf50938c40f
    path: EIPS/eip-8037.md
    change_type: parameter
    semantic_effect: substantive
    summary: Changes GAS_NEW_ACCOUNT's affected operations to CALL*, removes GAS_SELF_DESTRUCT_NEW_ACCOUNT
      (replaced by GAS_NEW_ACCOUNT), and corrects the deployment cost example accordingly.
    rationale: Changes the parameter schedule's scope and removes a distinct constant.
    change_group: null
