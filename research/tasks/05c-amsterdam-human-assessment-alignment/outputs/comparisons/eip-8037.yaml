confounds:
  input_alignment:
    classification: substantive_drift
    summary: 'Substantive intervening revisions: Defines success-vs-failure gas accounting for contract
      deployment: GAS_NEW_ACCOUNT, GAS_CODE_DEPOSIT*L and HASH_COST(L) are charged only on the success
      path, with explicit total-gas formulas and check ordering; removes the duplicated-code deposit-exemption
      sentence from the abstract; reformats the parameter table. | Changes GAS_NEW_ACCOUNT''s affected
      operations to CALL*, removes GAS_SELF_DESTRUCT_NEW_ACCOUNT (replaced by GAS_NEW_ACCOUNT), and corrects
      the deployment cost example accordingly.'
    classification_source: research/tasks/01-fork-eip-history/outputs/eips/eip-8037.yaml
