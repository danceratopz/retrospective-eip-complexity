confounds:
  input_alignment:
    classification: substantive_drift
    summary: 'Substantive intervening revisions: Retitles the EIP to ''State-access gas cost update''
      (PR #10582); renames GAS_STORAGE_UPDATE to GAS_COLD_STORAGE_WRITE and GAS_COLD_SLOAD to GAS_COLD_STORAGE_ACCESS;
      expands the repricing scope to GAS_STORAGE_CLEAR_REFUND, ACCESS_LIST_STORAGE_KEY_COST, and ACCESS_LIST_ADDRESS_COST;
      updates the discussions-to link.'
    classification_source: research/tasks/01-fork-eip-history/outputs/eips/eip-8038.yaml
  intervening_eip_commits:
  - id: eip8038-e02
    event_kind: revision
    authored_at: '2025-10-24T08:04:21Z'
    committed_at: '2025-10-24T08:04:21Z'
    commit: 856781eaaa855d3a59cb3db82cf217ef0945beff
    path: EIPS/eip-8038.md
    change_type: clarification
    semantic_effect: non_substantive
    summary: 'Corrects copy-paste boilerplate in the Backwards Compatibility section (PR #10553): ''new
      calldata cost rules''/''new floor cost values'' become ''new state access cost rules/values''.'
    rationale: Fixes wording evidently copied from a calldata-pricing EIP; the Specification section and
      the actual requirement on wallets/nodes are unchanged, so no implementation-affecting content changed.
    change_group: null
    confidence: medium
    source_ids:
    - git-856781eaaa85
    - gh-pr-map-eip-8038
  - id: eip8038-e03
    event_kind: revision
    authored_at: '2025-10-24T09:51:29Z'
    committed_at: '2025-10-24T09:51:29Z'
    commit: a691b7ad1a10043c9ac6cc1853f87d8cde48a35a
    path: EIPS/eip-8038.md
    change_type: parameter
    semantic_effect: substantive
    summary: 'Retitles the EIP to ''State-access gas cost update'' (PR #10582); renames GAS_STORAGE_UPDATE
      to GAS_COLD_STORAGE_WRITE and GAS_COLD_SLOAD to GAS_COLD_STORAGE_ACCESS; expands the repricing scope
      to GAS_STORAGE_CLEAR_REFUND, ACCESS_LIST_STORAGE_KEY_COST, and ACCESS_LIST_ADDRESS_COST; updates
      the discussions-to link.'
    rationale: Extends the set of gas parameters the EIP reprices and renames schedule constants, which
      changes what implementers must update; values remain TBD but the normative scope grew.
    change_group: null
    confidence: high
    source_ids:
    - git-a691b7ad1a10
    - gh-pr-map-eip-8038
  template_match:
    classification: exact
    rationale: Anchor inventory, definitions, score domains, nominal maximum, and thresholds match.
  human_timing_exposure:
    classification: possible_exposure
    rationale: The assessment notes that benchmark numbers were not yet available, showing fork-development
      awareness without reporting completed implementation outcomes.
