  commit: 5aea12c20ee27b3d85f7c2ec9e6a09e451fd81f0
  path: EIPS/eip-7981.md
  change_type: parameter
  semantic_effect: substantive
  summary: Re-parameterises the surcharge in terms of the EIP-7623 token abstraction. The two EIP-owned
    constants ACCESS_LIST_NONZERO_BYTE_COST and ACCESS_LIST_ZERO_BYTE_COST are replaced in the parameter
    table by TOTAL_COST_FLOOR_PER_TOKEN = 10, sourced from EIP-7623, and the formula becomes access_list_tokens
    = nonzero * 4 + zero followed by access_list_data_cost = access_list_tokens * TOTAL_COST_FLOOR_PER_TOKEN.
    Description, Abstract and Motivation are rewritten (adding the '~21% worst-case block size reduction'
    claim and the 'contributing to EVM gas while still leaving a non-negligible data footprint' framing);
    'Maximum Block Size Impact' is renamed 'Access List Size Impact' and recomputed at a 60M gas limit
    (1012 KB -> 604 KB); a new 'Maximum Block Size Impact' section states the Snappy-compressed maximum
    falls from 2.71 MiB to 2.13 MiB. The description acquires the typo 'footpring'.
  rationale: The effective rates are numerically unchanged (4 tokens * 10 = 40 gas per non-zero byte,
    1 token * 10 = 10 gas per zero byte), but the EIP stops owning its pricing constants and instead derives
    them from another EIP's TOTAL_COST_FLOOR_PER_TOKEN. That makes the charge track future changes to
    EIP-7623 - as the next two revisions demonstrate - so it is a substantive change to the specification
    even though no gas value moves in this commit.
  change_group: null
  confidence: high
  source_ids:
  - eips-commit-5aea12c20ee2
  - gh-pr-map-eip-7981
