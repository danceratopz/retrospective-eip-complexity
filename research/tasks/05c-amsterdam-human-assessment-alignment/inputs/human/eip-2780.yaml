  path: EIPS/eip-2780.md
  change_type: normative_behavior
  semantic_effect: substantive
  summary: 'Extends the proposal into a granular state-operation gas model (PR #10594, ''Include Call
    changes''): TX_BASE_COST 6,000 to 4,500; introduces STATE_UPDATE = 1,000, COLD_ACCOUNT_COST_CODE =
    2,600, COLD_ACCOUNT_COST_NOCODE = 500, WARM_STATE_READ = 100; reprices value-moving calls (CALL_VALUE_COST
    9,000 to 2,000, or 26,000 when creating an account); specifies a PAY-style primitive''s warmth/code-load
    behavior, self-transfer rule, and warmth policy; adds transaction reference cases; EIP-2929 described
    as ''refined by this EIP''.'
  rationale: Major expansion of normative scope from intrinsic gas into EVM gas-schedule adjustments with
    a parameter change.
  change_group: null
  confidence: high
  source_ids:
  - git-c91dc31f164f
  - gh-pr-map-eip-2780
