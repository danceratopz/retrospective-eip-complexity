- id: patterns_affecting_pre_existing_tests
  label: Patterns affecting pre-existing tests
  raw_score_cell: '2'
  parsed_terms:
  - 2
  numeric_contribution: 2
  rationale: 'A considerable subset of existing tests is affected, but the impact is concentrated in a
    contrived category: benchmarks and gas-boundary fixtures. BAL changes the cost surface (added per-block
    data, propagation overhead, builder/validator work) so pre-existing benchmarks no longer represent
    worst cases — new adversarial scenarios (fan-out reads, many-slot touches, deep delegation chains,
    large BAL-item counts approaching `block_gas_limit // ITEM_COST`) need to be researched and added,
    and the benchmarking framework needs new metrics for BAL size, generation cost, and validation cost.
    Existing OOG-boundary fixtures across forks need their warm/cold/touch assumptions re-verified under
    BAL inclusion semantics. Outside those categories, most pre-existing tests need no rework — Amsterdam-filled
    tests generate and validate a BAL automatically as a consensus artefact.'
  blank_interpretation: null
- id: transition_tool_interface_changes
  label: Transition-tool interface changes
  raw_score_cell: '2'
  parsed_terms:
  - 2
  numeric_contribution: 2
  rationale: 'A single new mechanism — the BAL builder/validator wired into the t8n (`block_access_lists.py`,
    `BlockAccessListBuilder`, `hash_block_access_list`, `validate_block_access_list_gas_limit`) — surfaces
    one new payload output (`blockAccessList` on `ExecutionPayloadV4`). The `block_access_list_hash` on
    the header is **not an independent field**: it is fully determined as `keccak256(rlp(BAL))` and carries
    no information not already present in the BAL itself. It is a Merkle/checksum binding, comparable
    to `transactionsRoot` vs. the transaction list — counting it as a second "new field" would double-count
    one piece of information. So in t8n terms this is "a new mechanism" (singular) producing one new output,
    not "multiple new fields **and** a new mechanism" (the 3 bucket). Per the anchor''s footnote, the
    t8n must additionally be fork-aware (Amsterdam-only activation), which warrants special consideration
    regardless of score.'
  blank_interpretation: null
- id: cryptography
  label: Cryptography-related testing
  raw_score_cell: '0'
  parsed_terms:
  - 0
  numeric_contribution: 0
  rationale: Keccak-256 over RLP only — already covered.
  blank_interpretation: null
- id: edge_boundary_conditions
  label: Edge/boundary conditions
  raw_score_cell: '3'
  parsed_terms:
  - 3
  numeric_contribution: 3
  rationale: 'An elevated number of cases is required. Per `test_cases.md` the BAL implementation drove
    gas off-by-one boundary tests at every state-access opcode (cold vs warm × OOG-before-target-access
    / OOG-after-target-access / success-minus-1 / success). Add: net-zero storage filtering (intra-tx
    coalescing, cross-frame shadowing, nested DELEGATECALL net-zero), CREATE/CREATE2 collisions, same-tx
    create+SELFDESTRUCT, 7702 invalid-nonce/invalid-chain-id, static-context filtering across all call
    opcodes, empty-block coinbase, zero-tip coinbase, system-address surplus filtering, RIPEMD-160 cross-block
    state leak, lexicographic byte-ordering endian traps.'
  blank_interpretation: null
- id: block_syncing_changes
  label: Block syncing changes
  raw_score_cell: '2'
  parsed_terms:
  - 2
  numeric_contribution: 2
  rationale: 'A single complex RLP validation mechanism is introduced: the BAL itself, whose sub-rules
    include hash binding to the header, lexicographic address ordering, ascending `block_access_index`
    per change list, uniqueness per `(address, slot)`, mutual exclusion between `storage_changes` and
    `storage_reads`, `bal_items <= block_gas_limit // ITEM_COST`, and `SYSTEM_ADDRESS` exclusion unless
    touched. The three new block exceptions (`INVALID_BLOCK_ACCESS_LIST`, `INVALID_BAL_HASH`, `BLOCK_ACCESS_LIST_GAS_LIMIT_EXCEEDED`)
    all stem from this single validator.'
  blank_interpretation: null
- id: engine_api_changes
  label: Engine API changes
  raw_score_cell: '3'
  parsed_terms:
  - 3
  numeric_contribution: 3
  rationale: 'Multiple fields **and** multiple new endpoints: `ExecutionPayloadV4` adds `blockAccessList`;
    new `engine_newPayloadV5`, `engine_getPayloadV6`, `engine_getPayloadBodiesByHashV2`, `engine_getPayloadBodiesByRangeV2`
    returning `ExecutionPayloadBodyV2`. EL must also retain BALs ≥ weak-subjectivity period.'
  blank_interpretation: null
