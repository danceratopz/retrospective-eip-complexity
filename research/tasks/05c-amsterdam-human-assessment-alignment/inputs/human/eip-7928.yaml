input_alignment:
  classification: substantive_drift
  summary: 'Substantive intervening revisions: Renames header field bal_hash->block_access_list_hash,
    specifies system-contract changes use tx_index = len(transactions) + 1, adds the rule that EIP-2930
    access-list entries MUST NOT be auto-included, and extends the example. | Code changes now also track
    EIP-7702 delegation indicators. | Fixes system-contract tx_index from len(transactions) + 1 to len(transactions)
    throughout text, example and pseudocode. | Splits system-contract handling into pre-execution (tx_index
    = len(transactions)) and post-execution (len(transactions) + 1) phases, adds the explicit EIP-4895
    reference for withdrawal recipients, restricts recipient balance recording to value > 0, and rebuilds
    the example with lexicographic ordering. | Switches BAL encoding from SSZ to RLP, introduces BlockAccessIndex
    (0 = pre-execution, 1..n = transactions, n+1 = post-execution), widens Balance to uint256, adds Engine
    API validation flow, and fixes the eip-7792.md link typo to eip-7702.md. | Fixes the block-hash system-contract
    address in the example from 0x...0001 to the actual EIP-2935 address 0x0000F90827F1C53a10cb7A02335B175320002935.
    | Restructures the Specification into dedicated sections (Scope and Inclusion, Ordering and Determinism,
    BlockAccessIndex Assignment, Recording Semantics, Edge Cases (Normative), Engine API); adds the Engine
    API statement that the EL provides both block_access_list and block_access_list_hash in the ExecutionPayload;
    updates description frontmatter and size figure (~45 KiB). | Specifies empty-BAL encoding: header
    hash is keccak256(rlp.encode([])) and the body field is the empty RLP list 0xc0; converts bullets
    to hyphen style. | Expands the exceptional-halts rule (accessed addresses of reverted calls MUST be
    included; reads appear in storage_reads) and downgrades validation-by-comparison from MUST (per EIP-2929)
    to MAY, dropping that EIP-2929 reference. | Splits SENDALL from SELFDESTRUCT and defines the in-transaction
    selfdestruct canonical signal (nonce 0, empty code, zero balance at that index). | Reverses the previous
    selfdestruct signal: destroyed-in-transaction accounts are included without balance/nonce/code changes;
    touched storage keys become storage_reads. | Adds a precompiled-contracts edge case: precompiles MUST
    be included when accessed, with a balance change if they receive value. | Expands the MUST-include
    list (opcode targets, reverting calls, failed CREATE targets, senders/recipients, coinbase, selfdestruct
    beneficiaries, system contracts, withdrawal recipients, precompiles), adds the no-op-write pre-value
    check note, and adds an EIP-7702 delegations edge case. | In-transaction selfdestruct: if the account
    had a positive pre-transaction balance, the balance change to zero MUST be recorded. | Restricts EIP-7702
    tracking to successful delegations and rewrites authority/delegation-target inclusion rules (empty
    change set on invalid-nonce failure; target only when actually loaded). | Adds the unaltered-balance
    rule (post == pre MUST NOT be recorded), extends balance recording to CALL/CALLCODE senders and recipients
    and CREATE/CREATE2 recipients, and conditions failed-authorization inclusion on accessed_addresses
    per EIP-2929. | Specifies Engine API structures and methods: ExecutionPayloadV4 with blockAccessList,
    engine_newPayloadV5, engine_getPayloadV6; CL computes the SSZ hash_tree_root. | Rewrites the ordering
    rules per-field (accounts, storage_changes, storage_reads, balance/nonce/code_changes ordered by block
    access index). | Deletes the MAX_* constants block entirely (MAX_TXS, MAX_SLOTS, MAX_ACCOUNTS, MAX_CODE_SIZE,
    MAX_CODE_CHANGES) and adds the zero-value block-reward recipient rule. | Refines the zero-value block-reward
    wording: no balance change and no read-only inclusion; include with a balance change only when the
    reward is positive. | Adds the COINBASE / fee-recipient edge case (include on any state change; exclude
    in empty blocks; include as a read when the reward is zero) and normalizes Coinbase->COINBASE. | Type
    aliases: Address bytes->bytes20, StorageKey/StorageValue bytes->bytes32, CodeData->Bytecode; balance
    recording text uint128->uint256. | Changes StorageKey and StorageValue from bytes32 to uint256. |
    Adds the rule that call-operation targets are included only if gas checks (memory expansion, access
    cost, transfer cost) pass before state access. | SYSTEM_ADDRESS (0xffff...fffe) MUST NOT be included
    unless it experiences state access itself. | Adds inclusion of deployed contract addresses from calls
    with initcode to empty addresses (e.g., calling 0x0 with initcode). | Removes the BAL from the EL
    block body (stored separately, transmitted in the ExecutionPayload), specifies the block-processing
    flow, adds engine_getBALsByHashV1/engine_getBALsByRangeV1 retrieval methods and a retention requirement,
    and updates the abstract (parallel state-root computation) and size figure (~70 KiB). | Despite the
    ''fix linter issues'' subject, changes the BAL retention requirement from ''until the last finalized
    checkpoint'' to ''the weak subjectivity period (=3533 epochs)'' (plus formatting fixes). | Rewrites
    the EIP-7702 delegation edge case: authority included on successful set/update/clear; inclusion on
    failed authorization depends on whether the authority was loaded; delegation target included only
    when loaded as an execution target. | Adds that spurious entries MAY be detected by validating BAL
    indices, which MUST never exceed len(transactions) + 1; fixes typos. | COINBASE included if the block
    contains transactions or withdrawals; withdrawal recipients included regardless of the withdrawal
    amount. | Replaces engine_getBALsByHashV1/RangeV1 with engine_getPayloadBodiesByHashV2/RangeV2 returning
    ExecutionPayloadBodyV2 (blockAccessList null for pre-Amsterdam or pruned blocks). | Adds the ''Gas
    Validation Before State Access'' section: pre-/post-state validation phases, a per-opcode pre-state
    gas table anchored to EIP-2929 constants, EIP-7702 delegation resolution rules and the SSTORE stipend
    check. | CREATE/CREATE2 targets included only ''if the target account is accessed''; COINBASE inclusion
    narrowed to withdrawals to the COINBASE address; storage_read->storage_reads naming and wording fixes.
    | Adds the Block Access List Size Constraint: bal_items * ITEM_COST <= available_gas + system_allowance,
    with constants from EIP-7002 and EIP-7251. | Adds the ''Early Rejection of Malicious BALs'' security
    consideration: clients SHOULD enforce G_remaining >= R_remaining * 2000 at transaction boundaries
    against phantom storage reads. | Simplifies the size cap to bal_items <= block_gas_limit // ITEM_COST
    with ITEM_COST = 2000, justified via the EIP-7981 cold-SLOAD floor; specifies EIP-7002/7251 queue-data
    slots appearing as storage_reads. | Adds uniqueness constraints: unique addresses, storage keys at
    most once per list, no key in both storage_changes and storage_reads, unique block_access_index per
    change list. | Adds an implementation note: the BAL need not enter the state transition function;
    implementations MAY validate a virtual BAL hash against the header (execution-specs approach). | Fixes
    contradictory fee-recipient rules: removes the COINBASE bullet from the MUST-include list; COINBASE
    now follows the same inclusion rules as any account; zero-value block rewards no longer force inclusion.
    | Widens BlockAccessIndex uint16->uint64 and specifies CL-side storage: BAL as an SSZ ExecutionPayload
    field, prunable to its hash_tree_root. | Adjusts BlockAccessIndex from uint64 to uint32.'
