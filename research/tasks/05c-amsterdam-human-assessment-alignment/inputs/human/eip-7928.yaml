scores:
- id: evm_gas_rule_changes
  label: EVM Gas rule changes
  raw_score_cell: '3'
  parsed_terms:
  - 3
  numeric_contribution: 3
  rationale: No new gas schedule, but the EIP imposes a hard pre-state / post-state validation ordering
    on every state-accessing opcode (`BALANCE`, `EXT*`, `*CALL`, `CREATE*`, `SLOAD`, `SSTORE`, `SELFDESTRUCT`).
    Gas-charge sites had to be re-ordered across the spec because state was being accessed before gas
    was charged; off-by-one boundaries determine whether an address appears in the BAL, so the rule change
    cascades into existing gas tests across multiple forks.
  blank_interpretation: null
- id: blob_gas_accounting_changes
  label: Blob gas accounting changes
  raw_score_cell: '0'
