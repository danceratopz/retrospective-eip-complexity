- id: performance_risks
  label: Performance risks
  raw_score_cell: '3'
  parsed_terms:
  - 3
  numeric_contribution: 3
  rationale: The BAL adds ~70 KiB/block of propagation overhead and is interwoven with execution — it
    cannot be benchmarked in isolation because validation requires re-deriving the BAL during the state
    transition. Builder behavior interacts with intra-tx coalescing, cross-frame shadowing, net-zero filtering,
    and the `R_remaining * 2000` gas-budget feasibility check. Benchmark suites under `tests/benchmark/stateful/eip7928_block_level_access_lists/`
    and `tests/benchmark/compute/eip7928_block_level_access_lists/` were added.
  blank_interpretation: null
- id: security_risks
  label: Security risks
  raw_score_cell: '3'
  parsed_terms:
  - 3
  numeric_contribution: 3
  rationale: The BAL elevates **every state-access check** — not just state writes — into consensus-critical
    territory. Whether an account or slot appears in the BAL depends on whether the caller had enough
    gas to *touch* it (cold/warm cache, account existence, 7702 delegation load, static-context check,
    value-transfer gas), and whether ambient artefacts like the coinbase or precompiles are deemed "touched"
    under fee-burning, empty-block, zero-tip, and selfdestruct-to-self scenarios. Any client that mis-orders
    a gas check vs. a state observation, mis-classifies a touch, or leaks cross-block precompile state
    diverges from the block-hash-bound BAL and breaks consensus. This is a substantial expansion of the
    consensus surface that interacts with multiple critical components (EVM gas accounting, EIP-2929 warm/cold
    tracking, EIP-6780 selfdestruct semantics, EIP-7702 delegation resolution, system-contract handling)
    and warrants extensive review and fuzzing.
  blank_interpretation: null
- id: cross_eip_interactions
  label: Cross-EIP interactions
  raw_score_cell: '3'
  parsed_terms:
  - 3
  numeric_contribution: 3
  rationale: 'Strong interdependencies, with existing test vectors actively redesigned: EIP-2929 (warm/cold)
    drives the gas-boundary cliffs that gate BAL inclusion; EIP-2930 listed-but-untouched entries are
    explicitly excluded; EIP-1559 coinbase tipping vs. burned base fee determines coinbase inclusion;
    EIP-6780 changes selfdestruct persistence semantics that the BAL must mirror; EIP-7702 delegation
    creates a two-level access model (target vs. delegated target) with multiple OOG boundaries and authorization-failure
    cases; EIP-4895 withdrawals are credited at `index=n+1` with no EVM execution; EIP-2935, EIP-4788,
    EIP-7002, EIP-7251 each require system-contract storage diff and cross-index handling; EIP-1153 transient
    storage must be explicitly *excluded*; EIP-214 static-context restrictions must fire before BAL inclusion.'
  blank_interpretation: null
