  change_type: parameter
  semantic_effect: substantive
  summary: Changes the single parameter FACTORY_ADDRESS from 0x0B to 0x12 (and the matching Rationale
    text, now 'the next lowest address after currently accepted precompiles'), and adds a Backwards Compatibility
    section requiring that FACTORY_ADDRESS not be used by other precompiles or predeploys on a chain,
    with the constant chosen to minimise that risk.
  rationale: Changes the address at which every deterministic deployment resolves - the EIP's defining
    constant - and adds a new compatibility requirement on chains adopting it.
