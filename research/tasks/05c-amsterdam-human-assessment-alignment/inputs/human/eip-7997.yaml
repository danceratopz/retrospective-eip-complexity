  path: EIPS/eip-7997.md
  change_type: normative_behavior
  semantic_effect: substantive
  summary: 'Rewrites the Abstract and two Motivation paragraphs, and - the substantive part - adds a prose
    normative specification of the factory''s behaviour ahead of the bytecode: when called, the account
    invokes CREATE2 (linking EIP-1014) with salt = first 32 bytes of input, init code = the remaining
    input and value = the call''s value; the call reverts with empty return data if input is shorter than
    32 bytes; if CREATE2 outputs 0 the call reverts with the creation frame''s return data. The bytecode
    is retained and is now described as implementing that specification.'
  rationale: Before this commit the only normative statement of behaviour was the opaque hex blob plus
    an assembly listing. Stating the interface and the two failure modes in prose is what clients and
    test authors implement against, and it is the first appearance of the EIP-1014 body reference.
  change_group: null
  confidence: high
