      amends EIP-684 with the extra empty-storage condition; cites EIP-158 for the pre-EIP-158 zero-nonce
      behavior and the 28 affected mainnet contracts. No requires frontmatter field.'
    rationale: Adding commit that creates the EIP file with its initial normative proposal.
