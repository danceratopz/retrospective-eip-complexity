    path: EIPS/eip-7951.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Initial addition of EIP-7951 ''Precompile for secp256r1 Curve Support'' (281 lines, Draft): introduces the
      P256VERIFY precompile at address 0x100 for secp256r1 ECDSA signature verification at 3450 gas. Specifies the curve
      parameters, field/point encodings, the 160-byte input ABI, the 32-byte success output versus empty failure output,
      five mandatory input-validation checks, the verification algorithm including the point-at-infinity check and the modular
      comparison r'' = r (mod n), and the rule that the precompile must not revert and must consume full gas on failure.
      Links a test-vector asset file and cites NIST SP 800-186 and FIPS 186-5.'
    rationale: Creation commit adding the complete initial specification.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-d386b29b5a31
    - eips-blob-eip7951-creation
  - id: eip7951-e01
    event_kind: revision
    authored_at: '2025-07-04T11:19:01+02:00'
    committed_at: '2025-07-04T17:19:01+08:00'
    commit: 75a5ba89571165ae11368d791cc5816bdb01546a
    path: EIPS/eip-7951.md
    change_type: parameter
    semantic_effect: substantive
    summary: 'Doubles the P256VERIFY gas cost from 3450 to 6900 in both the Precompile section and the Gas Schedule, replacing
      the ''15% more expensive than secp256k1'' justification with a statement that benchmarking found R1 verification significantly
      slower than ECRECOVER. The Gas Cost Justification now states that 6900 does not maintain compatibility with L2s but
      matches implementation benchmarks, and the Interface Compatibility list is weakened from ''the exact same interface
      as RIP-7212'' / ''Same gas cost: 3450 gas'' to ''a similar interface'' / ''Different gas cost: 3450 gas vs 6900 gas''.'
    rationale: Changes the precompile's normative gas price, which every implementation and gas test must follow, and correspondingly
      weakens the stated compatibility with existing L2 deployments.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-75a5ba895711
