  - id: eip7951-d01
    target_eip: 7212
    event_type: present_at_creation
    relationship: supersedes
    occurred_at: '2025-07-01T20:21:20Z'
    commit: d386b29b5a31bd5cfd8d21bbf4e8a0c87734085e
    rationale: 'CAUTION - the target is RIP-7212, a Rollup Improvement Proposal in ethereum/RIPs, NOT an EIP: there is no
      EIPS/eip-7212.md at the pinned ethereum/EIPs state. It is recorded here because EIP-7951''s own text names it explicitly
      and repeatedly, from creation onwards: ''This EIP supersedes RIP-7212 by implementing the same functionality with
      the same interface, but without the vulnerability'' (Motivation); ''This specification addresses critical security
      issues discovered in RIP-7212 while maintaining full interface compatibility with existing Layer 2 implementations''
      (Abstract); the Rationale enumerates the two RIP-7212 vulnerabilities fixed (missing point-at-infinity check, non-modular
      r comparison); Backwards Compatibility asserts bytecode compatibility with RIP-7212 deployments. Consumers joining
      dependency events by EIP number must exclude this event or resolve it against ethereum/RIPs. The relationship ''supersedes''
      is the EIP''s own word.'
    confidence: high
    source_ids:
    - eips-commit-d386b29b5a31
    - eips-blob-eip7951-creation
    - eips-blob-eip7951-pin
  - id: eip7951-d02
    target_eip: 7212
    event_type: changed
    relationship: supersedes
    occurred_at: '2025-07-04T09:19:01Z'
    commit: 75a5ba89571165ae11368d791cc5816bdb01546a
    rationale: 'Same non-EIP target as eip7951-d01 (RIP-7212 in ethereum/RIPs). The supersession itself is unchanged, but
      the compatibility claim attached to it is weakened by the gas-cost doubling: the Interface Compatibility section changes
      from ''maintains the exact same interface as RIP-7212'' with ''Same gas cost: 3450 gas'' to ''maintains a similar
      interface as RIP-7212'' with ''Different gas cost: 3450 gas vs 6900 gas'', and the Gas Cost Justification changes
      from ''maintains consistency with RIP-7212 implementations'' to ''does not maintain compatibility with L2s''. Recorded
      as a change to the dependency rather than a new one. Note the residual inconsistency at the pin: the Backwards Compatibility
      paragraph still claims ''full interface compatibility with RIP-7212 implementations deployed on Layer 2 networks''.'
    confidence: high
    source_ids:
    - eips-commit-75a5ba895711
    - eips-blob-eip7951-pin
