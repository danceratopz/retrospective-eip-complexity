unknowns:
  - >-
    Explicit negative search for cross-EIP dependencies. EIP-7044 has no frontmatter 'requires'
    field in any of its five revisions, and no revision contains a textual reference to another
    EIP or ERC number. Every blob from the creation commit through the pinned master was scanned
    case-insensitively for 'requires:', 'eip-<n>', 'EIP <n>', 'EIP-<n>' and 'erc-<n>' excluding
    self-references and the discussions-to URL; there were no matches. The document's external
    references are to ethereum/consensus-specs paths (deneb beacon-chain.md and the deneb test
    suite) and to CAPELLA_FORK_VERSION - a consensus-specs constant, not an EIP - so
    dependency_history.events is genuinely empty rather than unresearched. The Capella coupling
    is therefore a spec-level, not an EIP-level, reference and is not recorded as a dependency
    under this task's explicit-reference rule.
  - >-
    Pull-request metadata was retrieved and archived only for commit 67c43246e348 (PR #8345).
    Commits 54da9c4aa5a4, 1abd9b188192 and a67ac85a571e were merged by EIP-Bot and carry no PR
    number in their subjects; their PR numbers were not resolved. Commit a977c94ebddb references
    #8362 in its subject but that PR's metadata was not separately retrieved. The git commits are
    sufficient primary evidence for every recorded event.
  - >-
    The decision history that led to the proposal (its presentation to client developers on the
    frontmatter created date and its scheduling into the fork) belongs to the Cancun fork work
    unit and was not re-derived here.
