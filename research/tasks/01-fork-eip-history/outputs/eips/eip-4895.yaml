    path: EIPS/eip-4895.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Initial addition of EIP-4895 (merged from PR #4895): a new system-level ''withdrawal'' operation pushed
      from the beacon chain into the EVM, with a Withdrawal object of (index, address, amount) serialised as RLP([index,
      address, amount]), a new block-level `withdrawals` list, a `withdrawals_root` header commitment built as an
      index-keyed Merkle-Patricia trie, an additional block validity check, and an unconditional post-transaction
      balance increase with no gas cost. Frontmatter: status Draft, created 2022-03-10, no `requires` field. Includes
      an open TODO about withdrawal logs/receipts.'
    rationale: Adding commit; recorded as event_kind creation and excluded from revision counts.
    change_group: null
    confidence: high
    source_ids:
    - commit-1ce607ac37
