    path: EIPS/eip-4895.md
    change_type: interface_or_data_structure
    semantic_effect: substantive
    summary: 'Specifies the serialisation position of the new fields: block body becomes RLP([transactions, ommers,
      withdrawals]) and block RLP becomes RLP([header, transactions, ommers, withdrawals]); adds a dedicated ''New
      field in the execution block header: withdrawals root'' section with the full 16-element header RLP list ending
      in `withdrawals_root`; adds two NOTEs referring to EIP-3675 for the fixed ommers value and other fixed header
      values; drops the TODO about logs and receipts; expands the rationale on operations vs transactions and on
      the block-footprint bound (~1% of average block size).'
    rationale: Defines the concrete block-body and block-header encodings that clients must implement, and removes
      an unresolved specification TODO.
    change_group: null
    confidence: high
    source_ids:
