    change_type: interface_or_data_structure
    semantic_effect: substantive
    summary: 'Removes the nested RLP encoding of withdrawals: `Withdrawal` objects are now serialised as an RLP
      list with the schema `[index, address, amount]` rather than `RLP([index, address, amount])`, and the worked
      example uses plain lists; also fixes the ''dataa'' typo.'
    rationale: Changes the wire encoding of every withdrawal and therefore the withdrawals_root computation; a consensus-relevant
      serialisation change.
