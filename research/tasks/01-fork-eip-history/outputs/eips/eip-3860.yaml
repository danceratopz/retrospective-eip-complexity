    change_type: normative_behavior
    semantic_effect: substantive
    summary: >-
      Initial addition of EIP-3860 'Limit and meter initcode' in Draft status (122 lines) with
      frontmatter 'requires 170'. Defines INITCODE_WORD_COST = 2 and MAX_INITCODE_SIZE = 2 *
      MAX_CODE_SIZE = 49152, the helper initcode_cost(initcode) = INITCODE_WORD_COST *
      ceil(len(initcode) / 32), and four rules covering create transactions and the CREATE and
      CREATE2 instructions; oversize initcode causes an exceptional abort in all three cases.
    rationale: Creation commit adding the complete initial specification (merged via ethereum/EIPs#3860).
    change_group: null
    confidence: high
