unknowns:
- >-
  The seven-and-a-half-week gap between the frontmatter 'created' date (2021-07-16) and the
  first repository commit (2021-09-08) is not explained by any primary source reviewed here;
  the adding PR was opened one day before merge. Negative search: git log --follow at the pin
  reports no earlier path for this file, so no pre-2021-09-08 repository version exists.
- >-
  The failure semantics of oversize initcode in CREATE and CREATE2 changed three times
  (exceptional abort at creation, 0 pushed on the stack from eip3860-e02, exceptional abort
  again from eip3860-e06). Each commit is recorded separately; no change_group was assigned
  because these were distinct decisions taken months apart rather than one logical update split
  across commits.
- >-
