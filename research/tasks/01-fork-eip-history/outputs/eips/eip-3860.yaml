    path: EIPS/eip-3860.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: >-
      'Clarify rules inclusion and failure rules' (ethereum/EIPs#4757). Rule 1 changes from "the
      transaction is valid, may be included in a block and aborts exceptionally" to "the
      transaction is invalid"; rule 2 states the initcode cost is part of the intrinsic gas
      cost; rule 3 changes CREATE and CREATE2 oversize behaviour from exceptional abort to
      pushing 0 on the stack; the "How to report initcode limit violation?" rationale is
      rewritten accordingly; two test cases about intrinsic-gas coverage are added; Andrei
      Maiboroda is added as an author.
    rationale: >-
      Reverses the block-inclusion semantics of oversize create transactions and the failure
      mode of the creation instructions, both of which change consensus behaviour and the tests
      required for it.
