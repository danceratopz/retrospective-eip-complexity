    summary: 'Initial addition (PR #10623) as a Draft titled ''Increase churn limits'': halves CHURN_LIMIT_QUOTIENT
      from 2**16 to 2**15 as CHURN_LIMIT_QUOTIENT_GLOAS dedicated to activations and exits, introduces
      CONSOLIDATION_CHURN_LIMIT_QUOTIENT = 2**16 with a new get_consolidation_churn_limit, and redefines
      get_balance_churn_limit as the sum of the two churns for weak-subjectivity accounting (~6 day weak
      subjectivity period). Frontmatter requires: 7521.'
    rationale: Adding commit that creates the EIP file with its initial normative proposal.
