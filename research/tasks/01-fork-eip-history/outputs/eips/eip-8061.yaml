    path: EIPS/eip-8061.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Major respecification (PR #10765, 181 insertions / 60 deletions): retitles to ''Increase
      exit and consolidation churn''; reinstates the activation cap as MAX_PER_EPOCH_ACTIVATION_CHURN_LIMIT
      = 2**8, replacing MAX_PER_EPOCH_ACTIVATION_EXIT_CHURN_LIMIT; splits get_activation_exit_churn_limit
      into a capped get_activation_churn_limit and an uncapped get_exit_churn_limit; replaces get_balance_churn_limit
      with a rewritten compute_weak_subjectivity_period that weights exit churn 2/3, activation churn
      1/3 and consolidation churn 1; routes exits through the consolidation queue whenever earliest_exit_epoch
      > earliest_consolidation_epoch using compute_consolidation_epoch_and_update_churn with 2 * exit_balance
      // 3; and adds full process_pending_deposits and compute_exit_epoch_and_update_churn listings plus
      reworked rationale and weak-subjectivity figures (~7 days). Introduces an [EIP-8071] reference.'
    rationale: Wholesale change of the specified constants, churn functions, exit routing and weak-subjectivity
      formula.
    change_group: null
    confidence: high
    source_ids:
