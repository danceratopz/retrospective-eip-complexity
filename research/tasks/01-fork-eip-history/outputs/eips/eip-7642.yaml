    path: EIPS/eip-7642.md
    change_type: interface_or_data_structure
    semantic_effect: substantive
    summary: >-
      'Move to Draft' (ethereum/EIPs#9237, opened 2025-01-13 by Felix Lange and merged
      2025-04-11) rewrites the EIP. Title becomes 'eth/69 - history expiry and simpler receipts'
      and status returns Stagnant -> Draft; Ahmad Bitar is added as an author; the Status (0x00)
      message gains earliestBlock, latestBlock and latestBlockHash and moves the block hash to
      the end; a new BlockRangeUpdate (0x11) message is specified with a send-at-most-once-per-
      epoch rule; the eth/69 receipt encoding becomes the flat list
      "[tx-type, post-state-or-status, cumulative-gas, logs]" instead of the legacy or typed
      forms; new Motivation and Rationale sections cover history expiry, and EIP-7542 is cited as
      an earlier withdrawn proposal of the same idea.
    rationale: >-
      Adds a new protocol message and redefines two existing message encodings, changing what
      eth/69 requires of every client implementation and of the test suite.
    change_group: null
    confidence: high
    source_ids:
