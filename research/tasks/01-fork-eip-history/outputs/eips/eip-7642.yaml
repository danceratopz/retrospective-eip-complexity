unknowns:
- >-
  This is the single global history record for EIP-7642, which appears in two reviewed fork
  inventories (Prague and Osaka). Fork membership, the MAY/MUST rollout language in EIP-7600 and
  EIP-7607, and inclusion states are out of scope here and are held in the fork-EIP records.
- >-
  Title discrepancy. The EIP was created as 'eth/69 - Drop pre-merge fields' and renamed to
  'eth/69 - history expiry and simpler receipts' on 2025-04-11 (event eip7642-e05); eip.title
  records the title at the pin, while EIP-7607 still lists the older name.
- >-
  The EIP moved Stagnant -> Draft -> Last Call without a Review stage, and its scope changed
  twice after creation (eip7642-e02 removed the NewBlock and NewBlockHashes deletions;
  eip7642-e05 added the block-range handshake fields and the BlockRangeUpdate message). No
  primary source inside ethereum/EIPs records the decision behind either scope change; the PR
  discussions themselves were not archived for this work unit (reference only, ethereum/EIPs
  pull requests 9133 and 9237).
- >-
  Pull-request metadata used for event attribution is mutable GitHub API data archived under
  raw/eips/eip-7642/ (source gh-pr-map-eip-7642); it supplements, and never replaces, the Git
  commit evidence.
