unknowns:
- EIP-7778 never declares a 'requires' frontmatter field, at creation or at the pinned state, even though the
  block gas accounting formula at the pin depends on the EIP-7623 calldata floor. The dependency is recorded
  from the body reference only; no primary source explains the absence of the frontmatter declaration.
- The creation commit's EIP-7623 and EIP-4844 links are written as ./eip-7623 and ./eip-4844 without the .md
  suffix used everywhere else in the repository. Whether this was intentional is not recorded; the references
  are counted as explicit cross-EIP references regardless, and the suffixed form ./eip-7623.md appears when
  the reference returns at commit 5903a619bf35.
- The gas_spent receipt field lived in the specification for only nine days (commit af1a46dfb4b2, 2026-01-19,
  to commit 3929b1aab57b, 2026-01-28). Pull request ethereum/EIPs#11191 is titled 'Revert back to not having
  a receipt field' but its merged diff contains no stated reason, and no contemporaneous AllCoreDevs record
  was retrieved for this work unit, so why the field was dropped is unknown from the sources reviewed here.
- Negative search - no commit in the reviewed history renames or moves EIPS/eip-7778.md, and 'git log --follow'
  reports a single added path, so no pre-rename history exists to review.
- Event timestamps are reproduced with the offsets recorded in Git. Committer timezone offsets in this repository
  are set by the merge tooling (frequently +08:00) and are not evidence of where a change was made; all summary
  and creation dates are the equivalent UTC instants.
