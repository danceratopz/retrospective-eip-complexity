    path: EIPS/eip-7778.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: Initial addition of EIP-7778 'Prevent Block Gas Smuggling' (status Draft, author Ben Adams, no
      'requires' field, 193 lines). Proposes excluding from block gas accounting every gas discount and refund
      that does not correspond to an actual reduction in computational work, while leaving user-facing gas
      costs unchanged. Warm-access discounts and SSTORE reverts to the original value stay discounted in block
      accounting; SSTORE to zero is charged at full cost in block accounting. Gives block 20878522 as evidence
      (28.5 MGas net, 4.01 MGas refunds, 32.51 MGas gross). Frames the EIP throughout as complementing EIP-7623
      and gives a combined tx.gasUsed formula on top of the EIP-7623 calldata floor, plus tx.evm_gas_used =
      evm_gas_used - evm_gas_refund and block.evm_gas_used += evm_gas_used. Includes an Implementation section,
      five test-case groups and a non-standard 'Copyright and related rights waived via CC0 1.0 Universal.'
      notice.
    rationale: Creation commit adding the complete initial specification.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-a4c28b13ddda
