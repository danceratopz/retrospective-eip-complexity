    path: EIPS/eip-7778.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: Revival and complete rewrite, 193 lines down to 88. Status Stagnant -> Draft; title becomes 'Block
      Gas Limit Accounting without Refunds' and the description 'Prevent Block Gas Limit Circumvention by Excluding
      Refunds from Block Gas Accounting'; Toni Wahrstaetter is added as co-author. The scope narrows from 'certain
      gas discounts and refunds' to refunds alone (specifically SSTORE-to-zero), with warm-access and revert-to-original
      discounts explicitly retained in block accounting. The specification is restated as two rules - user
      gas cost stays tx.gas_used = gas_used - gas_refund, and block gas accounting becomes block.gas_used +=
      gas_used with refunds not subtracted - plus a Block Gas Limit Enforcement section. The whole EIP-7623/EIP-4844
      data-availability framing, the combined calldata-floor formula, the Implementation section and the DA-heavy
      test cases are removed; the document is reorganised into standard EIP sections with new Rationale, Backwards
      Compatibility, Test Cases and Security Considerations.
    rationale: Rewrites every normative statement in the EIP, narrows what is excluded from block gas accounting,
      and removes the coupling to EIP-7623 that the original specification was built on. The resulting rule
      is what later revisions refine.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-b18c23c9f03f
