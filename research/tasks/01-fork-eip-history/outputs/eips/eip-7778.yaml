    summary: Brings the EIP-7623 calldata floor back into both accounting formulas. Section 1 is retitled 'User
      and Receipt Gas Accounting (Unchanged)' and its rule becomes gas_used = max(tx_gas_used - gas_refund,
      calldata_floor_gas_cost); the block rule becomes block.gas_used += max(tx_gas_used, calldata_floor_gas_cost),
      explicitly citing the calldata floor from EIP-7623 (./eip-7623.md). The receipt note added by the previous
      revision and the separate 'Block Gas Limit Enforcement' section are deleted.
    rationale: Changes both normative formulas by introducing a max() against the calldata floor, which alters
      the gas charged for calldata-heavy transactions at both levels, and reintroduces an explicit dependency
      on EIP-7623.
