unknowns:
  - >-
    Explicit negative search for cross-EIP dependencies. EIP-7840 has no frontmatter 'requires'
    field in any of its six revisions, and no revision contains any textual reference to another
    EIP or ERC number. Every blob from the creation commit through the pinned master was scanned
    case-insensitively for 'requires:', 'eip-<n>', 'EIP <n>', 'EIP-<n>', 'erc-<n>' and '4844'
    excluding self-references and the discussions-to URL; there were no matches. The document
    discusses blob target/max counts and the blob base fee update fraction, and mentions the
    eth_feeHistory RPC field blobGasUsedRatio, but never names EIP-4844 or any other EIP, so
    dependency_history.events is genuinely empty rather than unresearched. The coupling to the
    blob mechanism is therefore implicit architectural coupling, which this task explicitly does
    not record.
  - >-
    Pull-request metadata was retrieved and archived only for commit b3b84e06f763 (PR #9240).
    Commits 494dfe7623d6, 58a3715c0f4c and d4c67cdfe5d7 were merged by EIP-Bot and carry no PR
    number in their subjects; their PR numbers were not resolved. Commits da129d42627c (#9223)
    and ef69a66822c0 (#10308) reference PR numbers in their subjects but that metadata was not
    separately retrieved. The git commits are sufficient primary evidence for every recorded
    event.
  - >-
    No rationale for adding baseFeeUpdateFraction (event eip7840-e02) is recorded in the commit
    or in PR #9240, whose body is the repository's PR-template boilerplate. Discussion on the
    ethereum-magicians thread linked from discussions-to was not traced; it is a non-archived
    mutable source outside this work unit's git-based evidence, and the corresponding AllCoreDevs
    decision history belongs to the Prague fork work unit.
