      path: EIPS/eip-7840.md
      change_type: interface_or_data_structure
      semantic_effect: substantive
      summary: >-
        Adds a third per-fork field 'baseFeeUpdateFraction' to the blobSchedule object (example
        values cancun 3338477, prague 5007716), with a matching Motivation bullet and Rationale
        sentence; and replaces the fallback rule with a requirement that clients configure
        target, max and baseFeeUpdateFraction per fork, declaring the behavior undefined and
        client-chosen when the configuration is missing or incomplete. Frontmatter description is
        reworded from 'Include a per-fork schedule of max and target blob counts in client
        configuration files' to 'Include a per-fork blob parameters in client configuration
        files'.
      rationale: >-
        Extends the configuration data structure with a new required field carrying the blob base
        fee update fraction, and simultaneously removes the previously specified default/fallback
        behavior, replacing it with undefined behavior. Both changes affect what execution clients
        must read from their configuration files. The merging pull request (#9240, author
        @MarekM25) carries only the repository's PR-template boilerplate, so no author rationale
        is on record beyond the diff itself.
      change_group: null
      confidence: high
      source_ids:
