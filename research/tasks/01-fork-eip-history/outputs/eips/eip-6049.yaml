    Explicit negative search for cross-EIP dependencies. EIP-6049 has no frontmatter 'requires'
    field in any of its six revisions, and no revision contains any textual reference to another
    EIP or ERC number. Every blob from the creation commit through the pinned master was scanned
    case-insensitively for 'requires:', 'eip-<n>', 'EIP <n>', 'EIP-<n>' and 'erc-<n>' excluding
