    summary: Replaces the 'TBA' Security Considerations placeholder with a substantive claim (CLZ is a stateless opcode
      with a low worst-case constant cost in memory, compute and proving, and is therefore not exploitable for denial of
      service). Also adds three co-authors (Georgios Konstantopoulos, Jochem Brouwer, Ben Adams), adds an SP1/ZK proving-cost
      paragraph to the Motivation, adds a C++ reference implementation including an SP1 rv32im-optimised 8-limb variant,
      and expands the gas-cost rationale with SP1 proving comparisons against ADD.
    rationale: Fills in the EIP's security assumptions, which had been an explicit placeholder, and adds reference implementations
      that implementers and reviewers may rely on. The opcode semantics and the gas cost (3 at this point) are unchanged,
      so the substantive label rests on the security-assumption and reference-implementation content; confidence medium
      because the remainder of the diff is motivation, rationale and author metadata.
