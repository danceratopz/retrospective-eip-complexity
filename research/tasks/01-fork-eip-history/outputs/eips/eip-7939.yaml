    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Initial addition of EIP-7939 ''Count leading zeros (CLZ) opcode'' (148 lines, Draft, sole author Vectorized):
      introduces the CLZ opcode at 0x1e, which pops one 256-bit word and pushes the number of leading zero bits, returning
      256 for zero. Gives a Solidity reference implementation and a Python definition, sets the gas cost at 3 (the same
      as ADD), gives rationale for the zero case and for preferring CLZ over a trailing-zeros opcode, and lists six test
      cases. Security Considerations is a ''TBA'' placeholder. Merged via PR 9701.'
    rationale: Creation commit adding the complete initial specification.
