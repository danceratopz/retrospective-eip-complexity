    semantic_effect: substantive
    summary: 'Major redesign ''refine based on discussions'' after ACD adoption: authorization tuples
      become [chain_id, address, [nonce], y_parity, r, s] delegating to code at an address instead of
      carrying literal code; SET_CODE_TX_TYPE=0x04, MAGIC=0x05, PER_AUTH_BASE_COST=2500; value field and
      ReceiptPayload defined; per-tuple failure handling and first-occurrence rule; optional chain_id/nonce
      scoping; extensive new rationale (no initcode, creation by template, revocation, self-sponsoring)
      and security sections; all EIP-3074 references removed; outer fields follow EIP-1559 semantics.'
    rationale: Rewrites the core mechanism (code-carrying to address-delegating) plus parameters, data
      structures, and security analysis.
