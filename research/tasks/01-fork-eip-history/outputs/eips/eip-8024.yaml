    change_type: clarification
    semantic_effect: non_substantive
    summary: Rewrites the 'Disallowed immediate range' rationale. The new text first states the EVM property being
      preserved (it is not possible to jump into the middle of an instruction, which PUSH immediates uphold by
      being masked from JUMPDEST analysis), then explains that these instructions preserve it without changing
      JUMPDEST analysis by forbidding 0x5b and 0x60-0x7f in their immediates, then gives the masked-opcode alternative
      and why it would break backwards compatibility without bytecode versioning (EOF), and finally notes that
      the encoding can be reused by future immediate-carrying instructions. 'counterfactual deployments-in-waiting'
      becomes 'included in transactions yet to be published on chain'. The sentence saying it would be safe to
      allow 0x5c to 0x5f is deleted.
    rationale: Confined to the Rationale section. The disallowed immediate ranges, the instruction algorithms,
      the encode/decode functions and every test vector are unchanged, so nothing an implementer or test author
      consumes moves.
