    commit: d0b75a60e8b8cd79048a439c78fb3b3d1c3c9adb
    path: EIPS/eip-8024.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: Re-encodes all three immediates branchlessly and widens EXCHANGE. decode_single becomes (x + 145)
      % 256 and encode_single (n + 111) % 256, replacing the two-branch +17 / -20 form; decode_pair replaces 'k
      = x if x <= 79 else x - 48' with 'k = x ^ 143' and encode_pair returns 'k ^ 143'. EXCHANGE's invalid immediate
      range widens from 79 < x < 128 to 81 < x < 128 (so 0x50 and 0x51 become valid), decode_pair's assertion
      admits x <= 81 and encode_pair's admits n <= 14. Every assembly and execution test vector is re-encoded
      to the new immediates (for example DUPN 17 is now e680 rather than e600, EXCHANGE 2 3 is e89d rather than
      e812), e850 changes from INVALID_EXCHANGE, POP to EXCHANGE 14 16, and e851 / e852 are added.
    rationale: 'Changes the byte-level encoding of every immediate for all three instructions and the set of valid
      EXCHANGE operand pairs. The most disruptive revision after creation: all previously published bytecode examples
      and test vectors become invalid.'
    change_group: null
    confidence: high
    source_ids:
