    path: EIPS/eip-7708.md
    change_type: clarification
    semantic_effect: substantive
    summary: 'Records the Soldogn interop breakout decisions. Replaces the three ''Open questions'' with settled
      Rationale prose: SYSTEM_ADDRESS is confirmed as the emitter for consistency with EIP-4788 and to distinguish
      protocol logs from contract logs; priority-fee and base-fee logs are rejected (log-volume cost, already
      derivable from header and receipt); withdrawal logs are rejected (no natural emission point, already
      derivable) and clients MAY instead expose an aggregating RPC. Replaces the ''TODO'' Test Cases section
      with a ten-item test list and a link to the execution-specs suite eip7708_eth_transfer_logs pinned at
      tree 155c3e136d81dcd5c61086c9d832595b7641db4a. Also changes ''non-zero'' to ''nonzero'' in the ordering
      sentence.'
    rationale: Closes the three outstanding design questions that determined the EIP's scope (which value flows
      emit logs) and defines the required test surface, including fork-transition behaviour. Both are inputs
      to implementation and testing even though no existing normative rule is reworded.
