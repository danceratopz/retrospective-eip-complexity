    path: EIPS/eip-7708.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Initial addition of EIP-7708 ''ETH transfers emit a log'' (status Draft, authors Vitalik Buterin
      and Peter Davies): every nonzero-value CALL, nonzero-value-transferring SELFDESTRUCT and nonzero-value-transferring
      transaction issues a log identical to a LOG3 with topics (MAGIC, sender, recipient) and a big-endian
      32-byte value as data. MAGIC is left as ''TBD''. Transaction-level logs precede EVM-execution logs; the
      other two are emitted when the transfer executes. Two open questions are recorded (withdrawals, fee payments)
      and the Test Cases section is ''TODO''.'
    rationale: Creation commit adding the complete initial specification.
    change_group: null
    confidence: high
