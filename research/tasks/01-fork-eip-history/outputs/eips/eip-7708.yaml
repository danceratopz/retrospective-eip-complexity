    path: EIPS/eip-7708.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Revival and first full specification pass (PR open for fourteen months). Status Stagnant -> Draft;
      adds Etan Kissling, Gajinder Singh and Carson as co-authors. Replaces the placeholder ''Parameters /
      MAGIC: TBD'' section with a concrete ''ETH transfer logs'' section: the emitting address becomes SYSTEM_ADDRESS
      0xfff...ffe (citing EIP-4788), topics[0] becomes keccak256(''Transfer(address,address,uint256)'') (0xddf252ad...),
      topics[1]/topics[2] the zero-padded from/to addresses and data the big-endian uint256 amount, explicitly
      matching the ERC-20 Transfer event. Restricts the SELFDESTRUCT transfer log to SELFDESTRUCT to a different
      account and adds a new ''Selfdestruct processing'' section defining a LOG2-shaped log with topics[0]
      = keccak256(''Selfdestruct(address,uint256)'') (0x4bfaba34...) for SELFDESTRUCT to the same account.
      Rewrites the open questions to ask which magic emitter address to use.'
    rationale: 'Turns an under-specified sketch into an implementable log encoding: it fixes the emitter address,
      the topic hashes, the data encoding and the log arity, and adds an entirely new log kind for self-directed
      SELFDESTRUCT. Every one of these changes affects client implementation and test generation.'
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-e8f1b9a9cd48
    - gh-pr-map-eip-7708
  - id: eip7708-e03
    event_kind: revision
    authored_at: '2026-01-21T10:52:30+01:00'
