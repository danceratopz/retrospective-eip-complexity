    change_type: normative_behavior
    semantic_effect: substantive
    summary: Simplifies the EIP by delegating the burn case to EIP-8246. Reverts the title and description
      to 'ETH transfers emit a log' and the Abstract to 'All ETH transfers emit a log'; adds 8246 to 'requires';
      deletes the entire 'ETH burn logs' section (the LOG2 Burn event, its topic hash, its two triggers and
      its ordering rule); replaces 'No backward compatibility issues found' with a Backwards Compatibility
      subsection stating that after EIP-8246 ETH can no longer be burned via SELFDESTRUCT to self or by sending
      ETH to an account marked for selfdestruction, so the edge case is not specified here; and removes the
      two burn-log test cases.
    rationale: Removes an entire normative log kind from the EIP and makes the remaining specification conditional
      on another proposal. This is the largest scope reduction in the file's history and directly changes what
      clients must implement.
