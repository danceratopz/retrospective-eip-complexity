    path: EIPS/eip-7708.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Adds Jared Wasinger as co-author and broadens the LOG2 selfdestruct log into an account closure
      log: besides SELFDESTRUCT to self it is now also emitted for ''any nonzero-value-holding account closure'',
      placed after all EVM-execution logs but before charging the EIP-1559 priority fee, in lexicographical
      order of closed account address. topics[1] is redefined from the ''from'' address to the closed contract_address,
      and an explanatory sentence covers the case of a contract already flagged for SELFDESTRUCT that receives
      further ETH.'
    rationale: Adds a new emission trigger, a new block-position rule and a new ordering rule, and redefines
      a topic's meaning; all are directly implementation- and test-visible.
    change_group: null
    confidence: high
