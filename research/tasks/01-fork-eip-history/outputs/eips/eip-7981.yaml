    commit: acc2533ec925d0659d2001d64edc3e6466e62400
    path: EIPS/eip-7981.md
    change_type: clarification
    semantic_effect: substantive
    summary: 'Pins down what is counted - ''the addresses (20 bytes each) and storage keys (32 bytes each)
      contained within the access list'' replaces ''the serialized access list data'' - and adds a Reference
      Implementation section giving EELS Python: a count_access_list_bytes helper and the calculate_intrinsic_cost
      integration that adds access_list_data_cost to the intrinsic gas for AccessList, FeeMarket, Blob and
      SetCode transactions. Also removes a stray blank line.'
    rationale: 'Removes a real ambiguity: ''serialized access list data'' could have been read as including
      RLP framing, whereas the new wording and the reference implementation count exactly 20 bytes per address
      and 32 bytes per key. The reference implementation also fixes which transaction types are affected and
      where in the intrinsic-cost calculation the charge lands.'
    change_group: null
