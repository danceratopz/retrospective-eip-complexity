    commit: 1356811a1522f1be9df1a2a600f2ac7a750cf7ba
    path: EIPS/eip-7981.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Restructures the EIP from a standalone surcharge into a modification of the EIP-7623 floor itself.
      ''requires'' becomes 2930, 7623 and TOTAL_COST_FLOOR_PER_TOKEN returns to 10 sourced from EIP-7623 (Motivation
      reference reverted too). Access list tokens are now added to access_list_cost AND folded into the floor:
      total_data_tokens = tokens_in_calldata + tokens_in_access_list, data_floor_gas_cost = TX_BASE_COST +
      TOTAL_COST_FLOOR_PER_TOKEN * total_data_tokens. A full tx.gasUsed formula with the max() of execution-side
      and floor-side costs is given, plus a new validity rule: a transaction with a gas limit below 21000 +
      TOTAL_COST_FLOOR_PER_TOKEN * total_data_tokens, or below its intrinsic gas cost, is invalid. The Rationale
      is replaced, ALL THREE test cases are deleted, the reference implementation is rewritten around calculate_access_list_tokens
      and a combined intrinsic/floor return, and Security Considerations is rewritten.'
    rationale: 'Changes what the EIP does: access list data now participates in the transaction floor calculation
      rather than only being surcharged, and a new transaction-validity condition is introduced. This changes
      gas outcomes for transactions whose execution cost sits below the floor, and adds a new invalidity case
      clients must enforce.'
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-1356811a1522
    - gh-pr-map-eip-7981
  - id: eip7981-e06
    event_kind: revision
    authored_at: '2026-03-27T13:15:07+01:00'
