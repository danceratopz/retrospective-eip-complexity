    commit: 2fbffe5f4d590876fba00489a597e2a0ef675a5b
    path: EIPS/eip-7981.md
    change_type: parameter
    semantic_effect: substantive
    summary: 'Replaces the single per-byte charge with a zero/non-zero split: ACCESS_LIST_DATA_COST_PER_BYTE
      = 16 is removed and ACCESS_LIST_NONZERO_BYTE_COST = 40 and ACCESS_LIST_ZERO_BYTE_COST = 10 are introduced,
      counted over the serialized access list data. A ''Source'' column is added to the parameter table. Effective
      costs rise to ~3200 gas per address and ~3180 gas per storage key; the block-size analysis (478 KB ->
      362 KB) and all three test cases are recomputed.'
    rationale: More than doubles the data surcharge and changes its shape from uniform per-byte to zero/non-zero
      weighted, which changes the gas charged for every access-list-bearing transaction.
    change_group: null
    confidence: high
