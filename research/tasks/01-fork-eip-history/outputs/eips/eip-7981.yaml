    path: EIPS/eip-7981.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: Initial addition of EIP-7981 'Increase access list cost' (status Draft, author Toni Wahrstaetter,
      requires 2930). Adds a flat data charge of ACCESS_LIST_DATA_COST_PER_BYTE = 16 gas per byte of access-list
      data on top of the existing EIP-2930 costs (ACCESS_LIST_ADDRESS_COST 2400, ACCESS_LIST_STORAGE_KEY_COST
      1900), with access_list_data_bytes = addresses * 20 + storage_keys * 32, giving 2720 gas per address
      and 2412 gas per storage key. Motivated as closing the loophole that lets access lists circumvent EIP-7623
      floor pricing. Includes a maximum-block-size analysis at a 36M gas limit (607 KB down to 478 KB) and
      three worked test cases.
    rationale: Creation commit adding the complete initial specification.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-a18e17596411
    - eips-blob-eip7981-creation
