    commit: 71d3353c3f6776485539fe2ec526b7cc80780bfc
    path: EIPS/eip-7981.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Simplifies the specification back to a flat surcharge (contributed by Pawel Bylica). The access
      list floor-token machinery is deleted: access_list_data_cost = 64 * access_list_bytes (1280 per address,
      2048 per storage key), stated to match the EIP-7976 calldata floor rate, and this surcharge is added
      to tx.gasUsed OUTSIDE the max(), leaving the EIP-2930 access_list_cost and the EIP-7976 floor calculation
      untouched - the floor term reverts to TOTAL_COST_FLOOR_PER_TOKEN * floor_tokens_in_calldata. The validity
      rule becomes ''any transaction with a gas limit below tx.gasUsed evaluated with execution_gas_used =
      0 is invalid''.'
    rationale: 'Reverses the structural change made on 2026-01-21: access list data no longer enters the floor
      calculation and is charged unconditionally instead. The specification''s shape, the validity rule and
      the interaction with EIP-7976 all change, even though the effective 64 gas per byte matches the preceding
      revision for transactions above the floor.'
    change_group: eip7981-flat-surcharge
    confidence: high
    source_ids:
