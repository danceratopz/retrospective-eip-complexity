    commit: 87def23e7d59b4c01a28744a23c42edde0c97938
    path: EIPS/eip-7981.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Aligns with EIP-7976''s updated calldata floor. ''requires'' becomes 2930, 7623, 7976 and TOTAL_COST_FLOOR_PER_TOKEN
      becomes 16, sourced from EIP-7976. The zero/non-zero weighting is dropped from the floor: floor_tokens_in_access_list
      = access_list_bytes * 4 and floor_tokens_in_calldata = (zero_bytes + nonzero_bytes) * 4, so every byte
      now counts as four tokens regardless of value; total_data_tokens is renamed total_floor_data_tokens throughout,
      including in the validity rule. The reference implementation is rewritten to sum byte lengths instead
      of inspecting byte values.'
    rationale: 'Both the constant (10 -> 16) and the tokenisation rule change: a zero byte in an access list
      goes from 1 token to 4 tokens, so the surcharge rises from 10 to 64 gas per zero byte and from 40 to
      64 gas per non-zero byte. Implementations and tests must change.'
    change_group: null
    confidence: high
