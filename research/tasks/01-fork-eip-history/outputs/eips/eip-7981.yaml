    path: EIPS/eip-7981.md
    change_type: clarification
    semantic_effect: substantive
    summary: 'Brings the reference implementation into line with the flat-surcharge specification: calculate_access_list_floor_tokens
      becomes calculate_access_list_data_cost returning total_bytes * 64, the surcharge is kept separate from
      the EIP-2930 access_list_cost, and it is added to BOTH the returned intrinsic_gas and the returned floor_gas.
      The docstring now states the intended identity tx.gasUsed = max(intrinsic_gas + execution_gas_used, floor_gas).'
    rationale: The preceding commit changed the prose but left a reference implementation that still folded
      access list tokens into the floor, so the document was internally inconsistent for two days. This commit
      resolves that and, in doing so, states how the surcharge-outside-the-max formulation is realised in code
      (added to both branches) - a detail the prose does not spell out and that implementations and tests depend
      on. Grouped with the flat-surcharge rework it completes. This is the last substantive revision at the
      pinned state.
    change_group: eip7981-flat-surcharge
