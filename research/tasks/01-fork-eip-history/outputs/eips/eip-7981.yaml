    change_type: parameter
    semantic_effect: substantive
    summary: 'Retargets the floor constant from EIP-7623 to EIP-7976: ''requires'' becomes 2930, 7976 and TOTAL_COST_FLOOR_PER_TOKEN
      becomes 15 (sourced from EIP-7976) instead of 10, raising the surcharge to 60 gas per non-zero byte and
      15 per zero byte (~3600 gas per address, ~3820 per storage key). The Motivation''s floor-pricing reference
      switches to EIP-7976, all worked numbers and the reference-implementation constants are recomputed, and
      the compressed-block-size claim moves from 2.13 MiB to approximately 1.7 MiB. The title is capitalised
      to ''Increase Access List Cost'' and the description typo ''footpring'' is corrected to ''Price access
      lists for data to reduce maximum block size''.'
    rationale: A 50 per cent increase in the data surcharge, driven by adopting a different EIP's floor constant.
      Both the gas values and the declared dependency change.
    change_group: null
