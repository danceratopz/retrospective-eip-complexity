    commit: 7f01d7b262fd2acda7ccb9a7b02aa1914d42e649
    path: EIPS/eip-7843.md
    change_type: interface_or_data_structure
    semantic_effect: substantive
    summary: Moves slot computation from the execution layer to the consensus layer and adds the plumbing for
      it. A new 'RPC changes' section states that the slot number is calculated in the consensus layer and passed
      to the execution layer through the engine API, adds a slot_number uint64 parameter to engine_newPayload,
      extends the engine API PayloadAttributes object with a slot_number uint64 field, and lets consensus clients
      optionally expose eth_getSlotNumberFromTimestamp and eth_getTimestampFromSlotNumber. Adds the 'Calculation
      in consensus layer' rationale and rewrites the Motivation and the encrypted-mempool sub-section as an example
      application; description becomes 'Precompile to get the current slot number'.
    rationale: Introduces new cross-layer interface surface (engine API parameter and PayloadAttributes field,
      plus two optional JSON-RPC methods) that clients must implement, so the change is substantive and interface-shaped.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-7f01d7b262fd
    - gh-pr-map-eip-7843
  - id: eip7843-e02
    event_kind: revision
    authored_at: '2025-01-27T11:51:20+00:00'
    committed_at: '2025-01-27T11:51:20+00:00'
    commit: b9726100a21e8547d9e72b0c9cfae21f860e1fdc
    path: EIPS/eip-7843.md
    change_type: interface_or_data_structure
    semantic_effect: substantive
    summary: 'Replaces the ''newPayload change'' sub-section with a ''Header extension'': instead of an engine_newPayload
      parameter, the execution block header encoding is extended with a slot_number uint64 field. Adds a ''ZK-VM
      proving'' rationale arguing that SLOT does not increase proving complexity because the slot number now lives
      in the header, keeping the block self-contained for proving.'
    rationale: Relocating the slot number from an engine API parameter into the block header changes the block
      data structure, block hashing and header validation for every client, so this is a substantive interface
      change despite being an eight-line diff.
    change_group: null
    confidence: high
