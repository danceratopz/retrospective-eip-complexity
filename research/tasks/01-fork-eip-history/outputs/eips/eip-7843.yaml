    path: EIPS/eip-7843.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Converts the proposal from a precompile to an opcode and gives it a concrete encoding: title becomes
      ''SLOTNUM opcode'', description ''Opcode to get the current slot number'', discussions-to moves to the slotnum-opcode
      topic, and the Specification now reads ''A new opcode SLOTNUM is introduced at 0x4b. It shall return one
      stack element'', with an Output stack table and ''SlotNumber is an 8 byte uint in big endian encoding'';
      the fixed gas cost of 2 is retained. The Motivation is rewritten around two existing ways to obtain the
      slot number on chain - computing it from the block timestamp, or supplying it as calldata and proving it
      against the beacon block root using EIP-4788 - and the two optional JSON-RPC conversion endpoints and the
      ''Precompile'' rationale sub-section are deleted.'
    rationale: Changes the instruction form (precompile to opcode), assigns the opcode byte 0x4b, replaces the
      return-data encoding with a stack result, and removes previously specified optional RPC surface. This is
      the largest normative change in the file's history and is also the commit that first names another EIP.
    change_group: null
    confidence: high
