    path: EIPS/eip-7843.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: Initial addition of EIP-7843 'SLOT precompile' (59 lines, status Draft, type Standards Track, category
      Core, single author Marc Harvey-Hill). It specifies a new precompiled contract SLOT at an unassigned address
      ('If block.timestamp >= TBD a new precompiled contract SLOT shall be created at address TBD'), returning
      the current slot number as an 8 byte ulong big-endian, at a fixed gas cost of 2. Motivation is that contracts
      otherwise have to hardcode the chain slot length; a sub-section motivates encrypted mempools. Rationale
      covers the W_base pricing and the choice of a precompile over an opcode (L2 flexibility).
    rationale: Creation commit adding the complete initial document, including the new precompile, its output
      encoding and its gas cost. Both the activation condition and the precompile address are 'TBD' placeholders
      at this point.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-e5b4a82dda0f
    - gh-pr-map-eip-7843
    - eips-blob-eip7843-creation
