    path: EIPS/eip-6780.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: "Rewrites the Specification bullets ('Add clarifications to EIP-6780'): states that the current execution\
      \ frame halts, that SELFDESTRUCT deletes no data at all (storage keys, code, account) outside same-transaction\
      \ creation, that Ether is no longer burnt when target == self for pre-existing contracts (but still burnt\
      \ for same-transaction-created contracts), and adds a definition of when a contract is 'considered created'\
      \ (start of a create transaction or when a CREATE-series operation begins execution, including when a balance\
      \ already exists at the address). Also adds a counterfactual-account rationale paragraph, rewrites Backwards\
      \ Compatibility, and fixes the mis-numbered Security Considerations list while adding the Ether-burn case."
    rationale: Changes and materially clarifies normative EVM behaviour (self-targeting burn semantics, frame halting,
      contract-creation definition) that implementers and testers must follow.
    change_group: null
    confidence: high
