    commit: 105ac0656c0931dc6052581c41fa6225ea90afef
    path: EIPS/eip-7732.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Resynchronises the EIP with the consensus-specs design, repinning the six links to consensus-specs
      9e2dc0bcf9aa17b549e1df4712b16a5709d74119 and rewriting the summary. The builder payment becomes an execution-layer
      withdrawal to a proposer-chosen address rather than a direct beacon-balance credit; PTC attestations also
      cover blob data availability. PAYLOAD_ABSENT/PRESENT/WITHHELD/INVALID_STATUS are dropped and PayloadAttestationData''s
      uint8 payload_status becomes the booleans payload_present and blob_data_available; new BuilderPendingPayment
      and BuilderPendingWithdrawal containers, the BUILDER_PEDING_WITHDRAWALS_LIMIT (sic) preset of 2**20 and
      BUILDER_WITHDRAWAL_PREFIX 0x03 are added; ExecutionPayloadEnvelope gains execution_requests and slot; BeaconState
      gains execution_payload_availability, builder_pending_payments and builder_pending_withdrawals and loses
      latest_full_slot; process_execution_payload_header now queues a pending payment; a new epoch-processing
      helper process_builder_pending_payments is added; the unused AttestationData ''index'' field is repurposed
      to signal payload availability. Fork choice is restructured: INTERVALS_PER_SLOT, PROPOSER_SCORE_BOOST, PAYLOAD_WITHHOLD_BOOST
      and PAYLOAD_REVEAL_BOOST are removed in favour of PAYLOAD_STATUS_PENDING/EMPTY/FULL, ChildNode becomes ForkChoiceNode,
      LatestMessage gains payload_present, the Store loses the withhold/reveal boost fields, and the ''Builder
      timeliness boosts'' rationale and the ''Reorg resistance'' security section are deleted. The inclusion-list
      compatibility reference changes from EIP-7547 to EIP-7805.'
    rationale: Changes constants, container definitions, state fields, state-transition and fork-choice rules,
      the payment mechanism and the stated security properties. Substantive by every clause of the rubric, and
      the commit that also replaces one explicit cross-EIP reference with another.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-105ac0656c09
    - gh-pr-map-eip-7732
  - id: eip7732-e04
    event_kind: revision
    authored_at: '2026-02-03T18:36:55-03:00'
