    path: EIPS/eip-7732.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Initial addition of EIP-7732 ''Enshrined Proposer-Builder Separation'' (296 lines, status Draft,
      type Standards Track, category Core, five authors). The Specification states ''Execution Layer: No changes
      are required'' and ''Engine API: No changes needed'', and delegates the full normative content to six consensus-specs
      documents (beacon chain, fork choice, p2p, validator, a new honest builder guide, fork logic) pinned at
      consensus-specs commit 1508f51b80df5488a515bfedf486f98435200e02 under specs/_features/eipxxxx/. The in-EIP
      summary introduces the payload-status constants, PTC_SIZE = 512, DOMAIN_BEACON_BUILDER, DOMAIN_PTC_ATTESTER,
      MAX_PAYLOAD_ATTESTATIONS = 4, the PayloadAttestation* / SignedExecutionPayloadHeader / ExecutionPayloadEnvelope
      containers, BeaconState and BeaconBlockBody additions, the reworked state-transition and withdrawal flow,
      fork-choice constants (PROPOSER_SCORE_BOOST reduced 40 -> 20, PAYLOAD_WITHHOLD_BOOST and PAYLOAD_REVEAL_BOOST
      at 40) with (Block, Slot, Payload) voting, two new p2p topics, a Rationale, and Security Considerations
      on reorg resistance, builder safety and a malicious PTC.'
    rationale: Creation commit adding the complete initial document. Substantive by definition, and the point
      at which the EIP's reference-based specification style - normative content held in pinned consensus-specs
      URLs, summarised in the EIP - is established.
