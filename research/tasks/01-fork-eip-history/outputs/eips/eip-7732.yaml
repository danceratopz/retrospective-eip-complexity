    commit: 4d7af9552edad39b66d82e4ea8403dce563a20be
    path: EIPS/eip-7732.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Second full resynchronisation, this time against the Gloas specs: the six links move to consensus-specs
      c94138e73e0e70eb4b27f9be4d4e9325fa1aebf7 and from specs/_features/eip7732/ to specs/gloas/. Builders become
      a distinct in-protocol entity rather than an attribution of validators - a new BuilderIndex type, BUILDER_INDEX_FLAG,
      BUILDER_INDEX_SELF_BUILD, a Builder container and a builders registry with BUILDER_REGISTRY_LIMIT, MAX_BUILDERS_PER_WITHDRAWALS_SWEEP,
      MIN_BUILDER_WITHDRAWABILITY_DELAY and the BUILDER_PAYMENT_THRESHOLD numerator/denominator - and the Abstract
      records that builder stake is not actively validating, is exempt from the churn queues, can be as little
      as 1 ETH, and that trusted ''promise'' payments are accommodated. SignedExecutionPayloadHeader is renamed
      SignedExecutionPayloadBid with a new ExecutionPayloadBid container; DOMAIN_BEACON_BUILDER changes from 0x1B000000
      to 0x0B000000 and DOMAIN_PROPOSER_PREFERENCES 0x0D000000 is added; full BeaconBlockBody and BeaconState
      listings replace the prose deltas, with latest_withdrawals_root replaced by payload_expected_withdrawals
      and next_withdrawal_builder_index added; ExecutionPayloadEnvelope drops blob_kzg_commitments and payload_withheld;
      builder deposits with the builder withdrawal prefix are processed immediately; the fork-choice section is
      reduced to a one-line statement that forkchoice is changed substantially; a ProposerPreferences p2p topic
      is added; and a ''Free option problem'' security section is added. Justin Traglia is added as an author.'
    rationale: Changes types, containers, domain constants, the builder model, the withdrawal flow, the p2p topic
      set and the security analysis. Substantive, and the version of the specification that stands at the pinned
      repository commit.
    change_group: null
    confidence: high
