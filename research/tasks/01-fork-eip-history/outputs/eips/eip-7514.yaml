unknowns:
  - >-
    Explicit negative search for cross-EIP dependencies. EIP-7514 has no frontmatter 'requires'
    field in any of its seven revisions, and no revision contains a textual reference to another
    EIP or ERC number. Every blob from the creation commit through the pinned master was scanned
    case-insensitively for 'requires:', 'eip-<n>', 'EIP <n>', 'EIP-<n>' and 'erc-<n>' excluding
    self-references and the discussions-to URL; there were no matches. The document's external
    references are to ethereum/consensus-specs paths only, so dependency_history.events is
    genuinely empty rather than unresearched. Note that the creation-commit discussions-to URL
    contained the slug 'eip-7668'; this is a stale Ethereum Magicians thread slug corrected in
    commit 5c9a79728b34 and is not a reference to EIP-7668 (see event eip7514-e03).
  - >-
    Pull-request metadata was retrieved and archived for commits b27a4c881f5f (#7715),
    4534f1e30bc5 (#7717) and 67c43246e348 (#8345). Commits 2d470f8085d5, 5c9a79728b34 and
    37a5e93275c8 were merged by EIP-Bot and carry no PR number in their subjects; their PR
    numbers were not resolved. Commit 9cc70b8923e5 references #7756 in its subject but that PR's
    metadata was not separately retrieved. The git commits are sufficient primary evidence for
    every recorded event.
  - >-
    PR #7715 attributes the constant change to ethereum/pm issue 857. That issue was not
    retrieved - ethereum/pm is not available as a local read-only clone in this work unit and the
    AllCoreDevs decision history belongs to the Cancun fork work unit - so the reference is
    recorded as it appears in the archived PR body without independent verification.
