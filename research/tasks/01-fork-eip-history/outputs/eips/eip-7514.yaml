      path: EIPS/eip-7514.md
      change_type: parameter
      semantic_effect: substantive
      summary: >-
        Changes the constant MAX_PER_EPOCH_CHURN_LIMIT from 12 to 8; adds a pointer to the full
        specification at consensus-specs specs/_features/eip7514/beacon_chain.md pinned at
        a56c4d026ff4fd39cbd77b7b8545eae719613018; deletes the two later-activation-date
        projection tables and rewrites the concluding rationale sentence for the value 8, adding
        that 8 prevents reaching 50 percent ETH staked for at least a full year even with a
        delayed fork.
      rationale: >-
        Direct change to the EIP's only normative parameter, which determines the enforced
        activation-churn bound; implementations and tests depend on the value. The merging pull
        request (#7715, body 'Update constant value as decided in
        https://github.com/ethereum/pm/issues/857') attributes the value to a recorded
        AllCoreDevs decision.
      change_group: null
      confidence: high
      source_ids:
