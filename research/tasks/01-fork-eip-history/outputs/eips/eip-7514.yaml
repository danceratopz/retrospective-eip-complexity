        - gh-pr-7715
    - id: eip7514-e02
      event_kind: revision
      authored_at: '2023-09-14T18:47:25+02:00'
      committed_at: '2023-09-14T16:47:25+00:00'
      commit: 4534f1e30bc55025c7ca5b871e4788173fdfdba5
      path: EIPS/eip-7514.md
      change_type: normative_behavior
      semantic_effect: substantive
      summary: >-
        Renames the constant MAX_PER_EPOCH_CHURN_LIMIT to MAX_PER_EPOCH_ACTIVATION_CHURN_LIMIT
        (value 8 unchanged) and replaces the single consensus-layer bullet 'Modify
        get_validator_churn_limit function adding an upper bound' with two bullets - 'Add
        get_validator_activation_churn_limit with upper bound
        MAX_PER_EPOCH_ACTIVATION_CHURN_LIMIT' and 'Modify process_registry_updates to use bounded
        activation churn limit'.
      rationale: >-
        More than a rename - it narrows the specified change from bounding the shared churn-limit
        helper to adding a separate activation-only helper consumed by process_registry_updates,
        so the bound applies to the entry queue and not to exits. Changes both the identifier
        implementers must use and the function-level shape of the state-transition change. PR
        #7717 records the intent as 'Align EIP variable names to
        https://github.com/ethereum/consensus-specs/pull/3499'. Left ungrouped from eip7514-e01
        despite landing two hours later on the same day - the parameter value change and the
        helper-scope change are distinct decisions with distinct upstream references.
      change_group: null
      confidence: high
      source_ids:
        - eips-commit-4534f1e30bc5
        - gh-pr-7717
