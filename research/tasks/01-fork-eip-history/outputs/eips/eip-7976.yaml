    path: EIPS/eip-7976.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: Re-targets the EIP from a 15/60 floor to a flat 64 gas per calldata byte. TOTAL_COST_FLOOR_PER_TOKEN
      changes from 15 to 16 and a new quantity floor_tokens_in_calldata = (zero_bytes_in_calldata + nonzero_bytes_in_calldata)
      * 4 is introduced; the floor branch of the tx.gasUsed max() and the transaction-validity threshold both
      switch from tokens_in_calldata to floor_tokens_in_calldata, which removes the 1:4 zero/non-zero asymmetry
      inherited from EIP-7623. Description, Abstract, Motivation (a 10 MiB payload would need ~671M gas rather
      than ~105M), Rationale (~0.67 MB worst case at 45M gas, ~37% reduction), the wallet guidance (parameter
      value 16) and the Test Cases are all updated to match.
    rationale: Changes the normative pricing parameter and the calldata-tokenisation used by the floor, so every
      implementation and every test vector for this EIP changes. The largest substantive revision in the file's
      history.
