    path: EIPS/eip-7976.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Initial addition of EIP-7976 ''Further increase calldata cost'' (108 lines, status Draft, type Standards
      Track, category Core, single author Toni Wahrstaetter, frontmatter ''requires: 7623''). It raises the EIP-7623
      calldata floor from 10/40 to 15/60 gas per zero/non-zero byte by setting TOTAL_COST_FLOOR_PER_TOKEN to 15
      while STANDARD_TOKEN_COST stays 4, restates the tx.gasUsed max() formula, and declares transactions invalid
      whose gas limit is below 21000 + TOTAL_COST_FLOOR_PER_TOKEN * tokens_in_calldata or below intrinsic gas.
      Also imports INITCODE_WORD_COST = 2 from EIP-3860, and adds Rationale (~0.72 MB to ~0.47 MB worst-case payload
      at a 30M gas limit), Backwards Compatibility (eth_estimateGas MUST be updated), Test Cases and Security
      Considerations sections.'
    rationale: Creation commit adding the complete initial document, including the single normative pricing parameter
      and the gas formula.
    change_group: null
    confidence: high
    source_ids:
