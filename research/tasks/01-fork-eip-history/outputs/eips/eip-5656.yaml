    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Initial addition of EIP-5656 ''Memory copying instruction'' (104 lines, status Draft, no frontmatter
      ''requires''). Introduces the `MCOPY` instruction at opcode `0x5c` with input stack (dst, src, length), no
      output stack items, overlapping-safe copy semantics (''as if an intermediate buffer were used''), memory
      expansion, and gas cost `Gverylow + Gcopy * ceil(length / 32)`. Test Cases and Security Considerations are
      ''TBA''.'
    rationale: Creation commit adding the complete initial specification.
