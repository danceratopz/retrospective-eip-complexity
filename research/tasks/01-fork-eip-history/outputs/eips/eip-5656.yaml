    summary: 'Adds a new ''### Gas costs'' subsection to the Specification stating that MCOPY belongs to the yellow-paper
      `W_copy` opcode group and giving the explicit formula: words_copied = (length + 31) // 32; g_verylow = 3;
      g_copy = 3 * words_copied + memory_expansion_cost; gas_cost = g_verylow + g_copy.'
    rationale: Makes the gas schedule explicit with concrete constants and memory-expansion accounting, where the
      creation text only gave the symbolic `Gverylow + Gcopy * ceil(length / 32)`. Directly affects implementation
      and test expectations, so substantive.
