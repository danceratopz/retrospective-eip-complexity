unknowns:
- >-
  No explicit cross-EIP dependency exists in any revision. Negative search - every one of the seven
  blob versions of the file (creation as eip-7935.md through the pinned EIPS/eip-7935.md) was
  grepped case-insensitively for 'eip-<digits>', 'EIP <digits>' and 'requires'; there are no matches
  other than the EIP's own number, and the frontmatter never carried a 'requires' field.
- >-
  Unnamed cross-EIP reference, recorded rather than converted into a dependency event. Since
  creation and unchanged at the pin, Backwards Compatibility reads 'It is possible that with a
  higher limit new transactions could exceed the proposed 30M transaction gas limit, so the
  scheduling of these two EIPs should be coordinated.' The phrase 'these two EIPs' explicitly
  asserts a coordination relationship with another proposal, and the 30M figure matches the cap
  EIP-7825 specified at that time, but the text never names an EIP number, so under this task's
  definition of an explicit cross-EIP dependency no dependency event is recorded. The sentence was
  never updated after EIP-7825 lowered its cap to 16,777,216 (2^24) on 2025-07-13, so the 30M figure
  is stale in the Final text. Identifying the intended target would require inference and is left
  to a later analysis step. Similarly, Security Considerations refers to 'the current 10MiB CL
  gossip limit' - the same constraint EIP-7934 addresses - without naming an EIP.
- >-
  Event timestamps are reproduced with the offsets recorded in Git. The committer timezone offsets
  in this repository are set by the merge tooling and are not evidence of where a change was made;
  all summary dates are the equivalent UTC instants.
