    change_type: normative_behavior
    semantic_effect: substantive
    summary: >-
      Initial addition of EIP-7825 'Transaction Gas Limit Cap' (74 lines, status Draft):
      a protocol-level cap of 30 million gas on the gas limit of any single transaction,
      enforced both in txpool validation (transactions above the cap are not pooled) and in
      block validation (a block containing such a transaction is invalid), independent of
      the block gas limit.
    rationale: Creation commit adding the complete initial specification.
