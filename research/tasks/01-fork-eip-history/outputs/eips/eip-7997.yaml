    summary: 'Rewrites the Abstract and two Motivation paragraphs, and - the substantive part - adds a prose
      normative specification of the factory''s behaviour ahead of the bytecode: when called, the account invokes
      CREATE2 (linking EIP-1014) with salt = first 32 bytes of input, init code = the remaining input and value
