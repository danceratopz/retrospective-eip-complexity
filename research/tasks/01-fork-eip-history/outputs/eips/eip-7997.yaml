    path: EIPS/eip-7997.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Complete redesign: the EIP stops specifying a new predeploy and instead formalises the already-deployed
      ''Arachnid'' keyless factory. Title becomes ''Deterministic Factory Contract''; Toni Wahrstaetter and
      Nick Johnson are added as co-authors; ''requires'' drops 211 and keeps 1014. FACTORY_ADDRESS becomes
      0x4e59b44847b379578588920cA78FbF26c0B4956C and the runtime code becomes 0x7fffffff...6014600cf3. The
      requirement is restated as ''the chain''s state MUST include FACTORY_ADDRESS with nonce 1 and this runtime
      code'', satisfiable by an ordinary (including keyless) transaction, by genesis inclusion, or by an irregular
      state transition. Behaviour differences from the previous factory are spelled out: an input shorter than
      32 bytes causes an attempted ~2^256-byte calldatacopy and reverts as a result; a failed creation reverts
      with EMPTY return data rather than propagating the creation frame''s data; the created address is returned
      as exactly 20 unpadded bytes. Motivation is condensed and re-argued around keyless transactions becoming
      undeployable as gas schedules change. The whole previous Rationale is replaced by a ''Choice of factory''
      section (about 25000 mainnet uses, hundreds of chains, EIP-1014 compatibility, no PUSH0 dependency per
      EIP-3855, and the two accepted downsides). Backwards Compatibility becomes ''no issues; a no-op on chains
      that already have it''. The Test Cases section is deleted and a Yul-equivalent listing replaces the assembly
      listing.'
    rationale: Replaces the specified contract, its address, its bytecode, its revert and return-data semantics,
      and the mechanism by which a chain satisfies the EIP. Nothing normative survives from the previous specification;
      this is the single largest change in the file's history.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-a0a7f5adb491
