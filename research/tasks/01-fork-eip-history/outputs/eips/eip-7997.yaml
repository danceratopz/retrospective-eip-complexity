    path: EIPS/eip-7997.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: Initial addition of EIP-7997 'Deterministic Factory Predeploy' (status Draft, author Francisco
      Giordano, requires 211 and 1014). Specifies FACTORY_ADDRESS = 0x0B and, upon activation, setting that
      account's code to the 52-byte minimal CREATE2 factory 60203610602f57...60006000fd, given in full as a
      Constantinople-targeted assembly listing (input = 32-byte salt followed by init code; revert if input
      is shorter than 32 bytes; forward callvalue to CREATE2; propagate the creation frame's return data on
      failure; return the 32-byte-padded created address on success). Motivation enumerates four existing workarounds
      for bootstrapping a multi-chain factory and their problems; Rationale covers the precompile-range placement,
      input validation, the deliberate absence of frontrunning protection, why not a new transaction type,
      and the Constantinople/no-PUSH0 target. Test Cases are 'TBD'.
    rationale: Creation commit adding the complete initial specification.
