    path: EIPS/eip-7997.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Removes the irregular state transition as a way of satisfying the EIP and removes the nonce rules
      that went with it. The Motivation sentence drops ''or added via irregular state transition''; the Specification
      now allows only an ordinary (including keyless) transaction or genesis inclusion with a nonce equal to
      1, deletes the nonce-0-MUST-be-set-to-1 / nonzero-MUST-NOT-be-modified rules, and adds: if a chain''s
      gas parameters no longer allow the keyless transaction, the only remedy is a coordinated irregular state
      transition that is out of scope, and ''Client software MUST NOT check for the existence of the contract
      at the fork boundary.'''
    rationale: Turns the EIP from something a client executes at activation into a chain-state expectation
      with an explicit prohibition on any fork-boundary check, and removes the nonce rules established by the
      preceding three commits. Directly changes what clients implement and what a fork-transition test may
      assert. This is the last commit touching the file at the pinned repository state.
