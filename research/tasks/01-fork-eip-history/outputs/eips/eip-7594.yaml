    path: EIPS/eip-7594.md
    change_type: interface_or_data_structure
    semantic_effect: substantive
    summary: 'Adds a new ''### Networking'' subsection to the Specification defining a replacement for
      the EIP-4844 blob-transaction pool wrapper used in PooledTransactions responses: rlp([tx_payload_body,
      wrapper_version, blobs, commitments, cell_proofs]), with wrapper_version = 1, cell_proofs carrying
      CELLS_PER_EXT_BLOB proofs per blob (extension cells included, blobs sent unextended), the indexing
      rule cell_proofs[i * CELLS_PER_EXT_BLOB + j], and four MUST validation conditions the receiving
      node applies (equal counts, exact cell-proof count, versioned-hash match, commitment/blob/cell-proof
      consistency with batch verification). Also repoints the detailed-specification link from consensus-specs
      specs/_features/eip7594/das-core.md (commit b4188829) to the specs/fulu/ tree (commit 9d377fd5).'
    rationale: Introduces a new normative wire data structure and validation rules for blob transactions;
      the first execution-layer-observable requirement in the document.
    change_group: null
    confidence: high
    source_ids:
