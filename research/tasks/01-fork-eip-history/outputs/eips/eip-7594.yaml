    change_type: security_assumption
    semantic_effect: substantive
    summary: 'Large content expansion ahead of Last Call. Frontmatter: category Networking -> Core and
      author Alex Stokes (@ralexstokes) added. Replaces the ''TBD'' Rationale with five subsections (why
      DAS scales the DA layer and the 1/8 sampling fraction, what peer sampling provides, why the parameters
      were chosen, why validators have a custody requirement beyond full nodes, column vs row sampling).
      Adds a Backwards Compatibility statement (''fully backwards compatible with EIP-4844''), replaces
      the empty Reference Implementation heading with a Test Cases pointer to the consensus and execution
      spec tests, and replaces ''Needs discussion'' in Security Considerations with a data-withholding
      analysis including the explicit upper bound P(tricking n*epsilon nodes) <= C(n, n*eps) * C(m, m/2
      - 1) * 2^(-k*n*eps) and a table of bounds for 10,000 nodes. Wording touch-ups in the abstract and
      specification (beacon nodes -> nodes, custody phrasing, wrapper_version emphasis, compute_cells
      / verify_cell_kzg_proof_batch named).'
    rationale: Adds the document's security argument and its formal withholding bound, and reclassifies
      the EIP from Networking to Core. Classified security_assumption because the security analysis is
      the largest normative-relevant addition; no MUST requirement changed. Medium confidence on the change_type
      because the commit is a mixed rationale/security/metadata update.
