      change_type: clarification
      semantic_effect: substantive
      summary: >-
        "Fix stale function name" (PR #8907): the assignment line still called
        compute_trie_root_from_indexed_data, removed by the previous commit; it now calls
        compute_requests_hash.
      rationale: >-
        Repairs the normative pseudocode left inconsistent by the flat-hash change so that
        the specified computation is unambiguous; same logical update as commit 73629679.
      change_group: eip7685-flat-hash
      confidence: medium
