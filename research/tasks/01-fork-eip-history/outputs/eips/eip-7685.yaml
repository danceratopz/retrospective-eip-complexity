      path: EIPS/eip-7685.md
      change_type: clarification
      semantic_effect: non_substantive
      summary: >-
        "Clarify intra-type ordering": drops the claim that lexicographical ordering of
        the opaque byte data would be the only valid scheme, keeping the same rule that
        intra-type order is determined by each request type individually.
      rationale: >-
        Rationale-section rewording; the normative rule (intra-type order undefined here,
        set per request type) is unchanged.
      change_group: null
      confidence: high
      source_ids: [c-67c96916]
