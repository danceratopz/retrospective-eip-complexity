      path: EIPS/eip-7685.md
      change_type: normative_behavior
      semantic_effect: substantive
      summary: >-
        "Change requests hash to flat hash" (PR #8854): replaces the Merkle-Patricia trie
        requests_root with a flat commitment, renaming the header field to requests_hash
        and defining compute_requests_hash(list) = keccak256(rlp.encode([rlp.encode(req)
        for req in list])); also rewords the opaque-byte-array rationale
        ("transaction payload" -> "request payload").
      rationale: >-
        Changes the header field name and the commitment algorithm; directly affects block
        validity computation.
      change_group: eip7685-flat-hash
      confidence: high
      source_ids: [c-73629679]
