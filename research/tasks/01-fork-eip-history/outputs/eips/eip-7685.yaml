        corrected to hash digests (m.update(sha256(r).digest())) over a
        Sequence[bytes] block_requests; adds a rationale explaining that a block with no
        requests then commits to sha256("").
      rationale: >-
        Changes which elements enter the commitment and therefore the value of
        requests_hash; directly affects block validity.
