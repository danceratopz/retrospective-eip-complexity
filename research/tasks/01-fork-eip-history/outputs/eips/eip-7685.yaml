      commit: a2c4300a9b691bc3d372dce22142f45db1c3c25a
      path: EIPS/eip-7685.md
      change_type: normative_behavior
      semantic_effect: substantive
      summary: >-
        Adds the EIP in Draft: a general purpose framework for propagating
        contract-triggered requests from the execution layer to the consensus layer. A
        Request is RequestType ++ RequestData; the header is extended with a 32-byte
        RequestsRoot computed as an MPT trie root keyed by index; the CL is told to extend
        ExecutionPayload and add a processing step in process_execution_payload.
      rationale: >-
        Initial proposal text establishing the entire framework; the adding commit is the
        creation event.
      change_group: null
      confidence: high
      source_ids: [c-a2c4300a, blob-creation]
    - id: eip7685-e02
      event_kind: revision
      authored_at: "2024-04-17T14:01:03-06:00"
      committed_at: "2024-04-17T20:01:03+00:00"
      commit: 0e0600ed164db7875be38548bfb26ec24ff78e01
      path: EIPS/eip-7685.md
      change_type: normative_behavior
      semantic_effect: substantive
      summary: >-
        "Simplify cl behavior": removes the requirement that "A additional processing step
        is be added to process_execution_payload to iterate over and process all
        requests", leaving each proposal free to choose how to extend ExecutionPayload and
        "how and when the request is processed".
      rationale: >-
        Deletes a consensus-layer processing requirement and delegates the decision to
        each request-type proposal; changes what implementers must do.
      change_group: null
      confidence: high
      source_ids: [c-0e0600ed]
    - id: eip7685-e03
      event_kind: revision
      authored_at: "2024-04-18T16:38:06-06:00"
      committed_at: "2024-04-18T22:38:06+00:00"
      commit: e2a66831fcc5984f478513ce298607e178c364e8
      path: EIPS/eip-7685.md
      change_type: interface_or_data_structure
      semantic_effect: substantive
      summary: >-
        Substantial specification build-out: renames the CamelCase types to snake_case
        (request_type / request_data / requests_root); adds a "Block structure" section
        appending a list of requests to the RLP block body; specifies requests_root
        computation with explicit compute_trie_root_from_indexed_data pseudocode; adds
        cross-type and intra-type ordering rationale sections; reflows the prose.
      rationale: >-
        Defines the block body structure and the header commitment computation that were
        previously only described in prose; changes the data structures implementers must
        produce.
      change_group: null
      confidence: high
      source_ids: [c-e2a66831]
    - id: eip7685-e04
      event_kind: revision
      authored_at: "2024-04-25T14:32:17-06:00"
