    - id: eip7685-e09
      event_kind: revision
      authored_at: "2024-10-07T08:31:38-06:00"
      committed_at: "2024-10-07T22:31:38+08:00"
      commit: a360757d75893fb9e7a9c37c98e05481d671f68f
      path: EIPS/eip-7685.md
      change_type: normative_behavior
      semantic_effect: substantive
      summary: >-
        "Group requests into request-data": removes the block-body extension entirely (the
        header alone carries the commitment); redefines a `requests` object as
        request_type ++ request_data where request_data holds zero or more encoded request
        objects of that type; replaces the keccak256/RLP commitment with
        sha256(sha256(requests_0) ++ sha256(requests_1) ++ ...); updates the abstract and
        the ordering rationale accordingly.
      rationale: >-
        Changes the block structure, the grouping of requests, and the hash function and
        construction of the header commitment.
      change_group: null
      confidence: high
      source_ids: [c-a360757d]
