    path: EIPS/eip-7892.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Initial addition of EIP-7892 (119 lines): defines Blob Parameter Only (BPO) hardforks as
      a class of fork that modifies only blob_target, blob_limit and baseFeeUpdateFraction. Extends the
      EIP-7840 `blobSchedule` object to allow an arbitrary number of block timestamps as keys, sketches
      a consensus-layer `BPO_FORK` configuration (an epoch/max_blobs table), and states four Requirements:
      EL and CL clients MUST share consistent BPO fork schedules; BPO forks MUST NOT conflict with other
      fork schedules; the blobSchedule timestamp MUST align with the start of the CL epoch; the blobSchedule
      max field MUST equal the CL max_blobs value. Includes Motivation, Rationale, Backwards Compatibility
      (''no concerns'') and Security Considerations (''no security risks identified''). Frontmatter: status
      Draft, type Informational, created 2025-02-28, requires 7840.'
    rationale: Adding commit; recorded as event_kind creation and excluded from revision counts.
    change_group: null
    confidence: high
    source_ids:
    - commit-216ebd2f32
