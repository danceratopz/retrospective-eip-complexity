    path: EIPS/eip-7892.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Largest single expansion of the EIP. Adds author Raul Kripalani (@raulk). Restructures the
      Specification into Definition / Blob schedule configuration / Execution layer configuration / Consensus
      layer configuration subsections. Execution layer: each blobSchedule fork is now linked to activation
      via a top-level `<fork_name>Time` Unix-timestamp field, BPO forks SHOULD be named `bpo<index>` starting
      at 1, activation timestamps are required only for post-Prague forks, and the illustrative JSON switches
      from raw-timestamp keys to named osaka/bpo1/bpo2 entries plus cancunTime/pragueTime/osakaTime/bpo1Time/bpo2Time.
      Adds the rule that a regular hardfork changing these parameters MUST do so by adding a blob schedule
      entry. Consensus layer: `BLOB_SCHEDULE` is defined as the sequence of blob-parameter changes after
      ELECTRA_FORK_EPOCH, one entry per changing fork. Adds a modified `compute_fork_digest` taking `current_epoch`
      and `blob_schedule` and XOR-bitmasking `max_blobs_per_block` into the 4-byte digest (returning the
      base digest when no schedule entry applies). Adds a P2P Networking section: a new ENR entry `nfd`
      (SSZ Bytes4 ForkDigest, ''next fork digest'') that nodes MUST evaluate alongside ENRForkID::next_*
      fields, a note that `Status` req/resp is unchanged but must carry the updated fork_digest, and a
      note that gossip topics rotate automatically at a BPO fork. Drops the earlier requirement ''BPO
      forks MUST NOT conflict with other fork schedules'' and changes ''The timestamp in blobSchedule''
      to ''The slot number in the EL''s blobSchedule''.'
    rationale: Introduces new normative networking behaviour (fork-digest computation, ENR field, peer
      evaluation), a new activation-timestamp configuration mechanism, and removes one previously stated
      MUST NOT requirement.
    change_group: null
    confidence: high
    source_ids:
    - commit-f37240a9ae
