    path: EIPS/eip-8282.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Initial addition (PR #11760) as a Draft: predeploys two EIP-7685 request contracts for EIP-7732
      builders - a 184-byte builder deposit contract (pubkey ++ withdrawal_credentials ++ amount ++ signature,
      first deposits and top-ups) and a 48-byte builder exit contract authorized by the caller''s execution
      address. Specifies constants (placeholder addresses and request-type bytes 0x03/0x04, per-block
      max and target counts, MIN_REQUEST_FEE, REQUEST_FEE_UPDATE_FRACTION, EXCESS_INHIBITOR, BUILDER_MIN_DEPOSIT),
      Nick''s-method presigned deployment, the EIP-7002/EIP-7251 storage layout and end-of-block SYSTEM_ADDRESS
      dequeue with a 30,000,000 gas limit, an EIP-1559-style fee, the BuilderDepositRequest/BuilderExitRequest
      SSZ containers, consensus-layer processing, and a ''Changes to EIP-7732'' section moving builder
      onboarding and exit off the validator flows. Frontmatter requires: 1559, 7685, 7732.'
    rationale: Adding commit that creates the EIP file with its initial normative proposal.
    change_group: null
    confidence: high
    source_ids:
    - git-de4c6f02c7be
    - gh-pr-map-eip-8282
  - id: eip8282-e02
    event_kind: revision
    authored_at: '2026-07-06T17:03:24Z'
    committed_at: '2026-07-06T17:03:24Z'
    commit: 20e77b2b621041e8a82a8d0cec3beb889e589fab
    path: EIPS/eip-8282.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Sync with the Gloas consensus-specs (PR #11859): BUILDER_WITHDRAWAL_PREFIX changes from
      0x03 to 0xB0 in all five places it appears; the placeholder predeploy addresses change from 0x...7732/0x...7733
      to 0x...01008282/0x...02008282; the placeholder markers on the request-type bytes are dropped; the
      SSZ containers change base class from object to Container; and the exited-builder top-up rule is
      tightened so withdrawable_epoch is re-armed only when the exited entry has already swept to zero
      (withdrawable_epoch != FAR_FUTURE_EPOCH and balance == 0) rather than on every top-up.'
    rationale: Changes a credential prefix constant, the declared predeploy addresses, an SSZ container
      declaration and a consensus-layer state-transition condition; all are implementation- and test-visible.
    change_group: null
    confidence: high
    source_ids:
    - git-20e77b2b6210
    - gh-pr-map-eip-8282
