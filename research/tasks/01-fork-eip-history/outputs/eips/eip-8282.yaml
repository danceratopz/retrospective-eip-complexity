    path: EIPS/eip-8282.md
    change_type: dependency
    semantic_effect: substantive
    summary: 'Frontmatter status Draft to Review (PR #12108); removes the parenthetical stating that EIP-7804,
      a Draft, also claims request type 0x03, leaving only ''The 0x03/0x04 request types MUST be unique
      across all active EIP-7685 request types; final allocation is coordinated in consensus-specs'';
      and empties the Reference Implementation TODO comment.'
    rationale: Removes the EIP's only explicit statement of a request-type-byte conflict with another
      in-flight proposal, changing its declared cross-EIP reference set; the normative uniqueness requirement
      itself is retained. Medium confidence because the status move and comment removal alone would be
      non_substantive and the dropped text was a coordination note rather than a rule.
    change_group: null
    confidence: medium
    source_ids:
    - git-ba60c6474f60
    - gh-pr-map-eip-8282
  - id: eip8282-e05
    event_kind: revision
    authored_at: '2026-08-10T15:23:39Z'
    committed_at: '2026-08-10T15:23:39Z'
    commit: 2d3c5e59e47103df15e51aafc815ba0b234e3388
    path: EIPS/eip-8282.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: 'Cleanup and tweaks rewrite (PR #11869, 93 insertions / 72 deletions): adds Felix Lange as
      an author; replaces Nick''s-method presigned deployment with deployment through the EIP-7997 CREATE2
      factory using a mined salt; removes the EXCESS_INHIBITOR constant and its deployment-time inhibitor
      semantics; restructures the request-queue section into Write path / Fee getter / System call and
      adds that a SYSTEM_ADDRESS call carrying calldata permanently disables the queue via an inhibitor
      and that non-matching calls MUST revert; states that both contracts apply fee increases per write
      rather than at end of block, unlike EIP-7002; moves the request-type uniqueness statement below
      the constants table with a consensus-specs permalink; simplifies the deposit acceptance condition
      to msg.value >= amount * 1 gwei + fee; fills in Reference Implementation with ethereum/sys-asm links;
      and condenses Motivation, Rationale, Backwards Compatibility and Security Considerations into headed
      subsections.'
    rationale: Changes the deployment mechanism, removes a constant, adds new system-call and revert rules
      and changes when the fee is updated; all are implementation- and test-visible.
    change_group: null
    confidence: high
    source_ids:
    - git-2d3c5e59e471
    - gh-pr-map-eip-8282
