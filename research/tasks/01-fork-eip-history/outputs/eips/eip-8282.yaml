    summary: 'Fixes the predeploy addresses to values derived from the current reference bytecode (PR
      #11899): BUILDER_DEPOSIT_CONTRACT_ADDRESS becomes 0x0000bFF46984e3725691FA540a8C7589300D8282 and
      BUILDER_EXIT_CONTRACT_ADDRESS becomes 0x000064D678505ad48F8cCb093BC65613800E8282, both without placeholder
      markers; the Deployment paragraph is restated to say the addresses derive from the presigned deployment
      transactions for the current reference bytecode and will change if that bytecode changes.'
    rationale: Replaces placeholder constants with concrete addresses that implementations and tests must
      use.
