unknowns:
- >-
  No explicit cross-EIP dependency exists in any revision. Negative search - every one of the seven
  blob versions of EIPS/eip-7934.md (creation through the pinned master commit) was grepped
  case-insensitively for 'eip-<digits>', 'EIP <digits>' and 'requires'; there are no matches other
  than the EIP's own number, and the frontmatter never carried a 'requires' field. The document does
  refer to the consensus layer's gossip size limit and, in its motivation, to block-size pressure
  generally, but it never names another EIP, so no dependency event is recorded. The Meta EIP
  EIP-7607 lists EIP-7934 for Fusaka, which is fork-work-unit scope rather than a dependency
  declared by this EIP.
- >-
  Residual inconsistency carried through to the pin - commit 9076d228026a renamed MARGIN to
  SAFETY_MARGIN in the bullet that introduces the constant but left the following bullet reading
  'MAX_RLP_BLOCK_SIZE calculated as MAX_BLOCK_SIZE - MARGIN'. That stale identifier is still present
  in the Final text at a08f51fec5b2b5da457adb05b8cffb487fb4f7de; the pseudocode below it uses
  SAFETY_MARGIN. Recorded as an observation about the document, not as a separate event.
- >-
  The pull-request title for commit 6984cfd02f9a announces a devp2p MAX_RECEIPTS_MESSAGE_SIZE change
  that does not appear in the merged diff. The GitHub API reports ethereum/EIPs#9907 as merged with
  one changed file, two additions and two deletions, matching the diff reviewed here; where the
  intended devp2p change went (a different repository, a later withdrawn PR, or nowhere) was not
  investigated because it lies outside this work unit.
- >-
  Event timestamps are reproduced with the offsets recorded in Git. The committer timezone offsets in
