    commit: 0e2559f9f1ba67f542c6ac4d0c07fac175a39a95
    path: EIPS/eip-7934.md
    change_type: parameter
    semantic_effect: substantive
    summary: >-
      Raises SAFETY_MARGIN from 512 KiB (524,288 bytes) to 2 MiB (2,097,152 bytes) in the Specification
      bullet list and pseudocode, and updates the Motivation and Rationale prose accordingly. This
      lowers the effective MAX_RLP_BLOCK_SIZE from 9,961,472 to 8,388,608 bytes.
    rationale: >-
      Changes the normative parameter that determines block validity; directly affects clients, block
      builders and tests. First commit of the two-commit safety-margin update.
    change_group: eip7934-safety-margin-2mib
    confidence: high
    source_ids:
