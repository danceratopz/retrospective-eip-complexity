    commit: 040800a32544ba8819ce7b9feaad9c8bb4400f62
    path: EIPS/eip-7934.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: >-
      Initial addition of EIP-7934 'RLP Execution Block Size Limit' (77 lines, status Draft):
      introduces MAX_BLOCK_SIZE = 10 MiB (10,485,760 bytes) and a MARGIN of 512 KiB (524,288 bytes),
      defines MAX_RLP_BLOCK_SIZE as MAX_BLOCK_SIZE - MARGIN, and makes any block whose RLP encoding
      exceeds MAX_RLP_BLOCK_SIZE invalid, both at block construction and at block validation. The
      motivation cites the consensus layer's 10 MiB gossip limit.
    rationale: Creation commit adding the complete initial specification.
    change_group: null
    confidence: high
    source_ids:
    - eips-commit-040800a32544
    - eips-blob-eip7934-creation
    - gh-pr-map-eip-7934
  - id: eip7934-e01
    event_kind: revision
    authored_at: '2025-06-10T13:22:38+03:00'
    committed_at: '2025-06-10T10:22:38+00:00'
    commit: 9076d228026a5ea6b9c7367c91d626c597d525a0
    path: EIPS/eip-7934.md
    change_type: clarification
    semantic_effect: substantive
    summary: >-
      Fixes the constant names in the Specification - the bullet list now introduces SAFETY_MARGIN
      instead of MARGIN, and the pseudocode computes MAX_RLP_BLOCK_SIZE = MAX_BLOCK_SIZE - SAFETY_MARGIN
      instead of GOSSIP_UPPER_LIMIT - SAFETY_MARGIN, replacing an identifier the EIP never defined.
    rationale: >-
      Materially clarifies the normative validity formula - as written at creation the pseudocode
      derived the block-size bound from GOSSIP_UPPER_LIMIT, a constant that appears nowhere else in
      the document, so the specification was not self-contained. Marked substantive because it changes
      what an implementer reading the pseudocode literally must do; a reviewer could reasonably call
      it editorial because the intended numeric bound (10 MiB minus the margin) is unchanged, which
      is why confidence is medium rather than high.
    change_group: null
    confidence: medium
    source_ids:
    - eips-commit-9076d228026a
    - gh-pr-map-eip-7934
  - id: eip7934-e02
    event_kind: revision
    authored_at: '2025-06-10T13:44:27+02:00'
