    summary: 'Specification updated to the design that shipped: instead of removing AttestationData.index the field is set to a fixed zero, committee indexing moves to the outer Attestation container via committee_bits, and aggregation_bits capacity is increased to all committees in a slot; the spec link moves from the eip7549 feature branch to the pinned consensus-specs Electra beacon-chain document; the deprecation-strategy rationale switches from option 1 to option 2 to avoid complicating AttesterSlashing; new rationale sections justify reducing MAX_ATTESTATIONS (to 8) and MAX_ATTESTER_SLASHINGS (2 -> 1); motivation gains the block-packing argument; a ''First block after fork'' security section is added.'
