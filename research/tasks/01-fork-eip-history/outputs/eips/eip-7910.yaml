    path: EIPS/eip-7910.md
    change_type: interface_or_data_structure
    semantic_effect: substantive
    summary: 'Largest redesign of the response. Removes the six hash/fork-id top-level members (`currentHash`/`nextHash`/`lastHash`,
      `currentForkId`/`nextForkId`/`lastForkId`) so the response contains exactly three members `current`,
      `next`, `last`, with `next`/`last` null when no future fork is configured. Deletes the ''Converting
      a Fork Configuration to a Hash'' section (RFC-8785 canonicalization plus CRC-32) and replaces the
      ''CRC-32 as Hash Format'' rationale with ''Why no configuration hash''. Adds a per-configuration
      `forkId` member (EIP-6122 FORK_HASH, `0x`-prefixed, zero-padded to four bytes, lower case). Renames
      the member `blobsSchedule` -> `blobSchedule` (including in the BPO section). Inverts the `precompiles`
      object so members are contract names and values are addresses, and requires members in alphabetical
      rather than ''canonical'' order, with the rule that future forks'' added members MUST be alphabetically
      sorted. Rewrites all sample configurations accordingly and adds a ''Without Future Fork Scheduled''
      example returning `next: null` and `last: null`. Weakens DDoS guidance from ''Clients SHOULD cache''
      to ''Clients MAY cache''.'
    rationale: Removes response members and an entire hashing procedure, adds a new member, renames another
      and inverts the shape of the precompiles map; every one of these changes what a conforming client
      returns.
    change_group: null
    confidence: high
    source_ids:
    - commit-5fbf86102e
