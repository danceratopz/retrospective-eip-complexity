    path: EIPS/eip-7910.md
    change_type: interface_or_data_structure
    semantic_effect: substantive
    summary: 'Initial addition of EIP-7910 (311 lines): specifies a new parameterless JSON-RPC method
      `eth_config` that clients MUST expose on the standard JSON-RPC port (and MAY expose via the Engine
      API), returning four members - `current`, `next`, `currentHash`, `nextHash` - where the hashes are
      CRC-32 digests of the RFC-8785 canonical JSON form of each configuration object. Defines the configuration
      object members `activationTime`, `blobsSchedule`, `chainId`, `precompiles` (address -> name map)
      and `systemContracts` (name -> address map), with per-fork name lists for Cancun and Prague, a MUST
      that the object contain exactly the parameters of the fork''s meta-EIP, a MUST that caches be purged
      at fork boundaries, and a MUST that future forks define their changes in their meta-EIPs. Includes
      Motivation (the Holesky Pectra misconfiguration), Rationale (precompile enumeration, full configs
      over deltas, nested vs flat, JSON, CRC-32 by reference to EIP-2124), Backwards Compatibility, Test
      Cases with Hoodi Prague/Cancun sample configs and a sample curl/response, a Reference Implementation
      pointer to Besu PR #8417, and Security Considerations (exposure, dishonest nodes, DDoS). Frontmatter:
      status Draft, type Standards Track, category Interface, created 2025-03-18; no `requires` field.'
    rationale: Adding commit; recorded as event_kind creation and excluded from revision counts.
    change_group: null
    confidence: high
    source_ids:
    - commit-3df094834b
    - blob-eip7910-creation
  - id: eip7910-e02
    event_kind: revision
    authored_at: '2025-07-09T19:40:29+02:00'
    committed_at: '2025-07-10T01:40:29+08:00'
    commit: 59c5b1739bc30ae056517d5c1bc1cfd6ebf0a30f
    path: EIPS/eip-7910.md
    change_type: interface_or_data_structure
    semantic_effect: substantive
    summary: 'Extends the response object from four to nine members: adds `last` and `lastHash` (the last
      known configuration, equal to `next` when the next fork is also the last) and adds `currentForkId`,
      `nextForkId` and `lastForkId` carrying the EIP-6122 `FORK_HASH` value. Adds a ''Blob Parameter Only
      Forks'' section stating that EIP-7892 BPO forks are interpreted as new forks that inherit the parent
      fork (recursively) and update only `blobsSchedule` values. Updates the abstract, the ''include every
      configuration parameter'' MUST and the `activationTime` description to cover ''last''. Sample response
      gains the `last`/`lastHash`/`lastForkId` block and the hash values become `0x`-prefixed. Also fixes
      the EIP-2124 rationale link to the `.md` form.'
    rationale: Adds three new response members and a new interpretation rule for BPO forks; both change
      what clients must return. Introduces this EIP's references to EIP-6122 and EIP-7892 (recorded as
      dependency events).
    change_group: null
    confidence: high
    source_ids:
    - commit-59c5b1739b
