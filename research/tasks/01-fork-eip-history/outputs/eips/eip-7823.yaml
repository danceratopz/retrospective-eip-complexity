    path: EIPS/eip-7823.md
    change_type: normative_behavior
    semantic_effect: substantive
    summary: >-
      Initial addition of EIP-7823 'Set upper bounds for MODEXP' in Draft status (65 lines) with
      frontmatter 'requires 198'. Requires each of length_of_BASE, length_of_EXPONENT and
      length_of_MODULUS passed to the MODEXP precompile at address 0x05 to be at most 8192 bits
      (1024 bytes); a larger input makes the precompile return an error and consume all gas. The
      Backwards Compatibility and Security Considerations sections are TODO placeholders.
    rationale: Creation commit adding the initial specification (merged via ethereum/EIPs#9046).
    change_group: null
    confidence: high
    source_ids:
