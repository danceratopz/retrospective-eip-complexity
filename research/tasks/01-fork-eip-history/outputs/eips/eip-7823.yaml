      'Fill in missing sections' (ethereum/EIPs#9271). Adds an Analysis subsection with mainnet
      occurrence tables for base, exponent and modulus lengths between blocks 5472266 and
      21550926 and a list of the invalid invocations found; replaces the Backwards Compatibility
      placeholder with the claim that no past transaction would have behaved differently under
      the new bound; replaces the Security Considerations placeholder with "Since only the
      accepted input range is reduced, no new security surface area is expected."
    rationale: >-
      Turns two TODO placeholders into stated backwards-compatibility and security assumptions
      and supplies the mainnet evidence backing the 1024-byte bound, all of which downstream
      review and testing rely on. The normative limit itself is unchanged.
