schema_version: 3
task_id: 01-fork-eip-history
fork_id: cancun
eip:
  number: 1153
  title: Transient storage opcodes
  layers: [execution]
  layer_classification:
    rationale: >-
      EIP-7569 "Full Specifications" lists EIP-1153 among the EIPs that "require changes to
      Ethereum's execution layer" and does not list it in the consensus-layer group.
    source_ids: [eip-7569-pinned]
membership:
  source_section: Included EIPs
  classification: included
  requirement: required
  source_ids: [eip-7569-pinned]
inclusion_history:
  normalized_state_counts:
    considered_for_inclusion: 1
    scheduled_for_inclusion: 2
    included: 1
  events:
    - id: cancun-eip1153-e1
      occurred_at: "2022-12-08"
      raw_label: "EIPs Considered for Inclusion (execution-specs cancun.md at creation)"
      normalized_state: considered_for_inclusion
      normalization_rationale: >-
        The execution-specs upgrade document's section name "EIPs Considered for Inclusion"
        maps directly to considered_for_inclusion. EIP-1153 was carried into the newly created
        Cancun upgrade spec from Shanghai's CFI list, which the same commit removed from
        shanghai.md; ACD call #151 minutes describe moving non-withdrawal candidates out of
        Shanghai. The prior Shanghai-era CFI status is a Shanghai fork relationship and is not
        modeled as a Cancun event.
      decision_body: "AllCoreDevs call #151 (2022-12-08); document change by Tim Beiko the same day"
      source_ids: [execution-specs-commit-b11cdefd, pm-acd-151-minutes, pm-issue-675]
    - id: cancun-eip1153-e2
      occurred_at: "2023-04-27"
      raw_label: "Included EIPs (execution-specs cancun.md)"
      normalized_state: scheduled_for_inclusion
      normalization_rationale: >-
        Moved from "EIPs Considered for Inclusion" to "Included EIPs" in cancun.md immediately
        after ACDE #160, where the decision was recorded ("we've been CFI-ing 1153 for quite a
        while and we moved it from Shanghai to Cancun... it would be fair to include it").
        In the 2022-2023 process, "Included" in the upgrade spec meant client teams had agreed
        to ship the EIP in the still-unactivated upgrade, i.e. what later vocabulary calls
        Scheduled for Inclusion; "included" is reserved here for post-activation. ACDE #161
        corroborates: "on the last call, we sort of agreed to include a bunch of EIPs. So at
        1153...".
      decision_body: "AllCoreDevs Execution Layer call #160 (2023-04-27)"
      source_ids: [execution-specs-commit-ada4aa34, pm-acde-160-minutes, pm-acde-161-minutes]
    - id: cancun-eip1153-e3
      occurred_at: "2023-12-07"
      raw_label: "Included EIPs (EIP-7569: Hardfork Meta - Dencun, at creation)"
      normalized_state: scheduled_for_inclusion
      normalization_rationale: >-
        EIP-7569 was created in Draft status listing this EIP under "Included EIPs" while the
        upgrade was still pending activation (the activation table was empty at creation), so
        the listing corresponds to scheduled_for_inclusion rather than included.
      decision_body: null
      source_ids: [eips-commit-babb441b]
    - id: cancun-eip1153-e4
      occurred_at: "2024-03-13T13:55:35Z"
      raw_label: "Activation - Mainnet (epoch 269568, timestamp 1710338135)"
      normalized_state: included
      normalization_rationale: >-
        Dencun activated on Ethereum mainnet at beacon epoch 269568 (timestamp 1710338135 =
        2024-03-13T13:55:35Z) with this EIP in EIP-7569's Included list; the mainnet activation
        row was added to EIP-7569 on 2024-02-08 and the Meta EIP was moved to Final on
        2024-03-29 following activation.
      decision_body: null
      source_ids: [eip-7569-pinned, eips-commit-8e35c4a1, eips-commit-a554f59c]
unknowns: []
