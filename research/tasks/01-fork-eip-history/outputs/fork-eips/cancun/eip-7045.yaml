schema_version: 3
task_id: 01-fork-eip-history
fork_id: cancun
eip:
  number: 7045
  title: Increase Max Attestation Inclusion Slot
  layers: [consensus]
  layer_classification:
    rationale: >-
      EIP-7569 "Full Specifications" lists EIP-7045 among the EIPs that "require changes to
      Ethereum's consensus layer" (specified in the deneb folder of ethereum/consensus-specs)
      and does not list it in the execution-layer group.
    source_ids: [eip-7569-pinned]
membership:
  source_section: Included EIPs
  classification: included
  requirement: required
  source_ids: [eip-7569-pinned]
inclusion_history:
  normalized_state_counts:
    proposed_for_inclusion: 1
    scheduled_for_inclusion: 2
    included: 1
  events:
    - id: cancun-eip7045-e1
      occurred_at: "2023-05-04"
      raw_label: "Deneb item: process_attestation inclusion-window modification (ACDC #108, pre-EIP/pre-spec)"
      normalized_state: proposed_for_inclusion
      normalization_rationale: >-
        Danny Ryan presented the change on ACDC #108 as a "Deneb item" before any spec or EIP
        existed: "There is not a spec for this already... The modification would be if it's
        from epoch N, it could be included up to... the entirety of epoch N+1... It's security
        related, so I think it should be expedited... by the next call we'll have a spec up."
        A feature put forward for the fork without a recorded commitment maps to
        proposed_for_inclusion. The consensus-layer process used no CFI/SFI vocabulary, so no
        considered_for_inclusion stage is imposed retroactively.
      decision_body: "AllCoreDevs Consensus Layer call #108 (2023-05-04)"
      source_ids: [pm-acdc-108-minutes]
    - id: cancun-eip7045-e2
      occurred_at: "2023-06-01"
      raw_label: "features that we intend to build [down] into the Deneb spec (ACDC #110)"
      normalized_state: scheduled_for_inclusion
      normalization_rationale: >-
        On ACDC #110 Danny Ryan fixed the list of features to build into the Deneb consensus
        spec, explicitly including 7045, with "one thumbs up and... no opposition". An
        explicit, unopposed commitment to build the feature into the fork's spec is normalized
        as scheduling on the consensus layer. ACDC #111 corroborates 7045 as "on the slate for
        going into Deneb", and ACDC #112 confirms the consensus-specs release had it built into
        the spec.
      decision_body: "AllCoreDevs Consensus Layer call #110 (2023-06-01)"
      source_ids: [pm-acdc-110-minutes, pm-acdc-111-minutes, pm-acdc-112-minutes]
    - id: cancun-eip7045-e3
      occurred_at: "2023-12-07"
      raw_label: "Included EIPs (EIP-7569: Hardfork Meta - Dencun, at creation)"
      normalized_state: scheduled_for_inclusion
      normalization_rationale: >-
        EIP-7569 was created in Draft status listing this EIP under "Included EIPs" while the
        upgrade was still pending activation (the activation table was empty at creation), so
        the listing corresponds to scheduled_for_inclusion rather than included.
      decision_body: null
      source_ids: [eips-commit-babb441b]
    - id: cancun-eip7045-e4
      occurred_at: "2024-03-13T13:55:35Z"
      raw_label: "Activation - Mainnet (epoch 269568, timestamp 1710338135)"
      normalized_state: included
      normalization_rationale: >-
        Dencun activated on Ethereum mainnet at beacon epoch 269568 (timestamp 1710338135 =
        2024-03-13T13:55:35Z) with this EIP in EIP-7569's Included list; the mainnet activation
        row was added to EIP-7569 on 2024-02-08 and the Meta EIP was moved to Final on
        2024-03-29 following activation.
      decision_body: null
      source_ids: [eip-7569-pinned, eips-commit-8e35c4a1, eips-commit-a554f59c]
unknowns:
  - >-
    ACDC #109 (2023-05-18) states about this change (as consensus-specs PR #3360): "we agreed
    on a previous call that this is something that we want to see in Cancun". The ACDC #108
    minutes record the presentation and an intent to expedite but no explicit minuted
    agreement; either the agreement at #108 went unminuted or it occurred in another venue.
    No separate agreement event was fabricated for this gap; the first recorded commitment
    event used is ACDC #110.
  - >-
    The EIP number 7045 was assigned after ACDC #109 ("I'll probably open up an EIP in relation
    to it to give it kind of a number to track it"); earlier events refer to the same change
    via its description and consensus-specs PR #3360.
