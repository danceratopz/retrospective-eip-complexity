schema_version: 3
task_id: 01-fork-eip-history
fork_id: cancun
eip:
  number: 7516
  title: BLOBBASEFEE opcode
  layers: [execution]
  layer_classification:
    rationale: >-
      EIP-7569 "Full Specifications" lists EIP-7516 among the EIPs that "require changes to
      Ethereum's execution layer" and does not list it in the consensus-layer group. (The
      EIP-7569 creation commit misspelled it "7526" in the execution-layer sentence; the typo
      was fixed on 2024-03-12 in ethereum/EIPs commit 170409fb94e329913fe68bec6a5dbeca8d051d80,
      and the pinned master text lists 7516 correctly.)
    source_ids: [eip-7569-pinned]
membership:
  source_section: Included EIPs
  classification: included
  requirement: required
  source_ids: [eip-7569-pinned]
inclusion_history:
  normalized_state_counts:
    scheduled_for_inclusion: 2
    included: 1
  events:
    - id: cancun-eip7516-e1
      occurred_at: "2023-09-14"
      raw_label: "\"let's have this be included for Deneb\" / Included EIPs (ACDE #170 decision; cancun.md change 2023-09-21)"
      normalized_state: scheduled_for_inclusion
      normalization_rationale: >-
        The BLOBBASEFEE opcode was decided on ACDE #170 as one of the "two final additions" to
        the fork ("we had another proposal this time on the EL which was to add [an opcode] to
        retrieve the blob gas price... I think we should do it"), and EIP-7516 was added
        directly to cancun.md's "Included EIPs" section one week later (2023-09-21) without a
        CFI stage. ACDC #118 (2023-09-21) corroborates: "EIP 7514 and 7516, two new EIPs that
        were added to the Cancun/Deneb upgrade during last week's ACD call." The event is dated
        to the decision (2023-09-14); the repository change followed on 2023-09-21. "Included"
        in the pre-activation upgrade spec is normalized as scheduled_for_inclusion; "included"
        is reserved here for post-activation.
      decision_body: "AllCoreDevs Execution Layer call #170 (2023-09-14)"
      source_ids: [pm-acde-170-minutes, execution-specs-commit-083e51c2, pm-acdc-118-minutes]
    - id: cancun-eip7516-e2
      occurred_at: "2023-12-07"
      raw_label: "Included EIPs (EIP-7569: Hardfork Meta - Dencun, at creation)"
      normalized_state: scheduled_for_inclusion
      normalization_rationale: >-
        EIP-7569 was created in Draft status listing this EIP under "Included EIPs" while the
        upgrade was still pending activation (the activation table was empty at creation), so
        the listing corresponds to scheduled_for_inclusion rather than included.
      decision_body: null
      source_ids: [eips-commit-babb441b]
    - id: cancun-eip7516-e3
      occurred_at: "2024-03-13T13:55:35Z"
      raw_label: "Activation - Mainnet (epoch 269568, timestamp 1710338135)"
      normalized_state: included
      normalization_rationale: >-
        Dencun activated on Ethereum mainnet at beacon epoch 269568 (timestamp 1710338135 =
        2024-03-13T13:55:35Z) with this EIP in EIP-7569's Included list; the mainnet activation
        row was added to EIP-7569 on 2024-02-08 and the Meta EIP was moved to Final on
        2024-03-29 following activation.
      decision_body: null
      source_ids: [eip-7569-pinned, eips-commit-8e35c4a1, eips-commit-a554f59c]
unknowns:
  - >-
    EIP-7516 entered the fork directly at scheduled_for_inclusion as a late addition; no
    proposed/considered stage exists in the reviewed primary sources (the EIP was written by
    Carl Beekhuizen shortly before ACDE #170 to formalize a request from Arbitrum).
