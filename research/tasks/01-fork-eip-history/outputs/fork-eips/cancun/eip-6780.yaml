      normalization_rationale: >-
        Moved from "EIPs Considered for Inclusion" to "Included EIPs" in cancun.md immediately
        after ACDE #160, where the decision was recorded ("basically make that commitment
        today... 6780 is included. and just for the people implement[ing], be mindful that
        potentially there'll be changes to this spec based on the findings of the analysis").
