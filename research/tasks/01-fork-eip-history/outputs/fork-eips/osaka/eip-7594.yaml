fork_id: osaka
eip:
  number: 7594
  title: PeerDAS - Peer Data Availability Sampling
  layers:
  - execution
  - consensus
  layer_classification:
    rationale: 'Cross-layer. Consensus: the EIP''s detailed specifications are the ethereum/consensus-specs
      ''fulu'' fork tree (data-column custody, sampling, gossip); Fulu is the consensus-layer half of
      Fusaka. Execution: the EIP also imposes normative execution-layer changes - a limit of 6 blobs per
      transaction that clients MUST enforce at submission, over the network, and during block production
      and processing, and a replacement of the EIP-4844 blob-transaction pool wrapper with a versioned
      cell-proof wrapper for PooledTransactions responses (frontmatter category: Core).'
    source_ids:
    - eips-blob-eip7594-pin
