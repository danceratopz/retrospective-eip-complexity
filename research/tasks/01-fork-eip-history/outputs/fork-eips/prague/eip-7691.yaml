schema_version: 3
task_id: 01-fork-eip-history
fork_id: prague
eip:
  number: 7691
  title: "Blob throughput increase"
  layers: [execution, consensus]
  layer_classification:
    rationale: "The pinned EIP-7600 Full Specifications section lists EIP-7691 in the Consensus Layer list only, but the EIP's own Parameters section states MAX_BLOBS_PER_BLOCK_ELECTRA and TARGET_BLOBS_PER_BLOCK_ELECTRA 'are consumed by the consensus layer clients' while MAX_BLOB_GAS_PER_BLOCK, TARGET_BLOB_GAS_PER_BLOCK and BLOB_BASE_FEE_UPDATE_FRACTION_PRAGUE 'are consumed by the execution layer clients' (updating EIP-4844's get_base_fee_per_blob_gas and calc_excess_blob_gas). Classified cross-layer on the EIP's own specification; EIP-7600's Execution Layer list omits it (omission noted in the fork record)."
    source_ids: [eips-blob-7600, eips-blob-7691]
membership:
  source_section: "Included EIPs > Core EIPs"
  classification: core
  requirement: "Listed under 'Included EIPs > Core EIPs' with no qualifying MAY/MUST language; an unconditional protocol change activated with the upgrade."
  source_ids: [eips-blob-7600]
inclusion_history:
  normalized_state_counts:
    scheduled_for_inclusion: 1
    included: 1
  events:
    - id: prague-7691-e1
      occurred_at: "2024-12-18T19:48:12Z"
      raw_label: "EIPs Scheduled for Inclusion ('Add EIPs 7623 & 7691')"
      normalized_state: scheduled_for_inclusion
      normalization_rationale: "ACDC#147 (2024-12-12) agreed to remove EIP-7742 from Pectra and instead 'implement a doubling to the blob count in Pectra through a change to the genesis configuration in clients' (summary row 147.6); the change was formalized as EIP-7691 (already discussed by name on ACDE#201, 2024-12-05, regarding the blob base fee update fraction) and added directly to 'EIPs Scheduled for Inclusion' on 2024-12-18 (commit 6770dfdd, PR #9094), replacing EIP-7742. ACDE#202 (2024-12-19) reaffirmed the replacement decision. EIP-7691 never appeared in a CFI section of the Meta EIP. occurred_at is the Meta EIP commit timestamp, the first primary record naming EIP-7691 as a Pectra member."
      decision_body: "AllCoreDevs Consensus (ACDC) #147 (blob-throughput decision); Meta EIP author"
      source_ids: [eips-commit-6770dfd, pm-acdc-147, pm-acde-201, pm-acde-202, gh-eip7600-commit-prs]
    - id: prague-7691-included
      occurred_at: "2025-05-07T10:05:11Z"
      raw_label: "Included EIPs (Pectra mainnet activation, epoch 364032 / timestamp 1746612311)"
      normalized_state: included
      normalization_rationale: "Pectra activated on Ethereum mainnet at the timestamp recorded in EIP-7600's Activation table (tentative mainnet time added 2025-04-03, commit 355b3350; 1746612311 = 2025-05-07T10:05:11Z). After activation the Meta EIP moved to Final and renamed its EIP list from 'EIPs Scheduled for Inclusion' to 'Included EIPs' (commit 78b50371, 2025-06-09) and changed its abstract from 'Scheduled for Inclusion' to 'Included' (commit 8877eaa7, 2025-06-23)."
      decision_body: "Ethereum mainnet activation per the EIP-7600 activation table; document finalization by the Meta EIP author"
      source_ids: [eips-blob-7600, eips-commit-355b335, eips-commit-78b5037, eips-commit-8877eaa]
