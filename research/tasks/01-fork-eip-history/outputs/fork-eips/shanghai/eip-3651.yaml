      occurred_at: "2022-03-04"
      raw_label: 'Added to "EIPs Considered for Inclusion" ("Make EIP-3651 CFI" / "moving it to CFI for Shanghai")'
      normalized_state: considered_for_inclusion
      normalization_rationale: >-
        On ACD 133 (2022-03-04) the moderator asked "Any objections with moving it to
        CFI for Shanghai...?" and concluded "it seems reasonable to at least move it to
        consider for inclusion and try to get it on devnets"; the execution-specs
        commit the same day (message "Make EIP-3651 CFI", body "Agreed to on ACD133.")
        added the EIP to the document's "EIPs Considered for Inclusion" section. The
        historical term "CFI / Considered for Inclusion" maps directly to
        considered_for_inclusion.
      decision_body: AllCoreDevs (ACD 133)
      source_ids:
        - pm-acd-133-minutes
        - execspecs-commit-ded8ebeb-3651-cfi
    - id: shanghai-eip3651-included-2022-10-27
      occurred_at: "2022-10-27"
      raw_label: 'Moved from "EIPs Considered for Inclusion" to "Included EIPs" ("we agreed to include the following EIPs in Shanghai and launch a devnet with them ASAP")'
      normalized_state: included
      normalization_rationale: >-
        ACD 148 decision 148.1 (2022-10-27) explicitly lists EIP-3651 among the EIPs
