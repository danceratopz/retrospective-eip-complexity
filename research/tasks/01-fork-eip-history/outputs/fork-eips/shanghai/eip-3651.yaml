        term maps directly to included. occurred_at uses the decision/commit-author
        date (2022-10-27); the PR merged one day later.
      decision_body: AllCoreDevs (ACD 148)
      source_ids:
        - pm-acd-148-minutes
        - execspecs-commit-2dfc5091-move-included
        - execspecs-pr-633
