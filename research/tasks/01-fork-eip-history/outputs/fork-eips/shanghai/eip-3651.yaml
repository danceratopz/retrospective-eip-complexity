schema_version: 3
task_id: 01-fork-eip-history
fork_id: shanghai
eip:
  number: 3651
  title: Warm COINBASE
  layers: [execution]
  layer_classification:
    rationale: >-
      EIP-3651 (Standards Track / Core) changes only EVM execution semantics: the
      COINBASE address is added to the warm access list at the start of transaction
      execution (building on EIP-2929 gas accounting). It requires no consensus-layer
      change; the Capella specification at the commit pinned by EIP-7568 contains no
      corresponding change.
    source_ids:
      - eips-eip3651-blob-a08f51fe
      - consensus-specs-capella-beacon-chain-01b53691
membership:
  source_section: Included EIPs
  classification: core
  requirement: required_protocol_change
  source_ids:
    - execspecs-shanghai-doc-8dbde99b
  notes:
    - Listed in the "Included EIPs" section of the pinned authoritative document; Standards Track / category Core at the pinned ethereum/EIPs master commit (eips-eip3651-blob-a08f51fe).
inclusion_history:
