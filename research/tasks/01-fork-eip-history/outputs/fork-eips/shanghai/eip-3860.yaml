schema_version: 3
task_id: 01-fork-eip-history
fork_id: shanghai
eip:
  number: 3860
  title: Limit and meter initcode
  layers: [execution]
  layer_classification:
    rationale: >-
      EIP-3860 (Standards Track / Core) limits initcode size and adds gas metering for
      initcode during contract creation - purely EVM/execution-layer semantics
      (extends EIP-170). The Capella specification at the commit pinned by EIP-7568
      contains no corresponding change.
    source_ids:
      - eips-eip3860-blob-a08f51fe
      - consensus-specs-capella-beacon-chain-01b53691
membership:
  source_section: Included EIPs
  classification: core
  requirement: required_protocol_change
  source_ids:
    - execspecs-shanghai-doc-8dbde99b
  notes:
    - Listed in the "Included EIPs" section of the pinned authoritative document; Standards Track / category Core at the pinned ethereum/EIPs master commit (eips-eip3860-blob-a08f51fe).
inclusion_history:
  normalized_state_counts:
    considered_for_inclusion: 1
    included: 1
  events:
    - id: shanghai-eip3860-cfi-2022-02-04
      occurred_at: "2022-02-04"
      raw_label: 'Added to "EIPs Considered for Inclusion" ("On ACD131, we agreed to move EIPs 3540, 3670 and 3860 to CFI.")'
      normalized_state: considered_for_inclusion
      normalization_rationale: >-
        The ACD 131 transcript (2022-02-04) closes with the moderator summarizing
        agreement on "moving ... 3540 which is the eof core eip 3670 which is the eof
        code validation and 3860 which was limit and meter init code ... to sort of
        cfi". The same day, execution-specs commit "Add CFI EIPs" (PR #447, body: "On
        ACD131, we agreed to move EIPs 3540, 3670 and 3860 to CFI.") created the
        document's "EIPs Considered for Inclusion" section containing EIP-3860. The
        historical CFI term maps directly to considered_for_inclusion.
      decision_body: AllCoreDevs (ACD 131)
      source_ids:
        - pm-acd-131-minutes
        - execspecs-commit-9c14b95c-add-cfi-eips
        - execspecs-pr-447
    - id: shanghai-eip3860-included-2022-10-27
      occurred_at: "2022-10-27"
      raw_label: 'Moved from "EIPs Considered for Inclusion" to "Included EIPs" ("we agreed to include the following EIPs in Shanghai and launch a devnet with them ASAP")'
      normalized_state: included
      normalization_rationale: >-
        ACD 148 decision 148.1 (2022-10-27) explicitly lists EIP-3860 among the EIPs
        agreed to be included in Shanghai; the execution-specs commit authored the same
        day ("Move some Shanghai EIPs to included", merged via PR #633 on 2022-10-28)
        moved it into "Included EIPs". occurred_at uses the decision/commit-author
        date; the PR merged one day later.
      decision_body: AllCoreDevs (ACD 148)
      source_ids:
        - pm-acd-148-minutes
        - execspecs-commit-2dfc5091-move-included
        - execspecs-pr-633
unknowns:
  - The ACD 131 transcript recalls that the EOF/initcode trio (3540/3670/3860) was
    first raised "in the last couple of minutes" of the previous call (ACD 130,
    2022-01-21) with consensus forming "shortly after [in] the discord". Meeting 130's
    written minutes contain no record of this (negative search, pm-acd-130-minutes),
    and the Discord discussion is not archivable here, so no earlier
    proposed_for_inclusion event is recorded; the first evidenced state change is the
    2022-02-04 CFI decision.
