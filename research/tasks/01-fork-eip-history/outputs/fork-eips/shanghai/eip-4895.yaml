schema_version: 3
task_id: 01-fork-eip-history
fork_id: shanghai
eip:
  number: 4895
  title: Beacon chain push withdrawals as operations
  layers: [execution, consensus]
  layer_classification:
    rationale: >-
      Cross-layer feature. The EIP itself (Standards Track / Core, authored by
      consensus-layer researchers Alex Stokes and Danny Ryan) specifies the
      execution-layer half: a new system-level "operation" type, a withdrawals list in
      the execution block and a withdrawals_root header field, with withdrawals
      "pushed" from the beacon chain to the EVM. The consensus-layer half shipped in
      Capella at the consensus-specs commit pinned by EIP-7568: the Withdrawal
      container, get_expected_withdrawals/process_withdrawals, and the
      ExecutionPayload withdrawals extension. Contemporaneous ACD 148 decision 148.2
      also describes Capella as "mostly withdrawals". Both layers are therefore
      recorded rather than forcing a single layer.
    source_ids:
      - eips-eip4895-blob-a08f51fe
      - consensus-specs-capella-beacon-chain-01b53691
      - pm-acd-148-minutes
membership:
  source_section: Included EIPs
  classification: core
  requirement: required_protocol_change
  source_ids:
    - execspecs-shanghai-doc-8dbde99b
  notes:
    - Listed in the "Included EIPs" section of the pinned authoritative document; Standards Track / category Core at the pinned ethereum/EIPs master commit (eips-eip4895-blob-a08f51fe).
    - The pinned document is the execution-layer (Shanghai) membership list; the matching consensus-layer (Capella) withdrawals changes are specified in consensus-specs v1.3.0 and are not represented as separate EIP numbers.
inclusion_history:
  normalized_state_counts:
    proposed_for_inclusion: 1
    considered_for_inclusion: 1
    included: 1
  events:
    - id: shanghai-eip4895-proposed-2022-02-04
      occurred_at: "2022-02-04"
      raw_label: '"probably the other biggest one is withdrawal the beacon chain which does not have an eip yet" (ACD 131 Shanghai prioritization discussion)'
      normalized_state: proposed_for_inclusion
      normalization_rationale: >-
        On ACD 131 (2022-02-04) beacon-chain withdrawals were raised as a top Shanghai
        priority before any EIP existed ("once we have a beacon chain withdrawal eip we
        can discuss that in more detail"). This is recorded as the proposal event for
        the feature that became EIP-4895 (frontmatter created 2022-03-10); the
        normalization notes that no EIP number existed at the time, so the event
        attaches to the fork-EIP relationship retrospectively by feature identity, not
        by number.
      decision_body: AllCoreDevs (ACD 131)
      source_ids:
        - pm-acd-131-minutes
        - eips-eip4895-blob-a08f51fe
    - id: shanghai-eip4895-cfi-2022-03-18
      occurred_at: "2022-03-18"
      raw_label: 'Decision 134.3 "EIP-4895 move to CFI"; added to "EIPs Considered for Inclusion" ("Agreed in ACD134")'
      normalized_state: considered_for_inclusion
      normalization_rationale: >-
        ACD 134 (2022-03-18) compared the two withdrawal designs (transaction-type
        EIP-4863 vs operations-based EIP-4895), settled on EIP-4895, and its decisions
        table records "EIP-4895 move to CFI" (item 134.3). The execution-specs commit
        authored the same day ("Add EIP 4895", body "Agreed in ACD134", merged via PR
        #477 on 2022-03-23) added it to "EIPs Considered for Inclusion". The historical
        CFI term maps directly to considered_for_inclusion; occurred_at uses the
        decision/commit-author date.
      decision_body: AllCoreDevs (ACD 134)
      source_ids:
        - pm-acd-134-minutes
        - execspecs-commit-19c3a583-add-4895
        - execspecs-pr-477
    - id: shanghai-eip4895-included-2022-10-27
      occurred_at: "2022-10-27"
      raw_label: 'Moved from "EIPs Considered for Inclusion" to "Included EIPs" ("we agreed to include the following EIPs in Shanghai and launch a devnet with them ASAP")'
      normalized_state: included
      normalization_rationale: >-
        ACD 148 decision 148.1 (2022-10-27) explicitly lists EIP-4895 among the EIPs
        agreed to be included in Shanghai; the execution-specs commit authored the same
        day ("Move some Shanghai EIPs to included", merged via PR #633 on 2022-10-28)
        moved it into "Included EIPs". occurred_at uses the decision/commit-author
        date; the PR merged one day later.
      decision_body: AllCoreDevs (ACD 148)
      source_ids:
        - pm-acd-148-minutes
        - execspecs-commit-2dfc5091-move-included
        - execspecs-pr-633
unknowns:
  - The consensus-layer (Capella) side of withdrawals followed the consensus-specs
    release process rather than EIP inclusion states; no CFI/included state sequence
    exists for it and none is invented here. Its pinned specification is referenced as
    layer-classification evidence only.
