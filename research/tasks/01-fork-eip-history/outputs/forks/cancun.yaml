unresolved_questions:
  - >-
    The AllCoreDevs call #151 minutes file (AllCoreDevs-EL-Meetings/Meeting 151.md) carries an
    erroneous header date of "November 10, 2022"; the linked agenda (ethereum/pm issue #675)
    and the identical YouTube stream link establish the call date as 2022-12-08, matching the
    same-day creation of the cancun.md upgrade spec. Events relying on this call use
    2022-12-08.
  - >-
    ACDC #109 (2023-05-18) refers to a prior agreement on the change that became EIP-7045 ("we
    agreed on a previous call that this is something that we want to see in Cancun"), but the
    ACDC #108 minutes record only a presentation with intent to expedite and no explicit
    minuted decision. The gap is preserved as an unknown in the EIP-7045 record rather than
    fabricating an agreement event.
  - >-
    The consensus layer had no membership-tracking document analogous to execution-specs
    cancun.md, so consensus-layer inclusion events (EIPs 7044, 7045, 7514, and the CL side of
    4788) are evidenced by ACDC/ACDE meeting minutes; consensus-specs deneb merge history was
    not inventoried (out of this work unit's scope).
  - >-
    Testnet activations (Goerli 2024-01-17, Sepolia 2024-01-30, Holesky 2024-02-07, per the
    EIP-7569 activation table) were not modeled as per-EIP inclusion-state events; only the
    mainnet activation (2024-03-13T13:55:35Z) is used for the normalized "included" state.
  - >-
    ethereum/execution-specs no longer exposes a master branch upstream (repository
    restructured into forks/* branches during 2025); all cited cancun.md commits were verified
    still reachable on GitHub on 2026-08-20 and remain available in the read-only local clone.
