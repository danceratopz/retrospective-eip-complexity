  - "Layer-classification note: the pinned EIP-7600 Full Specifications Execution Layer list omits EIP-7251 and EIP-7691 even though both EIPs' own specifications define execution-layer changes (EIP-7251 consolidation request contract; EIP-7691 EL blob-gas parameters). Both are classified cross-layer on the EIPs' own text, diverging from a literal reading of the Meta EIP's lists; evidence is cited in each record."
  - "Scope note (not researched further per input membership rules): several EIPs passed through Pectra consideration/scheduling cycles but are outside the final 'Included EIPs' inventory and therefore have no fork-eip record in this work unit: EIP-3074 (Included 2024-04-11, removed 2024-05-29 in favor of EIP-7702), EIP-7547, EIP/RIP-7212, the EOF set under EIP-7692 (Included 2024-06-06, removed in the 2024-09-27 rescope), EIP-7594/PeerDAS (added 2024-06-13, removed 2024-09-27), EIP-7742 (CFI 2024-09-27, SFI 2024-10-24, removed 2024-12-18), and EIP-7762 (CFI 2024-09-27, removed 2024-12-18). Their cycles are visible in the registered EIP-7600 commit sources."
