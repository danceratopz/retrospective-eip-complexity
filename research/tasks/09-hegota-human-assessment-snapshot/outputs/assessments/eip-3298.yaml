  - id: unspecified_behavior_requiring_cross_client_consensus
    label: Unspecified behavior requiring cross-client consensus
    raw_score_cell: '1'
    parsed_terms:
    - 1
    numeric_contribution: 1
    rationale: 'Amsterdam has two independent refund mechanisms and this EIP (2021) predates the second: the EIP-2200
      `refund_counter` in execution gas, which this EIP removes, and `credit_state_gas_refund()` in state gas, which
      credits `StateGasCosts.STORAGE_SET` back when a slot is cleared (`vm/instructions/storage.py`). The state-gas
      refund should stay: state paid for and released within the same transaction never persisted, so crediting
      it is not a refund for good hygiene but correct accounting for state that was never created. That leaves only
      a statement to add to the EIP, so scored 1 — the resolution is clear and needs no client negotiation.'
    blank_interpretation: null
