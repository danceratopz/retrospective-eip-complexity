  - id: patterns_affecting_pre_existing_tests
    label: Patterns affecting pre-existing tests
    raw_score_cell: '3'
    parsed_terms:
    - 3
    numeric_contribution: 3
    rationale: 'Every blockchain-test fixture for this fork must be regenerated: each header now commits a different
      state_root, causing all block hashes and downstream parent_hash values to be re-derived. Two categories require
      redesign: (1) tests with deliberately wrong state_root now expect rejection on the successor rather than the
      offending block, and (2) state_test-derived fixtures no longer commit their post-state root anywhere since
      they execute as single-block chains. Affects state, blockchain, transition, and benchmark fixtures.'
    blank_interpretation: null
  - id: new_invariant_on_pre_existing_tests
    label: New invariant on pre-existing tests
    raw_score_cell: '3'
    parsed_terms:
    - 3
    numeric_contribution: 3
    rationale: 'Every test in the fork, regardless of its purpose, requires two additional assertions: that its
      header''s state_root matches the parent''s post-state root, and that its own post-state root is not established
      by its header. Fork-transition vectors must be re-derived, as block F repeats F-1''s root—a configuration
      no pre-fork vector exhibits.'
    blank_interpretation: null
  - id: transition_tool_interface_changes
    label: Transition-tool interface changes
    raw_score_cell: '2'
    parsed_terms:
    - 2
    numeric_contribution: 2
    rationale: 'The t8n tool is per-block and stateless, but the delayed root requires chain-level state across
      invocations. Two approaches: (1) thread invocation n''s stateRoot output into block n+1''s header, or (2)
      have the tool take an explicit lastComputedStateRoot env input to validate headers and detect faults. Either
      way requires a new mechanism, not a field addition.'
    blank_interpretation: null
  - id: new_test_framework_primitives
    label: New test-framework primitives
    raw_score_cell: '3'
    parsed_terms:
    - 3
    numeric_contribution: 3
    rationale: 'Header assembly is framework-level. Block n''s root comes from block n-1''s execution, changing
      data flow globally. New primitives needed: (1) final post-state validation (sealing block or fixture-level
      field), (2) consume simulators modeling valid-then-invalidated payloads. Permanent framework change.'
    blank_interpretation: null
  - id: cryptography
    label: Cryptography-related testing
    raw_score_cell: '0'
    parsed_terms:
    - 0
    numeric_contribution: 0
    rationale: No cryptography introduced or modified. The state root is computed by the same trie machinery as
      before.
    blank_interpretation: null
  - id: edge_boundary_conditions
    label: Edge/boundary conditions
    raw_score_cell: '2'
    parsed_terms:
    - 2
    numeric_contribution: 2
    rationale: 'Deferred detection means invalid post-states surface only on successors, crossed with cases where
      the successor is absent, also invalid, or reorged away. Fork activation has distinctive edge cases: block
      F repeats state_root with its predecessor, and header.number < 1 must be handled at genesis. Empty blocks
      and reorgs allow stale last_computed_state_root values to pass undetected.'
    blank_interpretation: null
  - id: block_syncing_changes
    label: Block syncing changes
    raw_score_cell: '1'
    parsed_terms:
    - 1
    numeric_contribution: 1
    rationale: No RLP or encoding changes, but the header's state-root validation becomes stateful across blocks.
      A syncing client must accept a block with mismatched state_root, retain its computed root, and apply it to
      the successor. This cannot be tested with t8n alone—it requires a real client syncing a multi-block chain,
      including chains ending on unvalidated tips.
    blank_interpretation: null
