  - id: performance_risks
    label: Performance risks
    raw_score_cell: '2'
    parsed_terms:
    - 2
    numeric_contribution: 2
    rationale: '`TXDIFF` 0x00–0x05 take an arbitrary address, so this is the first mechanism by which execution
      can read another account''s storage slot. Those reads enter the BAL, so an assertion can populate the BAL
      with `(address, slot)` pairs the owning contract never touched, which breaks the assumption that a BAL entry
      implies interaction by that contract.'
    blank_interpretation: null
  - id: security_risks
    label: Security risks
    raw_score_cell: '2'
    parsed_terms:
    - 2
    numeric_contribution: 2
    rationale: 'Introspection is inert: `POST_TX` is a `STATICCALL` that cannot modify state. But `TXDIFF` can still
      add arbitrary storage keys to the BAL reads, and we need to prove that this does not affect present usecases
      or future EIPs (the witness generation is affected by this).'
    blank_interpretation: null
  - id: unspecified_behavior_requiring_cross_client_consensus
    label: Unspecified behavior requiring cross-client consensus
    raw_score_cell: '2'
    parsed_terms:
    - 2
    numeric_contribution: 2
    rationale: 'Previously unobservable behaviour becomes consensus-critical and has to be settled by discussion
      before vectors can be baselined: what counts as a change, how net-zero writes collapse, and the canonical
