    blank_interpretation: null
  - id: cross_eip_interactions
    label: Cross-EIP interactions
    raw_score_cell: 3 + 1
    parsed_terms:
    - 3
    - 1
    numeric_contribution: 4
    rationale: 'Strong interdependencies. **EIP-8141** is a hard dependency that this EIP *amends* — nothing here
      is testable without it, and EIP-8141 is itself Draft and assessed 🔴 38. **EIP-2929** (pricing, and `TXDIFF`
      mutates the access list), **EIP-7928** (BAL recording for live-state reads), **EIP-7702** (designators excluded
      from `contracts_deployed`), **EIP-4844** (blob fees folded into `gas_pre_charge`). <br><br>The "valid only
      inside a `POST_TX` frame" restriction then pulls in every transaction type as a negative case: the three opcodes
      must be shown to halt in legacy, **EIP-2930**, **EIP-1559**, **EIP-4844** and **EIP-7702** transactions, and
      in the `DEFAULT`, `VERIFY` and `SENDER` frame modes — roughly 3 x 8 coordinated cases, each owned by a different
      EIP''s transaction format. With **EIP-2718** framing those types, 8 interacting EIPs gives +1 for 5 beyond
      the first 3.'
    blank_interpretation: null
