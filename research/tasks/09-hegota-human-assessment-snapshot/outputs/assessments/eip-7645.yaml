  - id: security_risks
    label: Security risks
    raw_score_cell: '3'
    parsed_terms:
    - 3
    numeric_contribution: 3
    rationale: 'The blast radius is unknown and has to be determined before this can ship. The EIP asserts that
      for existing misuse affected negatively "a clear example has yet to be identified" — but `require(tx.origin
      == msg.sender)` is the standard idiom for "the caller is an EOA, not a contract", and aliasing makes it unconditionally
      true. Every contract using that guard silently loses it, and it fails **open**: the contract-caller patterns
      it was written to block (flash-loan and reentrancy shapes) become reachable again. Nobody has measured how
      many deployed contracts depend on it, in what value, or what each one gates. That is a substantial change
      to the security assumptions of an unquantified set of live contracts, and it needs on-chain analysis plus
      extensive review before the change can be judged safe — not a test-suite exercise.'
    blank_interpretation: null
  - id: unspecified_behavior_requiring_cross_client_consensus
    label: Unspecified behavior requiring cross-client consensus
    raw_score_cell: '1'
    parsed_terms:
    - 1
    numeric_contribution: 1
    rationale: 'A few details unspecified but with an obvious intended reading. "Return the same value as CALLER"
      fully determines the pushed value in every frame type, including DELEGATECALL. The one genuine omission is
      that **the EIP does not state a gas cost at all** — not that it is unchanged, not what it becomes. Left at
      1 rather than 2 because either answer is trivial on both the specs and the testing side: ORIGIN and CALLER
      are both fixed-cost, and settling it needs no back-and-forth with clients.'
    blank_interpretation: null
  - id: cross_eip_interactions
    label: Cross-EIP interactions
    raw_score_cell: '0'
    parsed_terms:
