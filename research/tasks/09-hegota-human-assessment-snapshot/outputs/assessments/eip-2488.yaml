  - id: evm_gas_rule_changes
    label: EVM Gas rule changes
    raw_score_cell: '1'
    parsed_terms:
    - 1
    numeric_contribution: 1
    rationale: 'Existing gas accounting mechanism is updated. CALLCODE today carries the full CALL-family dynamic
      cost: base, cold/warm account access under EIP-2929, the value-transfer and new-account surcharges, memory
      expansion for the argument and return regions, and the 63/64 stipend reservation. The assumed behaviour is
      that **the target is never warmed and no gas is consumed at all** — the opcode pops its arguments, pushes
      0, and charges nothing. That is the reading to specify, and it needs stating exactly, because the EIP''s one-line
      specification says only that the instruction "always returns 0".'
    blank_interpretation: null
  - id: state_access_ordering_within_opcode_execution
    label: State-access ordering within opcode execution
    raw_score_cell: '1'
    parsed_terms:
    - 1
    numeric_contribution: 1
    rationale: A single opcode's state access changes — it disappears. Under the assumed behaviour above, CALLCODE
      stops touching the target account entirely, so the target is no longer warmed for subsequent opcodes under
      EIP-2929 and no longer contributes an entry to the block-level access list. Both are observable, so the removal
      has to be tested rather than assumed.
    blank_interpretation: null
