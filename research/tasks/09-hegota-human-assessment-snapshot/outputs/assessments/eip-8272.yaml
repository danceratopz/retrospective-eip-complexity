    numeric_contribution: 3
    rationale: 'Elevated case counts. Window at both ends (`current_slot - slot` of 0, 1, 8191, 8192), index wraparound
      at `slot mod 8192`, the 16-reference (per-tx) cap, zero references (intrinsic gas 0, not the address cost),
      duplicate references (charged independently but deduplicated in access sets), last-write-wins within a slot.
