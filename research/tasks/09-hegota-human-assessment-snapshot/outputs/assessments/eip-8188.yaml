  - id: transition_tool_interface_changes
    label: Transition-tool interface changes
    raw_score_cell: '2'
    parsed_terms:
    - 2
    numeric_contribution: 2
    rationale: 'The t8n alloc changes shape on both sides: accounts gain a field, and the storage map goes from
      `slot -> value` to a pair. It must also record which of the two encodings a leaf is in, since `last_written_block
      = 0` fits both and they hash differently. Not 3 point since the block number is already in `env`.'
    blank_interpretation: null
  - id: new_test_framework_primitives
    label: New test-framework primitives
    raw_score_cell: '1'
    parsed_terms:
    - 1
    numeric_contribution: 1
    rationale: '`Account` and `Storage` are framework primitives used by every test in every fork, and both need
      the field. Since nearly every write bumps it, spelling it out per entry is unworkable. The framework needs
      an inferred default with opt-in assertion, plus a primitive for the legacy-versus-new encoding. Permanent
      surface, used by every other EIP''s tests.'
    blank_interpretation: null
