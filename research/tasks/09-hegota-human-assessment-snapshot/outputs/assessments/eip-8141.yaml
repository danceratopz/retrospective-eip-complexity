  - id: new_or_modified_transaction_validity_mechanisms
    label: New or modified transaction validity mechanisms
    raw_score_cell: '3'
    parsed_terms:
    - 3
    numeric_contribution: 3
    rationale: New intrinsic gas formula (mixed per-frame + per-signature + sum-of-frame-limits + calldata over
      two separate RLP streams), upfront multi-signature validation, frame-level constraints (mode/value/flags/count),
      runtime payer-designation and sender-approval. Introduces a post execution validity check which is totally
      new to EELS. Requires extensive test-infrastructure rework (filler intrinsic-gas computation, multi-scheme
      signing helpers etc).
    blank_interpretation: null
