  scores:
  - id: evm_gas_rule_changes
    label: EVM Gas rule changes
    raw_score_cell: '2'
    parsed_terms:
    - 2
    numeric_contribution: 2
    rationale: New per-frame gas isolation (`gas_limit` allocated per frame, not carried forward across frames)
      and new opcode gas costs (TXPARAM/FRAMEPARAM/SIGPARAM = 2, FRAMEDATALOAD = 3, FRAMEDATACOPY = 3 + word copy
      + mem expansion, APPROVE = 0). New mechanism, but applies only to type 0x06 frames and does not modify legacy
      tx gas accounting.
    blank_interpretation: null
  - id: blob_gas_accounting_changes
    label: Blob gas accounting changes
    raw_score_cell: '0'
    parsed_terms:
    - 0
    numeric_contribution: 0
    rationale: Frame tx carries EIP-4844 blob fields (`max_fee_per_blob_gas`, `blob_versioned_hashes`) but reuses
      existing blob gas accounting unmodified.
    blank_interpretation: null
  - id: new_evm_gas_refund
    label: New EVM gas refund
    raw_score_cell: '3'
    parsed_terms:
    - 3
    numeric_contribution: 3
    rationale: 'New complex refund mechanism: post-execution refund of gas to a designated `payer` resolved at runtime,
      plus full refund of skipped frames in failed atomic batches. Multiple refund paths; forces rework of existing
      refund-flow test infrastructure.'
    blank_interpretation: null
  - id: patterns_affecting_pre_existing_tests
    label: Patterns affecting pre-existing tests
    raw_score_cell: '1'
    parsed_terms:
    - 1
    numeric_contribution: 1
    rationale: New tx type is self-contained; legacy/1559/blob/7702 tx flows unchanged. Only minor impact on pre-existing
      opcode tests (new opcodes APPROVE/TXPARAM/FRAMEPARAM/SIGPARAM/FRAMEDATALOAD/FRAMEDATACOPY are globally available
      in the EVM regardless of tx type, so their behavior must be defined when invoked from legacy txs).
    blank_interpretation: null
  - id: transition_tool_interface_changes
    label: Transition-tool interface changes
    raw_score_cell: '1'
    parsed_terms:
    - 1
    numeric_contribution: 1
    rationale: 'No new block-environment fields, header inputs. Frame txs flow through standard EIP-2718 typed-tx
      dispatch. The one interface-side change is the receipt output schema, which gains a new shape for type 0x06:
      `[cumulative_gas_used, payer, [frame_receipt, ...]]` with a top-level `payer` field (resolved at runtime).'
    blank_interpretation: null
  - id: cryptography
    label: Cryptography-related testing
    raw_score_cell: '1'
    parsed_terms:
    - 1
    numeric_contribution: 1
    rationale: Introduces P256 as a tx-authentication primitive for the first time via a scheme dispatcher (0x0
      = SECP256K1, 0x1 = P256). Verification is defined as the P256VERIFY cryptographic operation.
    blank_interpretation: null
  - id: edge_boundary_conditions
    label: Edge/boundary conditions
    raw_score_cell: '4'
    parsed_terms:
    - 4
    numeric_contribution: 4
    rationale: 'Exceeds defined anchors: combinatorial explosion across mechanisms rather than a single elevated-case
      mechanism. Frame modes × flags × atomic-batch state × signature schemes × APPROVE scope matrix × default-code
      branches; further compounded by atomic batching, and cross-frame access.'
    blank_interpretation: null
  - id: block_syncing_changes
    label: Block syncing changes
    raw_score_cell: '2'
    parsed_terms:
    - 2
    numeric_contribution: 2
    rationale: 'Two new RLP validation mechanisms that affect syncing clients: (1) the type 0x06 tx-RLP envelope;
      (2) the corresponding new receipt-RLP shape (important for receipts root).'
    blank_interpretation: null
