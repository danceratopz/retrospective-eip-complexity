    label: New fork activation mechanism
    raw_score_cell: '3'
    parsed_terms:
    - 3
    numeric_contribution: 3
    rationale: Clients install `EXPIRY_VERIFIER` runtime code at address `0x8141` at fork activation — a state modification
      at the activation block.
    blank_interpretation: null
  - id: performance_risks
    label: Performance risks
    raw_score_cell: '2'
    parsed_terms:
    - 2
    numeric_contribution: 2
    rationale: Per-tx cost scales with frame count (≤64) and signature count, but is bounded and parameterizable.
      New opcodes individually benchmarkable. Main new concern is mempool DoS surface from validation-prefix work
      on rejected txs. This however is capped. Doesn't materially change existing performance baselines for legacy/1559/blob/7702
      txs.
    blank_interpretation: null
  - id: security_risks
    label: Security risks
    raw_score_cell: '3'
    parsed_terms:
    - 3
    numeric_contribution: 3
    rationale: 'Interacts with multiple critical subsystems: tx authentication (new multi-sig + scheme based dispatch),
      mempool relay policy, the EOA-vs-contract invariant (EIP-3607 relaxation lets contracts execute under SENDER
      mode), and ORIGIN semantics. The EIP itself enumerates non-trivial attack vectors: timestamp-dependency attack,
      deploy-frame front-running, state-read amplification via explicit sender, cross-frame privacy leakage, paymaster
      griefing, and mempool DoS via invalid `tx.sender` probing. Requires extensive review and fuzzing across protocol
      and mempool layers.'
    blank_interpretation: null
  - id: cross_eip_interactions
    label: Cross-EIP interactions
    raw_score_cell: '2'
    parsed_terms:
    - 2
    numeric_contribution: 2
    rationale: 'Strong interaction with FOCIL: FOCIL relies on attesters performing lightweight static validity
      checks (nonce + balance) on inclusion-list transactions without executing them. Frame transactions break this
      assumption.'
    blank_interpretation: null
